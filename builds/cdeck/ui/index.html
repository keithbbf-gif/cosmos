<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cDeck — COSMOS</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="header.css">
<link rel="stylesheet" href="deck_more.css">
</head>
<body>

<div class="deck-header"></div>

<div id="cdeck-cockpit">

  <div id="cdeck-more">
    <nav class="tab-rail"></nav>
    <div id="cdeck-pane-host"></div>
  </div>

  <main class="deck-stage" id="deck-stage">
    <section class="panel" id="panel-events">
      <div class="panel-hd"><h2>LIVE EVENTS</h2></div>
      <div class="panel-bd">
        <p class="evt-contract" id="evt-panel-hint">
          Each ledger row is clickable to open the inspector; scrolling away from the live tail
          pauses auto-scroll — scrolling pauses, not a feed pause.
        </p>
        <div class="feedbar">
          <div id="feedFollow" class="hidden"></div>
          <button type="button" id="feedJump" class="hidden"></button>
        </div>
        <div id="feed"><div class="empty">connect to stream events</div></div>
      </div>
    </section>
  </main>

</div>

<div id="cdeck-settings-pop" class="settings-pop" hidden role="dialog" aria-labelledby="cdeck-settings-title">
  <div class="settings-pop-inner">
    <header class="settings-pop-hd">
      <h2 id="cdeck-settings-title">Settings</h2>
      <button type="button" class="settings-close" data-action="close-settings" aria-label="Close">×</button>
    </header>
    <p class="dim tiny">Profile · Billing · Quota-Usage — Core GET paths only.</p>
    <div class="set-cards settings-cards">
      <div class="set-card" id="set-card-status" data-card="status"></div>
      <div class="set-card" id="set-card-usage" data-card="usage"></div>
      <div class="set-card" id="set-card-spend" data-card="spend"></div>
    </div>
    <section class="settings-billing">
      <h3>Billing · vendor homepages</h3>
      <div id="set-pay-rows"></div>
    </section>
    <p class="tiny" id="set-settings-err"></p>
  </div>
</div>

<script src="header.js"></script>
<script src="app.js"></script>
<script src="deck_tabs.js"></script>
<script src="deck_settings.js"></script>
<script src="kdash_native.js"></script>
</body>
</html>
