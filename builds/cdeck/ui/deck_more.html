<!-- deck_more.html — Sessions / Recents pane hosts (injected into #cdeck-pane-host) -->
<section id="pane-sessions-recents" class="pane-sessions">
  <div class="sessions-actions" role="toolbar" aria-label="Sessions verbs">
    <button type="button" data-sessions-act="list">LIST</button>
    <button type="button" data-sessions-act="open">OPEN</button>
    <button type="button" data-sessions-act="timeline">TIMELINE</button>
  </div>
  <div id="panel-recents-list" class="panel-recents-list"></div>
  <div id="recents-opened-card" class="recents-opened-card" hidden></div>
  <div id="panel-session-kit"></div>
  <div id="panel-open-sessions-suite"></div>
  <div id="panel-rolled-timeline" class="panel-rolled-timeline"></div>
  <pre id="panel-session-say" class="dim tiny" aria-live="polite"></pre>
</section>
