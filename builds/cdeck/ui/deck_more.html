<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cDeck — Profiles</title>
<style>
  /* ── base ── */
  :root {
    --bg:          #0b0e12;
    --panel:       #12161c;
    --panel-edge:  #1f2630;
    --ink:         #c8d2dc;
    --ink-dim:     #7a8694;
    --ink-faint:   #4a545f;
    --green:       #3fd68f;
    --amber:       #e6b450;
    --red:         #e5534b;
    --cyan:        #56b6c2;
    --head:        #e2e8ee;
    --mono:        "Consolas","Cascadia Mono","Courier New",monospace;
  }
  *  { box-sizing: border-box; margin: 0; padding: 0 }
  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.45;
    height: 100%;
    overflow: hidden;
  }

  /* ── shell ── */
  .dp-shell {
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ── left sidebar ── */
  .dp-left {
    width: 160px;
    min-width: 140px;
    background: var(--panel);
    border-right: 1px solid var(--panel-edge);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    overflow-x: hidden;
  }

  .dp-switcher { display: flex; flex-direction: column; gap: 2px; padding: 6px 4px }

  .dp-prof-btn {
    display: flex;
    align-items: center;
    gap: 7px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--ink-dim);
    font-family: var(--mono);
    font-size: 11px;
    padding: 5px 7px;
    border-radius: 4px;
    cursor: pointer;
    text-align: left;
    width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .dp-prof-btn:hover  { border-color: var(--panel-edge); color: var(--head) }
  .dp-prof-btn.dp-active {
    border-color: var(--cyan);
    color: var(--head);
    background: #131a24;
  }
  .dp-thumb {
    width: 30px;
    height: 20px;
    border-radius: 2px;
    background: var(--panel-edge);
    display: inline-block;
    flex-shrink: 0;
  }
  .dp-plabel {
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── right main panel ── */
  .dp-right {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── skin wallpaper header ── */
  .dp-skin-header {
    position: relative;
    height: 72px;
    flex-shrink: 0;
    background: var(--panel);
  }
  .dp-skin-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to right, rgba(11,14,18,.8) 0%, rgba(11,14,18,.3) 100%);
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 8px 14px;
  }
  .dp-profile-label {
    font-size: 15px;
    font-weight: 700;
    color: var(--head);
    letter-spacing: 1px;
    text-shadow: 0 1px 4px rgba(0,0,0,.8);
  }
  .dp-saved-badge {
    font-size: 10px;
    color: var(--green);
    border: 1px solid var(--green);
    border-radius: 3px;
    padding: 1px 6px;
    letter-spacing: 1px;
  }

  /* ── MOTIF top bar (forge) ── */
  .dp-motif-topbar {
    display: flex;
    flex-wrap: nowrap;
    overflow-x: auto;
    background: #0e1218;
    border-bottom: 1px solid var(--panel-edge);
    gap: 0;
    flex-shrink: 0;
  }
  .dp-motif-tab {
    background: transparent;
    border: none;
    border-right: 1px solid var(--panel-edge);
    color: var(--ink-dim);
    font-family: var(--mono);
    font-size: 11px;
    padding: 6px 11px;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .dp-motif-tab:hover  { color: var(--head); background: #12161c }
  .dp-motif-tab.dp-active {
    color: var(--cyan);
    background: var(--panel);
    border-bottom: 2px solid var(--cyan);
  }

  /* ── body: stage nav + main area ── */
  .dp-body {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  .dp-stage-nav {
    width: 148px;
    min-width: 130px;
    background: var(--panel);
    border-right: 1px solid var(--panel-edge);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    flex-shrink: 0;
    padding: 4px 3px;
    gap: 1px;
  }
  .dp-stage-tab {
    background: transparent;
    border: 1px solid transparent;
    color: var(--ink-dim);
    font-family: var(--mono);
    font-size: 11px;
    padding: 5px 8px;
    border-radius: 3px;
    cursor: pointer;
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .dp-stage-tab:hover  { border-color: var(--panel-edge); color: var(--head) }
  .dp-stage-tab.dp-active {
    border-color: var(--cyan);
    color: var(--cyan);
    background: #0d1520;
  }

  /* ── main area ── */
  .dp-main-area {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px;
  }

  /* ── form ── */
  .dp-form { display: flex; flex-direction: column; gap: 14px; max-width: 680px }

  .dp-section-head {
    font-size: 11px;
    color: var(--cyan);
    letter-spacing: 1px;
    text-transform: uppercase;
    border-bottom: 1px solid var(--panel-edge);
    padding-bottom: 4px;
    margin-bottom: 2px;
  }

  .dp-stage-pane, .dp-dest-pane, .dp-define-pane {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .dp-stage-hint {
    color: var(--ink-dim);
    font-size: 11px;
    border-left: 2px solid var(--panel-edge);
    padding-left: 8px;
    margin-bottom: 2px;
  }

  .dp-field {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .dp-field > span {
    font-size: 11px;
    color: var(--ink-dim);
    text-transform: uppercase;
    letter-spacing: .5px;
  }
  .dp-field input,
  .dp-field select,
  .dp-field textarea {
    background: #0e1116;
    border: 1px solid var(--panel-edge);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 12px;
    padding: 5px 8px;
    border-radius: 3px;
    outline: none;
    resize: vertical;
    width: 100%;
  }
  .dp-field input:focus,
  .dp-field select:focus,
  .dp-field textarea:focus { border-color: var(--cyan) }

  .dp-dest-note, .dp-saved-at {
    font-size: 11px;
    color: var(--ink-dim);
    font-style: italic;
  }
  .dp-dest-note em { color: var(--amber) }
  .dp-hidden { display: none !important }

  /* ── save bar ── */
  .dp-save-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    border-top: 1px solid var(--panel-edge);
    padding-top: 12px;
    margin-top: 4px;
  }
  .dp-save-btn {
    background: #182029;
    border: 1px solid var(--cyan);
    color: var(--head);
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 6px 20px;
    border-radius: 3px;
    cursor: pointer;
  }
  .dp-save-btn:hover  { background: #1a2d40 }
  .dp-save-btn:active { background: #0f1a24 }
  .dp-save-btn:disabled { opacity: .45; cursor: default }
  .dp-save-note { font-size: 11px; color: var(--ink-faint) }
  .dp-save-ok   { font-size: 11px; color: var(--green) }
  .dp-save-err  { font-size: 11px; color: var(--red) }

  .dp-loading {
    padding: 20px;
    color: var(--ink-dim);
    font-size: 12px;
  }
</style>
</head>
<body>
<div id="dp-root"></div>

<script src="deck_profiles.js"></script>
<script>
(function () {
  'use strict';

  /* cDeck Tauri injects __COSMOS_BASE__ and __COSMOS_TOKEN__ at launch.
     Fall back to same-origin empty string on loopback dev.              */
  var base  = (typeof __COSMOS_BASE__  !== 'undefined') ? __COSMOS_BASE__  : '';
  var token = (typeof __COSMOS_TOKEN__ !== 'undefined') ? __COSMOS_TOKEN__ : '';

  /* Allow the URL hash to pre-select a profile: #forge, #website, etc. */
  var initial = location.hash.replace('#', '') || 'website';
  if (!DeckProfiles.SKIN_NAMES[initial]) initial = 'website';

  var app = DeckProfiles.mount(
    document.getElementById('dp-root'),
    base,
    token,
    initial
  );

  /* profile switcher from top-level navigation (parent frame postMessage) */
  window.addEventListener('message', function (ev) {
    if (ev.data && ev.data.type === 'dp:select' && ev.data.profile) {
      var pid = ev.data.profile;
      if (DeckProfiles.SKIN_NAMES[pid]) {
        app._activeProfile = pid;
        app._activeStage   = 'define';
        app._error         = null;
        app._load(pid);
      }
    }
  });
})();
</script>
</body>
</html>
