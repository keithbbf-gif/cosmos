# COMPETENCY.toml — COSMOS node skills matrix (ROUTING input)
# Source: SGH (Grok research) live web 2026-08-26 + COSMOS rail files
#   (cosmos/cosmos_playwright_rail.py, cosmos/cosmos_codex_rail.py,
#    docs/research/CURSOR_CLOUD_AGENTS_API_v1.md, docs/FINAL_ARCHITECTURE.md)
# Ratings = real hands, not slogans. possessed=false and rating=0 if absent/unverified.
#
# STAGE-6 RUNTIME-BINDING (the value a live router reads; an exit code is NOT the gate):
#   skills.<task_type>.<node>.rating
# Algorithm: among nodes with skills.<task_type>.<node>.possessed==true AND currently
# AVAILABLE (registry/prober — not this file), pick max(rating). Ties: prefer
# nodes.<id>.family=="dom" (canon DOM-first). Remaining ties: router.nodes_order.

schema = "competency/1"
researched_at = "2026-08-26"
researched_by = "SGH"

[gate]
field = "skills.<task_type>.<node>.rating"
possessed_field = "skills.<task_type>.<node>.possessed"
tie_break = "nodes.<id>.family == \"dom\""
not_the_gate = "process exit code"

[router]
nodes_order = ["DOM", "G46", "Cursor", "SGH", "GEM", "OA"]
task_types = [
  "code-build",
  "code-review-critique",
  "web-research",
  "docs-authoring",
  "DOM-automation",
  "long-context-reasoning",
  "bulk-structured-extraction",
  "vendor-plural-critique",
]
rating_scale = "0=absent/unverified 1=weak 2=usable-with-caveats 3=competent 4=strong 5=best-among-listed"

[nodes.G46]
id = "G46"
family = "xai"
product = "Grok Build"
model = "grok-4.6"
context_tokens = 500000
cosmos_lane = "g46 / Grok Build CLI"
hands = "agentic coding loop (read/edit/shell/headless grok -p); API tools: function calling, web_search, x_search, code_execution. No first-party computer-use."

[nodes.GEM]
id = "GEM"
family = "google"
product = "Gemini API"
model = "gemini-3.7-flash"
context_tokens = 1000000
cosmos_lane = "gem-api / gem_worker"
hands = "google_search grounding, url_context, code_execution, structured outputs, function calling, Computer Use (client-side loop), Deep Research, 1M context"

[nodes.OA]
id = "OA"
family = "openai"
product = "OpenAI Codex / GPT-5.2-Codex"
model = "gpt-5.2-codex"
context_tokens = 400000
cosmos_lane = "oa-api + cosmos_codex_rail (CODER+VETTER)"
hands = "Codex CLI (shell/file/web_search/MCP/output-schema); Responses web_search, structured outputs, function calling, computer tool (harness required)"

[nodes.SGH]
id = "SGH"
family = "xai"
product = "Grok research (sgh-api)"
model = "grok-4.6"
context_tokens = 500000
cosmos_lane = "sgh-api"
hands = "web_search (search+browse+citations), x_search (keyword/semantic/user/thread), structured outputs. Research lane, not Grok Build harness."

[nodes.Cursor]
id = "Cursor"
family = "cursor"
product = "Cursor Cloud Agents + Agent CLI"
model = "multi-model (Grok/GPT/Gemini/Claude via Cursor)"
context_tokens = 0
cosmos_lane = "Cursor COSMOS 2 Cloud Agents API"
hands = "isolated VM coding loop (edit/test/PR/CI-fix), computer use (mouse/keyboard/browser), MCP (incl. Playwright MCP), semantic codebase index"

[nodes.DOM]
id = "DOM"
family = "dom"
product = "Playwright MCP"
model = "none (tool rail)"
context_tokens = 0
cosmos_lane = "playwright-dom (cosmos_playwright_rail)"
hands = "browser_navigate/snapshot/click/type/fill_form/tabs/network; Chromium+Firefox+WebKit; accessibility snapshots. Pinned @playwright/mcp@0.0.79. Not an LLM."

