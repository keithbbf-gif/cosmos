[project]
name = "cosmos-voice"
version = "0.1.0"
description = "COSMOS voice client and COSMOS Code plugin. Propose-only."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
cosmos-voice = "cosmos_voice.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider --tb=line"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["cosmos_voice", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["cosmos_voice"]
mypy_path = "."
pretty = true
warn_unused_ignores = true
