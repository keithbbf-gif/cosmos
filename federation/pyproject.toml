[project]
name = "cosmos-federation-proposals"
version = "0.1.0"
description = "Propose-only day-one installer for a COSMOS peer. Not the live tree."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "pylint>=3.0",
    "vulture>=2.10",
    "isort>=5.12",
    "pyflakes>=3.0",
    "flake8>=7.0",
    "pycodestyle>=2.11",
    "mccabe>=0.7",
    "coverage>=7.0",
]

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["cosmos_federation", "proposals", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["cosmos_federation"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["cosmos_federation"]
mypy_path = "."

[[tool.mypy.overrides]]
module = ["pytest", "pytest.*"]
ignore_missing_imports = true

# Proposal slices live in their own directories, added to sys.path at runtime.
[[tool.mypy.overrides]]
module = [
    "account",
    "bindpol",
    "chatwindow",
    "coldroot",
    "domdefer",
    "identity",
    "ledgerboot",
    "package",
    "seat",
    "spendcap",
    "wizard",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "proposals"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider --tb=short"

[tool.isort]
profile = "black"
line_length = 120

[tool.bandit]
exclude_dirs = ["tests", "_delme", "_pack"]
skips = ["B101"]

[tool.pylint.main]
ignore-paths = ["tests", "_delme", "_pack"]

[tool.pylint.messages_control]
disable = ["all"]
enable = ["E", "F"]

[tool.vulture]
min_confidence = 80
exclude = ["tests", "_delme", "_pack"]

[tool.coverage.run]
omit = ["tests/*", "_delme/*", "_pack/*"]

[tool.coverage.report]
fail_under = 70
