<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KDash Mobile — COSMOS</title>
<link rel="manifest" href="/kdash_manifest.webmanifest">
<meta name="theme-color" content="#0b0e12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="COSMOS">
<!--
  kdash_mobile.html — PHONE-FIRST frontend for the COSMOS v1 API (cosmos_service.py).
  Single self-contained file: no CDNs, no external scripts/styles/fonts, vanilla JS.
  Consumes (never changes) the existing surface:
    GET  /api/v1/status  /api/v1/jobs  /api/v1/health  /api/v1/spend
    GET  /api/v1/events?since_seq=N   (append-only ledger tail, cursor on seq)
    POST /api/v1/command {text}       (the voice/frontend seam)
  Every request carries Authorization: Bearer <token>.

  TOKEN HANDLING — deliberate choice: the bearer token lives ONLY in the in-memory
  `cfg` JS variable for the life of the page. It is NEVER written to localStorage,
  sessionStorage, cookies, or the URL — a phone browser's persisted storage outlives
  the session and is readable by anything that later opens this origin. Paste-per-
  session is the cost of not parking a credential on the handset.

  VOICE — Web Speech API, feature-detected. A transcript is NEVER auto-executed:
  it is echoed ("heard: ...") and placed in the text box for the user to SEND, so a
  misheard command is visible before it acts. No SR support => mic shows
  "voice unavailable" and the text box remains the input.
-->
<style>
  :root{
    --bg:#0b0e12;
    --panel:#12161c;
    --panel-edge:#1f2630;
    --ink:#c8d2dc;
    --ink-dim:#7a8694;
    --ink-faint:#4a545f;
    --green:#3fd68f;
    --amber:#e6b450;
    --red:#e5534b;
    --cyan:#56b6c2;
    --head:#e2e8ee;
    --mono:"Consolas","Cascadia Mono","Courier New",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--mono);
    font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%}
  body{padding:10px 10px calc(16px + env(safe-area-inset-bottom));
    max-width:560px;margin:0 auto;overflow-x:hidden}

  header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  header h1{font-size:16px;color:var(--head);letter-spacing:2px;font-weight:700}
  header h1 span{color:var(--cyan)}
  #connState{margin-left:auto;font-size:11px;color:var(--ink-dim)}
  #connState.ok{color:var(--green)}
  #connState.bad{color:var(--red)}

  .card{background:var(--panel);border:1px solid var(--panel-edge);
    border-radius:8px;padding:10px;margin-bottom:10px}
  .card h2{font-size:11px;letter-spacing:1.5px;color:var(--ink-dim);
    font-weight:700;margin-bottom:8px;display:flex;align-items:center}
  .card h2 .age{margin-left:auto;font-weight:400;color:var(--ink-faint);font-size:10px}

  input,button{font-family:var(--mono)}
  input[type=text],input[type=password],input[type=url]{
    width:100%;background:#0e1116;border:1px solid var(--panel-edge);color:var(--ink);
    font-size:16px; /* 16px stops iOS auto-zoom on focus */
    padding:12px;border-radius:6px;outline:none;min-height:48px}
  input:focus{border-color:var(--cyan)}
  .row{display:flex;gap:8px;margin-bottom:8px}
  .row:last-child{margin-bottom:0}

  button{background:#0e1116;border:1px solid var(--panel-edge);color:var(--ink);
    font-size:14px;border-radius:6px;min-height:48px;min-width:48px;padding:0 16px;
    cursor:pointer;touch-action:manipulation}
  button:active{border-color:var(--cyan);color:var(--cyan)}
  #btnConnect{width:100%;font-weight:700;letter-spacing:1px}

  /* ------- the big mic: THE primary input ------- */
  .micwrap{display:flex;flex-direction:column;align-items:center;gap:6px;margin:6px 0 10px}
  #btnMic{width:104px;height:104px;border-radius:50%;font-size:44px;line-height:1;
    border:2px solid var(--panel-edge);background:#0e1116}
  #btnMic.listening{border-color:var(--red);color:var(--red);
    animation:pulse 1.2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,83,75,.5)}
    70%{box-shadow:0 0 0 18px rgba(229,83,75,0)}100%{box-shadow:0 0 0 0 rgba(229,83,75,0)}}
  #btnMic.unavailable{opacity:.35}
  #micState{font-size:11px;color:var(--ink-dim);min-height:1.2em;text-align:center}
  #heard{font-size:13px;color:var(--amber);min-height:1.2em;text-align:center;
    word-break:break-word}

  #cmdInput{flex:1}
  #btnSend{font-weight:700}

  /* ------- command console: every command + its result, visible ------- */
  #console{max-height:220px;overflow-y:auto;overflow-x:hidden;display:flex;
    flex-direction:column;gap:6px}
  .centry{border-left:3px solid var(--panel-edge);padding:4px 8px;font-size:12px;
    word-break:break-word}
  .centry.cmd{border-color:var(--cyan);color:var(--cyan)}
  .centry.heard{border-color:var(--amber);color:var(--amber)}
  .centry.ok{border-color:var(--green)}
  .centry.err{border-color:var(--red)}
  .centry .ckind{font-weight:700;letter-spacing:1px;margin-right:6px}
  .centry.ok .ckind{color:var(--green)}
  .centry.err .ckind{color:var(--red)}
  .centry pre{white-space:pre-wrap;word-break:break-word;color:var(--ink-dim);
    font-size:11px;margin-top:2px;max-height:120px;overflow-y:auto}
  .cts{color:var(--ink-faint);font-size:10px;margin-right:6px}

  /* ------- status / lists ------- */
  .pill{display:inline-block;padding:2px 10px;border-radius:10px;font-size:11px;
    font-weight:700;letter-spacing:1px;border:1px solid var(--panel-edge)}
  .pill.green{color:var(--green);border-color:var(--green)}
  .pill.red{color:var(--red);border-color:var(--red)}
  .pill.amber{color:var(--amber);border-color:var(--amber)}
  .kv{display:flex;justify-content:space-between;gap:8px;padding:3px 0;font-size:12px}
  .kv .k{color:var(--ink-dim);white-space:nowrap}
  .kv .v{text-align:right;word-break:break-all}
  .empty{color:var(--ink-faint);font-size:12px;font-style:italic}

  #jobs .kv .v,#spend .kv .v{white-space:nowrap}
  #feed{max-height:180px;overflow-y:auto;overflow-x:hidden}
  .fevent{display:flex;gap:8px;font-size:11px;padding:2px 0;white-space:nowrap}
  .fseq{color:var(--ink-faint);min-width:3ch;text-align:right}
  .fname{color:var(--ink);overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .fwriter{color:var(--cyan)}
  .fage{color:var(--ink-faint)}
</style>
</head>
<body>

<header>
  <h1>KDASH<span>&#9656;</span>MOBILE</h1>
  <span id="connState">not connected</span>
</header>

<!-- ---------- connect: API base + bearer token (in-memory only) ---------- -->
<section class="card" id="connect">
  <h2>CONNECT</h2>
  <div class="row">
    <input id="apiBase" type="url" placeholder="https://cosmos-host:8443"
           spellcheck="false" autocomplete="off" autocapitalize="off">
  </div>
  <div class="row">
    <!-- token is held in a JS variable for this session ONLY - never localStorage -->
    <input id="token" type="password" placeholder="bearer token (kept in memory only)"
           spellcheck="false" autocomplete="off">
  </div>
  <div class="row"><button id="btnConnect">CONNECT</button></div>
</section>

<!-- ---------- voice-first command ---------- -->
<section class="card" id="command">
  <h2>COMMAND</h2>
  <div class="micwrap">
    <button id="btnMic" title="voice input" aria-label="voice input">&#127908;</button>
    <div id="micState">tap to speak</div>
    <div id="heard"></div>
  </div>
  <div class="row">
    <input id="cmdInput" type="text" placeholder="or type a command &mdash; try: help"
           spellcheck="false" autocomplete="off" autocapitalize="off">
    <button id="btnSend">SEND</button>
  </div>
  <div id="console"><div class="empty">no commands yet &mdash; results (ok / refused) appear here</div></div>
</section>

<!-- ---------- glanceable state ---------- -->
<section class="card">
  <h2>STATUS <span class="age" id="age-status">&mdash;</span></h2>
  <div id="status"><div class="empty">not connected</div></div>
</section>

<section class="card">
  <h2>EVENTS <span class="age" id="age-events">&mdash;</span></h2>
  <div id="feed"><div class="empty">the ledger tail streams here</div></div>
</section>

<section class="card">
  <h2>JOBS <span class="age" id="age-jobs">&mdash;</span></h2>
  <div id="jobs"><div class="empty">not connected</div></div>
</section>

<section class="card">
  <h2>HEALTH <span class="age" id="age-health">&mdash;</span></h2>
  <div id="health"><div class="empty">not connected</div></div>
</section>

<section class="card">
  <h2>SPEND HEADROOM <span class="age" id="age-spend">&mdash;</span></h2>
  <div id="spend"><div class="empty">not connected</div></div>
</section>

<script>
(function(){
  "use strict";
  var REFRESH_S = 12;      // status/jobs/health/spend cadence
  var EVENTS_S  = 5;       // event-tail cadence (cheap: append-only since_seq)
  var FETCH_TO_MS = 8000;  // per-request timeout
  var CONSOLE_MAX = 20;
  var FEED_MAX = 40;

  // SESSION-ONLY credential: the bearer token lives in this variable and nowhere
  // else. Deliberately NOT persisted (no localStorage / sessionStorage / cookie):
  // a stored token on a phone outlives the session and the user's intent.
  var cfg = { base:"", token:"" };
  var connected = false;
  var lastSeq = 0;
  var feedHasEvents = false;
  var eventsInflight = false;
  var nextAt = 0, nextEventsAt = 0;
  var consoleEntries = [];

  function $(id){ return document.getElementById(id); }
  function esc(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
                    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  function toMs(v){
    if(typeof v!=="number" || !isFinite(v)) return null;
    return v < 1e12 ? v*1000 : v;  // epoch seconds vs ms
  }
  function humanAge(sec){
    if(sec < 2) return "now";
    if(sec < 60) return Math.round(sec)+"s";
    if(sec < 3600) return Math.round(sec/60)+"m";
    return (sec/3600).toFixed(1)+"h";
  }
  function usd(v){
    if(typeof v!=="number" || !isFinite(v)) return "—";
    return "$"+v.toFixed(2);
  }
  function stamp(id){
    var el = $(id);
    el.textContent = new Date().toLocaleTimeString();
    el.style.color = "";
  }
  function stampErr(id, msg){
    var el = $(id);
    el.textContent = msg;
    el.style.color = "var(--red)";
  }

  // ---------- fetch (same seam as kdash_index: bearer on every call) ----------
  function apiCall(path, opts){
    var ctl = new AbortController();
    var t = setTimeout(function(){ ctl.abort(); }, FETCH_TO_MS);
    var url = cfg.base.replace(/\/+$/,"") + path;
    var headers = {"Authorization":"Bearer "+cfg.token};
    var init = {method:(opts && opts.method)||"GET", headers:headers,
                signal:ctl.signal, cache:"no-store"};
    if(opts && opts.body!==undefined){
      headers["Content-Type"] = "application/json";
      init.body = JSON.stringify(opts.body);
    }
    return fetch(url, init).then(function(r){
      clearTimeout(t);
      if(r.status===401) throw new Error("401 unauthorized — check the bearer token");
      return r.json().then(function(d){
        if(!r.ok && (!d || d.error===undefined)) throw new Error("HTTP "+r.status);
        return d;  // structured refusals ({error:...}) flow through to the caller
      });
    }).catch(function(e){
      clearTimeout(t);
      if(e.name==="AbortError") throw new Error("timeout after "+(FETCH_TO_MS/1000)+"s");
      throw e;
    });
  }
  function apiGet(p){ return apiCall(p); }
  function apiPost(p, body){ return apiCall(p, {method:"POST", body:body}); }

  // ---------- command console: sent text AND result, always visible ----------
  function addConsole(cls, kind, head, body){
    consoleEntries.push({tsMs:Date.now(), cls:cls, kind:kind, head:head, body:body});
    while(consoleEntries.length > CONSOLE_MAX) consoleEntries.shift();
    var el = $("console");
    el.innerHTML = consoleEntries.map(function(e){
      var h = '<div class="centry '+e.cls+'">'+
              '<span class="cts">'+esc(new Date(e.tsMs).toLocaleTimeString())+'</span>'+
              (e.kind ? '<span class="ckind">'+esc(e.kind)+'</span>' : '')+
              (e.head ? '<span>'+esc(e.head)+'</span>' : '');
      if(e.body) h += '<pre>'+esc(e.body)+'</pre>';
      return h+'</div>';
    }).join("");
    el.scrollTop = el.scrollHeight;
  }

  function runCommand(text){
    text = String(text||"").trim();
    if(!text) return;
    if(!connected){
      addConsole("err","NOT CONNECTED","connect before running commands",null);
      return;
    }
    addConsole("cmd","","> "+text,null);
    apiPost("/api/v1/command",{text:text}).then(function(d){
      var pretty = JSON.stringify(d, null, 1);
      if(d && d.error!==undefined && d.error!==null){
        addConsole("err","REFUSED", String(d.error), pretty);   // refusal is shown, loudly
      }else{
        addConsole("ok","OK", null, pretty);
      }
    }).catch(function(e){
      addConsole("err","TRANSPORT", e.message || String(e), null);
    });
  }

  $("btnSend").addEventListener("click", function(){
    runCommand($("cmdInput").value);
    $("cmdInput").value = "";
    $("heard").textContent = "";
  });
  $("cmdInput").addEventListener("keydown", function(e){
    if(e.key==="Enter"){ runCommand(this.value); this.value=""; $("heard").textContent=""; }
  });

  // ---------- voice: Web Speech API, feature-detected, review-before-send ----------
  (function(){
    var mic = $("btnMic");
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){
      mic.classList.add("unavailable");
      $("micState").textContent = "voice unavailable in this browser — type below";
      return;  // graceful: the text box remains the input, no error path
    }
    var rec = null, listening = false;
    mic.addEventListener("click", function(){
      if(listening){ try{ rec.stop(); }catch(_){} return; }
      rec = new SR();
      rec.lang = "en-US";
      rec.interimResults = false;
      rec.maxAlternatives = 1;
      rec.onresult = function(ev){
        if(ev.results && ev.results[0] && ev.results[0][0]){
          var heard = ev.results[0][0].transcript;
          // NEVER silently acted on: the transcript is echoed and staged in the
          // text box; the user reviews it and taps SEND.
          $("cmdInput").value = heard;
          $("heard").textContent = 'heard: "'+heard+'"';
          addConsole("heard","HEARD", heard+"  — tap SEND to run", null);
        }
      };
      rec.onend = function(){
        listening=false; mic.classList.remove("listening");
        $("micState").textContent = "tap to speak";
      };
      rec.onerror = function(ev){
        listening=false; mic.classList.remove("listening");
        $("micState").textContent = "mic error"+(ev && ev.error ? ": "+ev.error : "");
      };
      try{
        rec.start();
        listening = true;
        mic.classList.add("listening");
        $("micState").textContent = "listening… tap to stop";
      }catch(_){
        listening=false; mic.classList.remove("listening");
      }
    });
  })();

  // ---------- panels ----------
  function renderStatus(d){
    var head = d.ledger_head || {};
    $("status").innerHTML =
      '<div class="kv"><span class="k">kernel</span><span class="v">'+
        (d.ready ? '<span class="pill green">READY</span>'
                 : '<span class="pill red">NOT READY</span>')+'</span></div>'+
      '<div class="kv"><span class="k">tree</span><span class="v">'+esc(d.tree_id!=null?d.tree_id:"—")+'</span></div>'+
      '<div class="kv"><span class="k">ledger head</span><span class="v">#'+
        esc(head.seq!=null?head.seq:"?")+' '+esc(head.event!=null?head.event:"—")+'</span></div>';
  }

  function renderJobs(d){
    var jobs = d.jobs || {};
    var ids = Object.keys(jobs);
    if(ids.length===0){
      $("jobs").innerHTML = '<div class="empty">no jobs</div>';
      return;
    }
    $("jobs").innerHTML = ids.slice(-8).map(function(id){
      var st = String(jobs[id]);
      var cls = st==="DONE" ? "green" : (st==="FAILED" ? "red" : "amber");
      return '<div class="kv"><span class="k">'+esc(id)+'</span>'+
             '<span class="v"><span class="pill '+cls+'">'+esc(st)+'</span></span></div>';
    }).join("");
  }

  function renderHealth(d){
    var v = String(d.verdict!=null?d.verdict:"UNKNOWN");
    var cls = v==="GREEN" ? "green" : (v.indexOf("RED")===0 ? "red" : "amber");
    $("health").innerHTML =
      '<div class="kv"><span class="k">verdict</span><span class="v">'+
        '<span class="pill '+cls+'">'+esc(v)+'</span></span></div>'+
      '<div class="kv"><span class="k">red rows</span><span class="v">'+esc(d.reds!=null?d.reds:"—")+'</span></div>'+
      (d.diagnosis ? '<div class="kv"><span class="k">diagnosis</span><span class="v">'+esc(d.diagnosis)+'</span></div>' : '');
  }

  function renderSpend(d){
    var rails = d.rails || {};
    var names = Object.keys(rails);
    if(names.length===0){
      $("spend").innerHTML = '<div class="empty">no rails budgeted</div>';
      return;
    }
    $("spend").innerHTML = names.map(function(n){
      var r = rails[n];
      var head = r.headroom_usd, cap = r.cap_usd;
      var cls = (typeof head==="number" && typeof cap==="number" && cap>0 && head/cap < 0.15)
                ? "red" : "green";
      return '<div class="kv"><span class="k">'+esc(n)+'</span>'+
             '<span class="v"><span class="pill '+cls+'">'+usd(head)+'</span>'+
             ' <span style="color:var(--ink-faint)">/ '+usd(cap)+'</span></span></div>';
    }).join("");
  }

  function refreshAll(){
    if(!connected) return;
    apiGet("/api/v1/status").then(function(d){ renderStatus(d); stamp("age-status");
        $("connState").textContent="connected"; $("connState").className="ok";
      }).catch(function(e){ stampErr("age-status", e.message);
        $("connState").textContent="error"; $("connState").className="bad"; });
    apiGet("/api/v1/jobs").then(function(d){ renderJobs(d); stamp("age-jobs"); })
      .catch(function(e){ stampErr("age-jobs", e.message); });
    apiGet("/api/v1/health").then(function(d){ renderHealth(d); stamp("age-health"); })
      .catch(function(e){ stampErr("age-health", e.message); });
    apiGet("/api/v1/spend").then(function(d){ renderSpend(d); stamp("age-spend"); })
      .catch(function(e){ stampErr("age-spend", e.message); });
  }

  // ---------- event tail: poll /api/v1/events?since_seq= (append-only) ----------
  function pollEvents(){
    if(!connected || eventsInflight) return;
    eventsInflight = true;
    apiGet("/api/v1/events?since_seq="+lastSeq).then(function(d){
      eventsInflight = false;
      stamp("age-events");
      var feed = $("feed");
      var evs = d.events || [];
      if(!feedHasEvents && evs.length>0) feed.innerHTML = "";
      evs.forEach(function(ev){
        var seq = (typeof ev.seq==="number") ? ev.seq : null;
        if(seq!==null && seq<=lastSeq) return;   // old events never re-render
        if(seq!==null) lastSeq = seq;
        feedHasEvents = true;
        var tMs = toMs(ev.t);
        var row = document.createElement("div");
        row.className = "fevent";
        row.innerHTML =
          '<span class="fseq">'+(seq!==null?seq:"—")+'</span>'+
          '<span class="fname">'+esc(ev.event!=null?ev.event:"—")+'</span>'+
          '<span class="fwriter">'+esc(ev.writer!=null?ev.writer:"—")+'</span>'+
          '<span class="fage">'+(tMs!==null?humanAge((Date.now()-tMs)/1000):"—")+'</span>';
        feed.appendChild(row);
      });
      while(feed.children.length > FEED_MAX && feed.firstChild){
        feed.removeChild(feed.firstChild);
      }
      if(evs.length>0) feed.scrollTop = feed.scrollHeight;
    }).catch(function(e){
      eventsInflight = false;
      stampErr("age-events", e.message);
    });
  }

  // ---------- connect + tick ----------
  $("btnConnect").addEventListener("click", function(){
    var newBase = $("apiBase").value.trim();
    if(newBase !== cfg.base){
      lastSeq = 0; feedHasEvents = false;   // new backend => honest feed reset
      $("feed").innerHTML = '<div class="empty">connecting…</div>';
    }
    cfg.base = newBase;
    cfg.token = $("token").value.trim();    // in-memory only, see header comment
    if(!cfg.base){
      $("connState").textContent = "API base required"; $("connState").className = "bad";
      return;
    }
    if(!cfg.token){
      $("connState").textContent = "token required"; $("connState").className = "bad";
      return;
    }
    connected = true;
    $("connState").textContent = "connecting…"; $("connState").className = "";
    nextAt = Date.now() + REFRESH_S*1000;
    nextEventsAt = Date.now() + EVENTS_S*1000;
    refreshAll();
    pollEvents();
  });
  ["apiBase","token"].forEach(function(id){
    $(id).addEventListener("keydown", function(e){
      if(e.key==="Enter") $("btnConnect").click();
    });
  });

  setInterval(function(){
    var now = Date.now();
    if(connected && now >= nextAt){ nextAt = now + REFRESH_S*1000; refreshAll(); }
    if(connected && now >= nextEventsAt){ nextEventsAt = now + EVENTS_S*1000; pollEvents(); }
  }, 500);
})();
</script>
<script>
/* PWA: register the app-shell service worker (/kdash_sw.js). Feature-detected
   and wrapped so it can NEVER break the page: no serviceWorker support, a
   file:// open, or an insecure origin just leaves the page working as plain
   HTML. The worker caches ONLY the shell (page/manifest/worker) - it never
   caches /api/v1/* responses, so data stays live (the frozen-dashboard scar).
   The bearer token is untouched by all of this: in-memory cfg only. */
(function(){
  if (!("serviceWorker" in navigator)) return;   /* graceful: not an error */
  try {
    navigator.serviceWorker.register("/kdash_sw.js")
      .catch(function(){ /* unsupported scheme or offline first load: fine */ });
  } catch (e) { /* never surfaces - the page must work without a SW */ }
})();
</script>
</body>
</html>
