# Gitur default reviewer: Claude. CCr (Grok 4.6) still reviews all code
# before dispose. Not COSMOS claude -p (ANTHROPIC_OFF).
#
# Keith 2026-09-19: an empty ~3s claude-review fail is a harness flake
# (missing Anthropic secret or action crash), not a content refuse.
# Job continue-on-error: merge if other checks pass. Judge KEEP is CCr.
name: Claude review
on:
  pull_request:
    types: [opened, ready_for_review, reopened]
  issue_comment:
    types: [created]

jobs:
  claude-review:
    if: |
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: anthropics/claude-code-action@v1
        continue-on-error: true
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this pull request as the Gitur default reviewer (Claude).
            CCr (Grok 4.6) disposes the COSMOS live tree — do not approve merge.
            Post findings as inline comments. No finding without a file and line.
            Do not invent scores. Do not write the live tree.
      - name: harness-fail-is-not-a-merge-gate
        if: always()
        run: |
          echo "Judge KEEP is CCr (Luna/SOL), not this Action."
          echo "Empty ~3s fail = harness flake, not a content refuse."
          exit 0
