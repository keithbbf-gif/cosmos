[project]
name = "cosmos-voice-duplex"
version = "0.1.0"
description = "Full-duplex voice applied onto the COSMOS tree. Does not write live/ or take the lease."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
audio = ["sounddevice>=0.5"]
net = ["websockets>=12"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
cosmos-voice = "cosmos_voice_duplex.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cosmos_voice_duplex*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["cosmos_voice_duplex", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
files = ["cosmos_voice_duplex", "tests", "scripts"]
exclude = ["android"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
