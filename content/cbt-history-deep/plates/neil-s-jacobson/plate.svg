<svg xmlns="http://www.w3.org/2000/svg" width="360" height="440" viewBox="0 0 360 440" role="img" aria-labelledby="title desc">
  <title id="title">Neil S. Jacobson — typographic plate</title>
  <desc id="desc">No photograph; editorial type plate for educational history.</desc>
  <rect width="360" height="440" fill="#F7F2E8"/>
  <rect x="0" y="0" width="360" height="8" fill="#6B2D3E"/>
  <text x="180" y="120" text-anchor="middle" font-family="Georgia, 'Palatino Linotype', serif" font-size="11" letter-spacing="0.14em" fill="#6B2D3E">WOW THERAPIES · CBT HISTORY</text>
  <text x="180" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#1C1A17">Neil S. Jacobson</text>
  <text x="180" y="232" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#5C564C">1949–2003</text>
  <text x="180" y="264" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5C564C">researcher whose component studies and</text>
