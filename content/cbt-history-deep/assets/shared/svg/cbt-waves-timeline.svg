<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="t d">
  <title id="t">CBT and third-wave nickname timeline</title>
  <desc id="d">Schematic document anchors from 1952 through 2004, not a clinical efficacy chart.</desc>
  <rect width="960" height="300" fill="#f7f5f2"/>
  <line x1="80" y1="200" x2="880" y2="200" stroke="#5c5348" stroke-width="2"/>
  <circle cx="120" cy="200" r="7" fill="#1d5a8a"/>
  <text x="120" y="175" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#3d3832">1952</text>
  <text x="120" y="230" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#3d3832">Eysenck gauntlet</text>
  <circle cx="260" cy="200" r="7" fill="#1d5a8a"/>
  <text x="260" y="175" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#3d3832">1955</text>
  <text x="260" y="230" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#3d3832">Kelly · Ellis labels</text>
  <circle cx="400" cy="200" r="7" fill="#2f6f4e"/>
  <text x="400" y="175" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#3d3832">1967</text>
  <text x="400" y="230" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#3d3832">Beck depression book</text>
  <circle cx="540" cy="200" r="7" fill="#2f6f4e"/>
  <text x="540" y="175" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#3d3832">1979</text>
  <text x="540" y="230" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#3d3832">CT manual</text>
  <circle cx="680" cy="200" r="7" fill="#8a4b12"/>
  <text x="680" y="175" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#3d3832">1989</text>
  <text x="680" y="230" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#3d3832">NIMH TDCRP graph</text>
  <circle cx="820" cy="200" r="7" fill="#6b3d7a"/>
  <text x="820" y="175" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#3d3832">2004</text>
  <text x="820" y="230" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#3d3832">Third wave essay</text>
  <text x="480" y="40" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#3d3832">Document anchors (schematic; not to scale)</text>
</svg>
