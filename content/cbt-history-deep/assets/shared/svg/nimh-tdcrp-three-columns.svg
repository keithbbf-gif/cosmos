<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d">
  <title id="t">NIMH TDCRP three-column schematic</title>
  <desc id="d">Stylized bar groups for CBT, IPT, and medication columns on one federal graph  history, not outcome data.</desc>
  <rect width="720" height="360" fill="#f7f5f2"/>
  <text x="360" y="36" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#3d3832">Three schools on one NIMH graph (schematic)</text>
  <rect x="100" y="280" width="80" height="60" fill="#1d5a8a" opacity="0.85"/>
  <rect x="100" y="220" width="80" height="50" fill="#1d5a8a" opacity="0.55"/>
  <text x="140" y="355" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#3d3832">CBT</text>
  <rect x="300" y="270" width="80" height="70" fill="#2f6f4e" opacity="0.85"/>
  <rect x="300" y="210" width="80" height="50" fill="#2f6f4e" opacity="0.55"/>
  <text x="340" y="355" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#3d3832">IPT</text>
  <rect x="500" y="260" width="80" height="80" fill="#8a4b12" opacity="0.85"/>
  <rect x="500" y="200" width="80" height="50" fill="#8a4b12" opacity="0.55"/>
  <text x="540" y="355" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#3d3832">Imipramine + CM</text>
  <line x1="60" y1="340" x2="660" y2="340" stroke="#5c5348" stroke-width="1"/>
  <text x="360" y="90" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#5c5348">Not Elkins published means  a layout mnemonic only</text>
</svg>
