<svg width="720" height="400" viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui,Segoe UI,sans-serif">
<title>Chatbot Arena pairwise preference schematic</title>
<rect width="100%" height="100%" fill="#fafafa"/>
<defs>
<marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#5f6368"/>
</marker>
</defs><rect x="40" y="150" width="120" height="50" rx="8" fill="#fef7e0" stroke="#1a73e8" stroke-width="1.5"/>
<text x="100" y="180" text-anchor="middle" font-size="14" fill="#202124">User prompt</text><rect x="200" y="120" width="130" height="45" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="265" y="147" text-anchor="middle" font-size="14" fill="#202124">Model A</text><rect x="200" y="190" width="130" height="45" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="265" y="217" text-anchor="middle" font-size="14" fill="#202124">Model B</text><rect x="380" y="150" width="120" height="50" rx="8" fill="#f3e8fd" stroke="#1a73e8" stroke-width="1.5"/>
<text x="440" y="180" text-anchor="middle" font-size="14" fill="#202124">Vote A / B / tie</text><rect x="540" y="150" width="150" height="50" rx="8" fill="#e6f4ea" stroke="#1a73e8" stroke-width="1.5"/>
<text x="615" y="180" text-anchor="middle" font-size="14" fill="#202124">Bradley–Terry
ranking</text><line x1="160" y1="175" x2="200" y2="142" stroke="#5f6368" stroke-width="2" marker-end="url(#arr)"/><line x1="160" y1="175" x2="200" y2="212" stroke="#5f6368" stroke-width="2" marker-end="url(#arr)"/><line x1="330" y1="175" x2="380" y2="175" stroke="#5f6368" stroke-width="2" marker-end="url(#arr)"/><line x1="500" y1="175" x2="540" y2="175" stroke="#5f6368" stroke-width="2" marker-end="url(#arr)"/><text x="360" y="70" text-anchor="middle" font-size="17" font-weight="600">LMSYS Chatbot Arena (ICML 2024 paper)</text>
</svg>
