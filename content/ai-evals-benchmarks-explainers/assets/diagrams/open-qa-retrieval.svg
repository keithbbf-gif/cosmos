<svg width="720" height="400" viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui,Segoe UI,sans-serif">
<title>Open-domain QA retrieval schematic</title>
<rect width="100%" height="100%" fill="#fafafa"/>
<defs>
<marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#5f6368"/>
</marker>
</defs><rect x="80" y="150" width="200" height="55" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="180" y="182" text-anchor="middle" font-size="14" fill="#202124">Question</text><rect x="320" y="150" width="120" height="55" rx="8" fill="#fef7e0" stroke="#1a73e8" stroke-width="1.5"/>
<text x="380" y="182" text-anchor="middle" font-size="14" fill="#202124">Retriever</text><rect x="480" y="150" width="200" height="55" rx="8" fill="#e6f4ea" stroke="#1a73e8" stroke-width="1.5"/>
<text x="580" y="182" text-anchor="middle" font-size="14" fill="#202124">Short answer string</text><line x1="280" y1="177" x2="320" y2="177" stroke="#5f6368" stroke-width="2" marker-end="url(#arr)"/><line x1="440" y1="177" x2="480" y2="177" stroke="#5f6368" stroke-width="2" marker-end="url(#arr)"/><text x="360" y="80" text-anchor="middle" font-size="17" font-weight="600">Open QA benchmark (archetype)</text>
</svg>
