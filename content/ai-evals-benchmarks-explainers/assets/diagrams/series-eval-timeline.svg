<svg width="720" height="400" viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui,Segoe UI,sans-serif">
<title>Public language model evaluation milestones schematic</title>
<rect width="100%" height="100%" fill="#fafafa"/>
<defs>
<marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#5f6368"/>
</marker>
</defs><rect x="20" y="160" width="100" height="56" rx="8" fill="#fce8e6" stroke="#1a73e8" stroke-width="1.5"/>
<text x="70" y="193" text-anchor="middle" font-size="14" fill="#202124">BLEU 2002</text><rect x="140" y="160" width="100" height="56" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="190" y="193" text-anchor="middle" font-size="14" fill="#202124">GLUE 2018</text><rect x="260" y="160" width="100" height="56" rx="8" fill="#e6f4ea" stroke="#1a73e8" stroke-width="1.5"/>
<text x="310" y="193" text-anchor="middle" font-size="14" fill="#202124">MMLU 2021</text><rect x="380" y="160" width="100" height="56" rx="8" fill="#fef7e0" stroke="#1a73e8" stroke-width="1.5"/>
<text x="430" y="193" text-anchor="middle" font-size="14" fill="#202124">HELM 2022</text><rect x="500" y="160" width="100" height="56" rx="8" fill="#f3e8fd" stroke="#1a73e8" stroke-width="1.5"/>
<text x="550" y="193" text-anchor="middle" font-size="14" fill="#202124">Arena 2023</text><line x1="120" y1="188" x2="140" y2="188" stroke="#5f6368" stroke-width="2" marker-end="url(#arr)"/><line x1="240" y1="188" x2="260" y2="188" stroke="#5f6368" stroke-width="2" marker-end="url(#arr)"/><line x1="360" y1="188" x2="380" y2="188" stroke="#5f6368" stroke-width="2" marker-end="url(#arr)"/><line x1="480" y1="188" x2="500" y2="188" stroke="#5f6368" stroke-width="2" marker-end="url(#arr)"/><text x="360" y="80" text-anchor="middle" font-size="18" font-weight="600" fill="#202124">Public eval instruments (schematic timeline)</text>
<text x="360" y="110" text-anchor="middle" font-size="13" fill="#5f6368">Files, suites, holistic grids, and preference rooms—different questions, different scores</text>
<text x="360" y="280" text-anchor="middle" font-size="12" fill="#5f6368">Not a ranking; names mark published benchmarks cited in this series</text>
</svg>
