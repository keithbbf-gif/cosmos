<svg width="720" height="400" viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui,Segoe UI,sans-serif">
<title>What a benchmark contains: items, scoring rule, public claim</title>
<rect width="100%" height="100%" fill="#fafafa"/>
<defs>
<marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#5f6368"/>
</marker>
</defs><rect x="40" y="140" width="180" height="70" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="130" y="180" text-anchor="middle" font-size="14" fill="#202124">Item file
