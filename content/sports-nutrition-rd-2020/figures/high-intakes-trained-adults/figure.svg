<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Daily protein vs response (schematic)</title>
  <desc id="figDesc">Illustrative — Morton / Tagawa inspired</desc>
  <rect width="640" height="400" fill="#f7f5f0"/>
  <rect x="0" y="0" width="640" height="56" fill="#2d4a3e"/>
  <text x="20" y="34" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#f7f5f0" font-weight="600">Daily protein vs response (schematic)</text>
  <text x="20" y="78" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5c574f">Illustrative — Morton / Tagawa inspired</text>
  <line x1="80" y1="320" x2="580" y2="320" stroke="#8a8278" stroke-width="1.5"/>
  <line x1="80" y1="100" x2="80" y2="320" stroke="#8a8278" stroke-width="1.5"/>
  <text x="300" y="350" text-anchor="middle" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#4a4540">g protein / kg body mass / day</text>
  <text x="48" y="210" text-anchor="middle" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#4a4540" transform="rotate(-90 48 210)">response (arb.)</text>
  <path d="M 80 300 C 180 180, 320 150, 580 140" fill="none" stroke="#3d6b5a" stroke-width="3"/>
  <line x1="340" y1="100" x2="340" y2="320" stroke="#c45c3e" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="348" y="115" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#c45c3e">~1.6 g/kg (illustrative)</text>
  <text x="20" y="384" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8a8278">Illustrative schematic — not primary data. CC0 1.0.</text>
</svg>
