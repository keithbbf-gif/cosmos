<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="figtitle figdesc">
  <title id="figtitle">Typology: epigraphy</title>
  <desc id="figdesc">Schematic line diagram for educational use; redrawn, not a photograph of an artifact.</desc>
  <rect width="100%" height="100%" fill="#f7f6f3"/>
  <text x="36" y="32" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5c5c5c" letter-spacing="0.08em">FIGURE PLATE — SCHEMATIC</text>

  <text x="36" y="72" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1c1c1c">Typology diagram</text>
  <text x="36" y="96" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5c5c5c">epigraphy · morphological axes (schematic)</text>

  <rect x="80" y="160" width="160" height="120" fill="none" stroke="#1c1c1c" stroke-width="1.5"/>
  <line x1="100" y1="230" x2="220" y2="230" stroke="#8a8680" stroke-width="1"/>
  <line x1="160" y1="190" x2="160" y2="270" stroke="#8a8680" stroke-width="1"/>
  <text x="160" y="184" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#003057">Type A</text>
  <text x="160" y="264" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#5c5c5c">High status / ceremonial</text>

  <rect x="280" y="160" width="160" height="120" fill="none" stroke="#1c1c1c" stroke-width="1.5"/>
  <line x1="300" y1="230" x2="420" y2="230" stroke="#8a8680" stroke-width="1"/>
  <line x1="360" y1="190" x2="360" y2="270" stroke="#8a8680" stroke-width="1"/>
  <text x="360" y="184" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#003057">Type B</text>
  <text x="360" y="264" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#5c5c5c">Domestic / portable</text>

  <rect x="480" y="160" width="160" height="120" fill="none" stroke="#1c1c1c" stroke-width="1.5"/>
  <line x1="500" y1="230" x2="620" y2="230" stroke="#8a8680" stroke-width="1"/>
  <line x1="560" y1="190" x2="560" y2="270" stroke="#8a8680" stroke-width="1"/>
  <text x="560" y="184" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#003057">Type C</text>
  <text x="560" y="264" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#5c5c5c">Funerary / fixed</text>

  <line x1="240" y1="220" x2="280" y2="220" stroke="#5c5c5c" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="440" y1="220" x2="480" y2="220" stroke="#5c5c5c" stroke-width="1"/>
  <text x="36" y="330" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1c1c1c">Reading the diagram</text>
  <text x="36" y="350" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5c5c5c">Solid frames mark idealized morphotypes used in this essay series.</text>
  <text x="36" y="368" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5c5c5c">Cross-hatching indicates joinery zones; dashed elements are reconstructed.</text>
  <text x="36" y="386" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5c5c5c">Assign finds to types using caption fields in museum catalogs, not silhouette alone.</text>

  <text x="36" y="456" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#5c5c5c">Redrawn line diagram · staged editorial asset · not a museum photograph</text>
</svg>
