  <text x="36" y="330" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1c1c1c">Reading the diagram — The Paris Workshop in the Age of Rococo</text>
  <text x="36" y="350" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5c5c5c">Solid frames mark idealized morphotypes used in this chapter.</text>
  <text x="36" y="368" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5c5c5c">Dashed elements indicate reconstructed or debated forms.</text>
  <text x="36" y="386" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5c5c5c">Assign museum finds using accession captions, not silhouette alone.</text>

  <text x="36" y="456" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#5c5c5c">Redrawn line diagram · staged editorial asset · not a museum photograph</text>
