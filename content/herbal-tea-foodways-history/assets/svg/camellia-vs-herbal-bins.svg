<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img">
  <title>Camellia sinensis versus herbal grocery bins</title>
  <desc>Two labeled bins showing Camellia tea separate from non-Camellia tisane and herbal infusions.</desc>
  <rect width="880" height="520" fill="#e8eef2"/>
  <text x="440" y="40" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#1f2933">Grocery sorting: two bins, one aisle</text>
  <rect x="80" y="90" width="320" height="280" rx="10" fill="#c4a574" stroke="#1f2933" stroke-width="1.5"/>
  <text x="240" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#1f2933">Camellia sinensis</text>
  <text x="240" y="160" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#1f2933">Tea (unmarked default)</text>
  <text x="240" y="220" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#52606d">black · green · oolong · white</text>
  <rect x="480" y="90" width="320" height="280" rx="10" fill="#9cb4a0" stroke="#1f2933" stroke-width="1.5"/>
  <text x="640" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#1f2933">Not Camellia</text>
  <text x="640" y="160" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#1f2933">Herbal tea / tisane</text>
  <text x="640" y="210" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#52606d">mint · roselle · rooibos · barley</text>
  <text x="640" y="230" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#52606d">chrysanthemum · mate · hierbas</text>
  <path d="M400 230 L480 230" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arr)"/>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#1f2933"/></marker></defs>
  <text x="440" y="420" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#52606d">English herbal is an adjective beside an unmarked tea  not a species merge.</text>
  <text x="440" y="490" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#52606d">Editorial schematic  herbal-tea-foodways-history</text>
</svg>
