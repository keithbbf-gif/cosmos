<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img">
  <title>Americas non-Camellia cup geography</title>
  <desc>Americas outline with yaupon, mate, guayusa, and Andean hierbas regions marked as foodways drinks.</desc>
  <rect width="880" height="520" fill="#e8eef2"/>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#1f2933">Americas cups beyond the Camellia tin</text>
  <path d="M200 100 L340 80 L380 420 L180 400 Z" fill="#d4e4d9" stroke="#1f2933" stroke-width="1.5"/>
  <path d="M360 120 L520 100 L560 440 L340 420 Z" fill="#d4e4d9" stroke="#1f2933" stroke-width="1.5"/>
  <path d="M540 140 L720 120 L740 400 L560 380 Z" fill="#d4e4d9" stroke="#1f2933" stroke-width="1.5"/>
  <text x="270" y="240" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1f2933">yaupon · sassafras</text>
  <text x="430" y="260" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1f2933">mate · guayusa</text>
  <text x="640" y="260" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1f2933">Andean hierbas</text>
  <text x="430" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#52606d">Shaker/Moravian gardens (communal drying)</text>
  <text x="440" y="460" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#52606d">Council cups and morning circles  social form, not energy marketing.</text>
  <text x="440" y="490" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#52606d">Editorial map  herbal-tea-foodways-history</text>
</svg>
