<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img">
  <title>Ptisan to tisane word timeline</title>
  <desc>Chronological line from barley ptisan through French tisane to English herbal tea aisle usage without invented dates.</desc>
  <rect width="880" height="520" fill="#e8eef2"/>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#1f2933">Word line (approximate registers, not one invention day)</text>
  <line x1="60" y1="260" x2="820" y2="260" stroke="#1f2933" stroke-width="2"/>
  <circle cx="120" cy="260" r="8" fill="#f5e6d3" stroke="#1f2933" stroke-width="1.5"/>
  <text x="120" y="220" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#1f2933">ptisan</text>
  <text x="120" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#52606d">barley water · sickroom</text>
  <circle cx="320" cy="260" r="8" fill="#d4e4d9" stroke="#1f2933" stroke-width="1.5"/>
  <text x="320" y="220" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#1f2933">tisane (FR)</text>
  <text x="320" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#52606d">barley sense widens slowly</text>
  <circle cx="560" cy="260" r="8" fill="#9cb4a0" stroke="#1f2933" stroke-width="1.5"/>
  <text x="560" y="220" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#1f2933">herbal infusion</text>
  <text x="560" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#52606d">any mild plant cup</text>
  <circle cx="760" cy="260" r="8" fill="#c4a574" stroke="#1f2933" stroke-width="1.5"/>
  <text x="760" y="220" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#1f2933">herbal tea (EN)</text>
  <text x="760" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#52606d">grocery category · 20th c.</text>
  <text x="440" y="400" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#52606d">Lexicographers disagree on exact years; the plot is register shift, not a single eureka leaf.</text>
  <text x="440" y="490" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#52606d">Editorial timeline  herbal-tea-foodways-history</text>
</svg>
