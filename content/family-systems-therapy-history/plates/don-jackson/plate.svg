<svg xmlns="http://www.w3.org/2000/svg" width="360" height="440" viewBox="0 0 360 440" role="img" aria-labelledby="title desc">
  <title id="title">Don D. Jackson — typographic plate</title>
  <desc id="desc">No photograph; editorial type plate for educational history.</desc>
  <rect width="360" height="440" fill="#F7F2E8"/>
  <rect x="0" y="0" width="360" height="8" fill="#6B2D3E"/>
  <text x="180" y="120" text-anchor="middle" font-family="Georgia, 'Palatino Linotype', serif" font-size="10" letter-spacing="0.12em" fill="#6B2D3E">WOW THERAPIES · FAMILY SYSTEMS HISTORY</text>
  <text x="180" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#1C1A17">Don D. Jackson</text>
  <text x="180" y="232" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#5C564C">1920–1968</text>
  <text x="180" y="252" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5C564C">Don D. Jackson (1920–1968): Chestnut Lodge</text>
  <text x="180" y="274" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5C564C">to Palo Alto, family homeostasis (1957),</text>
  <text x="180" y="296" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5C564C">MRI (1958/59), and a short career that</text>
  <text x="180" y="318" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5C564C">built an institute and a journal.</text>
  <text x="180" y="400" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#8a8278">Typographic plate · CC0 · no AI face</text>
