  <title id="title">Gregory Bateson — typographic plate</title>
  <desc id="desc">No photograph; editorial type plate for educational history.</desc>
  <rect width="360" height="440" fill="#F7F2E8"/>
  <rect x="0" y="0" width="360" height="8" fill="#6B2D3E"/>
  <text x="180" y="120" text-anchor="middle" font-family="Georgia, 'Palatino Linotype', serif" font-size="10" letter-spacing="0.12em" fill="#6B2D3E">WOW THERAPIES · FAMILY SYSTEMS HISTORY</text>
  <text x="180" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#1C1A17">Gregory Bateson</text>
  <text x="180" y="232" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#5C564C">1904–1980</text>
  <text x="180" y="252" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5C564C">Gregory Bateson (1904–1980): Grantchester,</text>
