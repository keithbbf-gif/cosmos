<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">Banana panel from bars on one face versus alternate bars and cauls</title>
  <desc id="desc">Side elevation comparing panel bow from all clamps on one face with correct sandwich of alternating bars and crowned cauls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f3eb"/>
      <stop offset="100%" stop-color="#ebe4d6"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4a35a"/>
      <stop offset="100%" stop-color="#a08050"/>
    </linearGradient>
  </defs>
  <rect width="720" height="520" fill="url(#bg)"/>
  <text x="360" y="34" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#2c2416">The banana is a clamp pattern you can name</text>
  <text x="360" y="56" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#5c5346">Alternate bars. Crown the cauls. Wax the smile toward the work.</text>
  <text x="120" y="88" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#8b3a2a">Wrong - all bars on show face</text>
  <g transform="translate(40, 100)">
    <rect x="0" y="140" width="300" height="16" fill="#8b7355"/>
    <path d="M 0,156 Q 150,100 300,156" fill="url(#wood)" stroke="#3d3429" stroke-width="1.5"/>
    <rect x="40" y="72" width="220" height="10" fill="#4a4a4a" rx="2"/>
    <rect x="60" y="62" width="8" height="28" fill="#2c2416"/>
    <rect x="140" y="62" width="8" height="28" fill="#2c2416"/>
    <rect x="220" y="62" width="8" height="28" fill="#2c2416"/>
    <text x="150" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b3a2a">Edges down, field up - banana smile</text>
    <text x="150" y="218" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5c5346">Back face: bench was a suggestion</text>
  </g>
  <text x="120" y="348" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a5f4a">Right - sandwich + cauls</text>
  <g transform="translate(40, 360)">
    <rect x="0" y="100" width="300" height="16" fill="#8b7355"/>
    <rect x="0" y="60" width="300" height="40" fill="url(#wood)" stroke="#3d3429" stroke-width="1.5" rx="2"/>
    <path d="M 20,60 Q 150,48 280,60" fill="none" stroke="#1a5f4a" stroke-width="2"/>
    <text x="150" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#1a5f4a">crowned caul (smile to work)</text>
    <rect x="40" y="28" width="220" height="8" fill="#4a4a4a" rx="2"/>
    <rect x="40" y="124" width="220" height="8" fill="#4a4a4a" rx="2"/>
    <rect x="60" y="18" width="8" height="22" fill="#2c2416"/>
    <rect x="140" y="18" width="8" height="22" fill="#2c2416"/>
    <rect x="220" y="18" width="8" height="22" fill="#2c2416"/>
    <rect x="60" y="120" width="8" height="22" fill="#2c2416"/>
    <rect x="140" y="120" width="8" height="22" fill="#2c2416"/>
    <rect x="220" y="120" width="8" height="22" fill="#2c2416"/>
    <text x="150" y="168" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#1a5f4a">Even pressure through the field</text>
  </g>
  <g transform="translate(380, 100)">
    <rect x="0" y="0" width="300" height="380" fill="#fff" stroke="#3d3429" rx="6"/>
    <text x="150" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#2c2416">After iron</text>
    <text x="20" y="56" font-family="system-ui, sans-serif" font-size="11" fill="#2c2416">* Stickers, both faces, no tote on field</text>
    <text x="20" y="78" font-family="system-ui, sans-serif" font-size="11" fill="#2c2416">* Straightedge in the morning</text>
    <text x="20" y="100" font-family="system-ui, sans-serif" font-size="11" fill="#2c2416">* Clamp banana through thickness - saw seams</text>
    <text x="20" y="122" font-family="system-ui, sans-serif" font-size="11" fill="#5c5346">* Weather cup in sun stripe - time, not saw</text>
    <text x="20" y="160" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#8b3a2a">Not a rescue</text>
    <text x="20" y="182" font-family="system-ui, sans-serif" font-size="11" fill="#8b3a2a">Toolbox on field != press</text>
    <text x="20" y="204" font-family="system-ui, sans-serif" font-size="11" fill="#8b3a2a">Breadboard on angry top != priest</text>
    <text x="150" y="350" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#7a6f5f">Original diagram - gluing-clamping-furniture pack</text>
  </g>
</svg>
