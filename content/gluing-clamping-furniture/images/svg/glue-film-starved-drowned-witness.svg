<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
  <title id="title">Starved drowned and witness bead on a panel glue line</title>
  <desc id="desc">Three edge-joint cross sections: starved dry patches, correct thin film with witness bead, and drowned hydraulic smear.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f3eb"/>
      <stop offset="100%" stop-color="#ebe4d6"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a08050"/>
      <stop offset="100%" stop-color="#c4a35a"/>
    </linearGradient>
  </defs>
  <rect width="720" height="480" fill="url(#bg)"/>
  <text x="360" y="34" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#2c2416">Starved - witness - drowned</text>
  <text x="360" y="56" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#5c5346">The cheek and the light are the measure - not a slogan ounces-per-foot number.</text>
  <g transform="translate(40, 80)">
    <text x="100" y="0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#8b3a2a">Starved</text>
    <rect x="0" y="12" width="88" height="120" fill="url(#wood)" stroke="#3d3429"/>
    <rect x="88" y="12" width="88" height="120" fill="url(#wood)" stroke="#3d3429"/>
    <line x1="88" y1="12" x2="88" y2="132" stroke="#5c5346" stroke-width="1" stroke-dasharray="2 2"/>
    <rect x="84" y="40" width="8" height="20" fill="#c9b896" opacity="0.3"/>
    <rect x="84" y="90" width="8" height="24" fill="#c9b896" opacity="0.3"/>
    <text x="100" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5c5346">Dry counties</text>
    <text x="100" y="168" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8b3a2a">Matte line, no bead</text>
  </g>
  <g transform="translate(260, 80)">
    <text x="100" y="0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a5f4a">Witness</text>
    <rect x="0" y="12" width="88" height="120" fill="url(#wood)" stroke="#3d3429"/>
    <rect x="88" y="12" width="88" height="120" fill="url(#wood)" stroke="#3d3429"/>
    <rect x="84" y="20" width="8" height="104" fill="#d4a84a" opacity="0.55"/>
    <ellipse cx="88" cy="72" rx="6" ry="14" fill="#e8c468" stroke="#b8860b" stroke-width="1"/>
    <text x="100" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5c5346">Thin continuous film</text>
    <text x="100" y="168" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#1a5f4a">Even bead at close</text>
  </g>
  <g transform="translate(480, 80)">
    <text x="100" y="0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#2a4a7a">Drowned</text>
    <rect x="0" y="12" width="88" height="120" fill="url(#wood)" stroke="#3d3429"/>
    <rect x="88" y="12" width="88" height="120" fill="url(#wood)" stroke="#3d3429"/>
    <path d="M 88,12 Q 110,60 95,132 Q 80,100 88,12" fill="#d4a84a" opacity="0.7"/>
    <ellipse cx="105" cy="50" rx="18" ry="22" fill="#e8c468" opacity="0.9"/>
    <text x="100" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5c5346">Hydraulic pump-back</text>
    <text x="100" y="168" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#2a4a7a">Smear you will sand</text>
  </g>
  <g transform="translate(48, 280)">
    <rect x="0" y="0" width="624" height="160" fill="#fff" stroke="#3d3429" stroke-width="1" rx="6"/>
    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#2c2416">Spread stage checklist</text>
    <text x="20" y="52" font-family="system-ui, sans-serif" font-size="11" fill="#2c2416">* Cannot see dry wood through the film on faces that carry load</text>
    <text x="20" y="74" font-family="system-ui, sans-serif" font-size="11" fill="#2c2416">* Mortise floor: film, not a lake - see both-cheeks essay</text>
    <text x="20" y="96" font-family="system-ui, sans-serif" font-size="11" fill="#2c2416">* After gel: lift the bead - do not paint squeeze-out into pores</text>
    <text x="20" y="118" font-family="system-ui, sans-serif" font-size="11" fill="#5c5346">End grain may need a sizing coat before the film counts</text>
    <text x="312" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#7a6f5f">Original diagram - gluing-clamping-furniture pack</text>
  </g>
</svg>
