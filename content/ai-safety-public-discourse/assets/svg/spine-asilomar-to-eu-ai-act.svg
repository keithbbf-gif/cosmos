<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="spineTitle spineDesc">
  <title id="spineTitle">Public AI safety discourse timeline from Asilomar to the EU AI Act</title>
  <desc id="spineDesc">Selected public milestones from the 1975 recombinant-DNA Asilomar conference through Regulation (EU) 2024/1689 entering into force on 1 August 2024. Educational schematic; not a complete history.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, Segoe UI, sans-serif; font-size: 10px; fill: #1e293b; }
      .year { font-family: system-ui, -apple-system, Segoe UI, sans-serif; font-size: 11px; font-weight: 700; fill: #0f172a; }
      .era { font-family: system-ui, -apple-system, Segoe UI, sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
      .note { font-family: system-ui, -apple-system, Segoe UI, sans-serif; font-size: 9px; fill: #64748b; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="540" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" class="label" font-size="16" font-weight="700">Public record spine (selected dates)</text>
  <text x="600" y="54" text-anchor="middle" class="note">Left to right = time. Verify dates in SOURCES.md</text>

  <rect x="48" y="72" width="1080" height="20" rx="4" fill="#e2e8f0"/>
  <text x="600" y="86" text-anchor="middle" class="era" fill="#475569">1975 - 2014 - 2015 - 2017 - 2018 - 2019 - 2020 - 2021 - 2023 - 2024</text>

  <line x1="72" y1="300" x2="1128" y2="300" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(88,300)">
    <circle r="9" fill="#0d9488" stroke="#fff" stroke-width="2"/>
    <text y="-42" text-anchor="middle" class="year">1975</text>
    <text y="-26" text-anchor="middle" class="label">DNA Asilomar</text>
    <text y="28" text-anchor="middle" class="note">citation</text>
  </g>
  <g transform="translate(198,300)">
    <circle r="7" fill="#6366f1" stroke="#fff" stroke-width="2"/>
    <text y="42" text-anchor="middle" class="year">2014</text>
    <text y="58" text-anchor="middle" class="label">Superintelligence</text>
  </g>
  <g transform="translate(268,300)">
    <circle r="7" fill="#0d9488" stroke="#fff" stroke-width="2"/>
    <text y="-42" text-anchor="middle" class="year">2015</text>
    <text y="-26" text-anchor="middle" class="label">Puerto Rico</text>
  </g>
  <g transform="translate(318,300)">
    <circle r="7" fill="#ca8a04" stroke="#fff" stroke-width="2"/>
    <text y="42" text-anchor="middle" class="year">2015</text>
    <text y="58" text-anchor="middle" class="label">OpenAI founding</text>
  </g>
  <g transform="translate(388,300)">
    <circle r="9" fill="#0d9488" stroke="#fff" stroke-width="2"/>
    <text y="-42" text-anchor="middle" class="year">2017</text>
    <text y="-26" text-anchor="middle" class="label">23 principles</text>
  </g>
  <g transform="translate(458,300)">
    <circle r="8" fill="#ca8a04" stroke="#fff" stroke-width="2"/>
    <text y="42" text-anchor="middle" class="year">2018</text>
    <text y="58" text-anchor="middle" class="label">Charter</text>
  </g>
  <g transform="translate(528,300)">
    <circle r="7" fill="#ca8a04" stroke="#fff" stroke-width="2"/>
    <text y="-42" text-anchor="middle" class="year">2019</text>
    <text y="-26" text-anchor="middle" class="label">capped-profit</text>
  </g>
  <g transform="translate(578,300)">
    <circle r="7" fill="#2563eb" stroke="#fff" stroke-width="2"/>
    <text y="42" text-anchor="middle" class="year">2019</text>
    <text y="58" text-anchor="middle" class="label">HLEG guidelines</text>
  </g>
  <g transform="translate(628,300)">
    <circle r="7" fill="#64748b" stroke="#fff" stroke-width="2"/>
    <text y="-42" text-anchor="middle" class="year">2019</text>
    <text y="-26" text-anchor="middle" class="label">OECD</text>
  </g>
  <g transform="translate(688,300)">
    <circle r="7" fill="#2563eb" stroke="#fff" stroke-width="2"/>
    <text y="42" text-anchor="middle" class="year">2020</text>
    <text y="58" text-anchor="middle" class="label">EU White Paper</text>
  </g>
  <g transform="translate(758,300)">
    <circle r="8" fill="#2563eb" stroke="#fff" stroke-width="2"/>
    <text y="-42" text-anchor="middle" class="year">2021</text>
    <text y="-26" text-anchor="middle" class="label">COM(2021) 206</text>
  </g>
  <g transform="translate(808,300)">
    <circle r="7" fill="#64748b" stroke="#fff" stroke-width="2"/>
    <text y="42" text-anchor="middle" class="year">2021</text>
    <text y="58" text-anchor="middle" class="label">UNESCO</text>
  </g>
  <g transform="translate(878,300)">
    <circle r="7" fill="#2563eb" stroke="#fff" stroke-width="2"/>
    <text y="-42" text-anchor="middle" class="year">2023</text>
    <text y="-26" text-anchor="middle" class="label">EU trilogue deal</text>
  </g>
  <g transform="translate(928,300)">
    <circle r="7" fill="#64748b" stroke="#fff" stroke-width="2"/>
    <text y="42" text-anchor="middle" class="year">2023</text>
    <text y="58" text-anchor="middle" class="label">Bletchley</text>
  </g>
  <g transform="translate(978,300)">
    <circle r="7" fill="#6366f1" stroke="#fff" stroke-width="2"/>
    <text y="42" text-anchor="middle" class="year">2024</text>
    <text y="58" text-anchor="middle" class="label">FHI closes</text>
  </g>
  <g transform="translate(1048,300)">
    <circle r="10" fill="#1d4ed8" stroke="#fff" stroke-width="2"/>
    <text y="-42" text-anchor="middle" class="year">2024</text>
    <text y="-26" text-anchor="middle" class="label">Reg. (EU) 2024/1689</text>
    <text y="42" text-anchor="middle" class="note">OJ 12 Jul, EIF 1 Aug</text>
  </g>

  <text x="72" y="120" class="era" fill="#0f766e">Asilomar</text>
  <text x="198" y="120" class="era" fill="#4338ca">FHI / book</text>
  <text x="318" y="120" class="era" fill="#b45309">Charter era</text>
  <text x="578" y="120" class="era" fill="#1d4ed8">EU file</text>
  <text x="808" y="120" class="era" fill="#475569">Neighbors</text>

  <text x="600" y="510" text-anchor="middle" class="note">Original schematic, ai-safety-public-discourse, CC0 1.0</text>
</svg>
