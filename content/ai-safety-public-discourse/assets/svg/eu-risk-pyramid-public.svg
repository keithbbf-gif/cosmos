<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="pyrTitle pyrDesc">
  <title id="pyrTitle">EU AI Act risk pyramid as public explainer</title>
  <desc id="pyrDesc">Four-tier teaching pyramid: unacceptable (prohibited), high risk, limited risk (transparency), and minimal risk. Educational schematic; not a legal diagram.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, Segoe UI, sans-serif; font-size: 13px; fill: #0f172a; font-weight: 600; }
      .sub { font-family: system-ui, -apple-system, Segoe UI, sans-serif; font-size: 10px; fill: #334155; }
      .note { font-family: system-ui, -apple-system, Segoe UI, sans-serif; font-size: 9px; fill: #64748b; }
    </style>
  </defs>
  <rect width="960" height="520" fill="#f8fafc"/>
  <text x="480" y="32" text-anchor="middle" class="label" font-size="16">EU AI Act  risk pyramid (public explainer)</text>
  <text x="480" y="52" text-anchor="middle" class="note">Teaching picture from Commission slide decks; verify against Regulation (EU) 2024/1689</text>

  <polygon points="480,88 720,188 240,188" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
  <text x="480" y="148" text-anchor="middle" class="label" fill="#7f1d1d">Unacceptable</text>
  <text x="480" y="168" text-anchor="middle" class="sub" fill="#991b1b">Prohibited practices</text>

  <polygon points="240,188 720,188 660,268 300,268" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
  <text x="480" y="232" text-anchor="middle" class="label" fill="#9a3412">High risk</text>
  <text x="480" y="252" text-anchor="middle" class="sub" fill="#c2410c">Conformity + oversight duties</text>

  <polygon points="300,268 660,268 600,348 360,348" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
  <text x="480" y="312" text-anchor="middle" class="label" fill="#854d0e">Limited risk</text>
  <text x="480" y="332" text-anchor="middle" class="sub" fill="#a16207">Transparency obligations</text>

  <polygon points="360,348 600,348 540,428 420,428" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/>
  <text x="480" y="392" text-anchor="middle" class="label" fill="#166534">Minimal risk</text>
  <text x="480" y="412" text-anchor="middle" class="sub" fill="#15803d">Mostly unregulated uses</text>

  <text x="480" y="468" text-anchor="middle" class="note">GPAI and system-in-system cases are messier than a single tier  see draft 39</text>
</svg>
