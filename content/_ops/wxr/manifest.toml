# COSMOS content-pack manifest for WXR draft-import generation.
# Posts are never published by this tool — output is WXR with wp:status draft only.

version = 1

[[packs]]
id = "figroots-blog"
label = "Figroots horticultural blog"
site_url = "https://figroots.com"
site_title = "Figroots"
site_description = "Edible figs and orchard notes"
posts_glob = "content/packs/figroots-blog/posts/**/*.md"
sample_posts_glob = "content/_ops/wxr/samples/figroots-blog/**/*.md"

