<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" role="img" aria-labelledby="title desc">
  <title id="title">Timeline from elocution to modern speech-language pathology</title>
  <desc id="desc">Schematic timeline from eighteenth-century elocution through speech correction, wartime clinics, ASHA founding, and contemporary scope of practice.</desc>
  <defs>
    <style>
      .bg { fill: #FAF9F7; }
      .spine { stroke: #1E293B; stroke-width: 2; fill: none; }
      .grid { stroke: #E2E8F0; stroke-width: 1; }
      .era-title { font-family: Georgia, serif; font-size: 14px; font-weight: 600; fill: #1E293B; }
      .label { font-family: system-ui, sans-serif; font-size: 11px; fill: #64748B; }
      .milestone { font-family: system-ui, sans-serif; font-size: 12px; fill: #1E293B; }
      .band-hist { fill: #FEF3C7; }
      .band-clinical { fill: #CCFBF1; }
      .band-modern { fill: #E0E7FF; }
      .dot-hist { fill: #B45309; }
      .dot-clinical { fill: #0F766E; }
      .dot-modern { fill: #4338CA; }
    </style>
  </defs>
  <rect class="bg" width="920" height="320"/>
  <text x="40" y="36" class="era-title">From elocution to modern SLP (schematic)</text>
  <text x="40" y="54" class="label">Major eras  -  not exhaustive; dates are approximate anchors for teaching.</text>

  <rect class="band-hist" x="40" y="72" width="260" height="200" rx="4"/>
  <rect class="band-clinical" x="300" y="72" width="320" height="200" rx="4"/>
  <rect class="band-modern" x="620" y="72" width="260" height="200" rx="4"/>

  <text x="52" y="92" class="label" style="fill:#92400E;font-weight:600">Elocution &amp; correction</text>
  <text x="312" y="92" class="label" style="fill:#0F766E;font-weight:600">Professional formation</text>
  <text x="632" y="92" class="label" style="fill:#3730A3;font-weight:600">Contemporary scope</text>

  <line class="grid" x1="40" y1="248" x2="880" y2="248"/>
  <line class="spine" x1="60" y1="248" x2="860" y2="248"/>

  <!-- milestones -->
  <circle class="dot-hist" cx="100" cy="248" r="6"/>
  <text x="72" y="140" class="milestone">Rhetoric &amp; elocution</text>
  <text x="72" y="156" class="label">18th-19th c.</text>

  <circle class="dot-hist" cx="200" cy="248" r="6"/>
  <text x="168" y="168" class="milestone">Visible Speech,</text>
  <text x="168" y="184" class="label">speech training</text>

  <circle class="dot-clinical" cx="340" cy="248" r="6"/>
  <text x="308" y="132" class="milestone">Speech correction</text>
  <text x="308" y="148" class="label">schools &amp; clinics</text>

  <circle class="dot-clinical" cx="460" cy="248" r="6"/>
  <text x="420" y="168" class="milestone">WWI-II rehab</text>
  <text x="420" y="184" class="label">military &amp; VA</text>

  <circle class="dot-clinical" cx="560" cy="248" r="6"/>
  <text x="520" y="132" class="milestone">ASHA founded</text>
  <text x="520" y="148" class="label">1925</text>

  <circle class="dot-modern" cx="680" cy="248" r="6"/>
  <text x="648" y="168" class="milestone">Graduate training,</text>
  <text x="648" y="184" class="label">licensure growth</text>

  <circle class="dot-modern" cx="800" cy="248" r="6"/>
  <text x="752" y="132" class="milestone">SLP + audiology</text>
  <text x="752" y="148" class="label">evidence-based practice</text>

  <text x="40" y="300" class="label">Figure: SLPWOW History series  -  editorial schematic. Verify dates in article prose against primary sources.</text>
</svg>
