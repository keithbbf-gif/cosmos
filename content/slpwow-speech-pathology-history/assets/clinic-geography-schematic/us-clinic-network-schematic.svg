<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Schematic map of clinic and training hubs in the United States</title>
  <desc id="desc">Stylized map of the continental United States with markers for illustrative clinic types: university programs, VA hospitals, public school services, and community clinics. Not geographically precise.</desc>
  <defs>
    <style>
      .bg { fill: #FAF9F7; }
      .land { fill: #E2E8F0; stroke: #94A3B8; stroke-width: 1.5; }
      .title { font-family: Georgia, serif; font-size: 16px; font-weight: 600; fill: #1E293B; }
      .label { font-family: system-ui, sans-serif; font-size: 11px; fill: #64748B; }
      .legend-box { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; }
      .lg { font-family: system-ui, sans-serif; font-size: 11px; fill: #1E293B; }
    </style>
  </defs>
  <rect class="bg" width="920" height="420"/>
  <text x="40" y="36" class="title">Clinic &amp; training geography (schematic U.S.)</text>
  <text x="40" y="54" class="label">Markers indicate hub types, not exact locations or counts.</text>

  <!-- simplified CONUS -->
  <path class="land" d="M120 120 L280 100 L420 110 L520 95 L640 105 L720 130 L760 200 L740 280 L680 320 L560 340 L420 330 L280 310 L160 280 L100 200 Z"/>

  <circle cx="220" cy="200" r="10" fill="#0F766E"/>
  <circle cx="380" cy="170" r="10" fill="#B45309"/>
  <circle cx="520" cy="240" r="10" fill="#4338CA"/>
  <circle cx="620" cy="190" r="10" fill="#0F766E"/>
  <circle cx="480" cy="300" r="10" fill="#BE123C"/>
  <circle cx="300" cy="260" r="10" fill="#4338CA"/>

  <text x="235" y="204" class="lg">University clinic</text>
  <text x="395" y="158" class="lg">VA / military rehab</text>
  <text x="535" y="244" class="lg">School-based</text>

  <rect class="legend-box" x="40" y="72" width="200" height="108" rx="4"/>
  <text x="52" y="92" class="lg" style="font-weight:600">Legend</text>
  <circle cx="60" cy="108" r="6" fill="#0F766E"/><text x="72" y="112" class="label">Graduate training + clinic</text>
  <circle cx="60" cy="128" r="6" fill="#B45309"/><text x="72" y="132" class="label">Federal / military sites</text>
  <circle cx="60" cy="148" r="6" fill="#4338CA"/><text x="72" y="152" class="label">Public education</text>
  <circle cx="60" cy="168" r="6" fill="#BE123C"/><text x="72" y="172" class="label">Community / private</text>

  <text x="40" y="400" class="label">Figure: SLPWOW History series  -  use article text for regional history; map is illustrative only.</text>
</svg>
