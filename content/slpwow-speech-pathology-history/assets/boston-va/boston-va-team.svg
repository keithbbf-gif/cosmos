<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" role="img" aria-labelledby="title desc">
  <title id="title">Boston VA hallway as a working team, not an org chart</title>
  <desc id="desc">Editorial diagram of the Jamaica Plain conversation: Goodglass, Kaplan, Geschwind, and later treatment names around a VA ward that produced the Boston Diagnostic Aphasia Examination. Not a complete staff list for every year.</desc>
  <defs>
    <style>
      .bg { fill: #FAF9F7; }
      .title { font-family: Georgia, serif; font-size: 16px; font-weight: 600; fill: #1E293B; }
      .sub { font-family: system-ui, sans-serif; font-size: 11px; fill: #64748B; }
      .ward { fill: #CCFBF1; }
      .box { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; }
      .ink { font-family: system-ui, sans-serif; font-size: 12px; fill: #1E293B; }
      .head { font-family: Georgia, serif; font-size: 13px; font-weight: 600; fill: #1E293B; }
      .label { font-family: system-ui, sans-serif; font-size: 10px; fill: #64748B; }
    </style>
  </defs>
  <rect class="bg" width="920" height="380"/>
  <text x="36" y="34" class="title">Jamaica Plain hallway (teaching schematic)</text>
  <text x="36" y="52" class="sub">A lunch table that became a style. Names are the essay's cast, not every badge on the ward.</text>

  <rect class="ward" x="300" y="72" width="320" height="120" rx="4"/>
  <text x="318" y="100" class="head">VA ward / Aphasia Research Center</text>
  <text x="318" y="122" class="ink">Framingham 1951 - Boston VA</text>
  <text x="318" y="140" class="ink">Goodglass director, 1969-1996</text>
  <text x="318" y="162" class="label">Shared charts, not a visiting lecture</text>

  <rect class="box" x="36" y="72" width="240" height="88" rx="4"/>
  <text x="50" y="96" class="ink">Harold Goodglass</text>
  <text x="50" y="114" class="label">Clinical psychologist</text>
  <text x="50" y="132" class="label">Syndromes scored, not only narrated</text>

  <rect class="box" x="644" y="72" width="240" height="88" rx="4"/>
  <text x="658" y="96" class="ink">Edith Kaplan</text>
  <text x="658" y="114" class="label">Neuropsychologist</text>
  <text x="658" y="132" class="label">Process: how the error arrives</text>

  <rect class="box" x="36" y="216" width="270" height="88" rx="4"/>
  <text x="50" y="240" class="ink">Norman Geschwind</text>
  <text x="50" y="258" class="label">Neurologist  -  disconnection</text>
  <text x="50" y="276" class="label">Nineteenth-century wires, modern dress</text>

  <rect class="box" x="322" y="216" width="276" height="88" rx="4"/>
  <text x="336" y="240" class="ink">BDAE, 1972</text>
  <text x="336" y="258" class="label">Ward practice from c. 1960</text>
  <text x="336" y="276" class="label">Cookie-theft as portable kitchen</text>

  <rect class="box" x="614" y="216" width="270" height="88" rx="4"/>
  <text x="628" y="240" class="ink">Later hallway</text>
  <text x="628" y="258" class="label">Helm-Estabrooks, Blumstein,</text>
  <text x="628" y="276" class="label">Albert, Zurif  -  treatment &amp; lab</text>

  <text x="36" y="336" class="sub">Figure: SLPWOW History series   -   editorial graphic. Quadfasel (1954 laterality paper) belongs in the prose, not as a fourth box.</text>
  <text x="36" y="354" class="sub">Minnesota (Schuell) and Rochester (Darley) are other rooms, not missing staff.</text>
</svg>
