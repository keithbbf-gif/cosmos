<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440" role="img" aria-labelledby="title desc">
  <title id="title">Lee Edward Travis  -  portrait pending</title>
  <desc id="desc">Placeholder portrait plate for Lee Edward Travis until licensed photography is cleared in PORTRAIT_SOURCES.md.</desc>
  <defs>
    <style>
      .frame { fill: #FAF9F7; stroke: #1E293B; stroke-width: 2; }
      .inner { fill: #F1F5F9; stroke: #CBD5E1; stroke-width: 1; }
      .name { font-family: Georgia, serif; font-size: 20px; font-weight: 600; fill: #1E293B; }
      .dates { font-family: system-ui, sans-serif; font-size: 13px; fill: #64748B; }
      .pending { font-family: system-ui, sans-serif; font-size: 12px; fill: #B45309; font-weight: 600; }
      .credit { font-family: system-ui, sans-serif; font-size: 10px; fill: #94A3B8; }
    </style>
  </defs>
  <rect class="frame" x="20" y="20" width="320" height="400" rx="6"/>
  <rect class="inner" x="40" y="40" width="280" height="280" rx="4"/>
  <text x="180" y="200" text-anchor="middle" class="pending">Portrait pending</text>
  <text x="180" y="220" text-anchor="middle" class="dates">rights not cleared</text>
  <text x="180" y="340" text-anchor="middle" class="name">Lee Edward Travis</text>
  <text x="180" y="362" text-anchor="middle" class="dates">1896  -  1987</text>
  <text x="180" y="392" text-anchor="middle" class="credit">Credit: pending  -  see PORTRAIT_SOURCES.md</text>
</svg>
