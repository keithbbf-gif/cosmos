<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="520" viewBox="0 0 820 520" role="img" aria-labelledby="title desc">
  <title id="title">Living-room chests spine timeline - box older than the room name</title>
  <desc id="desc">Milestones from six-board chests through parlor, living room, Lane cedar, and mid-century storage. Soft dates stay soft in prose.</desc>
  <rect width="100%" height="100%" fill="#f4efe6"/>
  <text x="28" y="38" font-family="Source Serif 4, Georgia, serif" font-size="20" font-weight="600" fill="#2c2416">The chest is medieval; the living room is not</text>
  <text x="28" y="60" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" fill="#6b5a45">Spine from content/02-timeline.md - illustrative, not a catalog chronology.</text>
  <line x1="80" y1="420" x2="760" y2="420" stroke="#8b5a2b" stroke-width="3"/>
  <circle cx="100" cy="420" r="7" fill="#8b5a2b"/>
  <text x="100" y="448" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" fill="#2c2416">9th-16th c.</text>
  <text x="100" y="400" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="10" fill="#6b5a45">six-board</text>
  <circle cx="200" cy="420" r="7" fill="#8b5a2b"/>
  <text x="200" y="448" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" fill="#2c2416">15th c.</text>
  <text x="200" y="400" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="10" fill="#6b5a45">cassone</text>
  <circle cx="300" cy="420" r="7" fill="#8b5a2b"/>
  <text x="300" y="448" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" fill="#2c2416">ca. 1600</text>
  <text x="300" y="400" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="10" fill="#6b5a45">till / drawer</text>
  <circle cx="400" cy="420" r="7" fill="#8b5a2b"/>
  <text x="400" y="448" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" fill="#2c2416">1738</text>
  <text x="400" y="400" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="10" fill="#6b5a45">commode</text>
  <circle cx="500" cy="420" r="7" fill="#8b5a2b"/>
  <text x="500" y="448" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" fill="#2c2416">~1910</text>
  <text x="500" y="400" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="10" fill="#6b5a45">living room</text>
  <circle cx="600" cy="420" r="7" fill="#8b5a2b"/>
  <text x="600" y="448" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" fill="#2c2416">1912</text>
  <text x="600" y="400" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="10" fill="#6b5a45">Lane cedar</text>
  <circle cx="700" cy="420" r="7" fill="#8b5a2b"/>
  <text x="700" y="448" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" fill="#2c2416">1950-55</text>
  <text x="700" y="400" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="10" fill="#6b5a45">Eames ESU</text>
  <rect x="28" y="88" width="764" height="260" rx="6" fill="#efe6d4" stroke="#c4b49a"/>
  <text x="44" y="118" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" font-weight="600" fill="#2c2416">Before the room name</text>
  <text x="44" y="142" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" fill="#6b5a45">Lidded chest, drawers, tall case - chamber furniture before the living room label.</text>
  <text x="44" y="168" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" font-weight="600" fill="#2c2416">The polite century</text>
  <text x="44" y="192" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" fill="#6b5a45">Parlor formal; commode convenient; campaign chest travels; Shaker built-ins clear the floor.</text>
  <text x="44" y="218" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" font-weight="600" fill="#2c2416">After the parlor</text>
  <text x="44" y="242" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" fill="#6b5a45">Radio and TV wear wooden clothes; credenza drifts; retail accent chest names a leftover job.</text>
  <text x="44" y="280" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" font-weight="600" fill="#8b5a2b">One sentence spine:</text>
  <text x="44" y="302" font-family="Source Serif 4, Georgia, serif" font-size="13" fill="#2c2416">The chest is medieval; the drawer is seventeenth-century; the living room is a late-Victorian argument that won.</text>
  <text x="28" y="508" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" fill="#6b5a45">Original schematic - CC0 1.0 - BBF living-room chests pack. No AI imagery.</text>
</svg>
