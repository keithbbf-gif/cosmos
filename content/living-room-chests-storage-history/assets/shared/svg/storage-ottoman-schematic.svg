<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" role="img" aria-labelledby="title desc">
  <title id="title">Storage ottoman - six-board chest in upholstery schematic</title>
  <desc id="desc">Side view of a lidded box with padded top - the living-room descendant of a sit-on lid.</desc>
  <rect width="100%" height="100%" fill="#f4efe6"/>
  <rect x="140" y="100" width="280" height="120" fill="#efe6d4" stroke="#8b5a2b" stroke-width="2"/>
  <rect x="130" y="88" width="300" height="24" rx="8" fill="#7a6a5a" stroke="#5c4030"/>
  <text x="280" y="250" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" fill="#2c2416">Lid you can sit on - cables and blankets inside.</text>
  <text x="24" y="288" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" fill="#6b5a45">Original schematic - CC0 1.0 - BBF living-room chests pack.</text>
