<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="title desc">
  <title id="title">From lidded chest to mule chest to drawer stack - form evolution schematic</title>
  <desc id="desc">Three silhouettes: lidded six-board chest, hybrid with basal drawer, and vertical chest of drawers. Mule chest name is modern; object is seventeenth-century.</desc>
  <rect width="100%" height="100%" fill="#f4efe6"/>
  <text x="24" y="34" font-family="Source Serif 4, Georgia, serif" font-size="18" font-weight="600" fill="#2c2416">The well loses - lid, till, stack</text>
  <g transform="translate(60,80)">
    <rect x="0" y="40" width="140" height="100" fill="#efe6d4" stroke="#8b5a2b" stroke-width="2"/>
    <rect x="0" y="20" width="140" height="20" fill="#d4c4a8" stroke="#8b5a2b"/>
    <text x="70" y="170" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" fill="#2c2416">Lidded chest</text>
  </g>
  <g transform="translate(280,80)">
    <rect x="0" y="40" width="140" height="70" fill="#efe6d4" stroke="#8b5a2b" stroke-width="2"/>
    <rect x="0" y="20" width="140" height="20" fill="#d4c4a8" stroke="#8b5a2b"/>
    <rect x="10" y="110" width="120" height="30" fill="#e8dcc8" stroke="#8b5a2b"/>
    <text x="70" y="170" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" fill="#2c2416">Basal drawer(s)</text>
    <text x="70" y="188" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="10" fill="#6b5a45">mule name ~1911</text>
  </g>
  <g transform="translate(500,80)">
    <rect x="20" y="20" width="100" height="30" fill="#e8dcc8" stroke="#8b5a2b"/>
    <rect x="20" y="50" width="100" height="30" fill="#e8dcc8" stroke="#8b5a2b"/>
    <rect x="20" y="80" width="100" height="30" fill="#e8dcc8" stroke="#8b5a2b"/>
    <rect x="20" y="110" width="100" height="30" fill="#e8dcc8" stroke="#8b5a2b"/>
    <text x="70" y="170" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" fill="#2c2416">Drawer stack</text>
  </g>
  <path d="M210 130 L260 130" stroke="#8b5a2b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M430 130 L480 130" stroke="#8b5a2b" stroke-width="2" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8b5a2b"/></marker></defs>
  <text x="24" y="384" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" fill="#6b5a45">Original schematic - CC0 1.0 - BBF living-room chests pack.</text>
</svg>
