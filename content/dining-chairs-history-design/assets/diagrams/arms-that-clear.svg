<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Arm height versus apron</title>
  <desc id="desc">Plan sketch: arm path crossing apron clearance.</desc>
  <rect width="100%" height="100%" fill="#E8E4DC"/>

  <rect x="100" y="200" width="440" height="16" fill="#8B6F47" opacity="0.5"/>
  <text x="320" y="212" text-anchor="middle" font-size="11" fill="#5A554F">table apron zone</text>
  <path d="M180 320 L180 220 L240 200 L240 320 Z" fill="#8B6F47" stroke="#2A2622" stroke-width="2"/>
  <path d="M400 320 L400 210 L460 190 L460 320 Z" fill="#3D6B8E" opacity="0.35" stroke="#3D6B8E" stroke-width="2"/>
  <line x1="240" y1="200" x2="400" y2="210" stroke="#C45C3E" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="320" y="195" text-anchor="middle" font-size="13" fill="#C45C3E" font-family="Helvetica,Arial,sans-serif">arm must clear apron</text>

</svg>
