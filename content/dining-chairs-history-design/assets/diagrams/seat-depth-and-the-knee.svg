<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Seat depth at the dining chair</title>
  <desc id="desc">Plan view: depth from front rail toward back rail.</desc>
  <rect width="100%" height="100%" fill="#E8E4DC"/>

  <rect x="160" y="180" width="320" height="14" fill="#8B6F47" stroke="#2A2622" stroke-width="2"/>
  <line x1="160" y1="280" x2="160" y2="194" stroke="#2A2622" stroke-width="3"/>
  <line x1="480" y1="280" x2="480" y2="194" stroke="#2A2622" stroke-width="3"/>
  <line x1="160" y1="194" x2="420" y2="194" stroke="#C45C3E" stroke-width="2"/>
  <text x="290" y="186" text-anchor="middle" font-size="13" fill="#C45C3E" font-family="Helvetica,Arial,sans-serif">seat depth (front rail to back)</text>
  <circle cx="420" cy="194" r="5" fill="#C45C3E"/>
  <text x="430" y="210" font-size="12" fill="#5A554F" font-family="Helvetica,Arial,sans-serif">leave knee free</text>

</svg>
