<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Racking under diagonal load</title>
  <desc id="desc">Chair frame skewed to a parallelogram when leaned.</desc>
  <rect width="100%" height="100%" fill="#E8E4DC"/>

  <polygon points="200,300 360,300 380,120 220,120" fill="none" stroke="#2A2622" stroke-width="3"/>
  <polygon points="200,300 340,310 360,130 220,120" fill="none" stroke="#C45C3E" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="320" y="340" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#5A554F">lean-back rack: posts no longer square</text>

</svg>
