<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Chair measurement points</title>
  <desc id="desc">Key dimensions on a schematic side chair.</desc>
  <rect width="100%" height="100%" fill="#E8E4DC"/>

  <rect x="250" y="240" width="140" height="12" fill="#8B6F47" stroke="#2A2622"/>
  <circle cx="250" cy="246" r="4" fill="#C45C3E"/>
  <circle cx="390" cy="246" r="4" fill="#C45C3E"/>
  <circle cx="320" cy="200" r="4" fill="#C45C3E"/>
  <text x="180" y="246" font-size="11" fill="#C45C3E">width</text>
  <text x="320" y="190" text-anchor="middle" font-size="11" fill="#C45C3E">back height</text>
  <text x="320" y="300" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#5A554F">measure wood, not cushion fantasy</text>

</svg>
