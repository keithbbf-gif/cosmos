<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Front rail arris versus radius</title>
  <desc id="desc">Cross-section comparison of sharp and radiused front rails.</desc>
  <rect width="100%" height="100%" fill="#E8E4DC"/>

  <rect x="140" y="200" width="360" height="20" fill="#8B6F47" stroke="#2A2622" stroke-width="2"/>
  <text x="320" y="215" text-anchor="middle" font-size="12" fill="#2A2622" font-family="Helvetica,Arial,sans-serif">sharp front rail</text>
  <rect x="140" y="260" width="360" height="20" rx="8" fill="#8B6F47" stroke="#2A2622" stroke-width="2"/>
  <text x="320" y="275" text-anchor="middle" font-size="12" fill="#2A2622" font-family="Helvetica,Arial,sans-serif">radiused front rail</text>
  <text x="320" y="330" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#5A554F">thigh contact, not catalog glamour</text>

</svg>
