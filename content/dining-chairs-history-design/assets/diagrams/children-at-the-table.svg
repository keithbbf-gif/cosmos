<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Booster seat and table height</title>
  <desc id="desc">Schematic booster block and vertical measure; no faces.</desc>
  <rect width="100%" height="100%" fill="#E8E4DC"/>

  <rect x="160" y="260" width="320" height="14" fill="#8B6F47" stroke="#2A2622"/>
  <rect x="220" y="200" width="200" height="60" fill="none" stroke="#3D6B8E" stroke-width="2"/>
  <text x="320" y="235" text-anchor="middle" font-size="12" fill="#3D6B8E">booster / firm seat</text>
  <line x1="320" y1="200" x2="320" y2="160" stroke="#C45C3E" stroke-width="2"/>
  <text x="330" y="175" font-size="12" fill="#C45C3E">popliteal height</text>
  <text x="320" y="330" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#5A554F">no identifiable child — tape and furniture only</text>

</svg>
