<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Lumbar zone versus dining contact</title>
  <desc id="desc">Abstract torso outline without a face; compares task-chair lumbar band to dining back contact.</desc>
  <rect width="100%" height="100%" fill="#E8E4DC"/>

  <rect x="200" y="100" width="80" height="200" rx="8" fill="none" stroke="#6B6560" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="240" y="90" text-anchor="middle" font-size="11" fill="#5A554F" font-family="Helvetica,Arial,sans-serif">torso outline only</text>
  <rect x="250" y="160" width="40" height="50" fill="none" stroke="#C45C3E" stroke-width="2"/>
  <text x="310" y="188" font-size="12" fill="#C45C3E" font-family="Helvetica,Arial,sans-serif">office lumbar zone</text>
  <line x1="200" y1="220" x2="330" y2="220" stroke="#8B6F47" stroke-width="3"/>
  <text x="320" y="250" font-size="12" fill="#2A2622" font-family="Georgia,serif">dining: shoulder blades meet the splat</text>

</svg>
