<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Measuring finished seat height</title>
  <desc id="desc">Tape from floor to top of seat rail.</desc>
  <rect width="100%" height="100%" fill="#E8E4DC"/>

  <line x1="100" y1="360" x2="540" y2="360" stroke="#6B6560" stroke-width="2"/>
  <rect x="220" y="300" width="200" height="12" fill="#8B6F47" stroke="#2A2622" stroke-width="2"/>
  <line x1="180" y1="360" x2="180" y2="312" stroke="#C45C3E" stroke-width="2"/>
  <line x1="460" y1="360" x2="460" y2="312" stroke="#C45C3E" stroke-width="2"/>
  <line x1="180" y1="336" x2="460" y2="336" stroke="#C45C3E" stroke-width="2"/>
  <text x="320" y="328" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#C45C3E">finished seat height (measure after pad settles)</text>
  <text x="320" y="388" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#5A554F">finished floor — not carpet nap alone</text>

</svg>
