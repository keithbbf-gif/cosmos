  <rect x="56.0" y="-12" width="236" height="52" rx="6" fill="#FFFFFF" filter="url(#shadow)"/>
  <text x="100.0" y="10" text-anchor="middle" class="t-label">Proposal</text>
  <text x="100.0" y="24" text-anchor="middle" class="t-body">Commission publishes risk-based</text>
  <text x="100.0" y="37" text-anchor="middle" class="t-body">framework</text>
  <circle cx="700.0" cy="120" r="6" fill="#B85C38" stroke="#FAF8F5" stroke-width="2"/>
  <line x1="700.0" y1="120" x2="700.0" y2="172" stroke="#E3DDD4" stroke-width="1.5"/>
  <rect x="582.0" y="172" width="236" height="52" rx="6" fill="#FFFFFF" filter="url(#shadow)"/>
  <text x="700.0" y="194" text-anchor="middle" class="t-label">Entry into force</text>
  <text x="700.0" y="208" text-anchor="middle" class="t-body">Act adopted; staggered obligations</text>
  <circle cx="900.0" cy="120" r="6" fill="#B85C38" stroke="#FAF8F5" stroke-width="2"/>
  <line x1="900.0" y1="120" x2="900.0" y2="50" stroke="#E3DDD4" stroke-width="1.5"/>
  <rect x="782.0" y="-12" width="236" height="52" rx="6" fill="#FFFFFF" filter="url(#shadow)"/>
  <text x="900.0" y="10" text-anchor="middle" class="t-label">GPAI duties</text>
  <text x="900.0" y="24" text-anchor="middle" class="t-body">General-purpose model rules phase in</text>
  <circle cx="1100.0" cy="120" r="6" fill="#B85C38" stroke="#FAF8F5" stroke-width="2"/>
  <line x1="1100.0" y1="120" x2="1100.0" y2="172" stroke="#E3DDD4" stroke-width="1.5"/>
  <rect x="908.0" y="172" width="236" height="52" rx="6" fill="#FFFFFF" filter="url(#shadow)"/>
  <text x="1100.0" y="194" text-anchor="middle" class="t-label">High-risk systems</text>
  <text x="1100.0" y="208" text-anchor="middle" class="t-body">Conformity expectations sharpen</text>
  <circle cx="1100.0" cy="120" r="6" fill="#B85C38" stroke="#FAF8F5" stroke-width="2"/>
  <line x1="1100.0" y1="120" x2="1100.0" y2="50" stroke="#E3DDD4" stroke-width="1.5"/>
  <rect x="908.0" y="-12" width="236" height="52" rx="6" fill="#FFFFFF" filter="url(#shadow)"/>
  <text x="1100.0" y="10" text-anchor="middle" class="t-label">Market practice</text>
  <text x="1100.0" y="24" text-anchor="middle" class="t-body">Contracts reference AI Act clauses</text>
  <text x="56" y="612" class="t-small">Dates reflect public legislative timeline; verify against official EUR-Lex text.</text>
