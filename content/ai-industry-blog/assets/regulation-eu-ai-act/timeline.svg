  <line x1="100.0" y1="112" x2="100.0" y2="128" stroke="#1E4D6B" stroke-width="2"/>
  <text x="100.0" y="148" text-anchor="middle" class="t-year">2021</text>
  <line x1="300.0" y1="112" x2="300.0" y2="128" stroke="#1E4D6B" stroke-width="2"/>
