<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Context window literacy</title>
  <desc id="desc">Editorial diagram for the AI industry blog. Generic public concepts only.</desc>
  <defs>
    <style>
      .t-title { font: 600 26px Georgia, 'Times New Roman', serif; fill: #141414; }
      .t-sub { font: 400 14px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #5C574F; }
      .t-year { font: 700 13px system-ui, sans-serif; fill: #1E4D6B; }
      .t-label { font: 600 12px system-ui, sans-serif; fill: #141414; }
      .t-body { font: 400 11.5px system-ui, sans-serif; fill: #5C574F; }
      .t-small { font: 400 10px system-ui, sans-serif; fill: #8A847A; }
      .t-card-title { font: 600 13px system-ui, sans-serif; fill: #141414; }
    </style>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#141414" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1E4D6B"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FAF8F5"/>
  <text x="48" y="38" class="t-title">Context window literacy</text>
  <text x="48" y="62" class="t-sub">One advertised limit, several competing uses</text>
  <line x1="48" y1="74" x2="952" y2="74" stroke="#E3DDD4"/>
  <rect x="48" y="118" width="904" height="52" rx="8" fill="#FFFFFF" stroke="#E3DDD4"/>
  <rect x="48.0" y="118" width="180.8" height="52" fill="#1E4D6B" stroke="none"/>
  <text x="138.4" y="148.0" text-anchor="middle" font="600 11px system-ui,sans-serif" fill="#FFFFFF">System + tools</text>
  <rect x="228.8" y="118" width="108.5" height="52" fill="#B85C38" stroke="none"/>
  <text x="283.0" y="148.0" text-anchor="middle" font="600 11px system-ui,sans-serif" fill="#FFFFFF">User turn</text>
  <rect x="337.3" y="118" width="271.2" height="52" fill="#1E4D6B" stroke="none"/>
  <text x="472.9" y="148.0" text-anchor="middle" font="600 11px system-ui,sans-serif" fill="#FFFFFF">Retrieved / upload</text>
  <rect x="608.5" y="118" width="162.7" height="52" fill="#B85C38" stroke="none"/>
  <text x="689.8" y="148.0" text-anchor="middle" font="600 11px system-ui,sans-serif" fill="#FFFFFF">Model output</text>
  <rect x="771.2" y="118" width="180.8" height="52" fill="#E3DDD4" stroke="none"/>
  <text x="861.6" y="148.0" text-anchor="middle" font="600 11px system-ui,sans-serif" fill="#141414">Unused headroom</text>
  <text x="48" y="210" class="t-body">Longer windows help only when you measure which slice the model actually uses (start, middle, end).</text>
  <text x="48" y="228" class="t-body">Retrieval and caching often beat raw length for freshness and cost.</text>
  <text x="48" y="296" class="t-small">Proportions are illustrative — not a vendor spec or token count.</text>
</svg>
