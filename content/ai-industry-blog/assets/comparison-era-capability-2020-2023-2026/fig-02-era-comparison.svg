<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 306" width="1200" height="306" role="img" aria-labelledby="title desc">
  <title id="title">Capability framing by era (schematic)</title>
  <desc id="desc">Editorial diagram for the AI industry blog. Generic public concepts only.</desc>
  <defs>
    <style>
      .t-title { font: 600 26px Georgia, 'Times New Roman', serif; fill: #141414; }
      .t-sub { font: 400 14px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #5C574F; }
      .t-year { font: 700 13px system-ui, sans-serif; fill: #1E4D6B; }
      .t-label { font: 600 12px system-ui, sans-serif; fill: #141414; }
      .t-body { font: 400 11.5px system-ui, sans-serif; fill: #5C574F; }
      .t-small { font: 400 10px system-ui, sans-serif; fill: #8A847A; }
      .t-card-title { font: 600 13px system-ui, sans-serif; fill: #141414; }
    </style>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#141414" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1E4D6B"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FAF8F5"/>
  <text x="56" y="40" class="t-title">Capability framing by era (schematic)</text>
  <text x="56" y="66" class="t-sub">How buyers described “good enough” — not benchmark scores</text>
  <line x1="56" y1="78" x2="1144" y2="78" stroke="#E3DDD4"/>
  <rect x="56" y="110" width="346" height="140" rx="10" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="56" y="110" width="346" height="8" rx="10" fill="#D4E4ED"/>
  <text x="229.0" y="146" text-anchor="middle" class="t-year">2020</text>
  <text x="76" y="168" class="t-body">• Research demos &amp; APIs</text>
  <text x="76" y="190" class="t-body">• Few-shot without fine-tune</text>
  <text x="76" y="212" class="t-body">• Safety mostly offline</text>
  <rect x="426" y="110" width="346" height="140" rx="10" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="426" y="110" width="346" height="8" rx="10" fill="#EDE8E0"/>
  <text x="599.0" y="146" text-anchor="middle" class="t-year">2023</text>
  <text x="446" y="168" class="t-body">• Chat UX as default</text>
  <text x="446" y="190" class="t-body">• RAG + plugins in prod</text>
  <text x="446" y="212" class="t-body">• Eval suites on slide decks</text>
  <rect x="796" y="110" width="346" height="140" rx="10" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="796" y="110" width="346" height="8" rx="10" fill="#D4E4ED"/>
  <text x="969.0" y="146" text-anchor="middle" class="t-year">2026</text>
  <text x="816" y="168" class="t-body">• Agents + long context SKUs</text>
  <text x="816" y="190" class="t-body">• Governance in contracts</text>
  <text x="816" y="212" class="t-body">• Hybrid open + closed stacks</text>
  <text x="56" y="278" class="t-small">Qualitative framing for editorial context; verify claims against your workload.</text>
</svg>
