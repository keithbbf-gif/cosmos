<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="1100" height="420" role="img" aria-labelledby="title desc">
  <title id="title">RAG vs long context (when to use which)</title>
  <desc id="desc">Editorial diagram for the AI industry blog. Generic public concepts only.</desc>
  <defs>
    <style>
      .t-title { font: 600 26px Georgia, 'Times New Roman', serif; fill: #141414; }
      .t-sub { font: 400 14px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #5C574F; }
      .t-year { font: 700 13px system-ui, sans-serif; fill: #1E4D6B; }
      .t-label { font: 600 12px system-ui, sans-serif; fill: #141414; }
      .t-body { font: 400 11.5px system-ui, sans-serif; fill: #5C574F; }
      .t-small { font: 400 10px system-ui, sans-serif; fill: #8A847A; }
      .t-card-title { font: 600 13px system-ui, sans-serif; fill: #141414; }
    </style>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#141414" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1E4D6B"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FAF8F5"/>
  <text x="48" y="38" class="t-title">RAG vs long context (when to use which)</text>
  <text x="48" y="62" class="t-sub">Hybrid designs are common in 2026 production stacks</text>
  <line x1="48" y1="74" x2="1052" y2="74" stroke="#E3DDD4"/>
  <line x1="280" y1="159" x2="360" y2="159" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="280" y1="299" x2="360" y2="299" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="159" x2="640" y2="220" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="299" x2="640" y2="250" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="860" y1="235" x2="900" y2="235" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="80" y="120" width="200" height="78" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="80" y="120" width="200" height="6" rx="8" fill="#D4E4ED"/>
  <text x="180.0" y="148" text-anchor="middle" class="t-card-title">Large corpus</text>
  <text x="180.0" y="168" text-anchor="middle" class="t-body">Many docs, updates</text>
  <rect x="80" y="260" width="200" height="78" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="80" y="260" width="200" height="6" rx="8" fill="#D4E4ED"/>
  <text x="180.0" y="288" text-anchor="middle" class="t-card-title">Long context</text>
  <text x="180.0" y="308" text-anchor="middle" class="t-body">Whole binder in prompt</text>
  <rect x="360" y="120" width="200" height="78" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="360" y="120" width="200" height="6" rx="8" fill="#D4E4ED"/>
  <text x="460.0" y="148" text-anchor="middle" class="t-card-title">RAG retrieve</text>
  <text x="460.0" y="168" text-anchor="middle" class="t-body">Rank + cite spans</text>
  <rect x="360" y="260" width="200" height="78" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="360" y="260" width="200" height="6" rx="8" fill="#D4E4ED"/>
  <text x="460.0" y="288" text-anchor="middle" class="t-card-title">Cache prefix</text>
  <text x="460.0" y="308" text-anchor="middle" class="t-body">Amortize repeated binders</text>
  <rect x="640" y="190" width="220" height="90" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="640" y="190" width="220" height="6" rx="8" fill="#D4E4ED"/>
  <text x="750.0" y="218" text-anchor="middle" class="t-card-title">Hybrid</text>
  <text x="750.0" y="238" text-anchor="middle" class="t-body">Retrieve then fill window</text>
  <rect x="900" y="190" width="170" height="90" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="900" y="190" width="170" height="6" rx="8" fill="#D4E4ED"/>
  <text x="985.0" y="218" text-anchor="middle" class="t-card-title">Eval both</text>
  <text x="985.0" y="238" text-anchor="middle" class="t-body">Needle + citation tests</text>
  <text x="48" y="396" class="t-small">Pick based on freshness, citeability, and measured middle-context behavior.</text>
</svg>
