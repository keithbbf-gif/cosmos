<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" role="img" aria-labelledby="title desc">
  <title id="title">Transformer block (generic)</title>
  <desc id="desc">Editorial diagram for the AI industry blog. Generic public concepts only.</desc>
  <defs>
    <style>
      .t-title { font: 600 26px Georgia, 'Times New Roman', serif; fill: #141414; }
      .t-sub { font: 400 14px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #5C574F; }
      .t-year { font: 700 13px system-ui, sans-serif; fill: #1E4D6B; }
      .t-label { font: 600 12px system-ui, sans-serif; fill: #141414; }
      .t-body { font: 400 11.5px system-ui, sans-serif; fill: #5C574F; }
      .t-small { font: 400 10px system-ui, sans-serif; fill: #8A847A; }
      .t-card-title { font: 600 13px system-ui, sans-serif; fill: #141414; }
    </style>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#141414" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1E4D6B"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FAF8F5"/>
  <text x="48" y="38" class="t-title">Transformer block (generic)</text>
  <text x="48" y="62" class="t-sub">Self-attention + feed-forward stack repeated L times</text>
  <line x1="48" y1="74" x2="1052" y2="74" stroke="#E3DDD4"/>
  <line x1="280" y1="156" x2="340" y2="144" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="144" x2="640" y2="156" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="730" y1="156" x2="860" y2="156" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="460" y1="188" x2="460" y2="260" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="304" x2="640" y2="192" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="80" y="120" width="200" height="72" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="80" y="120" width="200" height="6" rx="8" fill="#D4E4ED"/>
  <text x="180.0" y="148" text-anchor="middle" class="t-card-title">Input tokens</text>
  <text x="180.0" y="168" text-anchor="middle" class="t-body">Embeddings + positional info</text>
  <rect x="340" y="100" width="240" height="88" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="340" y="100" width="240" height="6" rx="8" fill="#D4E4ED"/>
  <text x="460.0" y="128" text-anchor="middle" class="t-card-title">Multi-head attention</text>
  <text x="460.0" y="148" text-anchor="middle" class="t-body">Query/key/value projections; scaled</text>
  <text x="460.0" y="162" text-anchor="middle" class="t-body">dot-product</text>
  <rect x="640" y="120" width="180" height="72" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="640" y="120" width="180" height="6" rx="8" fill="#D4E4ED"/>
  <text x="730.0" y="148" text-anchor="middle" class="t-card-title">Add &amp; norm</text>
  <text x="730.0" y="168" text-anchor="middle" class="t-body">Residual + layer</text>
  <text x="730.0" y="182" text-anchor="middle" class="t-body">normalization</text>
  <rect x="340" y="260" width="240" height="88" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="340" y="260" width="240" height="6" rx="8" fill="#D4E4ED"/>
  <text x="460.0" y="288" text-anchor="middle" class="t-card-title">Feed-forward MLP</text>
  <text x="460.0" y="308" text-anchor="middle" class="t-body">Two linear layers + activation</text>
  <rect x="860" y="120" width="200" height="72" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="860" y="120" width="200" height="6" rx="8" fill="#D4E4ED"/>
  <text x="960.0" y="148" text-anchor="middle" class="t-card-title">Output hidden state</text>
  <text x="960.0" y="168" text-anchor="middle" class="t-body">Passed to next block or head</text>
  <text x="48" y="596" class="t-small">Educational schematic; omitting KV-cache and parallel training details.</text>
</svg>
