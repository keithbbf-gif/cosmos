<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" role="img" aria-labelledby="title desc">
  <title id="title">Retrieval-augmented generation (RAG)</title>
  <desc id="desc">Editorial diagram for the AI industry blog. Generic public concepts only.</desc>
  <defs>
    <style>
      .t-title { font: 600 26px Georgia, 'Times New Roman', serif; fill: #141414; }
      .t-sub { font: 400 14px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #5C574F; }
      .t-year { font: 700 13px system-ui, sans-serif; fill: #1E4D6B; }
      .t-label { font: 600 12px system-ui, sans-serif; fill: #141414; }
      .t-body { font: 400 11.5px system-ui, sans-serif; fill: #5C574F; }
      .t-small { font: 400 10px system-ui, sans-serif; fill: #8A847A; }
      .t-card-title { font: 600 13px system-ui, sans-serif; fill: #141414; }
    </style>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#141414" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#FAF8F5"/>
  <text x="48" y="38" class="t-title">Retrieval-augmented generation (RAG)</text>
  <text x="48" y="62" class="t-sub">Retrieve evidence, then condition generation on cited chunks</text>
  <line x1="48" y1="74" x2="1052" y2="74" stroke="#E3DDD4"/>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1E4D6B"/>
    </marker>
  <line x1="230" y1="185" x2="270" y2="185" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="185" x2="480" y2="165" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="210" x2="580" y2="250" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="285" x2="720" y2="210" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="920" y1="195" x2="960" y2="195" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="150" width="170" height="70" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="60" y="150" width="170" height="6" rx="8" fill="#D4E4ED"/>
  <text x="145.0" y="178" text-anchor="middle" class="t-card-title">User query</text>
  <text x="145.0" y="198" text-anchor="middle" class="t-body">Natural language question</text>
  <rect x="270" y="150" width="170" height="70" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="270" y="150" width="170" height="6" rx="8" fill="#D4E4ED"/>
  <text x="355.0" y="178" text-anchor="middle" class="t-card-title">Embed query</text>
  <text x="355.0" y="198" text-anchor="middle" class="t-body">Vector representation</text>
  <rect x="480" y="120" width="200" height="90" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="480" y="120" width="200" height="6" rx="8" fill="#D4E4ED"/>
  <text x="580.0" y="148" text-anchor="middle" class="t-card-title">Vector index</text>
  <text x="580.0" y="168" text-anchor="middle" class="t-body">Chunked documents</text>
  <rect x="480" y="250" width="200" height="70" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="480" y="250" width="200" height="6" rx="8" fill="#D4E4ED"/>
  <text x="580.0" y="278" text-anchor="middle" class="t-card-title">Ranked passages</text>
  <text x="580.0" y="298" text-anchor="middle" class="t-body">Top-k with scores</text>
  <rect x="720" y="150" width="200" height="90" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="720" y="150" width="200" height="6" rx="8" fill="#D4E4ED"/>
  <text x="820.0" y="178" text-anchor="middle" class="t-card-title">Prompt assembly</text>
  <text x="820.0" y="198" text-anchor="middle" class="t-body">Instructions + citations</text>
  <rect x="960" y="150" width="170" height="90" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="960" y="150" width="170" height="6" rx="8" fill="#D4E4ED"/>
  <text x="1045.0" y="178" text-anchor="middle" class="t-card-title">LLM</text>
  <text x="1045.0" y="198" text-anchor="middle" class="t-body">Answer grounded in context</text>
  <text x="48" y="596" class="t-small">Generic RAG pattern; production systems add rerankers, filters, and eval loops.</text>
</svg>
