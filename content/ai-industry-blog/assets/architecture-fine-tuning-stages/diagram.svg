<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" role="img" aria-labelledby="title desc">
  <title id="title">Fine-tuning stages (generic)</title>
  <desc id="desc">Editorial diagram for the AI industry blog. Generic public concepts only.</desc>
  <defs>
    <style>
      .t-title { font: 600 26px Georgia, 'Times New Roman', serif; fill: #141414; }
      .t-sub { font: 400 14px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #5C574F; }
      .t-year { font: 700 13px system-ui, sans-serif; fill: #1E4D6B; }
      .t-label { font: 600 12px system-ui, sans-serif; fill: #141414; }
      .t-body { font: 400 11.5px system-ui, sans-serif; fill: #5C574F; }
      .t-small { font: 400 10px system-ui, sans-serif; fill: #8A847A; }
      .t-card-title { font: 600 13px system-ui, sans-serif; fill: #141414; }
    </style>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#141414" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1E4D6B"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FAF8F5"/>
  <text x="48" y="38" class="t-title">Fine-tuning stages (generic)</text>
  <text x="48" y="62" class="t-sub">From base model to task-specific behavior</text>
  <line x1="48" y1="74" x2="1052" y2="74" stroke="#E3DDD4"/>
  <line x1="270" y1="180" x2="320" y2="160" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="270" y1="180" x2="320" y2="300" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="160" x2="560" y2="210" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="300" x2="560" y2="230" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="230" x2="800" y2="230" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="80" y="140" width="190" height="80" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="80" y="140" width="190" height="6" rx="8" fill="#D4E4ED"/>
  <text x="175.0" y="168" text-anchor="middle" class="t-card-title">Pretrained base</text>
  <text x="175.0" y="188" text-anchor="middle" class="t-body">General language model</text>
  <rect x="320" y="120" width="200" height="80" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="320" y="120" width="200" height="6" rx="8" fill="#D4E4ED"/>
  <text x="420.0" y="148" text-anchor="middle" class="t-card-title">Supervised FT</text>
  <text x="420.0" y="168" text-anchor="middle" class="t-body">Instruction / task pairs</text>
  <rect x="320" y="260" width="200" height="80" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="320" y="260" width="200" height="6" rx="8" fill="#D4E4ED"/>
  <text x="420.0" y="288" text-anchor="middle" class="t-card-title">Preference tuning</text>
  <text x="420.0" y="308" text-anchor="middle" class="t-body">Human or model preferences</text>
  <rect x="560" y="190" width="200" height="80" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="560" y="190" width="200" height="6" rx="8" fill="#D4E4ED"/>
  <text x="660.0" y="218" text-anchor="middle" class="t-card-title">Adapter / LoRA</text>
  <text x="660.0" y="238" text-anchor="middle" class="t-body">Low-rank weight updates</text>
  <rect x="800" y="190" width="220" height="80" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="800" y="190" width="220" height="6" rx="8" fill="#D4E4ED"/>
  <text x="910.0" y="218" text-anchor="middle" class="t-card-title">Deployed checkpoint</text>
  <text x="910.0" y="238" text-anchor="middle" class="t-body">Served with guardrails</text>
  <text x="48" y="596" class="t-small">Not every product uses every stage; diagram shows common public pipeline.</text>
</svg>
