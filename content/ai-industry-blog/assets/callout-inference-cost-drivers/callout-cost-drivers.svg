<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Inference cost drivers</title>
  <desc id="desc">Editorial diagram for the AI industry blog. Generic public concepts only.</desc>
  <defs>
    <style>
      .t-title { font: 600 26px Georgia, 'Times New Roman', serif; fill: #141414; }
      .t-sub { font: 400 14px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #5C574F; }
      .t-year { font: 700 13px system-ui, sans-serif; fill: #1E4D6B; }
      .t-label { font: 600 12px system-ui, sans-serif; fill: #141414; }
      .t-body { font: 400 11.5px system-ui, sans-serif; fill: #5C574F; }
      .t-small { font: 400 10px system-ui, sans-serif; fill: #8A847A; }
      .t-card-title { font: 600 13px system-ui, sans-serif; fill: #141414; }
    </style>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#141414" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1E4D6B"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FAF8F5"/>
  <text x="48" y="38" class="t-title">Inference cost drivers</text>
  <text x="48" y="62" class="t-sub">Illustrative framing for finance conversations</text>
  <line x1="48" y1="74" x2="852" y2="74" stroke="#E3DDD4"/>
  <rect x="72" y="110" width="756" height="140" rx="10" fill="#FFFFFF" stroke="#B85C38" stroke-width="2" filter="url(#shadow)"/>
  <rect x="72" y="110" width="6" height="140" rx="3" fill="#B85C38"/>
  <text x="96" y="150" class="t-label">Serving cost scales with tokens in and out, model width,</text>
  <text x="96" y="172" class="t-label">batch utilization, and region — not headline parameter</text>
  <text x="96" y="194" class="t-label">counts alone.</text>
  <text x="96" y="248" class="t-body">Conceptual summary; cite your vendor invoice for numbers.</text>
  <text x="48" y="292" class="t-small">Illustrative callout — not sourced statistics.</text>
</svg>
