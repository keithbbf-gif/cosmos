  <rect x="540" y="280" width="150" height="70" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="540" y="280" width="150" height="6" rx="8" fill="#D4E4ED"/>
