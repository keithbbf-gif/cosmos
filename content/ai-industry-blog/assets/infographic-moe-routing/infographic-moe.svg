  <rect x="760" y="200" width="160" height="70" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="760" y="200" width="160" height="6" rx="8" fill="#D4E4ED"/>
  <text x="840.0" y="228" text-anchor="middle" class="t-card-title">Combine</text>
