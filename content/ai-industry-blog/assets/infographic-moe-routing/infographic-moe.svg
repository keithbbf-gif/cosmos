  <rect x="960" y="200" width="140" height="70" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="960" y="200" width="140" height="6" rx="8" fill="#D4E4ED"/>
  <text x="1030.0" y="228" text-anchor="middle" class="t-card-title">Output</text>
  <text x="1030.0" y="248" text-anchor="middle" class="t-body">Next layer input</text>
  <text x="48" y="596" class="t-small">Serving MoE requires expert parallelism; diagram omits hardware mapping.</text>
