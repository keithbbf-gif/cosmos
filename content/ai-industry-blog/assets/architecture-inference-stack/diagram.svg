<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" role="img" aria-labelledby="title desc">
  <title id="title">Inference serving stack</title>
  <desc id="desc">Editorial diagram for the AI industry blog. Generic public concepts only.</desc>
  <defs>
    <style>
      .t-title { font: 600 26px Georgia, 'Times New Roman', serif; fill: #141414; }
      .t-sub { font: 400 14px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #5C574F; }
      .t-year { font: 700 13px system-ui, sans-serif; fill: #1E4D6B; }
      .t-label { font: 600 12px system-ui, sans-serif; fill: #141414; }
      .t-body { font: 400 11.5px system-ui, sans-serif; fill: #5C574F; }
      .t-small { font: 400 10px system-ui, sans-serif; fill: #8A847A; }
      .t-card-title { font: 600 13px system-ui, sans-serif; fill: #141414; }
    </style>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#141414" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#FAF8F5"/>
  <text x="48" y="38" class="t-title">Inference serving stack</text>
  <text x="48" y="62" class="t-sub">Request path from client to generated tokens</text>
  <line x1="48" y1="74" x2="1052" y2="74" stroke="#E3DDD4"/>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1E4D6B"/>
    </marker>
  <line x1="210" y1="205" x2="250" y2="205" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="205" x2="460" y2="155" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="205" x2="460" y2="275" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="155" x2="680" y2="190" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="275" x2="680" y2="210" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="840" y1="205" x2="880" y2="205" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="170" width="150" height="70" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="60" y="170" width="150" height="6" rx="8" fill="#D4E4ED"/>
  <text x="135.0" y="198" text-anchor="middle" class="t-card-title">Client</text>
  <text x="135.0" y="218" text-anchor="middle" class="t-body">App or API consumer</text>
  <rect x="250" y="170" width="170" height="70" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="250" y="170" width="170" height="6" rx="8" fill="#D4E4ED"/>
  <text x="335.0" y="198" text-anchor="middle" class="t-card-title">Gateway</text>
  <text x="335.0" y="218" text-anchor="middle" class="t-body">Auth, routing, rate limits</text>
  <rect x="460" y="120" width="180" height="70" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="460" y="120" width="180" height="6" rx="8" fill="#D4E4ED"/>
  <text x="550.0" y="148" text-anchor="middle" class="t-card-title">Scheduler</text>
  <text x="550.0" y="168" text-anchor="middle" class="t-body">Batching / queueing</text>
  <rect x="460" y="240" width="180" height="70" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="460" y="240" width="180" height="6" rx="8" fill="#D4E4ED"/>
  <text x="550.0" y="268" text-anchor="middle" class="t-card-title">Model workers</text>
  <text x="550.0" y="288" text-anchor="middle" class="t-body">GPU/TPU execution</text>
  <rect x="680" y="170" width="160" height="70" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="680" y="170" width="160" height="6" rx="8" fill="#D4E4ED"/>
  <text x="760.0" y="198" text-anchor="middle" class="t-card-title">Tokenizer</text>
  <text x="760.0" y="218" text-anchor="middle" class="t-body">Encode / decode</text>
  <rect x="880" y="170" width="180" height="70" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="880" y="170" width="180" height="6" rx="8" fill="#D4E4ED"/>
  <text x="970.0" y="198" text-anchor="middle" class="t-card-title">Streamed response</text>
  <text x="970.0" y="218" text-anchor="middle" class="t-body">Tokens + metadata</text>
  <text x="48" y="596" class="t-small">Simplified serving diagram; excludes speculative decoding and multi-region failover.</text>
</svg>
