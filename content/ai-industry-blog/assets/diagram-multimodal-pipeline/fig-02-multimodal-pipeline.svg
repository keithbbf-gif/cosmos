<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" width="1120" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Multimodal pipeline (generic)</title>
  <desc id="desc">Editorial diagram for the AI industry blog. Generic public concepts only.</desc>
  <defs>
    <style>
      .t-title { font: 600 26px Georgia, 'Times New Roman', serif; fill: #141414; }
      .t-sub { font: 400 14px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #5C574F; }
      .t-year { font: 700 13px system-ui, sans-serif; fill: #1E4D6B; }
      .t-label { font: 600 12px system-ui, sans-serif; fill: #141414; }
      .t-body { font: 400 11.5px system-ui, sans-serif; fill: #5C574F; }
      .t-small { font: 400 10px system-ui, sans-serif; fill: #8A847A; }
      .t-card-title { font: 600 13px system-ui, sans-serif; fill: #141414; }
    </style>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#141414" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1E4D6B"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FAF8F5"/>
  <text x="48" y="38" class="t-title">Multimodal pipeline (generic)</text>
  <text x="48" y="62" class="t-sub">Align encoders, fuse tokens, decode text or media</text>
  <line x1="48" y1="74" x2="1072" y2="74" stroke="#E3DDD4"/>
  <line x1="240" y1="166" x2="490" y2="210" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="240" y1="296" x2="490" y2="240" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="296" x2="490" y2="250" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="235" x2="720" y2="235" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="900" y1="235" x2="940" y2="235" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="70" y="130" width="170" height="72" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="70" y="130" width="170" height="6" rx="8" fill="#D4E4ED"/>
  <text x="155.0" y="158" text-anchor="middle" class="t-card-title">Text tokenizer</text>
  <text x="155.0" y="178" text-anchor="middle" class="t-body">Subword units</text>
  <rect x="70" y="260" width="170" height="72" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="70" y="260" width="170" height="6" rx="8" fill="#D4E4ED"/>
  <text x="155.0" y="288" text-anchor="middle" class="t-card-title">Vision encoder</text>
  <text x="155.0" y="308" text-anchor="middle" class="t-body">Patches or tiles</text>
  <rect x="280" y="260" width="170" height="72" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="280" y="260" width="170" height="6" rx="8" fill="#D4E4ED"/>
  <text x="365.0" y="288" text-anchor="middle" class="t-card-title">Audio / speech</text>
  <text x="365.0" y="308" text-anchor="middle" class="t-body">Frames or codes</text>
  <rect x="490" y="190" width="190" height="90" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="490" y="190" width="190" height="6" rx="8" fill="#D4E4ED"/>
  <text x="585.0" y="218" text-anchor="middle" class="t-card-title">Fusion layer</text>
  <text x="585.0" y="238" text-anchor="middle" class="t-body">Cross-attention</text>
  <rect x="720" y="190" width="180" height="90" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="720" y="190" width="180" height="6" rx="8" fill="#D4E4ED"/>
  <text x="810.0" y="218" text-anchor="middle" class="t-card-title">Language core</text>
  <text x="810.0" y="238" text-anchor="middle" class="t-body">Shared transformer</text>
  <rect x="940" y="190" width="150" height="90" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="940" y="190" width="150" height="6" rx="8" fill="#D4E4ED"/>
  <text x="1015.0" y="218" text-anchor="middle" class="t-card-title">Output head</text>
  <text x="1015.0" y="238" text-anchor="middle" class="t-body">Text, image, or speech</text>
  <text x="48" y="396" class="t-small">Production stacks add routing, caching, and modality-specific safety filters.</text>
</svg>
