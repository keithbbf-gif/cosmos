<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" role="img" aria-labelledby="title desc">
  <title id="title">Product data flywheel (generic)</title>
  <desc id="desc">Editorial diagram for the AI industry blog. Generic public concepts only.</desc>
  <defs>
    <style>
      .t-title { font: 600 26px Georgia, 'Times New Roman', serif; fill: #141414; }
      .t-sub { font: 400 14px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #5C574F; }
      .t-year { font: 700 13px system-ui, sans-serif; fill: #1E4D6B; }
      .t-label { font: 600 12px system-ui, sans-serif; fill: #141414; }
      .t-body { font: 400 11.5px system-ui, sans-serif; fill: #5C574F; }
      .t-small { font: 400 10px system-ui, sans-serif; fill: #8A847A; }
      .t-card-title { font: 600 13px system-ui, sans-serif; fill: #141414; }
    </style>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#141414" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1E4D6B"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FAF8F5"/>
  <text x="48" y="38" class="t-title">Product data flywheel (generic)</text>
  <text x="48" y="62" class="t-sub">How usage can feed the next model generation — when policy allows</text>
  <line x1="48" y1="74" x2="1052" y2="74" stroke="#E3DDD4"/>
  <line x1="300" y1="176" x2="360" y2="176" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="176" x2="600" y2="155" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="210" x2="700" y2="260" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="230" x2="840" y2="230" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="210" y1="212" x2="210" y2="260" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="210" y1="260" x2="600" y2="296" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="120" y="140" width="180" height="72" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="120" y="140" width="180" height="6" rx="8" fill="#D4E4ED"/>
  <text x="210.0" y="168" text-anchor="middle" class="t-card-title">Deployed model</text>
  <text x="210.0" y="188" text-anchor="middle" class="t-body">API or on-prem</text>
  <rect x="360" y="140" width="190" height="72" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="360" y="140" width="190" height="6" rx="8" fill="#D4E4ED"/>
  <text x="455.0" y="168" text-anchor="middle" class="t-card-title">User interactions</text>
  <text x="455.0" y="188" text-anchor="middle" class="t-body">Logs, edits, thumbs</text>
  <rect x="600" y="120" width="200" height="90" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="600" y="120" width="200" height="6" rx="8" fill="#D4E4ED"/>
  <text x="700.0" y="148" text-anchor="middle" class="t-card-title">Filtering + consent</text>
  <text x="700.0" y="168" text-anchor="middle" class="t-body">Retention rules</text>
  <rect x="600" y="260" width="200" height="72" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="600" y="260" width="200" height="6" rx="8" fill="#D4E4ED"/>
  <text x="700.0" y="288" text-anchor="middle" class="t-card-title">Labeling / curation</text>
  <text x="700.0" y="308" text-anchor="middle" class="t-body">Human or model judges</text>
  <rect x="840" y="190" width="180" height="72" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="840" y="190" width="180" height="6" rx="8" fill="#D4E4ED"/>
  <text x="930.0" y="218" text-anchor="middle" class="t-card-title">Training mix</text>
  <text x="930.0" y="238" text-anchor="middle" class="t-body">Blended with public data</text>
  <text x="48" y="596" class="t-small">Legal and contractual constraints vary; diagram is not a compliance guide.</text>
</svg>
