<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 400" width="1020" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Prompt injection defenses (layered)</title>
  <desc id="desc">Editorial diagram for the AI industry blog. Generic public concepts only.</desc>
  <defs>
    <style>
      .t-title { font: 600 26px Georgia, 'Times New Roman', serif; fill: #141414; }
      .t-sub { font: 400 14px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #5C574F; }
      .t-year { font: 700 13px system-ui, sans-serif; fill: #1E4D6B; }
      .t-label { font: 600 12px system-ui, sans-serif; fill: #141414; }
      .t-body { font: 400 11.5px system-ui, sans-serif; fill: #5C574F; }
      .t-small { font: 400 10px system-ui, sans-serif; fill: #8A847A; }
      .t-card-title { font: 600 13px system-ui, sans-serif; fill: #141414; }
    </style>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#141414" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1E4D6B"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FAF8F5"/>
  <text x="48" y="38" class="t-title">Prompt injection defenses (layered)</text>
  <text x="48" y="62" class="t-sub">No single filter fixes untrusted text in the context</text>
  <line x1="48" y1="74" x2="972" y2="74" stroke="#E3DDD4"/>
  <line x1="260" y1="209" x2="300" y2="159" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="260" y1="209" x2="300" y2="299" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="159" x2="540" y2="190" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="299" x2="540" y2="210" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="740" y1="209" x2="780" y2="209" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="70" y="170" width="190" height="78" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="70" y="170" width="190" height="6" rx="8" fill="#D4E4ED"/>
  <text x="165.0" y="198" text-anchor="middle" class="t-card-title">Untrusted input</text>
  <text x="165.0" y="218" text-anchor="middle" class="t-body">Email, web, user paste</text>
  <rect x="300" y="120" width="200" height="78" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="300" y="120" width="200" height="6" rx="8" fill="#D4E4ED"/>
  <text x="400.0" y="148" text-anchor="middle" class="t-card-title">Sanitize + isolate</text>
  <text x="400.0" y="168" text-anchor="middle" class="t-body">Separate channels</text>
  <rect x="300" y="260" width="200" height="78" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="300" y="260" width="200" height="6" rx="8" fill="#D4E4ED"/>
  <text x="400.0" y="288" text-anchor="middle" class="t-card-title">Tool allowlists</text>
  <text x="400.0" y="308" text-anchor="middle" class="t-body">Least privilege</text>
  <rect x="540" y="170" width="200" height="78" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="540" y="170" width="200" height="6" rx="8" fill="#D4E4ED"/>
  <text x="640.0" y="198" text-anchor="middle" class="t-card-title">Model policy</text>
  <text x="640.0" y="218" text-anchor="middle" class="t-body">Refuse override attempts</text>
  <rect x="780" y="170" width="190" height="78" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="780" y="170" width="190" height="6" rx="8" fill="#D4E4ED"/>
  <text x="875.0" y="198" text-anchor="middle" class="t-card-title">Human gate</text>
  <text x="875.0" y="218" text-anchor="middle" class="t-body">High-impact actions</text>
  <text x="48" y="376" class="t-small">Assume attackers read your system prompt; design for containment.</text>
</svg>
