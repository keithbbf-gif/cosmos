<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" role="img" aria-labelledby="title desc">
  <title id="title">Open-weight vs closed API topology</title>
  <desc id="desc">Editorial diagram for the AI industry blog. Generic public concepts only.</desc>
  <defs>
    <style>
      .t-title { font: 600 26px Georgia, 'Times New Roman', serif; fill: #141414; }
      .t-sub { font: 400 14px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #5C574F; }
      .t-year { font: 700 13px system-ui, sans-serif; fill: #1E4D6B; }
      .t-label { font: 600 12px system-ui, sans-serif; fill: #141414; }
      .t-body { font: 400 11.5px system-ui, sans-serif; fill: #5C574F; }
      .t-small { font: 400 10px system-ui, sans-serif; fill: #8A847A; }
      .t-card-title { font: 600 13px system-ui, sans-serif; fill: #141414; }
    </style>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#141414" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1E4D6B"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FAF8F5"/>
  <text x="48" y="38" class="t-title">Open-weight vs closed API topology</text>
  <text x="48" y="62" class="t-sub">Generic deployment patterns — not a vendor map</text>
  <line x1="48" y1="74" x2="1052" y2="74" stroke="#E3DDD4"/>
  <line x1="260" y1="150" x2="320" y2="150" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="260" y1="300" x2="320" y2="300" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="150" x2="560" y2="210" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="300" x2="560" y2="240" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="780" y1="230" x2="820" y2="230" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="110" width="200" height="80" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="60" y="110" width="200" height="6" rx="8" fill="#D4E4ED"/>
  <text x="160.0" y="138" text-anchor="middle" class="t-card-title">Closed API</text>
  <text x="160.0" y="158" text-anchor="middle" class="t-body">Vendor-hosted weights</text>
  <rect x="320" y="110" width="180" height="80" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="320" y="110" width="180" height="6" rx="8" fill="#D4E4ED"/>
  <text x="410.0" y="138" text-anchor="middle" class="t-card-title">Your app</text>
  <text x="410.0" y="158" text-anchor="middle" class="t-body">Gateway + policies</text>
  <rect x="60" y="260" width="200" height="80" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="60" y="260" width="200" height="6" rx="8" fill="#D4E4ED"/>
  <text x="160.0" y="288" text-anchor="middle" class="t-card-title">Open weights file</text>
  <text x="160.0" y="308" text-anchor="middle" class="t-body">Downloaded checkpoint</text>
  <rect x="320" y="260" width="180" height="80" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="320" y="260" width="180" height="6" rx="8" fill="#D4E4ED"/>
  <text x="410.0" y="288" text-anchor="middle" class="t-card-title">Your GPU cluster</text>
  <text x="410.0" y="308" text-anchor="middle" class="t-body">Self-managed serving</text>
  <rect x="560" y="185" width="220" height="90" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="560" y="185" width="220" height="6" rx="8" fill="#D4E4ED"/>
  <text x="670.0" y="213" text-anchor="middle" class="t-card-title">Shared controls</text>
  <text x="670.0" y="233" text-anchor="middle" class="t-body">Auth, logging, eval hooks</text>
  <rect x="820" y="185" width="200" height="90" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="820" y="185" width="200" height="6" rx="8" fill="#D4E4ED"/>
  <text x="920.0" y="213" text-anchor="middle" class="t-card-title">User / tenant data</text>
  <text x="920.0" y="233" text-anchor="middle" class="t-body">Stays in your boundary</text>
  <text x="48" y="596" class="t-small">Hybrid setups (VPC endpoints + local adapters) are common in enterprise.</text>
</svg>
