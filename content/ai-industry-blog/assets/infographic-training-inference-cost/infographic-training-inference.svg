<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 420" width="1020" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Training vs inference spend (schematic)</title>
  <desc id="desc">Editorial diagram for the AI industry blog. Generic public concepts only.</desc>
  <defs>
    <style>
      .t-title { font: 600 26px Georgia, 'Times New Roman', serif; fill: #141414; }
      .t-sub { font: 400 14px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #5C574F; }
      .t-year { font: 700 13px system-ui, sans-serif; fill: #1E4D6B; }
      .t-label { font: 600 12px system-ui, sans-serif; fill: #141414; }
      .t-body { font: 400 11.5px system-ui, sans-serif; fill: #5C574F; }
      .t-small { font: 400 10px system-ui, sans-serif; fill: #8A847A; }
      .t-card-title { font: 600 13px system-ui, sans-serif; fill: #141414; }
    </style>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#141414" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1E4D6B"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FAF8F5"/>
  <text x="48" y="38" class="t-title">Training vs inference spend (schematic)</text>
  <text x="48" y="62" class="t-sub">Where capex and opex show up in a generic model lifecycle</text>
  <line x1="48" y1="74" x2="972" y2="74" stroke="#E3DDD4"/>
  <line x1="250" y1="189" x2="290" y2="165" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="250" y1="189" x2="290" y2="299" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="490" y1="159" x2="530" y2="159" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="490" y1="299" x2="530" y2="299" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="720" y1="230" x2="760" y2="230" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="70" y="150" width="180" height="78" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="70" y="150" width="180" height="6" rx="8" fill="#D4E4ED"/>
  <text x="160.0" y="178" text-anchor="middle" class="t-card-title">Data + curation</text>
  <text x="160.0" y="198" text-anchor="middle" class="t-body">One-time corpus cost</text>
  <rect x="290" y="120" width="200" height="90" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="290" y="120" width="200" height="6" rx="8" fill="#D4E4ED"/>
  <text x="390.0" y="148" text-anchor="middle" class="t-card-title">Cluster training</text>
  <text x="390.0" y="168" text-anchor="middle" class="t-body">Large upfront GPU block</text>
  <rect x="290" y="260" width="200" height="78" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="290" y="260" width="200" height="6" rx="8" fill="#D4E4ED"/>
  <text x="390.0" y="288" text-anchor="middle" class="t-card-title">Alignment passes</text>
  <text x="390.0" y="308" text-anchor="middle" class="t-body">SFT, prefs, safety</text>
  <rect x="530" y="120" width="190" height="78" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="530" y="120" width="190" height="6" rx="8" fill="#D4E4ED"/>
  <text x="625.0" y="148" text-anchor="middle" class="t-card-title">Checkpoint storage</text>
  <text x="625.0" y="168" text-anchor="middle" class="t-body">Versioned weights</text>
  <rect x="530" y="260" width="190" height="78" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="530" y="260" width="190" height="6" rx="8" fill="#D4E4ED"/>
  <text x="625.0" y="288" text-anchor="middle" class="t-card-title">Serving fleet</text>
  <text x="625.0" y="308" text-anchor="middle" class="t-body">Per-token opex</text>
  <rect x="760" y="190" width="200" height="78" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="760" y="190" width="200" height="6" rx="8" fill="#D4E4ED"/>
  <text x="860.0" y="218" text-anchor="middle" class="t-card-title">Eval + monitoring</text>
  <text x="860.0" y="238" text-anchor="middle" class="t-body">Continuous harness runs</text>
  <text x="48" y="396" class="t-small">Illustrative economics — not vendor pricing or benchmark totals.</text>
</svg>
