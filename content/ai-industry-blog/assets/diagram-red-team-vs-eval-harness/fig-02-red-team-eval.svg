<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="title desc">
  <title id="title">Red team vs eval harness</title>
  <desc id="desc">Editorial diagram for the AI industry blog. Generic public concepts only.</desc>
  <defs>
    <style>
      .t-title { font: 600 26px Georgia, 'Times New Roman', serif; fill: #141414; }
      .t-sub { font: 400 14px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #5C574F; }
      .t-year { font: 700 13px system-ui, sans-serif; fill: #1E4D6B; }
      .t-label { font: 600 12px system-ui, sans-serif; fill: #141414; }
      .t-body { font: 400 11.5px system-ui, sans-serif; fill: #5C574F; }
      .t-small { font: 400 10px system-ui, sans-serif; fill: #8A847A; }
      .t-card-title { font: 600 13px system-ui, sans-serif; fill: #141414; }
    </style>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#141414" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1E4D6B"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FAF8F5"/>
  <text x="48" y="38" class="t-title">Red team vs eval harness</text>
  <text x="48" y="62" class="t-sub">Complementary loops — not interchangeable scoreboards</text>
  <line x1="48" y1="74" x2="912" y2="74" stroke="#E3DDD4"/>
  <line x1="300" y1="195" x2="400" y2="250" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="335" x2="400" y2="280" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="250" x2="680" y2="195" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="280" x2="680" y2="335" stroke="#1E4D6B" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="80" y="150" width="220" height="90" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="80" y="150" width="220" height="6" rx="8" fill="#D4E4ED"/>
  <text x="190.0" y="178" text-anchor="middle" class="t-card-title">Eval harness</text>
  <text x="190.0" y="198" text-anchor="middle" class="t-body">Fixed prompts, metrics</text>
  <rect x="80" y="290" width="220" height="90" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="80" y="290" width="220" height="6" rx="8" fill="#D4E4ED"/>
  <text x="190.0" y="318" text-anchor="middle" class="t-card-title">Red team</text>
  <text x="190.0" y="338" text-anchor="middle" class="t-body">Adaptive adversaries</text>
  <rect x="400" y="220" width="200" height="90" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="400" y="220" width="200" height="6" rx="8" fill="#D4E4ED"/>
  <text x="500.0" y="248" text-anchor="middle" class="t-card-title">Model build</text>
  <text x="500.0" y="268" text-anchor="middle" class="t-body">Candidate checkpoint</text>
  <rect x="680" y="150" width="220" height="90" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="680" y="150" width="220" height="6" rx="8" fill="#D4E4ED"/>
  <text x="790.0" y="178" text-anchor="middle" class="t-card-title">Issue tracker</text>
  <text x="790.0" y="198" text-anchor="middle" class="t-body">Severity + repro</text>
  <rect x="680" y="290" width="220" height="90" rx="8" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <rect x="680" y="290" width="220" height="6" rx="8" fill="#D4E4ED"/>
  <text x="790.0" y="318" text-anchor="middle" class="t-card-title">Release notes</text>
  <text x="790.0" y="338" text-anchor="middle" class="t-body">Known limitations</text>
  <text x="48" y="416" class="t-small">Red teams find unknowns; harnesses track regressions on known tests.</text>
