<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="title desc">
  <title id="title">AI compliance decision tree (high level)</title>
  <desc id="desc">Editorial diagram for the AI industry blog. Generic public concepts only.</desc>
  <defs>
    <style>
      .t-title { font: 600 26px Georgia, 'Times New Roman', serif; fill: #141414; }
      .t-sub { font: 400 14px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #5C574F; }
      .t-year { font: 700 13px system-ui, sans-serif; fill: #1E4D6B; }
      .t-label { font: 600 12px system-ui, sans-serif; fill: #141414; }
      .t-body { font: 400 11.5px system-ui, sans-serif; fill: #5C574F; }
      .t-small { font: 400 10px system-ui, sans-serif; fill: #8A847A; }
      .t-card-title { font: 600 13px system-ui, sans-serif; fill: #141414; }
    </style>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#141414" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1E4D6B"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FAF8F5"/>
  <text x="48" y="38" class="t-title">AI compliance decision tree (high level)</text>
  <text x="48" y="62" class="t-sub">Illustrative gates — confirm with counsel and primary law</text>
  <line x1="48" y1="74" x2="912" y2="74" stroke="#E3DDD4"/>
  <rect x="420.0" y="90" width="120" height="36" rx="6" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <text x="480" y="112" text-anchor="middle" class="t-label">Plan AI feature</text>
  <polygon points="480,176 550,198 480,220 410,198" fill="#FFFFFF" stroke="#B85C38" filter="url(#shadow)"/>
  <text x="480" y="202" text-anchor="middle" class="t-label">High-risk use case?</text>
  <polygon points="280,276 350,298 280,320 210,298" fill="#FFFFFF" stroke="#B85C38" filter="url(#shadow)"/>
  <text x="280" y="302" text-anchor="middle" class="t-label">Sector-specific rules?</text>
  <rect x="620.0" y="280" width="120" height="36" rx="6" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <text x="680" y="302" text-anchor="middle" class="t-label">Standard documentation</text>
  <rect x="220.0" y="380" width="120" height="36" rx="6" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <text x="280" y="402" text-anchor="middle" class="t-label">Enhanced audit + testing</text>
  <rect x="407.5" y="430" width="145" height="36" rx="6" fill="#FFFFFF" stroke="#E3DDD4" filter="url(#shadow)"/>
  <text x="480" y="452" text-anchor="middle" class="t-label">Ship with documented controls</text>
  <line x1="480" y1="130" x2="480" y2="176" stroke="#1E4D6B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="220" x2="280" y2="276" stroke="#1E4D6B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="380.0" y="248.0" text-anchor="middle" class="t-small">yes</text>
  <line x1="480" y1="220" x2="680" y2="276" stroke="#1E4D6B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="580.0" y="248.0" text-anchor="middle" class="t-small">no</text>
  <line x1="280" y1="320" x2="280" y2="376" stroke="#1E4D6B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="280.0" y="348.0" text-anchor="middle" class="t-small">yes</text>
  <line x1="280" y1="320" x2="480" y2="426" stroke="#1E4D6B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="380.0" y="373.0" text-anchor="middle" class="t-small">no</text>
  <line x1="680" y1="320" x2="480" y2="426" stroke="#1E4D6B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="280" y1="420" x2="480" y2="426" stroke="#1E4D6B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="48" y="496" class="t-small">Not legal advice; “high risk” definitions vary by jurisdiction.</text>
</svg>
