<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
  <title id="title">Night SKU — file vs podcast stack</title>
  <rect width="100%" height="100%" fill="#f7fafc"/>
  <text x="24" y="36" font-family="Source Serif 4, Georgia, serif" font-size="22" font-weight="600" fill="#1a2332">Night SKU — file vs podcast stack</text>
  <rect x="24" y="70" width="340" height="300" rx="6" fill="#ffffff" stroke="#cbd5e0"/>
  <rect x="400" y="70" width="336" height="300" rx="6" fill="#ffffff" stroke="#cbd5e0"/>
  <text x="40" y="98" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="15" font-weight="600" fill="#2b6cb0">One hero with a file</text>
  <text x="416" y="98" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="15" font-weight="600" fill="#9b2c2c">Five-ingredient night blend</text>
  <text x="40" y="128" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" font-weight="400" fill="#1a2332">• Melatonin 0.5–3 mg, assayed</text>
  <text x="40" y="150" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" font-weight="400" fill="#1a2332">• Mg glycinate with elemental math</text>
  <text x="40" y="172" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" font-weight="400" fill="#1a2332">• Theanine 200 mg if that is the SKU</text>
  <text x="416" y="128" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" font-weight="400" fill="#1a2332">• Five assays, five adulteration stories</text>
  <text x="416" y="150" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" font-weight="400" fill="#1a2332">• Apigenin isolate ≠ chamomile tea RCT</text>
  <text x="416" y="172" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" font-weight="400" fill="#1a2332">• Inherits Cohen gummy assay risk</text>
  <text x="24" y="426" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" fill="#4a5568">Qualitative operator split — article 20; not efficacy bars</text>
</svg>
