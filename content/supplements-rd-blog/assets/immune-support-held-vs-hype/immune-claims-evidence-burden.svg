<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="302" viewBox="0 0 760 302" role="img" aria-labelledby="title desc">
  <title id="title">Immune copy vs what large outpatient trials reported (2020–2021 window)</title>
  <rect width="100%" height="100%" fill="#f7fafc"/>
  <text x="24" y="36" font-family="Source Serif 4, Georgia, serif" font-size="22" font-weight="600" fill="#1a2332">Immune copy vs what large outpatient trials reported (2020–2021 window)</text>
  <text x="24" y="58" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" fill="#4a5568">Qualitative literacy map — not clinical effect sizes</text>
  <text x="24" y="104" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1a2332">High-dose vitamin C + zinc for COVID symptom duration</text>
  <rect x="280" y="88" width="420" height="28" rx="6" fill="#ffffff" stroke="#cbd5e0"/>
  <rect x="280" y="88" width="280" height="28" rx="6" fill="#2b6cb0" stroke="#cbd5e0"/>
  <text x="710" y="106" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" font-weight="400" fill="#4a5568">mixed burden — COVID A to Z did not meet endpoint</text>
  <text x="24" y="148" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1a2332">Vitamin D test-and-treat for ARI (CORONAVIT)</text>
  <rect x="280" y="132" width="420" height="28" rx="6" fill="#ffffff" stroke="#cbd5e0"/>
  <rect x="280" y="132" width="280" height="28" rx="6" fill="#2b6cb0" stroke="#cbd5e0"/>
  <text x="710" y="150" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" font-weight="400" fill="#4a5568">mixed burden — primary endpoints not met</text>
  <text x="24" y="192" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1a2332">Structure/function immune support (no disease claim)</text>
  <rect x="280" y="176" width="420" height="28" rx="6" fill="#ffffff" stroke="#cbd5e0"/>
  <rect x="280" y="176" width="140" height="28" rx="6" fill="#2f855a" stroke="#cbd5e0"/>
  <text x="710" y="194" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" font-weight="400" fill="#4a5568">lower burden — if substantiation file exists</text>
  <text x="24" y="236" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1a2332">Prevents / treats COVID-19</text>
  <rect x="280" y="220" width="420" height="28" rx="6" fill="#ffffff" stroke="#cbd5e0"/>
  <rect x="280" y="220" width="380" height="28" rx="6" fill="#9b2c2c" stroke="#cbd5e0"/>
  <text x="710" y="238" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" font-weight="400" fill="#4a5568">higher burden — disease claim; FDA letters</text>
  <text x="24" y="288" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" fill="#4a5568">Trial names and outcomes per article 03; not effect-size chart</text>
</svg>
