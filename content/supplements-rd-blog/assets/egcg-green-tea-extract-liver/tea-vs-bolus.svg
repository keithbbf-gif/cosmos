<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="268" viewBox="0 0 760 268" role="img" aria-labelledby="title desc">
  <title id="title">EFSA 2018 — tea cup vs bolus extract</title>
  <rect width="100%" height="100%" fill="#f7fafc"/>
  <text x="24" y="36" font-family="Source Serif 4, Georgia, serif" font-size="22" font-weight="600" fill="#1a2332">EFSA 2018 — tea cup vs bolus extract</text>
  <rect x="24" y="72" width="352" height="32" rx="6" fill="#e2e8f0" stroke="#cbd5e0"/>
  <text x="32" y="94" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1a2332">Exposure</text>
  <rect x="380" y="72" width="352" height="32" rx="6" fill="#e2e8f0" stroke="#cbd5e0"/>
  <text x="388" y="94" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1a2332">Panel sentence (summary)</text>
  <rect x="24" y="108" width="352" height="34" rx="6" fill="#ffffff" stroke="#cbd5e0"/>
  <text x="32" y="130" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" font-weight="400" fill="#1a2332">Traditional infusion</text>
  <rect x="380" y="108" width="352" height="34" rx="6" fill="#ffffff" stroke="#cbd5e0"/>
  <text x="388" y="130" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" font-weight="400" fill="#1a2332">Generally presumed safe as consumed</text>
  <rect x="24" y="144" width="352" height="34" rx="6" fill="#ffffff" stroke="#cbd5e0"/>
  <text x="32" y="166" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" font-weight="400" fill="#1a2332">Supplement ≥800 mg EGCG/d</text>
  <rect x="380" y="144" width="352" height="34" rx="6" fill="#ffffff" stroke="#cbd5e0"/>
  <text x="388" y="166" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" font-weight="400" fill="#1a2332">Transaminase signal in trials</text>
  <rect x="24" y="180" width="352" height="34" rx="6" fill="#ffffff" stroke="#cbd5e0"/>
  <text x="32" y="202" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" font-weight="400" fill="#1a2332">Below 800 mg bolus</text>
  <rect x="380" y="180" width="352" height="34" rx="6" fill="#ffffff" stroke="#cbd5e0"/>
  <text x="388" y="202" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" font-weight="400" fill="#1a2332">No safe dose set</text>
  <text x="24" y="254" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" fill="#4a5568">EFSA Journal 2018;16(4):5239 — not a target dose</text>
