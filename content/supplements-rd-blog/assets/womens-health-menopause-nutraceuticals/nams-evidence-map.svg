<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="254" viewBox="0 0 760 254" role="img" aria-labelledby="title desc">
  <title id="title">Menopause nutraceuticals — evidence map (qualitative)</title>
  <rect width="100%" height="100%" fill="#f7fafc"/>
  <text x="24" y="36" font-family="Source Serif 4, Georgia, serif" font-size="22" font-weight="600" fill="#1a2332">Menopause nutraceuticals — evidence map (qualitative)</text>
  <text x="24" y="58" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" fill="#4a5568">Qualitative literacy map — not clinical effect sizes</text>
  <text x="24" y="104" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1a2332">Herbal supplements for vasomotor symptoms (VMS)</text>
  <rect x="280" y="88" width="420" height="28" rx="6" fill="#ffffff" stroke="#cbd5e0"/>
  <rect x="280" y="88" width="280" height="28" rx="6" fill="#2b6cb0" stroke="#cbd5e0"/>
  <text x="710" y="106" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" font-weight="400" fill="#4a5568">mixed — NAMS 2023 did not recommend</text>
  <text x="24" y="148" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1a2332">Soy / isoflavone literature</text>
  <rect x="280" y="132" width="420" height="28" rx="6" fill="#ffffff" stroke="#cbd5e0"/>
  <rect x="280" y="132" width="280" height="28" rx="6" fill="#2b6cb0" stroke="#cbd5e0"/>
  <text x="710" y="150" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" font-weight="400" fill="#4a5568">mixed burden — read NAMS + primary papers</text>
  <text x="24" y="192" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1a2332">Disease claims (HRT, cancer)</text>
  <rect x="280" y="176" width="420" height="28" rx="6" fill="#ffffff" stroke="#cbd5e0"/>
  <rect x="280" y="176" width="380" height="28" rx="6" fill="#9b2c2c" stroke="#cbd5e0"/>
  <text x="710" y="194" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" font-weight="400" fill="#4a5568">higher burden — drug / deceptive ad lane</text>
  <text x="24" y="240" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" fill="#4a5568">NAMS 2023 nonhormone statement — article 15</text>
</svg>
