<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
  <title id="title">Algae oil vs the papers people steal</title>
  <rect width="100%" height="100%" fill="#f7fafc"/>
  <text x="24" y="36" font-family="Source Serif 4, Georgia, serif" font-size="22" font-weight="600" fill="#1a2332">Algae oil vs the papers people steal</text>
  <rect x="24" y="70" width="340" height="300" rx="6" fill="#ffffff" stroke="#cbd5e0"/>
  <rect x="400" y="70" width="336" height="300" rx="6" fill="#ffffff" stroke="#cbd5e0"/>
  <text x="40" y="98" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="15" font-weight="600" fill="#2b6cb0">What you bought</text>
  <text x="416" y="98" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="15" font-weight="600" fill="#9b2c2c">What you did not inherit</text>
  <text x="40" y="128" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" font-weight="400" fill="#1a2332">• Schizochytrium-class DHA oil</text>
  <text x="40" y="150" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" font-weight="400" fill="#1a2332">• Oxidation (PV / p-AV / TOTOX)</text>
  <text x="40" y="172" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" font-weight="400" fill="#1a2332">• Print EPA and DHA separately</text>
  <text x="416" y="128" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" font-weight="400" fill="#1a2332">• VITAL 1 g fish-oil primary miss</text>
  <text x="416" y="150" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" font-weight="400" fill="#1a2332">• STRENGTH / REDUCE-IT 4 g drugs</text>
  <text x="416" y="172" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" font-weight="400" fill="#1a2332">• A MACE HR on a 300 mg softgel</text>
  <text x="24" y="426" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" fill="#4a5568">PMID 30415637 / 33190147 / 30415628 — article 38</text>
</svg>
