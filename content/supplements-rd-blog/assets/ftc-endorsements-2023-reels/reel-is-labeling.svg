<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="368" viewBox="0 0 760 368" role="img" aria-labelledby="title desc">
  <title id="title">A paid Reel is a claim you made</title>
  <rect width="100%" height="100%" fill="#f7fafc"/>
  <text x="24" y="36" font-family="Source Serif 4, Georgia, serif" font-size="22" font-weight="600" fill="#1a2332">A paid Reel is a claim you made</text>
  <rect x="40" y="80" width="680" height="44" rx="6" fill="#ffffff" stroke="#cbd5e0"/>
  <text x="54" y="108" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1a2332">1. Material connection disclosed so a viewer actually sees it</text>
  <polygon points="374,128 386,128 380,138" fill="#4a5568"/>
  <rect x="40" y="136" width="680" height="44" rx="6" fill="#ffffff" stroke="#cbd5e0"/>
  <text x="54" y="164" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1a2332">2. Typicality needs evidence (FTC 2022 + 16 CFR 255)</text>
  <polygon points="374,184 386,184 380,194" fill="#4a5568"/>
  <rect x="40" y="192" width="680" height="44" rx="6" fill="#ffffff" stroke="#cbd5e0"/>
  <text x="54" y="220" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1a2332">3. Keep the contract next to the substantiation file</text>
  <text x="24" y="354" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" fill="#4a5568">April 2023 ~700 notices + 26 July 2023 guides — article 31</text>
</svg>
