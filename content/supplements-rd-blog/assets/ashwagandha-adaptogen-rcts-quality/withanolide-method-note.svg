<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-labelledby="title desc">
  <title id="title">Withanolide assay literacy</title>
  <rect width="100%" height="100%" fill="#f7fafc"/>
  <text x="24" y="36" font-family="Source Serif 4, Georgia, serif" font-size="22" font-weight="600" fill="#1a2332">Withanolide % without a method</text>
  <text x="24" y="58" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" fill="#4a5568">Why marker-only specs fail botanical QA</text>
  <rect x="24" y="90" width="712" height="120" rx="6" fill="#ffffff" stroke="#cbd5e0"/>
  <text x="40" y="130" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a2332">Sales sheet: &quot;5% withanolides&quot;</text>
  <text x="40" y="158" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" font-weight="400" fill="#4a5568">COA row missing HPTLC / HPLC reference → treat as rumor (article 07)</text>
  <rect x="24" y="230" width="712" height="80" rx="6" fill="#fff5f5" stroke="#9b2c2c"/>
  <text x="40" y="262" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" font-weight="600" fill="#9b2c2c">Identity (botanical) + marker assay + adulterant screen</text>
  <text x="40" y="286" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" font-weight="400" fill="#4a5568">See BAPP / piece 02 for adulteration context</text>
  <text x="24" y="326" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" fill="#4a5568">Illustrative — not a lab result</text>
</svg>
