<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
  <title id="title">Stick pack — sweat session vs desk sip</title>
  <rect width="100%" height="100%" fill="#f7fafc"/>
  <text x="24" y="36" font-family="Source Serif 4, Georgia, serif" font-size="22" font-weight="600" fill="#1a2332">Stick pack — sweat session vs desk sip</text>
  <rect x="24" y="70" width="340" height="300" rx="6" fill="#ffffff" stroke="#cbd5e0"/>
  <rect x="400" y="70" width="336" height="300" rx="6" fill="#ffffff" stroke="#cbd5e0"/>
  <text x="40" y="98" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="15" font-weight="600" fill="#2b6cb0">Sweat replacement talk</text>
  <text x="416" y="98" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="15" font-weight="600" fill="#9b2c2c">All-day wellness water</text>
  <text x="40" y="128" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" font-weight="400" fill="#1a2332">• Sodium milligrams for a long hot session</text>
  <text x="40" y="150" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" font-weight="400" fill="#1a2332">• Assay the ions, not sea-salt vibe</text>
  <text x="40" y="172" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" font-weight="400" fill="#1a2332">• No hyponatremia / adrenal disease copy</text>
  <text x="416" y="128" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" font-weight="400" fill="#1a2332">• Flavored salt at a keyboard</text>
  <text x="416" y="150" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" font-weight="400" fill="#1a2332">• Caffeine hiding in the stick</text>
  <text x="416" y="172" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" font-weight="400" fill="#1a2332">• WHO-ORS photos do not belong</text>
  <text x="24" y="426" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" fill="#4a5568">ODS Na/K fact sheets — article 39; not a prescription</text>
</svg>
