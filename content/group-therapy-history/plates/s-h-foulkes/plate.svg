<svg xmlns="http://www.w3.org/2000/svg" width="360" height="440" viewBox="0 0 360 440" role="img" aria-labelledby="title desc">
  <title id="title">S. H. Foulkes — typographic plate</title>
  <desc id="desc">No photograph; editorial type plate for educational history.</desc>
  <rect width="360" height="440" fill="#F7F2E8"/>
  <rect x="0" y="0" width="360" height="8" fill="#6B2D3E"/>
  <text x="180" y="120" text-anchor="middle" font-family="Georgia, 'Palatino Linotype', serif" font-size="10" letter-spacing="0.12em" fill="#6B2D3E">WOW THERAPIES · GROUP THERAPY HISTORY</text>
  <text x="180" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#1C1A17">S. H. Foulkes</text>
  <text x="180" y="232" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#5C564C">1898–1976</text>
  <text x="180" y="252" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5C564C">S. H. Foulkes (1898–1976), born Fuchs,</text>
  <text x="180" y="274" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5C564C">took group analysis from Frankfurt exile</text>
  <text x="180" y="296" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5C564C">through Northfield (1943) to a 1946 Lancet</text>
  <text x="180" y="318" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5C564C">paper, a 1948 book, and the Group Analytic</text>
  <text x="180" y="400" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#8a8278">Typographic plate · CC0 · no AI face</text>
</svg>
