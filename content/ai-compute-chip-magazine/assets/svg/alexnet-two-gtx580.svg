<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="anTitle anDesc">
  <title id="anTitle">AlexNet on two GTX 580 GPUs schematic</title>
  <desc id="anDesc">2012 ImageNet result often retold as two consumer GTX 580 cards running CUDA convolutions  public lore diagram.</desc>
  <defs>
    <style>
      .t { font-family: system-ui, sans-serif; font-size: 13px; fill: #0f172a; font-weight: 600; }
      .s { font-family: system-ui, sans-serif; font-size: 11px; fill: #334155; }
      .n { font-family: system-ui, sans-serif; font-size: 10px; fill: #64748b; }
    </style>
  </defs>
  <rect width="900" height="340" fill="#f8fafc"/>
  <text x="450" y="32" text-anchor="middle" class="t" font-size="15">2012  deep convnets meet gaming silicon</text>
  <rect x="120" y="80" width="200" height="120" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="220" y="130" text-anchor="middle" class="t">GTX 580 #1</text>
  <text x="220" y="154" text-anchor="middle" class="s">CUDA kernels</text>
  <rect x="580" y="80" width="200" height="120" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="680" y="130" text-anchor="middle" class="t">GTX 580 #2</text>
  <text x="680" y="154" text-anchor="middle" class="s">CUDA kernels</text>
  <rect x="360" y="100" width="180" height="80" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="450" y="138" text-anchor="middle" class="t">AlexNet</text>
  <text x="450" y="160" text-anchor="middle" class="s">ImageNet layer</text>
  <line x1="320" y1="140" x2="360" y2="140" stroke="#475569" stroke-width="2"/>
  <line x1="540" y1="140" x2="580" y2="140" stroke="#475569" stroke-width="2"/>
  <text x="450" y="280" text-anchor="middle" class="n">Public story  verify hardware details in article 12 sources</text>
</svg>
