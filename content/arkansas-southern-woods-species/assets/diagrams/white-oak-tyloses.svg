<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Ring-porous oak vessels and tyloses</title>
  <desc id="desc">Schematic end-grain cross section comparing open earlywood pores in red oak with tyloses plugging vessels in white oak.</desc>
  <rect width="100%" height="100%" fill="#faf9f6"/>
  <text x="48" y="36" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="0.12em" fill="#78716c">FIGURE B</text>
  <text x="48" y="62" font-family="Georgia, serif" font-size="22" fill="#1c1917">Why white oak does not drink like red oak</text>
  <line x1="48" y1="74" x2="852" y2="74" stroke="#e7e5e4" stroke-width="1"/>
  <text x="200" y="110" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1c1917">Red oak group  open pores</text>
  <text x="600" y="110" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1c1917">White oak  tyloses in vessels</text>
  <rect x="80" y="130" width="240" height="180" fill="#f5f5f4" stroke="#1c1917" stroke-width="0.75"/>
  <circle cx="120" cy="170" r="18" fill="none" stroke="#1c1917" stroke-width="1.2"/>
  <circle cx="170" cy="185" r="16" fill="none" stroke="#1c1917" stroke-width="1.2"/>
  <circle cx="220" cy="165" r="20" fill="none" stroke="#1c1917" stroke-width="1.2"/>
  <circle cx="140" cy="230" r="14" fill="none" stroke="#1c1917" stroke-width="1.2"/>
  <circle cx="200" cy="250" r="17" fill="none" stroke="#1c1917" stroke-width="1.2"/>
  <path d="M120 170 L120 280" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4 3" opacity="0.7"/>
  <text x="200" y="300" text-anchor="middle" font-size="10" fill="#78716c">Liquid can follow open vessels</text>
  <rect x="480" y="130" width="240" height="180" fill="#f5f5f4" stroke="#1c1917" stroke-width="0.75"/>
  <circle cx="520" cy="170" r="18" fill="none" stroke="#1c1917" stroke-width="1.2"/>
  <circle cx="570" cy="185" r="16" fill="none" stroke="#1c1917" stroke-width="1.2"/>
  <circle cx="620" cy="165" r="20" fill="none" stroke="#1c1917" stroke-width="1.2"/>
  <circle cx="540" cy="230" r="14" fill="none" stroke="#1c1917" stroke-width="1.2"/>
  <circle cx="600" cy="250" r="17" fill="none" stroke="#1c1917" stroke-width="1.2"/>
  <circle cx="520" cy="170" r="10" fill="#a8a29e" opacity="0.85"/>
  <circle cx="570" cy="185" r="8" fill="#a8a29e" opacity="0.85"/>
  <circle cx="620" cy="165" r="11" fill="#a8a29e" opacity="0.85"/>
  <circle cx="540" cy="230" r="7" fill="#a8a29e" opacity="0.85"/>
  <circle cx="600" cy="250" r="9" fill="#a8a29e" opacity="0.85"/>
  <text x="600" y="300" text-anchor="middle" font-size="10" fill="#78716c">Tyloses plug vessels  cooperage wood</text>
  <text x="48" y="340" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#78716c">Schematic only  not a micrograph. Original diagram for this pack.</text>
</svg>
