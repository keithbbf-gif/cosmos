<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Knife wall at layout line</title>
  <desc id="desc">Saw kerf rides in the knife wall; waste side is obvious.</desc>
