  <rect x="56" y="100" width="160" height="72" rx="4" fill="#FFFDF8" stroke="#1A1A1A" stroke-width="1.8"/>
  <text x="136" y="141" text-anchor="middle" fill="#1A1A1A" font-family="Helvetica, Arial, sans-serif" font-size="13">stock face</text>
  <rect x="240" y="100" width="160" height="72" rx="4" fill="#FFFDF8" stroke="#1A1A1A" stroke-width="1.8"/>
  <text x="320" y="141" text-anchor="middle" fill="#1A1A1A" font-family="Helvetica, Arial, sans-serif" font-size="13">pin / knife</text>
  <rect x="424" y="100" width="160" height="72" rx="4" fill="#FFFDF8" stroke="#1A1A1A" stroke-width="1.8"/>
  <text x="504" y="141" text-anchor="middle" fill="#1A1A1A" font-family="Helvetica, Arial, sans-serif" font-size="13">score line</text>
  <rect x="56" y="196" width="160" height="72" rx="4" fill="#FFFDF8" stroke="#1A1A1A" stroke-width="1.8"/>
  <text x="136" y="237" text-anchor="middle" fill="#1A1A1A" font-family="Helvetica, Arial, sans-serif" font-size="13">knife wall</text>
  <rect x="240" y="196" width="160" height="72" rx="4" fill="#FFFDF8" stroke="#1A1A1A" stroke-width="1.8"/>
  <text x="320" y="237" text-anchor="middle" fill="#1A1A1A" font-family="Helvetica, Arial, sans-serif" font-size="13">waste side</text>
  <rect x="424" y="196" width="160" height="72" rx="4" fill="#FFFDF8" stroke="#1A1A1A" stroke-width="1.8"/>
  <text x="504" y="237" text-anchor="middle" fill="#1A1A1A" font-family="Helvetica, Arial, sans-serif" font-size="13">saw kerf</text>
