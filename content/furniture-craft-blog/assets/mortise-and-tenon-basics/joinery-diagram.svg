<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Through mortise and tenon (section)</title>
  <desc id="desc">Cheek faces stay parallel; shoulders define depth stop.</desc>
  <rect width="100%" height="100%" fill="#F7F3E8"/>
  <text x="32" y="44" fill="#1A1A1A" font-family="Georgia, serif" font-size="20" font-weight="600">Through mortise and tenon (section)</text>
  <rect x="24" y="64" width="592" height="332" fill="none" stroke="#D4C9B0" stroke-width="1"/>
  <rect x="120" y="140" width="80" height="200" fill="none" stroke="#1A1A1A" stroke-width="2.5"/>
  <rect x="200" y="160" width="280" height="40" fill="#F7F3E8" stroke="#1A1A1A" stroke-width="2.5"/>
  <line x1="200" y1="200" x2="200" y2="340" stroke="#1A1A1A" stroke-width="2.5"/>
  <text x="130" y="360" fill="#4A4A4A" font-family="Helvetica, Arial, sans-serif" font-size="13">mortise</text>
  <text x="300" y="155" fill="#4A4A4A" font-family="Helvetica, Arial, sans-serif" font-size="13">tenon cheek</text>
  <text x="210" y="320" fill="#4A4A4A" font-family="Helvetica, Arial, sans-serif" font-size="13">shoulder</text>
</svg>
