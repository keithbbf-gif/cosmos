<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Butt hinge mortise depth</title>
  <desc id="desc">Mortise depth = hinge leaf thickness; barrel flush.</desc>
  <rect width="100%" height="100%" fill="#F7F3E8"/>
  <text x="32" y="44" fill="#1A1A1A" font-family="Georgia, serif" font-size="20" font-weight="600">Butt hinge mortise depth</text>
  <rect x="24" y="64" width="592" height="332" fill="none" stroke="#D4C9B0" stroke-width="1"/>
  <rect x="200" y="180" width="120" height="160" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="200" y="200" width="40" height="80" fill="#4A4A4A" opacity="0.25" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="250" y="220" fill="#4A4A4A" font-size="12" font-family="sans-serif">mortise depth = leaf</text>
</svg>
