<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Drawer side clearance</title>
  <desc id="desc">1–2 mm total side play; front reveal even left-right.</desc>
  <rect width="100%" height="100%" fill="#F7F3E8"/>
  <text x="32" y="44" fill="#1A1A1A" font-family="Georgia, serif" font-size="20" font-weight="600">Drawer side clearance</text>
  <rect x="24" y="64" width="592" height="332" fill="none" stroke="#D4C9B0" stroke-width="1"/>
  <rect x="160" y="160" width="320" height="180" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="180" y="180" width="280" height="140" fill="none" stroke="#4A4A4A" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="170" y="150" fill="#4A4A4A" font-size="12" font-family="sans-serif">1–2 mm side clearance</text>
</svg>
