  <text x="32" y="44" fill="#1A1A1A" font-family="Georgia, serif" font-size="20" font-weight="600">Wedged through-tenon</text>
  <rect x="24" y="64" width="592" height="332" fill="none" stroke="#D4C9B0" stroke-width="1"/>
  <rect x="280" y="160" width="200" height="50" fill="none" stroke="#1A1A1A" stroke-width="2"/>
