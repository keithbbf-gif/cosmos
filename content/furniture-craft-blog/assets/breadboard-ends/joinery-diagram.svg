<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Breadboard end movement</title>
  <desc id="desc">Fixed center; slots at ends for seasonal width change.</desc>
  <rect width="100%" height="100%" fill="#F7F3E8"/>
  <text x="32" y="44" fill="#1A1A1A" font-family="Georgia, serif" font-size="20" font-weight="600">Breadboard end movement</text>
  <rect x="24" y="64" width="592" height="332" fill="none" stroke="#D4C9B0" stroke-width="1"/>
  <rect x="100" y="200" width="400" height="60" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="500" y="190" width="40" height="80" fill="none" stroke="#1A1A1A" stroke-width="2.5"/>
  <circle cx="520" cy="230" r="6" fill="#1A1A1A"/>
  <rect x="512" y="250" width="16" height="30" fill="none" stroke="#8B4513" stroke-width="2"/>
  <text x="360" y="190" fill="#4A4A4A" font-size="12" font-family="sans-serif">top (width moves)</text>
  <text x="505" y="360" fill="#4A4A4A" font-size="12" font-family="sans-serif">slot</text>
</svg>
