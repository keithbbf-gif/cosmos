<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">ASHA scope domains as a teaching wheel (schematic)</title>
  <desc id="desc">Circular schematic of major scope areas — speech sound, language, fluency, voice, swallowing, cognitive-communication, AAC — not an official ASHA chart.</desc>
  <defs><style>.bg { fill: #FAF9F7; }
.title { font-family: Georgia, serif; font-size: 16px; font-weight: 600; fill: #1E293B; }
.dek { font-family: system-ui, sans-serif; font-size: 11px; fill: #64748B; }
.label { font-family: system-ui, sans-serif; font-size: 11px; fill: #64748B; }
.strong { font-family: system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #1E293B; }
.card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; }
.band-teal { fill: #CCFBF1; }
.band-amber { fill: #FEF3C7; }
.band-indigo { fill: #E0E7FF; }
.accent-teal { fill: #0F766E; }
.accent-amber { fill: #B45309; }
.spine { stroke: #1E293B; stroke-width: 2; fill: none; }
.note { font-family: system-ui, sans-serif; font-size: 10px; fill: #64748B; }</style></defs>
  <rect class="bg" width="720" height="420"/>

  <text x="40" y="36" class="title">Scope of practice — teaching wheel</text>
  <circle cx="360" cy="220" r="120" fill="#E0E7FF" stroke="#CBD5E1"/>
  <circle cx="360" cy="220" r="48" fill="#0F766E"/>
  <text x="360" y="224" class="strong" text-anchor="middle" fill="#FFFFFF">SLP</text>
  <text x="360" y="96" class="label" text-anchor="middle">Speech sounds</text>
  <text x="520" y="180" class="label">Language</text>
  <text x="520" y="260" class="label">Fluency</text>
  <text x="360" y="360" class="label" text-anchor="middle">Swallowing</text>
  <text x="200" y="260" class="label">Voice</text>
  <text x="200" y="180" class="label">Cognition / AAC</text>
  <text x="40" y="404" class="note">When news says “speech therapist,” ask which slice of the wheel is in play.</text>
</svg>
