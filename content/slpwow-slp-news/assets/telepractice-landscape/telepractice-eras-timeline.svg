<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" role="img" aria-labelledby="title desc">
  <title id="title">Telepractice eras for speech therapy (schematic timeline)</title>
  <desc id="desc">Schematic timeline from early videoconference pilots through pandemic waivers to state licensure compacts and payer policy churn.</desc>
  <defs><style>.bg { fill: #FAF9F7; }
.title { font-family: Georgia, serif; font-size: 16px; font-weight: 600; fill: #1E293B; }
.dek { font-family: system-ui, sans-serif; font-size: 11px; fill: #64748B; }
.label { font-family: system-ui, sans-serif; font-size: 11px; fill: #64748B; }
.strong { font-family: system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #1E293B; }
.card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; }
.band-teal { fill: #CCFBF1; }
.band-amber { fill: #FEF3C7; }
.band-indigo { fill: #E0E7FF; }
.accent-teal { fill: #0F766E; }
.accent-amber { fill: #B45309; }
.spine { stroke: #1E293B; stroke-width: 2; fill: none; }
.note { font-family: system-ui, sans-serif; font-size: 10px; fill: #64748B; }</style></defs>
  <rect class="bg" width="920" height="300"/>

  <text x="40" y="36" class="title">Telepractice — eras (schematic)</text>
  <line class="spine" x1="60" y1="200" x2="860" y2="200"/>
  <circle class="accent-teal" cx="140" cy="200" r="6"/><text x="100" y="168" class="label">Early pilots</text>
  <circle class="accent-teal" cx="320" cy="200" r="6"/><text x="280" y="140" class="strong">State rules</text>
  <circle class="accent-amber" cx="500" cy="200" r="6"/><text x="460" y="168" class="label">Emergency waivers</text>
  <circle class="accent-teal" cx="680" cy="200" r="6"/><text x="640" y="140" class="strong">Licensure compacts</text>
  <circle class="accent-teal" cx="820" cy="200" r="6"/><text x="780" y="168" class="label">Payer manuals</text>
  <text x="40" y="268" class="note">A headline about “telehealth ending” may mean one payer or one public health emergency — read the fine print.</text>
</svg>
