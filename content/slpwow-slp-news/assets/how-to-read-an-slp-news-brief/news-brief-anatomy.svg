<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" role="img" aria-labelledby="title desc">
  <title id="title">Anatomy of an SLPWOW news brief (schematic card)</title>
  <desc id="desc">Editorial schematic labeling headline, context, what changed, who it affects, and what to verify on primary sources.</desc>
  <defs><style>.bg { fill: #FAF9F7; }
.title { font-family: Georgia, serif; font-size: 16px; font-weight: 600; fill: #1E293B; }
.dek { font-family: system-ui, sans-serif; font-size: 11px; fill: #64748B; }
.label { font-family: system-ui, sans-serif; font-size: 11px; fill: #64748B; }
.strong { font-family: system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #1E293B; }
.card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; }
.band-teal { fill: #CCFBF1; }
.band-amber { fill: #FEF3C7; }
.band-indigo { fill: #E0E7FF; }
.accent-teal { fill: #0F766E; }
.accent-amber { fill: #B45309; }
.spine { stroke: #1E293B; stroke-width: 2; fill: none; }
.note { font-family: system-ui, sans-serif; font-size: 10px; fill: #64748B; }</style></defs>
  <rect class="bg" width="880" height="420"/>

  <text x="40" y="36" class="title">Anatomy of an SLP news brief (schematic)</text>
  <text x="40" y="56" class="dek">How to read our cards — not a template for diagnosing patients.</text>
  <rect class="card" x="40" y="76" width="800" height="300" rx="8"/>
  <rect class="band-teal" x="56" y="92" width="768" height="44" rx="4"/>
  <text x="68" y="118" class="strong">Headline — what happened (verify date)</text>
  <rect class="band-indigo" x="56" y="148" width="768" height="52" rx="4"/>
  <text x="68" y="170" class="label">Context — why clinicians or families might care</text>
  <text x="68" y="188" class="label">What changed — rule, study, funding, or guidance (quote the source)</text>
  <rect class="band-amber" x="56" y="212" width="370" height="72" rx="4"/>
  <text x="68" y="236" class="strong">Who it affects</text>
  <text x="68" y="254" class="label">School SLPs · medical · private · families</text>
  <rect class="band-teal" x="438" y="212" width="386" height="72" rx="4"/>
  <text x="450" y="236" class="strong">Verify on primary source</text>
  <text x="450" y="254" class="label">ASHA · CMS · CDC · state board · peer-reviewed paper</text>
  <text x="40" y="396" class="note">No AI-generated faces. Illustration is typographic only.</text>
</svg>
