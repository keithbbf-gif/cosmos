<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" role="img" aria-labelledby="title desc">
  <title id="title">Cerebellar tDCS versus sham naming outcomes</title>
  <desc id="desc">Trial schematic: tDCS did not beat sham for Cantonese naming while computerized therapy moved verbs.</desc>
  <defs><style>

.bg { fill: #FAF9F7; }
.title { font-family: Georgia, serif; font-size: 16px; font-weight: 600; fill: #1E293B; }
.dek { font-family: system-ui, sans-serif; font-size: 11px; fill: #64748B; }
.label { font-family: system-ui, sans-serif; font-size: 11px; fill: #64748B; }
.strong { font-family: system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #1E293B; }
.card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; }
.band { fill: #FFE4E6; }
.accent { fill: #BE123C; }
.bullet { font-family: system-ui, sans-serif; font-size: 11px; fill: #1E293B; }
.note { font-family: system-ui, sans-serif; font-size: 10px; fill: #64748B; }
.spine { stroke: #BE123C; stroke-width: 2; fill: none; }
.node { fill: #BE123C; }

  </style></defs>
  <rect class="bg" width="880" height="420"/>
  <text x="40" y="36" class="title">Cerebellar tDCS versus sham naming outcomes</text>
  <text x="40" y="56" class="dek">Trial schematic: tDCS did not beat sham for Cantonese naming while computerized therapy moved verbs.</text>
  <rect class="card" x="40" y="76" width="800" height="300" rx="8"/>
  <rect class="band" x="56" y="92" width="768" height="36" rx="4"/>
  <rect class="accent" x="56" y="92" width="6" height="36" rx="2"/>
  <text x="72" y="116" class="strong">Research</text>
  <rect class="band" x="30" y="170" width="140" height="80" rx="6"/>
  <text x="100" y="200" text-anchor="middle" class="label">tDCS ≈ sham</text>
  <text x="100" y="214" text-anchor="middle" class="label">naming</text>
  <line class="spine" x1="140" y1="210" x2="260" y2="210"/>
  <rect class="band" x="230" y="170" width="140" height="80" rx="6"/>
  <text x="300" y="200" text-anchor="middle" class="label">Verb training</text>
  <text x="300" y="214" text-anchor="middle" class="label">moved</text>
  <line class="spine" x1="340" y1="210" x2="460" y2="210"/>
  <rect class="band" x="430" y="170" width="140" height="80" rx="6"/>
  <text x="500" y="200" text-anchor="middle" class="label">Cantonese cohort</text>
  <line class="spine" x1="540" y1="210" x2="660" y2="210"/>
  <rect class="band" x="630" y="170" width="140" height="80" rx="6"/>
  <text x="700" y="200" text-anchor="middle" class="label">Adjunct research</text>
  <text x="700" y="214" text-anchor="middle" class="label">only</text>
  <text x="40" y="396" class="note">SLPWOW SLP News — original editorial SVG. No photographs or AI faces.</text>
</svg>
