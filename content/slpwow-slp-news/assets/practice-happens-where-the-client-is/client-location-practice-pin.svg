<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" role="img" aria-labelledby="title desc">
  <title id="title">Client-location practice pin (compact)</title>
  <desc id="desc">Map pin schematic: telepractice encounter jurisdiction follows the client’s location, not the clinician’s home office.</desc>
  <defs><style>

.bg { fill: #FAF9F7; }
.title { font-family: Georgia, serif; font-size: 16px; font-weight: 600; fill: #1E293B; }
.dek { font-family: system-ui, sans-serif; font-size: 11px; fill: #64748B; }
.label { font-family: system-ui, sans-serif; font-size: 11px; fill: #64748B; }
.strong { font-family: system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #1E293B; }
.card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; }
.band { fill: #CCFBF1; }
.accent { fill: #0F766E; }
.bullet { font-family: system-ui, sans-serif; font-size: 11px; fill: #1E293B; }
.note { font-family: system-ui, sans-serif; font-size: 10px; fill: #64748B; }
.spine { stroke: #0F766E; stroke-width: 2; fill: none; }
.node { fill: #0F766E; }

  </style></defs>
  <rect class="bg" width="880" height="420"/>
  <text x="40" y="36" class="title">Client-location practice pin (compact)</text>
  <text x="40" y="56" class="dek">Map pin schematic: telepractice encounter jurisdiction follows the client’s location, not the clinician’s home office.</text>
  <rect class="card" x="40" y="76" width="800" height="300" rx="8"/>
  <rect class="band" x="56" y="92" width="768" height="36" rx="4"/>
  <rect class="accent" x="56" y="92" width="6" height="36" rx="2"/>
  <text x="72" y="116" class="strong">ASLP-IC</text>
  <rect class="band" x="56" y="150" width="168" height="170" rx="6"/>
  <text x="66" y="178" class="label">Client site =</text>
  <text x="66" y="194" class="label">practice state</text>
  <rect class="band" x="232" y="150" width="168" height="170" rx="6"/>
  <text x="242" y="178" class="label">Tele does not move</text>
  <text x="242" y="194" class="label">the pin</text>
  <rect class="band" x="408" y="150" width="168" height="170" rx="6"/>
  <text x="418" y="178" class="label">Non-issuing</text>
  <text x="418" y="194" class="label">members: ordinary</text>
  <text x="418" y="210" class="label">license</text>
  <rect class="band" x="584" y="150" width="168" height="170" rx="6"/>
  <text x="594" y="178" class="label">Document location</text>
  <text x="594" y="194" class="label">in chart</text>
  <text x="40" y="396" class="note">SLPWOW SLP News — original editorial SVG. No photographs or AI faces.</text>
</svg>
