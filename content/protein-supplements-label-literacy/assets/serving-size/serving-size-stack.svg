<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t d">
  <title id="t">Serving size stack: scoop grams versus household measure (schematic)</title>
  <desc id="d">Three-column schematic comparing label serving size in grams, a filled scoop, and a household cup measure. Teaching diagram for reading serving lines on protein tubs.</desc>
  <rect width="720" height="320" fill="#f6f1e8"/>
  <text x="24" y="34" font-family="Georgia, serif" font-size="17" fill="#2c2416">Serving size: what the panel declares vs what you scoop</text>
  <rect x="40" y="70" width="190" height="200" fill="#fff" stroke="#3a4a3c" stroke-width="1.5" rx="4"/>
  <text x="135" y="98" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="13" font-weight="600" fill="#2c2416">Panel line</text>
  <text x="135" y="130" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#2c2416">Serving size</text>
  <text x="135" y="152" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#2c2416">1 scoop (30 g)</text>
  <text x="135" y="200" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="10" fill="#6a5b45">Grams are the</text>
  <text x="135" y="216" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="10" fill="#6a5b45">legal anchor</text>
  <rect x="265" y="70" width="190" height="200" fill="#e8efe9" stroke="#3a4a3c" stroke-width="1.5" rx="4"/>
  <text x="360" y="98" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="13" font-weight="600" fill="#2c2416">Scoop in tub</text>
  <ellipse cx="360" cy="175" rx="55" ry="28" fill="#d5e0d6" stroke="#3a4a3c"/>
  <path d="M 360 203 L 360 235" stroke="#3a4a3c" stroke-width="3"/>
  <text x="360" y="258" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="10" fill="#6a5b45">Heaped vs level changes grams</text>
  <rect x="490" y="70" width="190" height="200" fill="#fff" stroke="#5a4a32" stroke-width="1.5" rx="4"/>
  <text x="585" y="98" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="13" font-weight="600" fill="#2c2416">Household</text>
  <path d="M 545 220 L 545 160 L 625 160 L 625 220 Z" fill="none" stroke="#5a4a32" stroke-width="2"/>
  <text x="585" y="148" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#2c2416">1/3 cup</text>
  <text x="585" y="248" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="10" fill="#6a5b45">Optional parallel measure</text>
  <text x="24" y="298" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#6a5b45">Compare all three before you multiply protein per serving times servings per day.</text>
</svg>
