<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="t d">
  <title id="t">Supplement Facts panel anatomy for a protein powder (schematic)</title>
  <desc id="d">Generic Supplement Facts box with labeled regions: title, serving size, calories, protein grams, percent daily value, other dietary ingredients, and footnote. Teaching diagram only.</desc>
  <rect width="720" height="480" fill="#f6f1e8"/>
  <text x="24" y="36" font-family="Georgia, serif" font-size="18" fill="#2c2416">Supplement Facts - panel regions (schematic)</text>
  <text x="24" y="58" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#6a5b45">21 CFR 101.36 - generic protein powder - not a real brand label</text>
  <rect x="200" y="78" width="320" height="360" fill="#fff" stroke="#2c2416" stroke-width="2"/>
  <line x1="200" y1="118" x2="520" y2="118" stroke="#2c2416" stroke-width="4"/>
  <text x="360" y="108" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="16" font-weight="700" fill="#2c2416">Supplement Facts</text>
  <text x="212" y="142" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#2c2416">Serving size 1 scoop (30 g)</text>
  <text x="212" y="158" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#2c2416">Servings per container 30</text>
  <line x1="212" y1="168" x2="508" y2="168" stroke="#2c2416" stroke-width="2"/>
  <text x="212" y="188" font-family="ui-sans-serif, sans-serif" font-size="12" font-weight="700" fill="#2c2416">Amount per serving</text>
  <text x="480" y="188" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#2c2416">% DV</text>
  <text x="212" y="210" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#2c2416">Calories 120</text>
  <line x1="212" y1="218" x2="508" y2="218" stroke="#2c2416" stroke-width="3"/>
  <text x="212" y="240" font-family="ui-sans-serif, sans-serif" font-size="12" font-weight="700" fill="#2c2416">Protein 24 g</text>
  <text x="480" y="240" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#2c2416">48%</text>
  <text x="212" y="262" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#2c2416">Total carbohydrate 3 g</text>
  <text x="480" y="262" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#2c2416">1%</text>
  <text x="212" y="290" font-family="ui-sans-serif, sans-serif" font-size="11" font-weight="700" fill="#2c2416">Whey protein isolate 24 g</text>
  <text x="212" y="308" font-family="ui-sans-serif, sans-serif" font-size="10" fill="#3d3426">(dietary ingredient amount line)</text>
  <text x="212" y="340" font-family="ui-sans-serif, sans-serif" font-size="9" fill="#3d3426">* Percent Daily Values are based on a 2,000 calorie diet.</text>
  <text x="212" y="354" font-family="ui-sans-serif, sans-serif" font-size="9" fill="#3d3426">+ Daily Value not established.</text>
  <path d="M 540 100 L 580 100" stroke="#3a5a7a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="588" y="104" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#3a5a7a">Panel title</text>
  <path d="M 540 150 L 580 150" stroke="#3a5a7a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="588" y="146" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#3a5a7a">Serving size</text>
  <text x="588" y="162" font-family="ui-sans-serif, sans-serif" font-size="10" fill="#6a5b45">+ servings / container</text>
  <path d="M 120 230 L 190 230" stroke="#3a5a7a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="24" y="226" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#3a5a7a">Protein (g)</text>
  <text x="24" y="242" font-family="ui-sans-serif, sans-serif" font-size="10" fill="#6a5b45">+ %DV when shown</text>
  <path d="M 120 298 L 190 298" stroke="#3a5a7a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="24" y="294" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#3a5a7a">Dietary ingredient</text>
  <text x="24" y="310" font-family="ui-sans-serif, sans-serif" font-size="10" fill="#6a5b45">amount lines</text>
  <path d="M 540 348 L 580 348" stroke="#3a5a7a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="588" y="344" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#3a5a7a">Footnotes</text>
  <text x="588" y="360" font-family="ui-sans-serif, sans-serif" font-size="10" fill="#6a5b45">DV basis - DV not established</text>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3a5a7a"/>
    </marker>
  </defs>
  <text x="24" y="458" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#6a5b45">Illustrative layout for literacy - numbers are placeholders, not a product declaration.</text>
</svg>
