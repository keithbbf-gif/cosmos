<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t d">
  <title id="t">Eight questions before a microbiome SKU</title>
  <desc id="d">Checklist schematic for a live-organism file. Not a certification mark.</desc>
  <rect width="720" height="340" fill="#f6f1e8"/>
  <text x="24" y="30" font-family="Georgia, serif" font-size="17" fill="#2c2416">Eight questions (schematic)  a file, not a seal</text>
  <text x="36" y="68" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#2c2416">1. Genus, species, strain designation?</text>
  <text x="36" y="98" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#2c2416">2. Deposit number a lab can retrieve?</text>
  <text x="36" y="128" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#2c2416">3. CFU (or AFU) through end of shelf, this matrix?</text>
  <text x="36" y="158" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#2c2416">4. Human study on this strain, named endpoint?</text>
  <text x="36" y="188" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#2c2416">5. Finished-product COA  identity, potency, contaminants?</text>
  <text x="36" y="218" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#2c2416">6. Intended-use sentences stay inside DSHEA?</text>
  <text x="36" y="248" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#2c2416">7. Safety file for the intended population?</text>
  <text x="36" y="278" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#2c2416">8. Category: supplement, food, or LBP/drug?</text>
  <text x="36" y="318" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#6a5b45">Educational checklist. Not a certification, score, or medical recommendation.</text>
</svg>
