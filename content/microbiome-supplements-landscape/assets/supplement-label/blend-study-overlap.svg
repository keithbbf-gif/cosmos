<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="t d">
  <title id="t">Clinically studied blend: overlap between trial object and hopper formula</title>
  <desc id="d">Venn schematic with small overlap region labeled as the only place the adjective can live. Not a brand chart.</desc>
  <rect width="720" height="280" fill="#f6f1e8"/>
  <text x="24" y="32" font-family="Georgia, serif" font-size="17" fill="#2c2416">"Clinically studied" lives only in the overlap (schematic)</text>
  <circle cx="260" cy="160" r="90" fill="#d5e0d6" fill-opacity="0.85" stroke="#3a4a3c"/>
  <circle cx="460" cy="160" r="90" fill="#e8d9c0" fill-opacity="0.85" stroke="#5a4a32"/>
  <text x="210" y="100" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#2c2416">What was studied</text>
  <text x="210" y="120" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#3d3426">strain, dose, matrix</text>
  <text x="510" y="100" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#2c2416">What is in the hopper</text>
  <text x="510" y="120" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#3d3426">this month</text>
  <text x="360" y="168" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#2c2416">overlap</text>
  <text x="360" y="188" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#3d3426">same object</text>
  <text x="24" y="252" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#6a5b45">FTC reads what a reasonable consumer takes away. Neighbor trials do not merge by species name (Hill 2014).</text>
</svg>
