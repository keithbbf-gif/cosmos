<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="f5-title f5-desc">
  <title id="f5-title">Fig. 5  Six provinces of the creatine research literature</title>
  <desc id="f5-desc">Grid of six provinces: chemistry and synthesis, distribution and transport, measurement, feeding protocols as methods, exercise tasks, and product and statute. Methods geography, not a shop shelf.</desc>
  <defs>
    <style>
      .paper { fill: #f3f6f9; }
      .ink { fill: #152028; font-family: Georgia, serif; }
      .muted { fill: #4a5560; font-family: Georgia, serif; font-size: 11px; }
      .caps { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; }
      .p1 { fill: #d9e4ef; stroke: #1e5a8a; }
      .p2 { fill: #e2dfd4; stroke: #6b5a48; }
      .p3 { fill: #dce8dc; stroke: #3d6b4a; }
      .p4 { fill: #f0e0d0; stroke: #8a5a1e; }
      .p5 { fill: #e8dce8; stroke: #6b2d5c; }
      .p6 { fill: #e0e4e8; stroke: #4a5560; }
    </style>
  </defs>
  <rect class="paper" width="1200" height="600"/>
  <rect x="0" y="0" width="1200" height="6" fill="#1e5a8a"/>
  <text x="48" y="42" class="ink caps">Fig. 05</text>
  <text x="48" y="72" class="ink" font-size="24" font-weight="bold">Literature provinces (CRL-01)</text>
  <text x="48" y="98" class="muted">Same word, different files  map before you merge forests.</text>

  <rect x="60" y="140" width="340" height="120" class="p1" rx="6" stroke-width="1.4"/>
  <text x="230" y="175" class="ink" text-anchor="middle" font-size="15" font-weight="bold">Chemistry &amp; synthesis</text>
  <text x="230" y="198" class="muted" text-anchor="middle">What it is; AGAT/GAMT</text>
  <text x="230" y="218" class="muted" text-anchor="middle">Bottleneck: pathway, not performance</text>

  <rect x="420" y="140" width="340" height="120" class="p2" rx="6" stroke-width="1.4"/>
  <text x="590" y="175" class="ink" text-anchor="middle" font-size="15" font-weight="bold">Distribution &amp; transport</text>
  <text x="590" y="198" class="muted" text-anchor="middle">Pools, SLC6A8, shuttle story</text>
  <text x="590" y="218" class="muted" text-anchor="middle">Bottleneck: compartment fractions</text>

  <rect x="780" y="140" width="360" height="120" class="p3" rx="6" stroke-width="1.4"/>
  <text x="960" y="175" class="ink" text-anchor="middle" font-size="15" font-weight="bold">Measurement</text>
  <text x="960" y="198" class="muted" text-anchor="middle">Biopsy, 31P-MRS, creatinine signals</text>
  <text x="960" y="218" class="muted" text-anchor="middle">Bottleneck: assay variance</text>

  <rect x="60" y="290" width="340" height="120" class="p4" rx="6" stroke-width="1.4"/>
  <text x="230" y="325" class="ink" text-anchor="middle" font-size="15" font-weight="bold">Feeding protocols</text>
  <text x="230" y="348" class="muted" text-anchor="middle">Methods sections only</text>
  <text x="230" y="368" class="muted" text-anchor="middle">Not personal dosing charts</text>

  <rect x="420" y="290" width="340" height="120" class="p5" rx="6" stroke-width="1.4"/>
  <text x="590" y="325" class="ink" text-anchor="middle" font-size="15" font-weight="bold">Exercise tasks</text>
  <text x="590" y="348" class="muted" text-anchor="middle">Sprint vs lift vs ride</text>
  <text x="590" y="368" class="muted" text-anchor="middle">Bottleneck: task duration</text>

  <rect x="780" y="290" width="360" height="120" class="p6" rx="6" stroke-width="1.4"/>
  <text x="960" y="325" class="ink" text-anchor="middle" font-size="15" font-weight="bold">Product &amp; statute</text>
  <text x="960" y="348" class="muted" text-anchor="middle">Monohydrate vs salts; label law</text>
  <text x="960" y="368" class="muted" text-anchor="middle">Bottleneck: what is in the bottle</text>

  <text x="48" y="560" class="muted">Educational landscape  CRL stages 16 walk these provinces in order.</text>
</svg>
