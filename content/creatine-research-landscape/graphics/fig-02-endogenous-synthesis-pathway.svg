<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="f2-title f2-desc">
  <title id="f2-title">Fig. 2  Endogenous creatine synthesis pathway (schematic)</title>
  <desc id="f2-desc">Arginine and glycine form guanidinoacetate via AGAT; GAMT methylates guanidinoacetate to creatine using S-adenosylmethionine. Kidney and liver labels are review-level geography.</desc>
  <defs>
    <style>
      .paper { fill: #f3f6f9; }
      .ink { fill: #152028; font-family: Georgia, serif; }
      .muted { fill: #4a5560; font-family: Georgia, serif; font-size: 12px; }
      .caps { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; }
      .box { fill: #fff; stroke: #1e5a8a; stroke-width: 1.4; }
      .enz { fill: #dce8f4; stroke: #1e5a8a; stroke-width: 1.2; }
      .arrow { stroke: #152028; stroke-width: 1.4; fill: none; marker-end: url(#arr); }
    </style>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#152028"/>
    </marker>
  </defs>
  <rect class="paper" width="1200" height="520"/>
  <rect x="0" y="0" width="1200" height="6" fill="#1e5a8a"/>
  <text x="48" y="42" class="ink caps">Fig. 02</text>
  <text x="48" y="72" class="ink" font-size="24" font-weight="bold">Endogenous synthesis (two-enzyme relay)</text>
  <text x="48" y="98" class="muted">Textbook human route  not a treatment pathway diagram.</text>

  <rect x="80" y="160" width="140" height="56" class="box" rx="4"/>
  <text x="150" y="192" class="ink" text-anchor="middle" font-size="14" font-weight="bold">Arginine</text>
  <text x="150" y="210" class="muted" text-anchor="middle" font-size="11">+ glycine</text>

  <path d="M 230 188 L 300 188" class="arrow"/>
  <rect x="300" y="168" width="120" height="40" class="enz" rx="4"/>
  <text x="360" y="194" class="ink" text-anchor="middle" font-size="13" font-weight="bold">AGAT</text>

  <path d="M 430 188 L 500 188" class="arrow"/>
  <rect x="500" y="160" width="180" height="56" class="box" rx="4"/>
  <text x="590" y="192" class="ink" text-anchor="middle" font-size="13" font-weight="bold">Guanidinoacetate</text>
  <text x="590" y="210" class="muted" text-anchor="middle" font-size="11">(GAA)</text>

  <path d="M 690 188 L 760 188" class="arrow"/>
  <rect x="760" y="168" width="120" height="40" class="enz" rx="4"/>
  <text x="820" y="194" class="ink" text-anchor="middle" font-size="13" font-weight="bold">GAMT</text>

  <path d="M 890 188 L 960 188" class="arrow"/>
  <rect x="960" y="160" width="140" height="56" class="box" rx="4"/>
  <text x="1030" y="198" class="ink" text-anchor="middle" font-size="15" font-weight="bold">Creatine</text>

  <text x="820" y="250" class="muted" text-anchor="middle">methyl donor: SAM -> SAH</text>

  <rect x="120" y="300" width="200" height="70" fill="#e8eef4" stroke="#8899aa" rx="4"/>
  <text x="220" y="328" class="ink" text-anchor="middle" font-size="12" font-weight="bold">Kidney (review maps)</text>
  <text x="220" y="348" class="muted" text-anchor="middle">AGAT activity often cited here</text>

  <rect x="480" y="300" width="200" height="70" fill="#e8eef4" stroke="#8899aa" rx="4"/>
  <text x="580" y="328" class="ink" text-anchor="middle" font-size="12" font-weight="bold">Liver (review maps)</text>
  <text x="580" y="348" class="muted" text-anchor="middle">GAMT activity often cited here</text>

  <rect x="840" y="300" width="240" height="70" fill="#e8eef4" stroke="#8899aa" rx="4"/>
  <text x="960" y="328" class="ink" text-anchor="middle" font-size="12" font-weight="bold">Blood -> tissues</text>
  <text x="960" y="348" class="muted" text-anchor="middle">SLC6A8 uptake (see CRL-12)</text>

  <text x="48" y="480" class="muted" font-size="11">Walker 1979; Wyss &amp; Kaddurah-Daouk 2000  cited in CRL-06. Educational only.</text>
</svg>
