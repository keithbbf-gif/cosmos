<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="f6-title f6-desc">
  <title id="f6-title">Fig. 6  Exercise task duration vs phosphagen bottleneck</title>
  <desc id="f6-desc">Horizontal spectrum from seconds-long maximal efforts through repeated high-intensity work toward steady endurance. Shaded band marks where phosphagen-limited task designs cluster in the creatine exercise literature.</desc>
  <defs>
    <style>
      .paper { fill: #f3f6f9; }
      .ink { fill: #152028; font-family: Georgia, serif; }
      .muted { fill: #4a5560; font-family: Georgia, serif; font-size: 12px; }
      .caps { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; }
      .band { fill: #dce8f4; opacity: 0.85; }
      .axis { stroke: #152028; stroke-width: 1.4; }
      .tick { stroke: #152028; stroke-width: 1; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#152028"/>
    </marker>
  </defs>
  <rect class="paper" width="1200" height="500"/>
  <rect x="0" y="0" width="1200" height="6" fill="#1e5a8a"/>
  <text x="48" y="42" class="ink caps">Fig. 06</text>
  <text x="48" y="72" class="ink" font-size="24" font-weight="bold">Task spectrum (why meta-analyses fight)</text>
  <text x="48" y="98" class="muted">Map tasks before you average them  CRL-26, CRL-29, CRL-30.</text>

  <rect x="120" y="200" width="520" height="100" class="band" rx="4"/>
  <text x="380" y="235" class="ink" text-anchor="middle" font-size="14" font-weight="bold">Phosphagen-shaped file (often studied)</text>
  <text x="380" y="258" class="muted" text-anchor="middle">~330 s efforts, short rests, repeated bouts</text>

  <line x1="80" y1="320" x2="1120" y2="320" class="axis" marker-end="url(#arrow)"/>
  <text x="80" y="305" class="muted caps">Task duration -></text>

  <line x1="140" y1="312" x2="140" y2="328" class="tick"/>
  <text x="140" y="350" class="ink" text-anchor="middle" font-size="12" font-weight="bold">seconds</text>
  <text x="140" y="368" class="muted" text-anchor="middle">Wingate, sprints</text>

  <line x1="400" y1="312" x2="400" y2="328" class="tick"/>
  <text x="400" y="350" class="ink" text-anchor="middle" font-size="12" font-weight="bold">~13 min</text>
  <text x="400" y="368" class="muted" text-anchor="middle">Repeated HIIT</text>

  <line x1="700" y1="312" x2="700" y2="328" class="tick"/>
  <text x="700" y="350" class="ink" text-anchor="middle" font-size="12" font-weight="bold">1030 min</text>
  <text x="700" y="368" class="muted" text-anchor="middle">Mixed sport</text>

  <line x1="1000" y1="312" x2="1000" y2="328" class="tick"/>
  <text x="1000" y="350" class="ink" text-anchor="middle" font-size="12" font-weight="bold">steady</text>
  <text x="1000" y="368" class="muted" text-anchor="middle">Endurance rides</text>

  <text x="48" y="450" class="muted" font-size="11">No outcome bars  this figure sorts designs, it does not score creatine for you.</text>
</svg>
