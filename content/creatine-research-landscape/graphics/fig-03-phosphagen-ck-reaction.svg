<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="f3-title f3-desc">
  <title id="f3-title">Fig. 3  Creatine kinase phosphagen reaction</title>
  <desc id="f3-desc">Near-equilibrium reaction: phosphocreatine plus ADP and hydrogen ion reversibly form creatine plus ATP, catalyzed by creatine kinase in the cytosol.</desc>
  <defs>
    <style>
      .paper { fill: #f3f6f9; }
      .ink { fill: #152028; font-family: Georgia, serif; }
      .muted { fill: #4a5560; font-family: Georgia, serif; font-size: 12px; }
      .caps { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; }
      .rxn { font-size: 22px; font-weight: bold; }
      .ck { fill: #dce8f4; stroke: #1e5a8a; stroke-width: 1.5; }
    </style>
  </defs>
  <rect class="paper" width="1200" height="480"/>
  <rect x="0" y="0" width="1200" height="6" fill="#1e5a8a"/>
  <text x="48" y="42" class="ink caps">Fig. 03</text>
  <text x="48" y="72" class="ink" font-size="24" font-weight="bold">Phosphagen buffer (CK reaction)</text>
  <text x="48" y="98" class="muted">Vocabulary for reading feeding and MRS papers  not a performance claim.</text>

  <text x="600" y="200" class="ink rxn" text-anchor="middle">PCr + ADP + Hz + Cr + ATP</text>

  <rect x="480" y="240" width="240" height="48" class="ck" rx="6"/>
  <text x="600" y="270" class="ink" text-anchor="middle" font-size="16" font-weight="bold">Creatine kinase (CK)</text>

  <text x="600" y="330" class="muted" text-anchor="middle">Forward (-> ATP) during sudden load - reverse (-> PCr) during recovery</text>

  <rect x="80" y="360" width="320" height="72" fill="#fff" stroke="#8899aa" rx="4"/>
  <text x="240" y="388" class="ink" text-anchor="middle" font-size="13" font-weight="bold">Cytosolic CK (MM)</text>
  <text x="240" y="408" class="muted" text-anchor="middle">Near sites of ATP use</text>

  <rect x="800" y="360" width="320" height="72" fill="#fff" stroke="#8899aa" rx="4"/>
  <text x="960" y="388" class="ink" text-anchor="middle" font-size="13" font-weight="bold">Serum CK ` this reaction</text>
  <text x="960" y="408" class="muted" text-anchor="middle">Leakage marker after muscle stress</text>

  <text x="48" y="458" class="muted" font-size="11">See CRL-10 for isoforms and CRL-15 for 31P-MRS readouts.</text>
</svg>
