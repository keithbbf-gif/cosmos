<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">Breadboard end cap and seasonal field width on a table top</title>
  <desc id="desc">Plan view of a table field that swells in humid summer and shrinks in dry winter while the breadboard end cap stays fixed length. Center glue and elongated outer pins allow width change without splitting the tenon.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f3eb"/>
      <stop offset="100%" stop-color="#ebe4d6"/>
    </linearGradient>
    <pattern id="grain" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <line x1="0" y1="0" x2="8" y2="0" stroke="#c9b896" stroke-width="1"/>
    </pattern>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a5f4a"/>
    </marker>
    <marker id="arrowL" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8b3a2a"/>
    </marker>
  </defs>
  <rect width="720" height="520" fill="url(#bg)"/>
  <text x="360" y="34" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#2c2416">Breadboard cap on a field that still changes width</text>
  <text x="360" y="56" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#5c5346">Glue the center. Slot the outer pins. The cap does not grow with the field.</text>
  <text x="120" y="88" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a5f4a">Humid shop / summer - field wider</text>
  <g transform="translate(40, 100)">
    <rect x="0" y="40" width="280" height="100" fill="#d4c4a8" stroke="#3d3429" stroke-width="1.5" rx="3"/>
    <rect x="0" y="40" width="280" height="100" fill="url(#grain)" opacity="0.5"/>
    <rect x="280" y="40" width="44" height="100" fill="#a08050" stroke="#3d3429" stroke-width="1.5" rx="2"/>
    <text x="140" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#2c2416">field (width grows)</text>
    <text x="302" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#fff">breadboard</text>
    <rect x="118" y="130" width="44" height="12" fill="#3d3429" opacity="0.85" rx="1"/>
    <text x="140" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5c5346">glue center only</text>
    <ellipse cx="40" cy="90" rx="14" ry="6" fill="none" stroke="#1a5f4a" stroke-width="2" stroke-dasharray="3 2"/>
    <ellipse cx="260" cy="90" rx="14" ry="6" fill="none" stroke="#1a5f4a" stroke-width="2" stroke-dasharray="3 2"/>
    <circle cx="40" cy="90" r="3" fill="#3d3429"/>
    <circle cx="260" cy="90" r="3" fill="#3d3429"/>
    <text x="40" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#1a5f4a">slot + pin</text>
    <text x="260" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#1a5f4a">slot + pin</text>
    <path d="M 20,90 L 4,90" stroke="#1a5f4a" stroke-width="2" marker-end="url(#arrowL)"/>
    <path d="M 260,90 L 276,90" stroke="#1a5f4a" stroke-width="2" marker-end="url(#arrowR)"/>
  </g>
  <text x="120" y="308" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#8b3a2a">Dry house / winter - field narrower</text>
  <g transform="translate(40, 320)">
    <rect x="24" y="40" width="232" height="100" fill="#d4c4a8" stroke="#3d3429" stroke-width="1.5" rx="3"/>
    <rect x="24" y="40" width="232" height="100" fill="url(#grain)" opacity="0.5"/>
    <rect x="256" y="40" width="44" height="100" fill="#a08050" stroke="#3d3429" stroke-width="1.5" rx="2"/>
    <text x="140" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#2c2416">field (width shrinks)</text>
    <text x="278" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#fff">breadboard</text>
    <rect x="118" y="130" width="44" height="12" fill="#3d3429" opacity="0.85" rx="1"/>
    <ellipse cx="64" cy="90" rx="14" ry="6" fill="none" stroke="#8b3a2a" stroke-width="2" stroke-dasharray="3 2"/>
    <ellipse cx="236" cy="90" rx="14" ry="6" fill="none" stroke="#8b3a2a" stroke-width="2" stroke-dasharray="3 2"/>
    <circle cx="52" cy="90" r="3" fill="#3d3429"/>
    <circle cx="248" cy="90" r="3" fill="#3d3429"/>
    <path d="M 44,90 L 28,90" stroke="#8b3a2a" stroke-width="2" marker-end="url(#arrowL)"/>
    <path d="M 236,90 L 252,90" stroke="#8b3a2a" stroke-width="2" marker-end="url(#arrowR)"/>
    <text x="140" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5c5346">same cap length - pins slide in slots</text>
  </g>
  <g transform="translate(400, 120)">
    <rect x="0" y="0" width="280" height="340" fill="#fff" stroke="#3d3429" stroke-width="1" rx="6"/>
    <text x="140" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#2c2416">End view - January proud line</text>
    <rect x="40" y="50" width="200" height="24" fill="#d4c4a8" stroke="#3d3429"/>
    <rect x="240" y="46" width="20" height="32" fill="#a08050" stroke="#3d3429"/>
    <line x1="238" y1="78" x2="262" y2="78" stroke="#8b3a2a" stroke-width="2"/>
    <text x="140" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#5c5346">Field shrank; cap did not. Shoulder line opens if joint was a clamp.</text>
    <text x="20" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#2c2416">* Long grain on cap - quiet length</text>
    <text x="20" y="152" font-family="system-ui, sans-serif" font-size="11" fill="#2c2416">* Field width = live dimension</text>
    <text x="20" y="174" font-family="system-ui, sans-serif" font-size="11" fill="#2c2416">* Size slots to Delta MC on the scrap</text>
    <text x="20" y="210" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#2c2416">Failure mode:</text>
    <text x="20" y="232" font-family="system-ui, sans-serif" font-size="11" fill="#8b3a2a">Outer third glued - tenon splits</text>
    <text x="20" y="254" font-family="system-ui, sans-serif" font-size="11" fill="#8b3a2a">Tight pins everywhere - cap fights field</text>
    <text x="140" y="310" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#7a6f5f">Original diagram - wood-movement-furniture-shop pack</text>
  </g>
</svg>
