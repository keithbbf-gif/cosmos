<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
  <title id="title">Equilibrium moisture content vs relative humidity at 70 deg F for furniture wood</title>
  <desc id="desc">Chart relating shop relative humidity to equilibrium moisture content EMC percent. Example points at 30, 50, and 70 percent RH. A board on sticks approaches the EMC the air allows.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f3eb"/>
      <stop offset="100%" stop-color="#ebe4d6"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b6914"/>
      <stop offset="50%" stop-color="#c4a35a"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3d3429"/>
    </marker>
  </defs>
  <rect width="720" height="480" fill="url(#bg)"/>
  <text x="360" y="36" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#2c2416">EMC follows the air - about 70 deg F (shop temperature)</text>
  <text x="360" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#5c5346">Equilibrium moisture content (EMC) is the MC the board settles toward in given RH</text>
  <rect x="88" y="88" width="520" height="320" fill="#fff" stroke="#3d3429" stroke-width="1.5" rx="4"/>
  <g stroke="#d8d0c4" stroke-width="1">
    <line x1="88" y1="168" x2="608" y2="168"/>
    <line x1="88" y1="248" x2="608" y2="248"/>
    <line x1="88" y1="328" x2="608" y2="328"/>
    <line x1="192" y1="88" x2="192" y2="408"/>
    <line x1="296" y1="88" x2="296" y2="408"/>
    <line x1="400" y1="88" x2="400" y2="408"/>
    <line x1="504" y1="88" x2="504" y2="408"/>
  </g>
  <line x1="88" y1="408" x2="608" y2="408" stroke="#3d3429" stroke-width="2"/>
  <line x1="88" y1="408" x2="88" y2="88" stroke="#3d3429" stroke-width="2"/>
  <text x="348" y="448" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#2c2416">Relative humidity (%)</text>
  <text x="42" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#2c2416" transform="rotate(-90 42 252)">EMC (% MC)</text>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#5c5346" text-anchor="end">
    <text x="80" y="412">6</text>
    <text x="80" y="332">10</text>
    <text x="80" y="252">12</text>
    <text x="80" y="172">14</text>
    <text x="80" y="92">16</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#5c5346" text-anchor="middle">
    <text x="88" y="424">30</text>
    <text x="192" y="424">40</text>
    <text x="296" y="424">50</text>
    <text x="400" y="424">60</text>
    <text x="504" y="424">70</text>
    <text x="608" y="424">80</text>
  </g>
  <path d="M 88,395 Q 200,360 296,318 T 504,198 T 608,128" fill="none" stroke="#6b5344" stroke-width="3" stroke-linecap="round"/>
  <g font-family="system-ui, sans-serif" font-size="12" fill="#2c2416">
    <circle cx="88" cy="392" r="5" fill="#8b4513"/>
    <text x="98" y="378">30% RH -&gt; ~6.2% EMC</text>
    <circle cx="296" cy="318" r="5" fill="#8b4513"/>
    <text x="306" y="304">50% RH -&gt; ~9.2% EMC</text>
    <circle cx="504" cy="198" r="5" fill="#8b4513"/>
    <text x="514" y="184">70% RH -&gt; ~13.1% EMC</text>
  </g>
  <g transform="translate(560, 72)">
    <rect x="0" y="0" width="120" height="28" fill="url(#wood)" stroke="#3d3429" stroke-width="1" rx="2"/>
    <text x="60" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#fff">board on sticks</text>
    <path d="M 60,32 L 60,52" stroke="#3d3429" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="60" y="68" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5c5346">approaches EMC</text>
  </g>
  <text x="360" y="472" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#7a6f5f">Verify cells against your Wood Handbook edition. Temperature shifts the table.</text>
</svg>
