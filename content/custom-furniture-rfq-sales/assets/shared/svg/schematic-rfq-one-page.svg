  <rect x="72" y="212" width="496" height="44" fill="#ece8e1" stroke="#8a8278"/>
  <text x="88" y="239" font-family="system-ui,sans-serif" font-size="12" fill="#3d3832">Finish + samples</text>
  <rect x="72" y="268" width="240" height="44" fill="#ece8e1" stroke="#8a8278"/>
  <text x="88" y="295" font-family="system-ui,sans-serif" font-size="12" fill="#3d3832">Freight terms</text>
