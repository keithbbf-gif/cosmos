  <rect x="72" y="100" width="496" height="44" fill="#ece8e1" stroke="#8a8278"/>
  <text x="88" y="127" font-family="system-ui,sans-serif" font-size="12" fill="#3d3832">Object + room</text>
  <rect x="72" y="156" width="240" height="44" fill="#ece8e1" stroke="#8a8278"/>
  <text x="88" y="183" font-family="system-ui,sans-serif" font-size="12" fill="#3d3832">Dimensions</text>
  <rect x="328" y="156" width="240" height="44" fill="#ece8e1" stroke="#8a8278"/>
