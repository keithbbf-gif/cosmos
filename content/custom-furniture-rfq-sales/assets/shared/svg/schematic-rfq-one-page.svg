  <text x="344" y="295" font-family="system-ui,sans-serif" font-size="12" fill="#3d3832">Need-by date</text>
  <rect x="72" y="324" width="496" height="44" fill="#ece8e1" stroke="#8a8278"/>
  <text x="88" y="351" font-family="system-ui,sans-serif" font-size="12" fill="#3d3832">Contact + site photos</text>
