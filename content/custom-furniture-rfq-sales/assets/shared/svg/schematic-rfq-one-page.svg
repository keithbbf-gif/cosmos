<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="t d">
  <title id="t">RFQ one-page anatomy</title>
  <desc id="d">Blocks for object, dimensions, path, finish, freight, and date on one request page.</desc>
  <rect width="640" height="480" fill="#f8f7f4"/>
