<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d">
  <title id="t">Delivery path through house</title>
  <desc id="d">Truck to door, stair landing, and soffit pinch points.</desc>
  <rect width="720" height="360" fill="#f8f7f4"/>
  <path d="M 80 280 L 200 280 L 200 180 L 360 180 L 360 120 L 520 120" fill="none" stroke="#1d5a8a" stroke-width="3"/>
  <circle cx="80" cy="280" r="10" fill="#8a4b12"/>
  <text x="80" y="310" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11">Truck</text>
  <circle cx="520" cy="120" r="10" fill="#2f6f4e"/>
  <text x="520" y="100" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11">Room</text>
  <rect x="340" y="200" width="40" height="60" fill="#c9bfb0" stroke="#5c5348"/>
  <text x="360" y="275" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11">Landing</text>
</svg>
