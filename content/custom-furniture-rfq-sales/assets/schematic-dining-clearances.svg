<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Dining table clearance diagram</title>
  <desc id="desc">Top-down table with 36-inch chair zones and 42-inch pass aisle example.</desc>
  <rect width="720" height="420" fill="#f8f7f4"/>

  <rect x="40" y="40" width="640" height="340" fill="#e8e4dc" stroke="#8a8278" stroke-width="2"/>
  <rect x="200" y="120" width="320" height="120" fill="#c9bfb0" stroke="#3d3832" stroke-width="2"/>
  <text x="360" y="185" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13">Table (plan view)</text>
  <text x="120" y="185" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1d5a8a">36 in min</text>
  <text x="600" y="185" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1d5a8a">36 in min</text>
  <text x="360" y="95" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#2f6f4e">42 in pass (example)</text>
  <circle cx="150" cy="180" r="14" fill="none" stroke="#3d3832" stroke-width="1.5"/>
  <circle cx="570" cy="180" r="14" fill="none" stroke="#3d3832" stroke-width="1.5"/>
  <text x="360" y="320" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8a8278">NKBA-style planning numbers — verify against your edition</text>

</svg>
