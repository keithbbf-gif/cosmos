<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="title desc">
  <title id="title">Lead time stack diagram</title>
  <desc id="desc">Sequential shop stages from queue through freight.</desc>
  <rect width="720" height="340" fill="#f8f7f4"/>
  <rect x="60" y="120" width="90" height="160" fill="#5c5348" opacity="0.85"/>
  <text x="105" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#3d3832">Queue</text>
  <path d="M150 200 H170" stroke="#3d3832" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="160" y="120" width="90" height="160" fill="#6b8e4e" opacity="0.85"/>
  <text x="205" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#3d3832">Lumber</text>
  <path d="M250 200 H270" stroke="#3d3832" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="260" y="120" width="90" height="160" fill="#8a6f4e" opacity="0.85"/>
  <text x="305" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#3d3832">Mill</text>
  <path d="M350 200 H370" stroke="#3d3832" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="360" y="120" width="90" height="160" fill="#4a7c9e" opacity="0.85"/>
  <text x="405" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#3d3832">Finish</text>
  <path d="M450 200 H470" stroke="#3d3832" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="460" y="120" width="90" height="160" fill="#7a5c8a" opacity="0.85"/>
  <text x="505" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#3d3832">Buyouts</text>
  <path d="M550 200 H570" stroke="#3d3832" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="560" y="120" width="90" height="160" fill="#9a6b4a" opacity="0.85"/>
  <text x="605" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#3d3832">Freight</text>

  <text x="360" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#3d3832">Lead time is a stack, not a stamp</text>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3d3832"/></marker></defs>

</svg>
