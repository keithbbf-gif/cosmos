<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="title desc">
  <title id="title">Phone screen versus room-light sample</title>
  <desc id="desc">Contrast between saturated phone display and physical finish sample.</desc>
  <rect width="720" height="460" fill="#f8f7f4"/>

  <rect x="80" y="80" width="200" height="360" rx="16" fill="#222" stroke="#3d3832" stroke-width="2"/>
  <rect x="95" y="100" width="170" height="280" fill="#4a90d9"/>
  <text x="180" y="420" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11">Phone display (saturated)</text>
  <rect x="360" y="120" width="280" height="200" fill="#c9bfb0" stroke="#8a8278" stroke-width="2"/>
  <text x="500" y="210" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12">Finish board in room light</text>
  <text x="360" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600">Screen color ≠ stain in the room</text>

</svg>
