<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="title desc">
  <title id="title">RFQ checklist</title>
  <desc id="desc">Checkbox list for a complete request for quote.</desc>
  <rect width="720" height="320" fill="#f8f7f4"/>
<text x="360" y="36" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#3d3832">One-sitting RFQ checklist</text>
  <rect x="120" y="70" width="24" height="24" fill="#fff" stroke="#3d3832"/>
  <text x="160" y="87" font-family="system-ui,sans-serif" font-size="13">Object named</text>
  <rect x="120" y="114" width="24" height="24" fill="#fff" stroke="#3d3832"/>
  <text x="160" y="131" font-family="system-ui,sans-serif" font-size="13">Inches + path</text>
  <rect x="120" y="158" width="24" height="24" fill="#fff" stroke="#3d3832"/>
  <text x="160" y="175" font-family="system-ui,sans-serif" font-size="13">Finish</text>
  <rect x="120" y="202" width="24" height="24" fill="#fff" stroke="#3d3832"/>
  <text x="160" y="219" font-family="system-ui,sans-serif" font-size="13">Freight tier</text>
  <rect x="120" y="246" width="24" height="24" fill="#fff" stroke="#3d3832"/>
  <text x="160" y="263" font-family="system-ui,sans-serif" font-size="13">Requested date</text>

</svg>
