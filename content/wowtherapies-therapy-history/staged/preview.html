<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Wow Therapies — staged graphics preview</title>
  <style>
    body { margin: 0; background: #2a2824; color: #f7f2e8; font-family: Georgia, serif; }
    header { padding: 24px 32px; border-bottom: 1px solid #6b2d3e; }
    h1 { font-size: 1.4rem; margin: 0 0 8px; }
    p { margin: 0; opacity: 0.85; font-size: 0.95rem; }
    main { padding: 24px 32px 48px; max-width: 1240px; }
    figure { margin: 0 0 40px; background: #1c1a17; padding: 16px; border-radius: 4px; }
    figcaption { margin-top: 12px; font-size: 0.9rem; line-height: 1.45; }
    img { width: 100%; height: auto; display: block; background: #f7f2e8; }
  </style>
</head>
<body>
  <header>
    <h1>therapy-history / staged graphics</h1>
    <p>Magazine-style SVG figures — monogram portrait plates (no synthetic likenesses).</p>
  </header>
  <main>
    <figure>
      <img src="graphics/fig-01-timeline-psychotherapy.svg" alt="Fig 1 timeline"/>
      <figcaption><strong>Fig. 1</strong> Psychotherapy timeline (1850–present).</figcaption>
    </figure>
    <figure>
      <img src="graphics/fig-02-schools-of-thought.svg" alt="Fig 2 schools"/>
      <figcaption><strong>Fig. 2</strong> Schools-of-thought conceptual map.</figcaption>
    </figure>
    <figure>
      <img src="graphics/fig-03-portrait-plate-freud.svg" alt="Fig 3 Freud plate"/>
      <figcaption><strong>Fig. 3</strong> Freud portrait plate (monogram).</figcaption>
    </figure>
  </main>
</body>
</html>
