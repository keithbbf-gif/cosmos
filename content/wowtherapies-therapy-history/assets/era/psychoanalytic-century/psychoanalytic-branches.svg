<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="t d">
  <title id="t">Psychoanalytic branches</title>
  <desc id="d">Neo-Freudian and analytic schools branching schematic</desc>
  <defs>
    <style>
      .paper { fill: #F7F2E8; }
      .ink { fill: #1C1A17; font-family: Georgia, 'Palatino Linotype', serif; }
      .muted { fill: #5C564C; font-family: Georgia, serif; }
      .caps { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; }
      .rule { stroke: #1C1A17; stroke-width: 1; fill: none; }
      .tick { stroke: #1C1A17; stroke-width: 0.8; }
    </style>
  </defs>
  <rect class="paper" width="1000" height="500"/>
  <rect x="0" y="0" width="1000" height="6" fill="#6B2D3E"/>

  <text x="48" y="44" class="ink caps">Era 04</text>
  <text x="48" y="74" class="ink" font-size="24" font-weight="bold">The psychoanalytic century — branches, not a single church</text>
  <rect x="420" y="120" width="160" height="56" fill="#E8DCC8" stroke="#1C1A17"/>
  <text x="500" y="152" text-anchor="middle" class="ink" font-weight="bold">Freudian core</text>
  <line x1="500" y1="176" x2="500" y2="210" class="rule"/>
  <line x1="200" y1="210" x2="800" y2="210" class="rule"/>
  <line x1="200" y1="210" x2="200" y2="250" class="rule"/>
  <line x1="350" y1="210" x2="350" y2="250" class="rule"/>
  <line x1="500" y1="210" x2="500" y2="250" class="rule"/>
  <line x1="650" y1="210" x2="650" y2="250" class="rule"/>
  <line x1="800" y1="210" x2="800" y2="250" class="rule"/>

  <rect x="120" y="250" width="160" height="70" fill="#E8DCC8" stroke="#1C1A17" stroke-width="0.8"/>
  <text x="132" y="278" class="ink" font-weight="bold">Jung</text>
  <text x="132" y="300" class="muted" font-size="12">Analytical psychology</text>

  <rect x="270" y="250" width="160" height="70" fill="#E8DCC8" stroke="#1C1A17" stroke-width="0.8"/>
  <text x="282" y="278" class="ink" font-weight="bold">Adler</text>
  <text x="282" y="300" class="muted" font-size="12">Individual psychology</text>

  <rect x="420" y="250" width="160" height="70" fill="#E8DCC8" stroke="#1C1A17" stroke-width="0.8"/>
  <text x="432" y="278" class="ink" font-weight="bold">Klein</text>
  <text x="432" y="300" class="muted" font-size="12">Object relations</text>

  <rect x="570" y="250" width="160" height="70" fill="#E8DCC8" stroke="#1C1A17" stroke-width="0.8"/>
  <text x="582" y="278" class="ink" font-weight="bold">Horney</text>
  <text x="582" y="300" class="muted" font-size="12">Cultural psychoanalysis</text>

  <rect x="720" y="250" width="160" height="70" fill="#E8DCC8" stroke="#1C1A17" stroke-width="0.8"/>
  <text x="732" y="278" class="ink" font-weight="bold">Anna Freud</text>
  <text x="732" y="300" class="muted" font-size="12">Ego psychology</text>

  <text x="80" y="360" class="ink" font-size="13">Institutional spread: Vienna → Zurich → London → New York training institutes (dates vary by society).</text>
  <text x="80" y="384" class="muted" font-size="12">Winnicott and object-relations lineages continue off this chart — see figure essays.</text>

  <rect x="40" y="400" width="920" height="56" fill="#FFF" stroke="#1C1A17" stroke-width="0.6" opacity="0.92"/>
  <text x="52" y="420" class="muted caps">Caption</text>
  <text x="52" y="440" class="ink" font-size="12">Fig. 1. Branching schematic of analytic schools (simplified). Original SVG (CC0); photograph embeds only per PORTRAIT_SOURCES.md.</text>
</svg>
