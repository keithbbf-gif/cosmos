<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Feminist relational axes</title>
  <desc id="d">Power and mutuality schematic</desc>
  <defs>
    <style>
      .paper { fill: #F7F2E8; }
      .ink { fill: #1C1A17; font-family: Georgia, 'Palatino Linotype', serif; }
      .muted { fill: #5C564C; font-family: Georgia, serif; }
      .caps { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; }
      .rule { stroke: #1C1A17; stroke-width: 1; fill: none; }
      .tick { stroke: #1C1A17; stroke-width: 0.8; }
    </style>
  </defs>
  <rect class="paper" width="900" height="400"/>
  <rect x="0" y="0" width="900" height="6" fill="#6B2D3E"/>

  <text x="48" y="44" class="ink caps">Era 11</text>
  <text x="48" y="74" class="ink" font-size="24" font-weight="bold">Feminist and relational therapies</text>
  <line x1="100" y1="220" x2="800" y2="220" class="rule"/>
  <text x="100" y="200" class="muted" font-size="11">Hierarchical expert</text>
  <text x="720" y="200" class="muted" font-size="11">Mutual / relational</text>
  <text x="80" y="260" class="ink" font-size="13">Chesler (1972), Miller (1976), Jordan et al. — critique of neutrality myths &amp; power in the room.</text>
  <text x="80" y="284" class="muted" font-size="12">No stock « Rosie » clipart — conceptual axis only.</text>

  <rect x="40" y="310" width="820" height="56" fill="#FFF" stroke="#1C1A17" stroke-width="0.6" opacity="0.92"/>
  <text x="52" y="330" class="muted caps">Caption</text>
  <text x="52" y="350" class="ink" font-size="12">Fig. 1. Editorial axis from hierarchical to relational models. Original SVG (CC0).</text>
</svg>
