<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">CBT model schematic</title>
  <desc id="d">Thought feeling behavior triangle</desc>
  <defs>
    <style>
      .paper { fill: #F7F2E8; }
      .ink { fill: #1C1A17; font-family: Georgia, 'Palatino Linotype', serif; }
      .muted { fill: #5C564C; font-family: Georgia, serif; }
      .caps { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; }
      .rule { stroke: #1C1A17; stroke-width: 1; fill: none; }
      .tick { stroke: #1C1A17; stroke-width: 0.8; }
    </style>
  </defs>
  <rect class="paper" width="900" height="400"/>
  <rect x="0" y="0" width="900" height="6" fill="#6B2D3E"/>

  <text x="48" y="44" class="ink caps">Era 08</text>
  <text x="48" y="74" class="ink" font-size="24" font-weight="bold">Cognitive therapy and the empirical turn</text>
  <polygon points="450,130 620,300 280,300" fill="#E9D4DC" stroke="#1C1A17" stroke-width="0.8"/>
  <text x="450" y="160" text-anchor="middle" class="ink" font-weight="bold">Automatic thoughts</text>
  <text x="310" y="290" class="ink" font-weight="bold">Emotions</text>
  <text x="560" y="290" class="ink" font-weight="bold">Behaviors</text>
  <text x="80" y="340" class="muted" font-size="12">Beck depression trials (1970s–) and Ellis REBT (1962) — manual + measurement, not brain CGI stock art.</text>

  <rect x="40" y="350" width="820" height="56" fill="#FFF" stroke="#1C1A17" stroke-width="0.6" opacity="0.92"/>
  <text x="52" y="370" class="muted caps">Caption</text>
  <text x="52" y="390" class="ink" font-size="12">Fig. 1. Cognitive-behavioral reciprocity (editorial triangle). Original SVG (CC0).</text>
</svg>
