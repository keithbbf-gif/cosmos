<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d">
  <title id="t">Attachment dyad schematic</title>
  <desc id="d">Caregiver-child secure base abstract</desc>
  <defs>
    <style>
      .paper { fill: #F7F2E8; }
      .ink { fill: #1C1A17; font-family: Georgia, 'Palatino Linotype', serif; }
      .muted { fill: #5C564C; font-family: Georgia, serif; }
      .caps { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; }
      .rule { stroke: #1C1A17; stroke-width: 1; fill: none; }
      .tick { stroke: #1C1A17; stroke-width: 0.8; }
    </style>
  </defs>
  <rect class="paper" width="900" height="420"/>
  <rect x="0" y="0" width="900" height="6" fill="#6B2D3E"/>

  <text x="48" y="44" class="ink caps">Era 09</text>
  <text x="48" y="74" class="ink" font-size="24" font-weight="bold">Attachment: nurseries to the therapy hour</text>
  <rect x="200" y="160" width="120" height="80" rx="8" fill="#D8E0EB" stroke="#1C1A17"/>
  <text x="260" y="205" text-anchor="middle" class="ink">Caregiver</text>
  <rect x="520" y="160" width="120" height="80" rx="8" fill="#D8E0EB" stroke="#1C1A17"/>
  <text x="580" y="205" text-anchor="middle" class="ink">Child</text>
  <line x1="320" y1="200" x2="520" y2="200" class="rule" stroke-width="1.4"/>
  <text x="420" y="190" text-anchor="middle" class="muted" font-size="11">secure base</text>
  <text x="80" y="280" class="ink" font-size="13">Bowlby wartime nurseries → Robertson films → Strange Situation (Ainsworth) → AAI in adult therapy discourse.</text>

  <rect x="40" y="330" width="820" height="56" fill="#FFF" stroke="#1C1A17" stroke-width="0.6" opacity="0.92"/>
  <text x="52" y="350" class="muted caps">Caption</text>
  <text x="52" y="370" class="ink" font-size="12">Fig. 1. Abstract secure-base dyad (no faces or photographs). Original schematic (CC0).</text>
</svg>
