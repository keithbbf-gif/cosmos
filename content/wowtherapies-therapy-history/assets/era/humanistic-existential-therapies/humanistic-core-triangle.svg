<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="t d">
  <title id="t">Humanistic therapies axes</title>
  <desc id="d">Rogerian core conditions schematic</desc>
  <defs>
    <style>
      .paper { fill: #F7F2E8; }
      .ink { fill: #1C1A17; font-family: Georgia, 'Palatino Linotype', serif; }
      .muted { fill: #5C564C; font-family: Georgia, serif; }
      .caps { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; }
      .rule { stroke: #1C1A17; stroke-width: 1; fill: none; }
      .tick { stroke: #1C1A17; stroke-width: 0.8; }
    </style>
  </defs>
  <rect class="paper" width="900" height="460"/>
  <rect x="0" y="0" width="900" height="6" fill="#6B2D3E"/>

  <text x="48" y="44" class="ink caps">Era 06</text>
  <text x="48" y="74" class="ink" font-size="24" font-weight="bold">Humanistic and existential « third force »</text>
  <polygon points="450,140 620,360 280,360" fill="#D8E0EB" stroke="#1C1A17" stroke-width="0.8"/>
  <text x="450" y="200" text-anchor="middle" class="ink" font-weight="bold">Congruence</text>
  <text x="330" y="340" class="ink" font-weight="bold">Empathy</text>
  <text x="540" y="340" class="ink" font-weight="bold">Unconditional</text>
  <text x="540" y="358" class="ink" font-weight="bold">positive regard</text>
  <text x="80" y="400" class="muted" font-size="12">Existential strand (Frankl, Yalom): meaning, mortality, choice — parallel, not identical to Rogerian posture.</text>

  <rect x="40" y="410" width="820" height="56" fill="#FFF" stroke="#1C1A17" stroke-width="0.6" opacity="0.92"/>
  <text x="52" y="430" class="muted caps">Caption</text>
  <text x="52" y="450" class="ink" font-size="12">Fig. 1. Rogerian « core conditions » as an editorial triangle. Original SVG (CC0); no therapist or client likenesses.</text>
</svg>
