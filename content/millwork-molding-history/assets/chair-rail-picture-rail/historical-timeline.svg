<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
  <title id="title">Chair rail, picture rail, and the dado that is not a chair — dated anchors</title>
  <desc id="desc">Milestones for the essay. Dates marked soft in prose stay soft.</desc>
  <rect width="100%" height="100%" fill="#f4efe6"/>
  <text x="24" y="36" font-family="Source Serif 4, Georgia, serif" font-size="20" font-weight="600" fill="#2c2416">Chair rail, picture rail, and the dado that is not a chair — dated anchors</text>
  <text x="24" y="58" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" fill="#6b5a45">Milestones for the essay. Dates marked soft in prose stay soft.</text>
  <rect x="24" y="80" width="88" height="28" rx="4" fill="#8b5a2b" stroke="#c4b49a"/>
  <text x="68" y="99" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" font-weight="600" fill="#fffaf0">18th c.</text>
  <text x="128" y="94" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2c2416">Chair rail as dado cap</text>
  <text x="128" y="112" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" fill="#6b5a45">Verify in the essay before a print caption locks the year.</text>
  <line x1="118" y1="108" x2="118" y2="166" stroke="#c4b49a" stroke-width="2"/>
  <rect x="24" y="158" width="88" height="28" rx="4" fill="#efe6d4" stroke="#c4b49a"/>
  <text x="68" y="177" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" font-weight="600" fill="#8b5a2b">19th c.</text>
  <text x="128" y="172" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2c2416">High dados in parlors</text>
  <text x="128" y="190" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" fill="#6b5a45">Verify in the essay before a print caption locks the year.</text>
  <line x1="118" y1="186" x2="118" y2="244" stroke="#c4b49a" stroke-width="2"/>
  <rect x="24" y="236" width="88" height="28" rx="4" fill="#8b5a2b" stroke="#c4b49a"/>
  <text x="68" y="255" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" font-weight="600" fill="#fffaf0">1890–1920</text>
  <text x="128" y="250" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2c2416">Picture rail common in U.S. houses</text>
  <text x="128" y="268" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" fill="#6b5a45">Verify in the essay before a print caption locks the year.</text>
  <line x1="118" y1="264" x2="118" y2="322" stroke="#c4b49a" stroke-width="2"/>
  <rect x="24" y="314" width="88" height="28" rx="4" fill="#efe6d4" stroke="#c4b49a"/>
  <text x="68" y="333" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" font-weight="600" fill="#8b5a2b">now</text>
  <text x="128" y="328" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2c2416">One stick sold as both</text>
  <text x="128" y="346" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" fill="#6b5a45">Verify in the essay before a print caption locks the year.</text>
  <text x="24" y="446" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" fill="#6b5a45">Illustrative shop plate — not a grind template. BBF millwork lane, staged.</text>
</svg>
