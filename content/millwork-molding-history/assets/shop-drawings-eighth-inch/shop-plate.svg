  <text x="24" y="58" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" fill="#6b5a45">Line sections for the second heading. Not a knife grind.</text>
  <rect x="24" y="72" width="712" height="360" fill="#efe6d4" stroke="#c4b49a"/>
  <path d="M 123.68 150 L 140.48000000000002 150 L 140.48000000000002 166.8 L 123.68 166.8" fill="none" stroke="#2c2416" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="115.68" y="360" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" fill="#2c2416">paper</text>
