<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Fig stem cross-section showing cambium and hollow pith</title>
  <desc id="desc">Schematic cross-section of dormant fig wood with bark, cambium ring, xylem, and large central pith</desc>
  <rect width="720" height="420" fill="#f5f0e8"/>
  <text x="360" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="600" fill="#2c2416">Fig stem cross-section  -  where cambium lives</text>
  <!-- stem outline -->
  <circle cx="360" cy="210" r="120" fill="#e8dfd0" stroke="#5c4a32" stroke-width="2"/>
  <!-- pith -->
  <circle cx="360" cy="210" r="52" fill="#d4c8b8" stroke="#5c4a32" stroke-width="1.2"/>
  <text x="360" y="215" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#2c2416">Hollow pith</text>
  <!-- cambium ring -->
  <circle cx="360" cy="210" r="115" fill="none" stroke="#4a6741" stroke-width="5" opacity="0.85"/>
  <circle cx="360" cy="210" r="108" fill="none" stroke="#4a6741" stroke-width="5" opacity="0.85"/>
  <!-- bark -->
  <path d="M 360 90 A 120 120 0 0 1 480 210" fill="none" stroke="#8b5a2b" stroke-width="14" stroke-linecap="round"/>
  <text x="505" y="200" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#2c2416">Bark</text>
  <!-- callout cambium -->
  <line x1="430" y1="130" x2="520" y2="95" stroke="#2c2416" stroke-width="1"/>
  <text x="525" y="92" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" fill="#4a6741">Cambium (living union line)</text>
  <text x="525" y="108" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#5c4a32">Match this ring to the partner piece</text>
  <!-- wedge hint -->
  <path d="M 360 158 L 420 210 L 360 262 Z" fill="#fff" fill-opacity="0.35" stroke="#2c2416" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="430" y="250" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#2c2416">Wedge face should show</text>
  <text x="430" y="265" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#2c2416">cambium, not pith only</text>
  <rect x="40" y="330" width="640" height="55" fill="#fff" stroke="#d4c8b8"/>
  <text x="55" y="352" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#2c2416">1. Cambium is a thin green layer just under bark on dormant wood.</text>
  <text x="55" y="370" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#2c2416">2. Fig pith is large  -  a sponge wedge fails even when the cut looks neat.</text>
  <text x="360" y="408" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5c4a32">Schematic  -  not to scale � shared.cambium-cross-section</text>
</svg>
