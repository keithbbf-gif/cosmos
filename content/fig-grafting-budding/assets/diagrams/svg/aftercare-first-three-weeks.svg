<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Fig graft aftercare  -  shade, humidity bag, suckers, stake</title>
  <desc id="desc">Schematic of first three weeks after fig graft showing bagged scion, partial shade, sucker removal, and stake</desc>
  <rect width="900" height="520" fill="#f5f0e8"/>
  <text x="450" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="600" fill="#2c2416">Aftercare  -  first three weeks (dryness and sunburn kill takes)</text>
  <!-- shade cloth -->
  <rect x="80" y="60" width="740" height="40" fill="#4a6741" opacity="0.25" stroke="#4a6741" stroke-dasharray="6 4"/>
  <text x="450" y="85" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#2c2416">30-50% shade breaks afternoon heat on new unions</text>
  <!-- stock -->
  <rect x="430" y="100" width="40" height="280" fill="#c9bcaa" stroke="#5c4a32"/>
  <!-- scion with bag -->
  <rect x="442" y="100" width="16" height="120" fill="#8b5a2b" opacity="0.4" stroke="#5c4a32"/>
  <path d="M 430 100 Q 450 70 470 100 L 465 200 Q 450 215 435 200 Z" fill="#fff" fill-opacity="0.55" stroke="#2c2416" stroke-width="1"/>
  <text x="520" y="150" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#2c2416">Humidity bag on scion</text>
  <text x="520" y="165" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#5c4a32">White exterior if sun hits it</text>
  <!-- sucker -->
  <path d="M 450 320 Q 380 340 360 400" fill="none" stroke="#4a6741" stroke-width="8" stroke-linecap="round"/>
  <line x1="360" y1="400" x2="340" y2="420" stroke="#6b3a2a" stroke-width="3"/>
  <text x="300" y="410" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#6b3a2a">Rub understock suckers early</text>
  <!-- stake -->
  <line x1="410" y1="380" x2="410" y2="120" stroke="#5c4a32" stroke-width="4"/>
  <line x1="410" y1="200" x2="455" y2="180" stroke="#5c4a32" stroke-width="2"/>
  <text x="320" y="130" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#2c2416">Stake brittle new shoots</text>
  <!-- water note -->
  <ellipse cx="720" cy="420" rx="70" ry="25" fill="#4a90a4" opacity="0.2" stroke="#4a90a4"/>
  <text x="720" y="418" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#2c2416">Water the plant,</text>
  <text x="720" y="432" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#2c2416">not the union tape</text>
  <rect x="40" y="440" width="820" height="55" fill="#fff" stroke="#d4c8b8"/>
  <text x="55" y="462" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#2c2416">Most 8a graft failures in weeks 1-3: scion dried out, cooked in clear plastic, or outcompeted by understock growth.</text>
  <text x="55" y="480" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#2c2416">Peek through film if you must  -  daily lifting is how you dry the scion while feeling vigilant.</text>
  <text x="450" y="512" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5c4a32">Schematic  -  not to scale � shared.aftercare-first-three-weeks</text>
</svg>
