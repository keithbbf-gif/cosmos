<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-labelledby="title desc">
  <title id="title">Chip-bud grafting sequence on fig wood</title>
  <desc id="desc">Four-step schematic: stock slot, scion chip with bud, insertion, parafilm wrap</desc>
  <rect width="920" height="480" fill="#f5f0e8"/>
  <text x="460" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="600" fill="#2c2416">Chip-bud on fig  -  reliable backyard sequence</text>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#2c2416">
    <!-- step 1 -->
    <text x="115" y="70" text-anchor="middle" font-weight="600">1. Stock slot</text>
    <rect x="95" y="90" width="18" height="180" fill="#c9bcaa" stroke="#5c4a32"/>
    <path d="M 104 160 L 88 175 L 104 190 L 120 175 Z" fill="#fff" stroke="#2c2416"/>
    <text x="115" y="290" text-anchor="middle" font-size="10">Angled bottom cut,</text>
    <text x="115" y="305" text-anchor="middle" font-size="10">slice down, lift chip</text>
    <!-- step 2 -->
    <text x="345" y="70" text-anchor="middle" font-weight="600">2. Scion chip</text>
    <rect x="325" y="90" width="18" height="180" fill="#8b5a2b" opacity="0.35" stroke="#5c4a32"/>
    <path d="M 334 150 L 318 165 L 334 180 L 350 165 Z" fill="#e8dfd0" stroke="#4a6741" stroke-width="1.5"/>
    <circle cx="334" cy="165" r="6" fill="#4a6741"/>
    <text x="345" y="290" text-anchor="middle" font-size="10">Bud in thickened zone;</text>
    <text x="345" y="305" text-anchor="middle" font-size="10">slide with knife, not thumb</text>
    <!-- step 3 -->
    <text x="575" y="70" text-anchor="middle" font-weight="600">3. Insert</text>
    <rect x="555" y="90" width="18" height="180" fill="#c9bcaa" stroke="#5c4a32"/>
    <path d="M 564 160 L 548 175 L 564 190 L 580 175 Z" fill="#e8dfd0" stroke="#4a6741" stroke-width="1.5"/>
    <circle cx="564" cy="175" r="6" fill="#4a6741"/>
    <text x="575" y="290" text-anchor="middle" font-size="10">Cambium at edges + base;</text>
    <text x="575" y="305" text-anchor="middle" font-size="10">recut slot if air shows</text>
    <!-- step 4 -->
    <text x="805" y="70" text-anchor="middle" font-weight="600">4. Wrap</text>
    <rect x="785" y="90" width="18" height="180" fill="#c9bcaa" stroke="#5c4a32"/>
    <rect x="778" y="140" width="32" height="50" fill="none" stroke="#6b3a2a" stroke-width="3" rx="2"/>
    <text x="805" y="290" text-anchor="middle" font-size="10">Parafilm over bud eye;</text>
    <text x="805" y="305" text-anchor="middle" font-size="10">fig eye dries if left open</text>
  </g>
  <rect x="40" y="340" width="840" height="70" fill="#fff" stroke="#d4c8b8"/>
  <text x="55" y="362" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#2c2416">Works on green or dormant wood � does not require slipping bark � spends one bud � preferred over T-bud for most fig growers in 8a</text>
  <text x="55" y="382" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#2c2416">Cut stock first so the scion chip is not waiting in the wind.</text>
  <text x="460" y="458" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5c4a32">Schematic  -  not to scale � shared.chip-bud-sequence</text>
</svg>
