<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 472" width="760" height="472" role="img" aria-labelledby="title desc">
  <title id="title">CITES &amp; conservation — regional listing overview (schematic)</title>
  <desc id="desc">Simplified map blocks with appendix notes for trade-relevant furniture species.</desc>
  <rect width="100%" height="400" fill="#faf8f5"/>
  <rect x="80" y="100" width="220" height="140" fill="#6B8E23" opacity="0.55" rx="4"/>
  <text x="190.0" y="170.0" text-anchor="middle" font-size="12" fill="#1a1a1a">North America</text>
  <rect x="80" y="260" width="220" height="80" fill="#CD853F" opacity="0.55" rx="4"/>
  <text x="190.0" y="300.0" text-anchor="middle" font-size="12" fill="#1a1a1a">South America</text>
  <rect x="320" y="80" width="180" height="100" fill="#4682B4" opacity="0.55" rx="4"/>
  <text x="410.0" y="130.0" text-anchor="middle" font-size="12" fill="#1a1a1a">Europe</text>
  <rect x="320" y="200" width="200" height="120" fill="#DAA520" opacity="0.55" rx="4"/>
  <text x="420.0" y="260.0" text-anchor="middle" font-size="12" fill="#1a1a1a">Africa</text>
  <rect x="540" y="120" width="180" height="100" fill="#2E8B57" opacity="0.55" rx="4"/>
  <text x="630.0" y="170.0" text-anchor="middle" font-size="12" fill="#1a1a1a">S &amp; SE Asia</text>
  <rect x="540" y="240" width="160" height="90" fill="#8FBC8F" opacity="0.55" rx="4"/>
  <text x="620.0" y="285.0" text-anchor="middle" font-size="12" fill="#1a1a1a">Oceania</text>
  <text x="24" y="20" font-size="11" fill="#333"><tspan font-weight="600">Americas:</tspan> Swietenia macrophylla (App. II, 1992+); Dalbergia nigra (App. I)</text>
  <text x="24" y="38" font-size="11" fill="#333"><tspan font-weight="600">West &amp; Central Africa:</tspan> Diospyros crassiflora (App. II); Khaya spp. (App. II)</text>
  <text x="24" y="56" font-size="11" fill="#333"><tspan font-weight="600">South &amp; SE Asia:</tspan> Tectona grandis (national controls); D. latifolia (App. II)</text>
  <text x="24" y="74" font-size="11" fill="#333"><tspan font-weight="600">Europe:</tspan> Most temperate furniture species: not CITES-listed</text>
  <rect y="400" width="100%" height="72" fill="#f0ebe3"/>
  <text x="16" y="422" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#2c2416">CITES &amp; conservation — regional listing overview (schematic)</text>
  <text x="16" y="442" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#5a5045">Schematic regions only. Listing status: cites.org Appendices (checked 2024–2025 summaries).</text>
</svg>
