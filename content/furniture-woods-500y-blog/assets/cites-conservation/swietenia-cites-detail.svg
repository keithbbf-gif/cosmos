  <text x="518" y="162" text-anchor="middle" font-size="11" fill="#333">Historic import markets: UK, US, EU workshops</text>
  <text x="24" y="270" font-size="11" fill="#555">Use plantation-grown or documented pre-Convention stock where legally available.</text>

  <rect y="320" width="100%" height="72" fill="#f0ebe3"/>
  <text x="16" y="342" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#2c2416">Honduran &amp; related mahoganies — CITES schematic</text>
  <text x="16" y="362" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#5a5045">Listing summary: cites.org species database (Swietenia); effective dates per COP decisions.</text>
