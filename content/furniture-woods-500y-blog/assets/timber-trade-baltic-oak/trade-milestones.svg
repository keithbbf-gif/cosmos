<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 292" width="640" height="292" role="img" aria-labelledby="title desc">
  <title id="title">Baltic oak export chain</title>
  <desc id="desc">Regional trade timeline for timber-trade-baltic-oak.</desc>
  <rect width="100%" height="220" fill="#faf8f5"/>
  <line x1="50" y1="100" x2="590" y2="100" stroke="#5a5045" stroke-width="2"/>
  <text x="24" y="32" font-size="14" font-weight="600" fill="#2c2416">Baltic oak export chain</text>
  <circle cx="50.0" cy="100" r="4" fill="#8B4513"/>
  <text x="50.0" y="88" text-anchor="middle" font-size="9" fill="#333">Riga market</text>
  <text x="50.0" y="120" text-anchor="middle" font-size="9" fill="#777">1580</text>
  <circle cx="176.0" cy="100" r="4" fill="#8B4513"/>
  <text x="176.0" y="88" text-anchor="middle" font-size="9" fill="#333">Dutch shipping</text>
  <text x="176.0" y="120" text-anchor="middle" font-size="9" fill="#777">1650</text>
  <circle cx="356.0" cy="100" r="4" fill="#8B4513"/>
  <text x="356.0" y="88" text-anchor="middle" font-size="9" fill="#333">Royal Navy stores</text>
  <text x="356.0" y="120" text-anchor="middle" font-size="9" fill="#777">1750</text>
  <circle cx="590.0" cy="100" r="4" fill="#8B4513"/>
  <text x="590.0" y="88" text-anchor="middle" font-size="9" fill="#333">Rail + local oak</text>
  <text x="590.0" y="120" text-anchor="middle" font-size="9" fill="#777">1880</text>
  <rect y="220" width="100%" height="72" fill="#f0ebe3"/>
  <text x="16" y="242" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#2c2416">Baltic oak export chain</text>
  <text x="16" y="262" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#5a5045">Dates are order-of-magnitude trade milestones; see draft bibliography for primary sources.</text>
</svg>
