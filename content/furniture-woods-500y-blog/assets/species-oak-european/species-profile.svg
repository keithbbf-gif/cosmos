<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 372" width="480" height="372" role="img" aria-labelledby="title desc">
  <title id="title">European oak — species profile</title>
  <desc id="desc">Comparison bars for European oak.</desc>
  <rect width="100%" height="300" fill="#faf8f5"/>
  
  <text x="24" y="36" font-size="16" font-weight="600" fill="#2c2416">European oak</text>
  <text x="24" y="54" font-size="11" font-style="italic" fill="#555">Quercus petraea/robur</text>
  <text x="24" y="78" font-size="11" fill="#444">Peak furniture-trade era: 16th–19th c. Baltic &amp; English</text>
  <text x="24" y="110" font-size="11" fill="#333">Janka hardness</text>
  <rect x="24" y="118" width="280" height="18" fill="#e8e0d5" rx="2"/>
  <rect x="24" y="118" width="90" height="18" fill="#8B6914" rx="2"/>
  <text x="310" y="132" font-size="10" fill="#444">1120 lbf</text>
  <text x="24" y="168" font-size="11" fill="#333">Oven-dry density</text>
  <rect x="24" y="176" width="280" height="18" fill="#e8e0d5" rx="2"/>
  <rect x="24" y="176" width="159" height="18" fill="#8B6914" opacity="0.85" rx="2"/>
  <text x="310" y="190" font-size="10" fill="#444">680 kg/m³</text>

  <rect y="300" width="100%" height="72" fill="#f0ebe3"/>
  <text x="16" y="322" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#2c2416">European oak — species profile</text>
  <text x="16" y="342" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#5a5045">Property means: USDA FPL Wood Handbook / Wood Database. Trade era from historical furniture literature.</text>
</svg>
