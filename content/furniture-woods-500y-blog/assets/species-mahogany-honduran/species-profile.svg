<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 372" width="480" height="372" role="img" aria-labelledby="title desc">
  <title id="title">Honduran mahogany — species profile</title>
  <desc id="desc">Comparison bars for Honduran mahogany.</desc>
  <rect width="100%" height="300" fill="#faf8f5"/>
  
  <text x="24" y="36" font-size="16" font-weight="600" fill="#2c2416">Honduran mahogany</text>
  <text x="24" y="54" font-size="11" font-style="italic" fill="#555">Swietenia macrophylla</text>
  <text x="24" y="78" font-size="11" fill="#444">Peak furniture-trade era: 1720s–20th c. Atlantic trade</text>
  <text x="24" y="110" font-size="11" fill="#333">Janka hardness</text>
  <rect x="24" y="118" width="280" height="18" fill="#e8e0d5" rx="2"/>
  <rect x="24" y="118" width="72" height="18" fill="#8B4513" rx="2"/>
  <text x="310" y="132" font-size="10" fill="#444">900 lbf</text>
  <text x="24" y="168" font-size="11" fill="#333">Oven-dry density</text>
  <rect x="24" y="176" width="280" height="18" fill="#e8e0d5" rx="2"/>
  <rect x="24" y="176" width="149" height="18" fill="#8B4513" opacity="0.85" rx="2"/>
  <text x="310" y="190" font-size="10" fill="#444">640 kg/m³</text>

  <rect y="300" width="100%" height="72" fill="#f0ebe3"/>
  <text x="16" y="322" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#2c2416">Honduran mahogany — species profile</text>
  <text x="16" y="342" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#5a5045">Property means: USDA FPL Wood Handbook / Wood Database. Trade era from historical furniture literature.</text>
</svg>
