  <text x="48" y="424" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="13" fill="#1c1917">Tangential flatsawn boards show cathedral figure; radial quartersawn shows linear ray fleck; rift sits between the two.</text>
  <text x="48" y="444" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#78716c">Geometry after R. B. Hoadley, Understanding Wood (Taunton).</text>
