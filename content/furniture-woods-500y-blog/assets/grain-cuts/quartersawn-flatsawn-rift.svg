<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 432" width="720" height="432" role="img" aria-labelledby="title desc">
  <title id="title">Quartersawn, flatsawn, and riftsawn — log to face</title>
  <desc id="desc">Schematic log cross-section with cut directions and resulting grain patterns.</desc>
  <rect width="100%" height="360" fill="#faf8f5"/>
  <circle cx="200" cy="180" r="70" fill="#D4A574" stroke="#8B6914" stroke-width="2"/>
  <circle cx="200" cy="180" r="24.5" fill="#f5e6d3" stroke="#8B6914"/>
  <line x1="130" y1="180" x2="270" y2="180" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="200" y="98" text-anchor="middle" font-size="12" fill="#c0392b">Flatsawn — tangential</text>
  <line x1="200" y1="110" x2="200" y2="250" stroke="#2980b9" stroke-width="2"/>
  <text x="278" y="180" font-size="12" fill="#2980b9">Quartersawn — radial</text>
  <line x1="150.48282115829602" y1="130.5222373226244" x2="249.51717884170398" y2="229.4777626773756" stroke="#27ae60" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="120" y="270" text-anchor="end" font-size="12" fill="#27ae60">Riftsawn (~30–60° to ray)</text>
  <rect x="420" y="80" width="80" height="80" fill="#e8dcc8" stroke="#666"/>
  <path d="M430 120 Q460 115 490 120" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <path d="M430 135 Q460 130 490 135" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <path d="M430 150 Q460 145 490 150" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <path d="M430 165 Q460 160 490 165" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <text x="460" y="175" text-anchor="middle" font-size="10" fill="#333">Flatsawn face</text>
  <rect x="515" y="80" width="80" height="80" fill="#e8dcc8" stroke="#666"/>
  <line x1="523" y1="85" x2="587" y2="85" stroke="#2980b9" stroke-width="1"/>
  <line x1="523" y1="98" x2="587" y2="98" stroke="#2980b9" stroke-width="1"/>
  <line x1="523" y1="111" x2="587" y2="111" stroke="#2980b9" stroke-width="1"/>
  <line x1="523" y1="124" x2="587" y2="124" stroke="#2980b9" stroke-width="1"/>
  <line x1="523" y1="137" x2="587" y2="137" stroke="#2980b9" stroke-width="1"/>
  <line x1="523" y1="150" x2="587" y2="150" stroke="#2980b9" stroke-width="1"/>
  <text x="555" y="175" text-anchor="middle" font-size="10" fill="#333">Quartersawn face</text>
  <rect x="610" y="80" width="80" height="80" fill="#e8dcc8" stroke="#666"/>
  <line x1="620" y1="85" x2="630" y2="165" stroke="#27ae60" stroke-width="1"/>
  <line x1="628" y1="85" x2="638" y2="165" stroke="#27ae60" stroke-width="1"/>
  <line x1="636" y1="85" x2="646" y2="165" stroke="#27ae60" stroke-width="1"/>
  <line x1="644" y1="85" x2="654" y2="165" stroke="#27ae60" stroke-width="1"/>
  <line x1="652" y1="85" x2="662" y2="165" stroke="#27ae60" stroke-width="1"/>
  <line x1="660" y1="85" x2="670" y2="165" stroke="#27ae60" stroke-width="1"/>
  <line x1="668" y1="85" x2="678" y2="165" stroke="#27ae60" stroke-width="1"/>
  <line x1="676" y1="85" x2="686" y2="165" stroke="#27ae60" stroke-width="1"/>
  <text x="650" y="175" text-anchor="middle" font-size="10" fill="#333">Riftsawn face</text>
  <text x="360" y="40" font-size="13" font-weight="600" fill="#2c2416">Log orientation → typical face grain</text>
  <rect y="360" width="100%" height="72" fill="#f0ebe3"/>
  <text x="16" y="382" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#2c2416">Quartersawn, flatsawn, and riftsawn — log to face</text>
  <text x="16" y="402" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#5a5045">Diagram after standard woodworking texts (Hoadley, Understanding Wood); angles approximate.</text>
</svg>
