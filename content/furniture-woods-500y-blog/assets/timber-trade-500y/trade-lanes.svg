<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 448" width="900" height="448" role="img" aria-labelledby="title desc">
  <title id="title">Three trade lanes</title>
  <desc id="desc">Regional furniture-timber trade milestones on parallel lanes.</desc>
  <rect width="100%" height="100%" fill="#faf9f6"/>
  
  <text x="48" y="36" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" letter-spacing="0.12em" fill="#78716c">FIGURE 2</text>
