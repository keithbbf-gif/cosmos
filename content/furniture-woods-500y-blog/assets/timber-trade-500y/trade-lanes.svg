  <line x1="48" y1="360" x2="852" y2="360" stroke="#e7e5e4" stroke-width="1"/>
  <text x="48" y="384" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="13" fill="#1c1917">Baltic oak, Caribbean mahogany, and Indian Ocean teak followed distinct supply chains before twentieth-century conservation law.</text>
  <text x="48" y="404" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#78716c">Milestone years follow draft bibliographies; 1992 Swietenia listing per cites.org.</text>
