<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">BIFMA vs healthcare bed system schematic</title>
  <desc id="desc">Comparison panels for office furniture testing versus hospital bed entrapment system.</desc>
  <rect width="960" height="540" fill="#f6f5f2"/>

  <text x="480" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#2e2a26">BIFMA stamp ≠ healthcare bed-system stamp</text>
  <rect x="140" y="120" width="280" height="100" rx="8" fill="#ebe6dd" stroke="#7a746c"/>
  <text x="280" y="175" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13">Office / contract casegood</text>
  <rect x="540" y="120" width="280" height="100" rx="8" fill="#cfc5b8" stroke="#9a3b2e" stroke-width="2"/>
  <text x="680" y="175" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13">Bed + rail + mattress system</text>
  <text x="480" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#7a746c">Different test houses — do not swap certificates in a punchout line item.</text>

</svg>
