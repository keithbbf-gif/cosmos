<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Nurses station sightline schematic</title>
  <desc id="desc">Elevation showing seated sightline question at transaction height millwork.</desc>
  <rect width="960" height="540" fill="#f6f5f2"/>

  <text x="480" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#2e2a26">Nurses' station — seated-to-seated sightline</text>
  <rect x="80" y="80" width="800" height="60" fill="#cfc5b8" stroke="#2e2a26" stroke-width="2"/>
  <text x="480" y="115" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12">Transaction counter (standing height)</text>
  <circle cx="200" cy="280" r="28" fill="#ebe6dd" stroke="#7a746c"/>
  <circle cx="760" cy="280" r="28" fill="#ebe6dd" stroke="#7a746c"/>
  <text x="200" y="285" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10">CNA seated</text>
  <text x="760" y="285" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10">Resident seated</text>
  <line x1="228" y1="280" x2="732" y2="280" stroke="#1d5c4a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="480" y="260" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1d5c4a">Can one seated person see another?</text>

</svg>
