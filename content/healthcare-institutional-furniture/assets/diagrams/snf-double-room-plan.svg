<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">SNF double bedroom plan</title>
  <desc id="desc">Two bed envelopes separated by curtain track with shared center aisle.</desc>
  <rect width="960" height="540" fill="#f6f5f2"/>

  <text x="480" y="34" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#2e2a26">SNF double — two 80 ft² floors, one width problem</text>
  <rect x="60" y="55" width="840" height="400" fill="#fff" stroke="#2e2a26" stroke-width="2"/>
  <line x1="480" y1="55" x2="480" y2="455" stroke="#b8aea3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="480" y="75" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#7a746c">Privacy curtain track</text>
  <rect x="90" y="100" width="170" height="90" fill="#cfc5b8" stroke="#2e2a26"/>
  <rect x="700" y="100" width="170" height="90" fill="#cfc5b8" stroke="#2e2a26"/>
  <text x="175" y="150" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12">Bed A</text>
  <text x="785" y="150" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12">Bed B</text>
  <rect x="90" y="210" width="55" height="45" fill="#ebe6dd" stroke="#7a746c"/>
  <rect x="815" y="210" width="55" height="45" fill="#ebe6dd" stroke="#7a746c"/>
  <text x="480" y="280" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#9a3b2e">Shared aisle — overbed + lift compete here</text>
  <path d="M260 320 H700" stroke="#1d5c4a" stroke-width="2"/>
  <text x="480" y="340" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1d5c4a">Case-goods strip along wall only</text>
  <text x="90" y="430" font-family="system-ui,sans-serif" font-size="11" fill="#7a746c">≥80 ft² per resident in a multiple bedroom — width, not area, punishes paired nightstands.</text>

</svg>
