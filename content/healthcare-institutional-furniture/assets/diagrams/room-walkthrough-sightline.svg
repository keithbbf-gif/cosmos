<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">SNF room walk-through sightline</title>
  <desc id="desc">Plan schematic from door to bed head for survey-style walk-through.</desc>
  <rect width="960" height="540" fill="#f6f5f2"/>

  <text x="480" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#2e2a26">Walk-through path — door sightline to bed face</text>
  <rect x="100" y="60" width="760" height="400" fill="#fff" stroke="#2e2a26" stroke-width="2"/>
  <rect x="100" y="360" width="80" height="100" fill="#ebe6dd" stroke="#1d5c4a" stroke-width="2"/>
  <text x="140" y="415" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11">Door</text>
  <path d="M180 410 Q400 200 620 150" fill="none" stroke="#1d5c4a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="400" y="240" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1d5c4a">Staff sightline</text>
  <rect x="580" y="120" width="220" height="100" fill="#cfc5b8" stroke="#2e2a26"/>
  <text x="690" y="175" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12">Head of bed</text>
  <text x="120" y="100" font-family="system-ui,sans-serif" font-size="11" fill="#7a746c">1. Threshold · 2. Crash path · 3. Rail state · 4. Overbed parked · 5. Oxygen zone</text>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1d5c4a"/></marker></defs>

</svg>
