  <text x="480" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#2e2a26">Bariatric bed envelope — aisle theft</text>
  <rect x="180" y="140" width="520" height="120" fill="#cfc5b8" stroke="#9a3b2e" stroke-width="2"/>
  <text x="440" y="205" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13">Wider deck + motors</text>
