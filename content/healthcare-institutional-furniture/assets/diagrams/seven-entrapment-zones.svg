<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Seven bed entrapment zones diagram</title>
  <desc id="desc">Side elevation schematic labeling FDA Hospital Bed Safety Workgroup zones 1 through 7.</desc>
  <rect width="960" height="540" fill="#f6f5f2"/>

  <text x="480" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#2e2a26">Hospital bed system — seven entrapment zones (FDA 2006, educational)</text>
  <rect x="200" y="70" width="560" height="120" rx="6" fill="#ebe6dd" stroke="#2e2a26" stroke-width="2"/>
  <text x="480" y="135" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13">Mattress deck (side elevation)</text>
  <rect x="180" y="60" width="24" height="140" fill="#cfc5b8" stroke="#9a3b2e" stroke-width="2"/>
  <rect x="756" y="60" width="24" height="140" fill="#cfc5b8" stroke="#9a3b2e" stroke-width="2"/>
  <text x="192" y="220" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#9a3b2e">Z1</text>
  <text x="768" y="220" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#9a3b2e">Z1</text>
  <text x="300" y="205" font-family="system-ui,sans-serif" font-size="10" fill="#1a4d7a">Z2 under rail</text>
  <text x="420" y="195" font-family="system-ui,sans-serif" font-size="10" fill="#1a4d7a">Z3 rail–mattress</text>
  <text x="210" y="95" font-family="system-ui,sans-serif" font-size="10" fill="#1a4d7a">Z4 end bay</text>
  <text x="620" y="95" font-family="system-ui,sans-serif" font-size="10" fill="#7a746c">Z5 split gap</text>
  <text x="140" y="130" font-family="system-ui,sans-serif" font-size="10" fill="#7a746c">Z6 rail–board</text>
  <text x="720" y="130" font-family="system-ui,sans-serif" font-size="10" fill="#7a746c">Z7 board–mattress</text>
  <text x="480" y="260" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#2e2a26">Zones 1–3: &lt;120 mm (4.75 in) recommended · Zone 4: &lt;60 mm (2.375 in) + angle table</text>
  <text x="480" y="285" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#7a746c">Zones 5–7 named in guidance — not “safe by silence.” Open FDA/HBSW drawings for assessment.</text>
  <rect x="80" y="310" width="800" height="200" fill="#fff" stroke="#7a746c" stroke-width="1"/>
  <text x="100" y="340" font-family="system-ui,sans-serif" font-size="12" fill="#2e2a26">Furniture-adjacent: Zone 3 (mattress width/softness) · Zone 6 (decorative headboard) · Zone 7 (footboard gap)</text>
  <text x="100" y="365" font-family="system-ui,sans-serif" font-size="11" fill="#7a746c">Not a substitute for HBSW measurement methods or clinical assessment.</text>

</svg>
