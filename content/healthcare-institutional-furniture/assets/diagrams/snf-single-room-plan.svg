<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">SNF single room plan schematic</title>
  <desc id="desc">Plan view showing bed envelope, working aisle, toilet punch-out, and case goods in a notional 100 square foot skilled nursing room.</desc>
  <rect width="960" height="540" fill="#f6f5f2"/>

  <text x="480" y="36" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="600" fill="#2e2a26">SNF single room — usable rectangle (notional 100 ft² floor)</text>
  <rect x="80" y="60" width="800" height="420" fill="#fff" stroke="#2e2a26" stroke-width="2"/>
  <rect x="520" y="90" width="120" height="200" fill="#ebe6dd" stroke="#1d5c4a" stroke-width="2"/>
  <text x="580" y="175" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#2e2a26">Toilet</text>
  <text x="580" y="195" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#7a746c">(punched from plan)</text>
  <rect x="120" y="120" width="360" height="100" fill="#cfc5b8" stroke="#2e2a26" stroke-width="2"/>
  <text x="300" y="165" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#2e2a26">Bed envelope + rails up</text>
  <rect x="120" y="240" width="90" height="50" fill="#ebe6dd" stroke="#7a746c"/>
  <text x="165" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11">Nightstand</text>
  <rect x="230" y="300" width="70" height="70" fill="#ebe6dd" stroke="#7a746c"/>
  <text x="265" y="340" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10">Chair</text>
  <rect x="320" y="300" width="100" height="24" fill="none" stroke="#1a4d7a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="370" y="318" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#1a4d7a">Overbed parked</text>
  <path d="M120 230 H480" stroke="#1d5c4a" stroke-width="3" marker-end="url(#arr)"/>
  <text x="300" y="222" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1d5c4a">Working aisle / lift path</text>
  <rect x="400" y="300" width="80" height="180" fill="#ebe6dd" stroke="#7a746c"/>
  <text x="440" y="390" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11">Wardrobe</text>
  <text x="120" y="500" font-family="system-ui,sans-serif" font-size="11" fill="#7a746c">CMS floor: ≥100 ft² single (42 CFR 483.90(e)(1)(ii)) — furniture lives in the leftover.</text>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1d5c4a"/></marker></defs>

</svg>
