<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Ward to private room layout shift</title>
  <desc id="desc">Comparison of multi-bed ward row versus single resident room envelope.</desc>
  <rect width="960" height="540" fill="#f6f5f2"/>

  <text x="480" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#2e2a26">Ward row → private room — footprint shift</text>
  <g font-family="system-ui,sans-serif" font-size="11">
    <text x="200" y="70" text-anchor="middle" font-weight="600">Ward (many beds, one air)</text>
    <rect x="60" y="85" width="280" height="180" fill="#fff" stroke="#7a746c"/>
    <rect x="75" y="100" width="50" height="150" fill="#ebe6dd" stroke="#b8aea3"/>
    <rect x="135" y="100" width="50" height="150" fill="#ebe6dd" stroke="#b8aea3"/>
    <rect x="195" y="100" width="50" height="150" fill="#ebe6dd" stroke="#b8aea3"/>
    <rect x="255" y="100" width="50" height="150" fill="#ebe6dd" stroke="#b8aea3"/>
    <text x="620" y="70" text-anchor="middle" font-weight="600">Private room (one envelope)</text>
    <rect x="480" y="85" width="280" height="180" fill="#fff" stroke="#2e2a26" stroke-width="2"/>
    <rect x="520" y="110" width="200" height="90" fill="#cfc5b8" stroke="#1d5c4a"/>
    <rect x="520" y="210" width="60" height="40" fill="#ebe6dd" stroke="#7a746c"/>
  </g>
  <path d="M350 175 H470" stroke="#1d5c4a" stroke-width="3" marker-end="url(#arr)"/>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1d5c4a"/></marker></defs>

</svg>
