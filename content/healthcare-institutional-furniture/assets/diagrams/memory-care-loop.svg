<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Memory care furniture layout schematic</title>
  <desc id="desc">Plan with circulation loop and anchored seating footprint.</desc>
  <rect width="960" height="540" fill="#f6f5f2"/>

  <text x="480" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#2e2a26">Memory care — wander loop vs. anchored furniture</text>
  <rect x="120" y="80" width="720" height="360" fill="#fff" stroke="#2e2a26"/>
  <path d="M200 200 H760 V360 H200 Z" fill="none" stroke="#1a4d7a" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="480" y="400" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1a4d7a">Circulation loop (not a maze graphic)</text>
  <rect x="240" y="240" width="80" height="50" fill="#ebe6dd" stroke="#1d5c4a"/>
  <text x="280" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10">Anchored seating</text>

</svg>
