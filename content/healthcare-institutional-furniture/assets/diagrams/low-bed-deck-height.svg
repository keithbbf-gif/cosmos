<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Low bed deck height comparison</title>
  <desc id="desc">Side elevation comparing standard and low mattress deck heights.</desc>
  <rect width="960" height="540" fill="#f6f5f2"/>

  <text x="480" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#2e2a26">Low bed deck height vs. fall culture (notional)</text>
  <line x1="100" y1="380" x2="860" y2="380" stroke="#2e2a26" stroke-width="2"/>
  <rect x="280" y="280" width="400" height="100" fill="#ebe6dd" stroke="#2e2a26"/>
  <text x="480" y="335" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12">Standard deck</text>
  <rect x="280" y="320" width="400" height="60" fill="#cfc5b8" stroke="#1d5c4a" stroke-width="2"/>
  <text x="480" y="355" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#1d5c4a">Low deck</text>
  <text x="480" y="420" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#7a746c">Lower deck changes reach to nightstand and rail assist — not a furniture catalog toggle.</text>

</svg>
