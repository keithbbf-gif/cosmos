<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Zone 3 mattress gap schematic</title>
  <desc id="desc">Side view highlighting rail-to-mattress opening when mattress does not match bed system.</desc>
  <rect width="960" height="540" fill="#f6f5f2"/>

  <text x="480" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#2e2a26">Zone 3 — rail-to-mattress canyon (mattress mismatch)</text>
  <rect x="160" y="100" width="640" height="100" fill="#ebe6dd" stroke="#2e2a26"/>
  <rect x="140" y="90" width="20" height="120" fill="#cfc5b8" stroke="#9a3b2e"/>
  <rect x="800" y="90" width="20" height="120" fill="#cfc5b8" stroke="#9a3b2e"/>
  <rect x="200" y="110" width="520" height="70" fill="#fff" stroke="#1d5c4a" stroke-width="2"/>
  <text x="460" y="155" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#1d5c4a">Gap opens when deck + mattress ≠ rail design</text>
  <text x="480" y="280" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#7a746c">Foam softening and articulation change the number you took on install day.</text>

</svg>
