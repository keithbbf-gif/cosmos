<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Side rail geometry schematic</title>
  <desc id="desc">Educational comparison of full, half, and intermediate rail positions relative to mattress openings.</desc>
  <rect width="960" height="540" fill="#f6f5f2"/>

  <text x="480" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#2e2a26">Side rail nicknames vs. openings (geometry, not restraint paperwork)</text>
  <g font-family="system-ui,sans-serif" font-size="11" fill="#2e2a26">
    <text x="120" y="70" font-weight="600">Full rail</text>
    <rect x="100" y="85" width="200" height="100" fill="#ebe6dd" stroke="#2e2a26"/>
    <rect x="95" y="80" width="12" height="110" fill="#cfc5b8" stroke="#9a3b2e"/>
    <rect x="293" y="80" width="12" height="110" fill="#cfc5b8" stroke="#9a3b2e"/>
    <text x="200" y="205" text-anchor="middle" fill="#7a746c">Wall with holes (Zones 1–2)</text>
    <text x="400" y="70" font-weight="600">Half rail</text>
    <rect x="380" y="85" width="200" height="100" fill="#ebe6dd" stroke="#2e2a26"/>
    <rect x="375" y="120" width="12" height="70" fill="#cfc5b8" stroke="#9a3b2e"/>
    <text x="480" y="205" text-anchor="middle" fill="#7a746c">End bay + torso gap (Zones 4–6)</text>
    <text x="680" y="70" font-weight="600">Intermediate</text>
    <rect x="660" y="85" width="200" height="100" fill="#ebe6dd" stroke="#2e2a26"/>
    <rect x="655" y="100" width="12" height="45" fill="#cfc5b8" stroke="#1d5c4a" transform="rotate(-25 661 122)"/>
    <text x="760" y="205" text-anchor="middle" fill="#1d5c4a">Left “kind” — measure anyway</text>
  </g>
  <text x="480" y="280" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#2e2a26">Measure at flat, articulated, and intermediate — mattress vendor on the same line as the rail.</text>
  <text x="480" y="305" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#7a746c">Wooden caps and bumpers are accessories; they change openings.</text>

</svg>
