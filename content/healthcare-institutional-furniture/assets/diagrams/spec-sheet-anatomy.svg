<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Healthcare furniture spec sheet anatomy</title>
  <desc id="desc">Labeled blocks for dimensions, fire materials, install, and bed adjacency.</desc>
  <rect width="960" height="540" fill="#f6f5f2"/>

  <text x="480" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#2e2a26">Spec sheet anatomy — what the mill needs</text>
  <rect x="120" y="70" width="720" height="380" fill="#fff" stroke="#2e2a26" stroke-width="2"/>
  <line x1="120" y1="120" x2="840" y2="120" stroke="#7a746c"/>
  <text x="140" y="105" font-family="system-ui,sans-serif" font-size="12">W × D × H · finish · edge · hardware · freight class</text>
  <rect x="140" y="140" width="320" height="50" fill="#ebe6dd" stroke="#7a746c"/>
  <text x="300" y="170" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11">Materials + fire tags</text>
  <rect x="140" y="210" width="640" height="80" fill="#ebe6dd" stroke="#7a746c"/>
  <text x="460" y="255" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11">Install / anchor / anti-tip</text>
  <rect x="140" y="310" width="640" height="50" fill="#cfc5b8" stroke="#1d5c4a"/>
  <text x="460" y="340" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11">Mattress line + bed model (if adjacent)</text>

</svg>
