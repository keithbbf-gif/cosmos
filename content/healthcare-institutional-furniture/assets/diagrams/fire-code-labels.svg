<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Fire code labels schematic</title>
  <desc id="desc">Two-panel schematic contrasting California TB 117 furniture label and NFPA 101 adoption context.</desc>
  <rect width="960" height="540" fill="#f6f5f2"/>

  <text x="480" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#2e2a26">CAL TB 117-2013 vs. NFPA 101 — sticker is not a program</text>
  <rect x="160" y="120" width="240" height="120" fill="#fff" stroke="#2e2a26"/>
  <text x="280" y="175" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12">TB 117-2013 label</text>
  <rect x="560" y="120" width="240" height="120" fill="#fff" stroke="#2e2a26"/>
  <text x="680" y="175" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12">NFPA 101 adoption</text>
  <text x="480" y="320" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#7a746c">Read the state adoption book — a tag photo is evidence, not a life-safety program.</text>

</svg>
