<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Overbed table clearance schematic</title>
  <desc id="desc">Side view showing table base relative to wheelchair footplate zone.</desc>
  <rect width="960" height="540" fill="#f6f5f2"/>

  <text x="480" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#2e2a26">Overbed table — base vs. wheelchair footplate</text>
  <rect x="200" y="100" width="400" height="80" fill="#ebe6dd" stroke="#2e2a26"/>
  <text x="400" y="145" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12">Bed deck</text>
  <rect x="250" y="200" width="300" height="20" fill="#cfc5b8" stroke="#1d5c4a"/>
  <text x="400" y="215" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10">Table top</text>
  <ellipse cx="320" cy="320" rx="50" ry="30" fill="none" stroke="#9a3b2e" stroke-width="2"/>
  <text x="320" y="325" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#9a3b2e">Footplate</text>
  <text x="480" y="400" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#7a746c">Apron height and base width are politics in the aisle.</text>

</svg>
