<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="fig01-title fig01-desc">
  <title id="fig01-title">Fig. 1 - Public milestones in multimodal AI (2012-2024)</title>
  <desc id="fig01-desc">Chronological axis of selected public papers, weight releases, and product launches in vision-language and generative media. Editorial schematic; dates from public announcements.</desc>
  <defs>
    <style>
      .paper { fill: #0f1419; }
      .ink { fill: #e8eef2; font-family: 'Segoe UI', system-ui, sans-serif; }
      .muted { fill: #8b9aab; font-family: 'Segoe UI', system-ui, sans-serif; }
      .caps { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; }
      .label { font-size: 13px; font-weight: 600; }
      .note { font-size: 11px; }
      .year { font-size: 12px; font-weight: 700; fill: #56b6c2; }
      .band-vl { fill: #1a2a38; }
      .band-gen { fill: #1f2d24; }
      .band-asst { fill: #2a2438; }
      .rule { stroke: #56b6c2; stroke-width: 1.2; fill: none; }
      .tick { stroke: #8b9aab; stroke-width: 1; }
      .dot { fill: #3fd68f; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#56b6c2"/>
    </marker>
  </defs>
  <rect class="paper" width="1200" height="520"/>
  <rect x="0" y="0" width="1200" height="5" fill="#56b6c2"/>
  <text x="48" y="42" class="ink caps">Fig. 01</text>
  <text x="48" y="72" class="ink" font-size="24" font-weight="bold">Public multimodal AI - selected doors</text>
  <text x="48" y="98" class="muted note">Papers, weights, and launches on the public record - not a complete bibliography.</text>

  <rect x="80" y="128" width="320" height="32" class="band-vl" rx="3"/>
  <text x="92" y="148" class="muted caps" font-size="10">Vision + language (contrastive / VQA)</text>
  <rect x="420" y="128" width="360" height="32" class="band-gen" rx="3"/>
  <text x="432" y="148" class="muted caps" font-size="10">Generative images (tokens ' diffusion)</text>
  <rect x="800" y="128" width="320" height="32" class="band-asst" rx="3"/>
  <text x="812" y="148" class="muted caps" font-size="10">Assistants that look (VLMs)</text>

  <line x1="80" y1="300" x2="1120" y2="300" class="rule" marker-end="url(#arrow)"/>
  <text x="80" y="288" class="muted caps">Calendar time</text>

  <g class="tick">
    <line x1="160" y1="292" x2="160" y2="308"/><text x="148" y="328" class="year">2015</text>
    <line x1="320" y1="292" x2="320" y2="308"/><text x="308" y="328" class="year">2018</text>
    <line x1="480" y1="292" x2="480" y2="308"/><text x="468" y="328" class="year">2021</text>
    <line x1="640" y1="292" x2="640" y2="308"/><text x="628" y="328" class="year">2022</text>
    <line x1="800" y1="292" x2="800" y2="308"/><text x="788" y="328" class="year">2023</text>
    <line x1="960" y1="292" x2="960" y2="308"/><text x="948" y="328" class="year">2024</text>
  </g>

  <g>
    <line x1="200" y1="300" x2="200" y2="240" class="tick"/>
    <circle cx="200" cy="234" r="5" class="dot"/>
    <text x="120" y="222" class="label ink">Show and Tell captions</text>
    <text x="120" y="238" class="note muted">Vinyals et al. - CVPR 2015</text>

    <line x1="360" y1="300" x2="360" y2="360" class="tick"/>
    <circle cx="360" cy="366" r="5" class="dot"/>
    <text x="280" y="382" class="label ink">ViT patches</text>
    <text x="280" y="398" class="note muted">Dosovitskiy et al. - ICLR 2021</text>

    <line x1="480" y1="300" x2="480" y2="220" class="tick"/>
    <circle cx="480" cy="214" r="5" class="dot"/>
    <text x="400" y="200" class="label ink">CLIP + DALL-E blogs</text>
    <text x="400" y="216" class="note muted">OpenAI - 5 Jan 2021</text>

    <line x1="560" y1="300" x2="560" y2="360" class="tick"/>
    <circle cx="560" cy="366" r="5" class="dot"/>
    <text x="500" y="382" class="label ink">LDM / latent diffusion</text>
    <text x="500" y="398" class="note muted">Rombach et al. - CVPR 2022</text>

    <line x1="640" y1="300" x2="640" y2="240" class="tick"/>
    <circle cx="640" cy="234" r="5" class="dot"/>
    <text x="560" y="222" class="label ink">Stable Diffusion weights</text>
    <text x="560" y="238" class="note muted">Stability - 22 Aug 2022</text>

    <line x1="760" y1="300" x2="760" y2="360" class="tick"/>
    <circle cx="760" cy="366" r="5" class="dot"/>
    <text x="680" y="382" class="label ink">LLaVA instruction tuning</text>
    <text x="680" y="398" class="note muted">Liu et al. - arXiv 2023</text>

    <line x1="840" y1="300" x2="840" y2="220" class="tick"/>
    <circle cx="840" cy="214" r="5" class="dot"/>
    <text x="760" y="200" class="label ink">GPT-4V preview</text>
    <text x="760" y="216" class="note muted">OpenAI - Sep 2023</text>

    <line x1="960" y1="300" x2="960" y2="360" class="tick"/>
    <circle cx="960" cy="366" r="5" class="dot"/>
    <text x="880" y="382" class="label ink">Whisper weights public</text>
    <text x="880" y="398" class="note muted">Radford et al. - 2022-2023 use</text>
  </g>
  <text x="48" y="490" class="muted note">Original schematic - CC0 - no photographs or AI-generated faces.</text>
</svg>
