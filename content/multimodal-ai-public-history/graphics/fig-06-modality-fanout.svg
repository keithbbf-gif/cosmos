<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="fig06-title fig06-desc">
  <title id="fig06-title">Fig. 6 - Modalities fanning out from shared embedding spaces after CLIP</title>
  <desc id="fig06-desc">Hub-and-spoke diagram: contrastive text-image space at center with branches for speech spectrograms, video frames, and music tokens. Abstract icons only.</desc>
  <defs>
    <style>
      .bg { fill: #0f1419; }
      .hub { fill: #243040; stroke: #56b6c2; stroke-width: 2; }
      .spoke { fill: #1a2330; stroke: #3a4a5c; stroke-width: 1.2; }
      .ink { fill: #e8eef2; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; }
      .muted { fill: #8b9aab; font-family: system-ui, sans-serif; font-size: 11px; }
      .caps { fill: #56b6c2; font-size: 11px; letter-spacing: 0.12em; }
      .link { stroke: #3fd68f; stroke-width: 1.5; fill: none; }
    </style>
  </defs>
  <rect class="bg" width="960" height="480"/>
  <text x="40" y="36" class="caps">Fig. 06</text>
  <text x="40" y="64" class="ink" font-size="20">After CLIP: more joints</text>

  <circle cx="480" cy="250" r="72" class="hub"/>
  <text x="480" y="244" class="ink" text-anchor="middle">Text-image</text>
  <text x="480" y="262" class="muted" text-anchor="middle">joint space</text>

  <line class="link" x1="480" y1="178" x2="480" y2="100"/>
  <rect x="400" y="56" width="160" height="64" class="spoke" rx="6"/>
  <text x="480" y="84" class="ink" text-anchor="middle">Whisper</text>
  <text x="480" y="102" class="muted" text-anchor="middle">audio ' text</text>

  <line class="link" x1="552" y1="210" x2="680" y2="140"/>
  <rect x="640" y="96" width="160" height="64" class="spoke" rx="6"/>
  <text x="720" y="124" class="ink" text-anchor="middle">Video</text>
  <text x="720" y="142" class="muted" text-anchor="middle">frames - tokens</text>

  <line class="link" x1="552" y1="290" x2="680" y2="360"/>
  <rect x="640" y="336" width="160" height="64" class="spoke" rx="6"/>
  <text x="720" y="364" class="ink" text-anchor="middle">Music</text>
  <text x="720" y="382" class="muted" text-anchor="middle">spectrogram tokens</text>

  <line class="link" x1="408" y1="290" x2="280" y2="360"/>
  <rect x="160" y="336" width="160" height="64" class="spoke" rx="6"/>
  <text x="240" y="364" class="ink" text-anchor="middle">ImageBind</text>
  <text x="240" y="382" class="muted" text-anchor="middle">multi-modal bind</text>

  <line class="link" x1="408" y1="210" x2="280" y2="140"/>
  <rect x="160" y="96" width="160" height="64" class="spoke" rx="6"/>
  <text x="240" y="124" class="ink" text-anchor="middle">VL assistants</text>
  <text x="240" y="142" class="muted" text-anchor="middle">LLaVA - GPT-4V</text>

  <text x="40" y="456" class="muted">Public names as history labels - CC0 schematic</text>
</svg>
