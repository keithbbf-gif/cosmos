<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="fig05-title fig05-desc">
  <title id="fig05-title">Fig. 5 - Two publics: API products versus downloadable weights</title>
  <desc id="fig05-desc">Split diagram contrasting gated API and Discord products with open weight checkpoints and local inference. Labels name public examples from 2022; no vendor logos.</desc>
  <defs>
    <style>
      .bg { fill: #0f1419; }
      .cityA { fill: #1f2a38; stroke: #c67878; stroke-width: 1.5; }
      .cityB { fill: #1a2a24; stroke: #3fd68f; stroke-width: 1.5; }
      .ink { fill: #e8eef2; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 600; }
      .muted { fill: #8b9aab; font-family: system-ui, sans-serif; font-size: 11px; }
      .caps { fill: #56b6c2; font-size: 11px; letter-spacing: 0.12em; }
      .gate { fill: #2a3544; stroke: #c67878; }
    </style>
  </defs>
  <rect class="bg" width="960" height="520"/>
  <text x="40" y="36" class="caps">Fig. 05</text>
  <text x="40" y="64" class="ink" font-size="20">Two publics (2022)</text>

  <rect x="48" y="100" width="400" height="340" class="cityA" rx="8"/>
  <text x="72" y="132" class="ink">City A - API / product</text>
  <text x="72" y="156" class="muted">Waitlist - preview - subscription</text>
  <rect x="72" y="180" width="120" height="48" class="gate" rx="4"/>
  <text x="88" y="208" class="muted">server gate</text>
  <text x="220" y="208" class="muted">prompt in ' pixels out</text>
  <text x="72" y="260" class="muted">Examples on the record:</text>
  <text x="72" y="282" class="muted">DALL-E 2 preview - Midjourney Discord</text>
  <text x="72" y="304" class="muted">Imagen (paper / limited access)</text>
  <text x="72" y="340" class="muted">Safety: server-side filters</text>
  <text x="72" y="362" class="muted">Fork model: no - Screenshot: yes</text>

  <rect x="512" y="100" width="400" height="340" class="cityB" rx="8"/>
  <text x="536" y="132" class="ink">City B - weights / checkpoint</text>
  <text x="536" y="156" class="muted">wget - Hugging Face - local GPU</text>
  <rect x="536" y="180" width="160" height="48" class="gate" rx="4" style="stroke:#3fd68f"/>
  <text x="552" y="208" class="muted">.ckpt / .safetensors</text>
  <text x="536" y="260" class="muted">Examples on the record:</text>
  <text x="536" y="282" class="muted">Stable Diffusion - 22 Aug 2022</text>
  <text x="536" y="304" class="muted">OpenCLIP - community merges</text>
  <text x="536" y="340" class="muted">Safety: license + local filters</text>
  <text x="536" y="362" class="muted">Fork model: yes - You are the server</text>

  <text x="240" y="468" class="muted" text-anchor="middle">Same headlines - different civics</text>
  <text x="48" y="500" class="muted">Original schematic - CC0 - no logos</text>
</svg>
