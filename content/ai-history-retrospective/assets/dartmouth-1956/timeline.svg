<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" role="img" aria-labelledby="t d">
  <title id="t">Dartmouth 1956 summer workshop</title>
  <desc id="d">The 1956 Dartmouth summer research project where artificial intelligence was named.</desc>
  <rect width="600" height="220" fill="#f3efe6"/>
  <rect x="28" y="24" width="544" height="172" fill="none" stroke="#6b6358" stroke-width="0.6"/>
  <text x="300" y="52" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#2a241c">DARTMOUTH SUMMER RESEARCH PROJECT</text>
  <text x="300" y="70" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#5c5248">1956</text>
  <rect x="72" y="92" width="456" height="40" fill="#e8dfd0" stroke="#2a241c" stroke-width="0.8"/>
  <text x="300" y="118" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#2a241c">Eight weeks at Dartmouth College</text>
  <text x="300" y="156" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#4a3728">Proposal: McCarthy, Minsky, Rochester, Shannon</text>
  <text x="300" y="174" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#4a3728">Participants included Newell, Simon, and others across the summer</text>
</svg>
