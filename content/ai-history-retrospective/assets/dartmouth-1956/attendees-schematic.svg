<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" role="img" aria-labelledby="t">
 <title id="t">Dartmouth attendee schematic</title>
 <rect width="480" height="260" fill="#f4f0e8"/>
