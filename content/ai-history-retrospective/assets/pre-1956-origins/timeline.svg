<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200" role="img" aria-labelledby="t d">
  <title id="t">Pre-1956 origins timeline</title>
  <desc id="d">Selected milestones before the Dartmouth workshop naming artificial intelligence.</desc>
  <rect width="680" height="200" fill="#f3efe6"/>
  <rect x="24" y="20" width="632" height="160" fill="none" stroke="#6b6358" stroke-width="0.6"/>
  <text x="340" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#2a241c">BEFORE THE DARTMOUTH LABEL</text>
  <line x1="48" y1="100" x2="632" y2="100" stroke="#2a241c" stroke-width="1.5"/>
  <g font-family="Georgia, serif" font-size="10" fill="#2a241c">
    <line x1="100" y1="92" x2="100" y2="108" stroke="#2a241c"/>
    <text x="100" y="128" text-anchor="middle">1936</text>
    <text x="100" y="142" text-anchor="middle" font-size="8" fill="#6b6358">Turing machine</text>
    <line x1="200" y1="92" x2="200" y2="108" stroke="#2a241c"/>
    <text x="200" y="128" text-anchor="middle">1943</text>
    <text x="200" y="142" text-anchor="middle" font-size="8" fill="#6b6358">McCulloch-Pitts</text>
    <line x1="320" y1="92" x2="320" y2="108" stroke="#2a241c"/>
    <text x="320" y="128" text-anchor="middle">1948</text>
    <text x="320" y="142" text-anchor="middle" font-size="8" fill="#6b6358">Cybernetics</text>
    <line x1="440" y1="92" x2="440" y2="108" stroke="#2a241c"/>
    <text x="440" y="128" text-anchor="middle">1950</text>
    <text x="440" y="142" text-anchor="middle" font-size="8" fill="#6b6358">Turing test paper</text>
    <line x1="560" y1="92" x2="560" y2="108" stroke="#2a241c"/>
    <text x="560" y="128" text-anchor="middle">1951</text>
    <text x="560" y="142" text-anchor="middle" font-size="8" fill="#6b6358">Early learning machines</text>
  </g>
  <text x="340" y="178" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#8a8074">Detail figure; see series era map G-ERA-001 for full span.</text>
</svg>
