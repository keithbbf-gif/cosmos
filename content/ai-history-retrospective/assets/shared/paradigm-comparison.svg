<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t d">
 <title id="t">Paradigm comparison - symbolic, connectionist, statistical, foundation models</title>
 <desc id="d">Four-column historical framing of dominant AI paradigms.</desc>
 <rect width="720" height="320" fill="#f4f0e8"/>
 <text x="360" y="32" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#2a241c">Paradigms in historical sequence</text>
 <g font-family="Georgia, serif">
 <rect x="32" y="52" width="152" height="240" fill="#ebe4d6" stroke="#6b6358"/>
 <text x="108" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a241c">Symbolic</text>
 <text x="108" y="98" text-anchor="middle" font-size="10" fill="#4a3728">1950s-1980s peak</text>
 <text x="44" y="125" font-size="10" fill="#2a241c"> &#183; Logic &amp; rules</text>
 <text x="44" y="145" font-size="10" fill="#2a241c"> &#183; Expert systems</text>
 <text x="44" y="165" font-size="10" fill="#2a241c"> &#183; Search &amp; planning</text>
 <rect x="200" y="52" width="152" height="240" fill="#e5ddd0" stroke="#6b6358"/>
 <text x="276" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a241c">Connectionist</text>
 <text x="276" y="98" text-anchor="middle" font-size="10" fill="#4a3728">1940s-; revivals</text>
 <text x="212" y="125" font-size="10" fill="#2a241c"> &#183; Neural nets</text>
 <text x="212" y="145" font-size="10" fill="#2a241c"> &#183; Parallel distributed</text>
 <text x="212" y="165" font-size="10" fill="#2a241c"> &#183; Learning by weight change</text>
 <rect x="368" y="52" width="152" height="240" fill="#ebe4d6" stroke="#6b6358"/>
 <text x="444" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a241c">Statistical</text>
 <text x="444" y="98" text-anchor="middle" font-size="10" fill="#4a3728">1990s-2010s</text>
 <text x="380" y="125" font-size="10" fill="#2a241c"> &#183; Data + features</text>
 <text x="380" y="145" font-size="10" fill="#2a241c"> &#183; SVM, boosting, HMM</text>
 <text x="380" y="165" font-size="10" fill="#2a241c"> &#183; NLP before deep shift</text>
 <rect x="536" y="52" width="152" height="240" fill="#e0d6c8" stroke="#6b6358"/>
 <text x="612" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a241c">Foundation</text>
 <text x="612" y="98" text-anchor="middle" font-size="10" fill="#4a3728">~2018-present</text>
 <text x="548" y="125" font-size="10" fill="#2a241c"> &#183; Large pre-trained</text>
 <text x="548" y="145" font-size="10" fill="#2a241c"> &#183; Scale + compute</text>
 <text x="548" y="165" font-size="10" fill="#2a241c"> &#183; General-purpose APIs</text>
 </g>
 <line x1="184" y1="170" x2="536" y2="170" stroke="#6b6358" stroke-width="0.8" stroke-dasharray="6 4" opacity="0.5"/>
 <text x="360" y="305" text-anchor="middle" font-size="9" fill="#8a8074">Overlaps are real; columns emphasize dominant research fashion per era.</text>
</svg>
