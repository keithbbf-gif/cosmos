<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="t d">
  <title id="t">Paradigm comparison chart</title>
  <desc id="d">Four paradigms in historical sequence: symbolic, connectionist, statistical, foundation models.</desc>
  <rect width="760" height="340" fill="#f3efe6"/>
  <rect x="32" y="28" width="696" height="284" fill="none" stroke="#6b6358" stroke-width="0.75"/>
  <text x="380" y="56" text-anchor="middle" font-family="Georgia, serif" font-size="16" letter-spacing="0.03em" fill="#2a241c">RESEARCH PARADIGMS</text>
  <text x="380" y="74" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#5c5248">dominant fashion by era (simplified)</text>
  <g font-family="Georgia, serif">
    <rect x="48" y="92" width="158" height="200" fill="#ebe4d6" stroke="#6b6358" stroke-width="0.8"/>
    <text x="127" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a241c">Symbolic</text>
    <text x="127" y="136" text-anchor="middle" font-size="9" fill="#5c5248">1950s-1980s peak</text>
    <text x="60" y="162" font-size="10" fill="#2a241c">Logic and rules</text>
    <text x="60" y="180" font-size="10" fill="#2a241c">Expert systems</text>
    <text x="60" y="198" font-size="10" fill="#2a241c">Search, planning</text>
    <rect x="218" y="92" width="158" height="200" fill="#e3dbd0" stroke="#6b6358" stroke-width="0.8"/>
    <text x="297" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a241c">Connectionist</text>
    <text x="297" y="136" text-anchor="middle" font-size="9" fill="#5c5248">recurring revivals</text>
    <text x="230" y="162" font-size="10" fill="#2a241c">Neural networks</text>
    <text x="230" y="180" font-size="10" fill="#2a241c">Distributed reps</text>
    <text x="230" y="198" font-size="10" fill="#2a241c">Learning weights</text>
    <rect x="388" y="92" width="158" height="200" fill="#ebe4d6" stroke="#6b6358" stroke-width="0.8"/>
    <text x="467" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a241c">Statistical</text>
    <text x="467" y="136" text-anchor="middle" font-size="9" fill="#5c5248">1990s-2010s</text>
    <text x="400" y="162" font-size="10" fill="#2a241c">Data-driven features</text>
    <text x="400" y="180" font-size="10" fill="#2a241c">SVM, boosting</text>
    <text x="400" y="198" font-size="10" fill="#2a241c">Probabilistic NLP</text>
    <rect x="558" y="92" width="158" height="200" fill="#e0d6c8" stroke="#6b6358" stroke-width="0.8"/>
    <text x="637" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a241c">Foundation</text>
    <text x="637" y="136" text-anchor="middle" font-size="9" fill="#5c5248">2018 onward</text>
    <text x="570" y="162" font-size="10" fill="#2a241c">Large pre-training</text>
    <text x="570" y="180" font-size="10" fill="#2a241c">Scale and compute</text>
    <text x="570" y="198" font-size="10" fill="#2a241c">General APIs</text>
  </g>
  <text x="380" y="318" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#8a8074">Paradigms coexist; columns mark emphasis, not exclusivity. | G-PAR-001</text>
</svg>
