<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="t d">
 <title id="t">AI winter and summer schematic</title>
 <desc id="d">Stylized funding and attention curve with labeled winter and summer periods.</desc>
 <rect width="640" height="280" fill="#f4f0e8"/>
 <text x="320" y="30" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#2a241c">Funding &amp; attention (schematic)</text>
 <path d="M 56 200 C 120 180, 140 120, 200 140 S 280 200, 320 160 S 400 80, 480 100 S 560 60, 584 90" fill="none" stroke="#2a241c" stroke-width="2"/>
 <rect x="230" y="48" width="100" height="200" fill="#c9bfb0" opacity="0.35"/>
 <text x="280" y="70" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#4a3728">Winter I</text>
 <text x="280" y="86" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#6b6358">~1974-1980</text>
 <rect x="350" y="48" width="70" height="200" fill="#c9bfb0" opacity="0.25"/>
 <text x="385" y="70" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#4a3728">Winter II</text>
 <text x="385" y="86" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#6b6358">~1987-1993</text>
 <rect x="470" y="48" width="110" height="200" fill="#e8dfd0" opacity="0.5"/>
 <text x="525" y="70" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#4a3728">Summer</text>
 <text x="525" y="86" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#6b6358">DL + LLM wave</text>
 <line x1="48" y1="220" x2="592" y2="220" stroke="#6b6358" stroke-width="1"/>
 <text x="56" y="238" font-family="Georgia, serif" font-size="10" fill="#6b6358">1960</text>
 <text x="300" y="238" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#6b6358">1990</text>
 <text x="584" y="238" text-anchor="end" font-family="Georgia, serif" font-size="10" fill="#6b6358">2026</text>
 <text x="320" y="262" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#8a8074">Not to scale &#183; illustrative only</text>
</svg>
