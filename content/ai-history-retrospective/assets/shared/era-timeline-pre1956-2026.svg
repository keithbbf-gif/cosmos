<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="t d">
  <title id="t">AI history era timeline, pre-1956 through 2026</title>
  <desc id="d">Archival horizontal era map for the retrospective series. Illustrative period bands, not a quantitative chart.</desc>
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.93 0 0 0 0 0.9 0 0 0 0 0.85 0 0 0 0.05 0"/>
      <feBlend in="SourceGraphic" in2="n" mode="multiply"/>
    </filter>
  </defs>
  <rect width="960" height="280" fill="#f3efe6" filter="url(#grain)"/>
  <rect x="40" y="28" width="880" height="224" fill="none" stroke="#6b6358" stroke-width="0.75"/>
  <text x="480" y="58" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" letter-spacing="0.04em" fill="#2a241c">ERAS OF ARTIFICIAL INTELLIGENCE</text>
  <text x="480" y="78" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#5c5248">pre-1956 to 2026 (retrospective index)</text>
  <line x1="72" y1="88" x2="888" y2="88" stroke="#6b6358" stroke-width="0.5"/>
  <line x1="72" y1="148" x2="888" y2="148" stroke="#2a241c" stroke-width="1.75"/>
  <g font-family="Georgia, serif" font-size="10" fill="#4a3728">
    <line x1="120" y1="140" x2="120" y2="156" stroke="#2a241c" stroke-width="1.2"/>
    <text x="120" y="172" text-anchor="middle">1943</text>
    <text x="120" y="186" text-anchor="middle" font-size="8" fill="#6b6358">McCulloch-Pitts</text>
    <line x1="200" y1="140" x2="200" y2="156" stroke="#2a241c" stroke-width="1.2"/>
    <text x="200" y="172" text-anchor="middle">1956</text>
    <text x="200" y="186" text-anchor="middle" font-size="8" fill="#6b6358">Dartmouth</text>
    <line x1="320" y1="140" x2="320" y2="156" stroke="#6b6358"/>
    <text x="320" y="172" text-anchor="middle">1974</text>
    <line x1="440" y1="140" x2="440" y2="156" stroke="#6b6358"/>
    <text x="440" y="172" text-anchor="middle">1987</text>
    <line x1="560" y1="140" x2="560" y2="156" stroke="#6b6358"/>
    <text x="560" y="172" text-anchor="middle">1997</text>
    <line x1="680" y1="140" x2="680" y2="156" stroke="#2a241c" stroke-width="1.2"/>
    <text x="680" y="172" text-anchor="middle">2012</text>
    <text x="680" y="186" text-anchor="middle" font-size="8" fill="#6b6358">ImageNet shift</text>
    <line x1="780" y1="140" x2="780" y2="156" stroke="#2a241c" stroke-width="1.2"/>
    <text x="780" y="172" text-anchor="middle">2017</text>
    <text x="780" y="186" text-anchor="middle" font-size="8" fill="#6b6358">Transformers</text>
    <line x1="860" y1="140" x2="860" y2="156" stroke="#6b6358"/>
    <text x="860" y="172" text-anchor="middle">2026</text>
  </g>
  <g font-family="Georgia, serif" font-size="10" fill="#2a241c">
    <rect x="88" y="108" width="100" height="20" fill="#e9e0d2" stroke="#6b6358" stroke-width="0.6"/>
    <text x="138" y="122" text-anchor="middle">Cybernetics</text>
    <rect x="168" y="108" width="148" height="20" fill="#e2d9cb" stroke="#6b6358" stroke-width="0.6"/>
    <text x="242" y="122" text-anchor="middle">Symbolic AI</text>
    <rect x="308" y="108" width="108" height="20" fill="#d9d0c2" stroke="#6b6358" stroke-width="0.6"/>
    <text x="362" y="122" text-anchor="middle">Expert systems</text>
    <rect x="412" y="108" width="72" height="20" fill="#cfc6b8" stroke="#6b6358" stroke-width="0.6"/>
    <text x="448" y="122" text-anchor="middle">Winter I</text>
    <rect x="480" y="108" width="128" height="20" fill="#e2d9cb" stroke="#6b6358" stroke-width="0.6"/>
    <text x="544" y="122" text-anchor="middle">Statistical ML</text>
    <rect x="600" y="108" width="120" height="20" fill="#ddd4c6" stroke="#6b6358" stroke-width="0.6"/>
    <text x="660" y="122" text-anchor="middle">Deep learning</text>
    <rect x="716" y="108" width="156" height="20" fill="#e8dfd0" stroke="#6b6358" stroke-width="0.6"/>
    <text x="794" y="122" text-anchor="middle" font-size="9">Foundation models</text>
  </g>
  <text x="480" y="218" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#6b6358">Bands overlap in practice; use as a reading guide, not a census of all research.</text>
  <text x="480" y="238" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#8a8074">Long Term History of AI (Retrospective) | archival figure G-ERA-001</text>
</svg>
