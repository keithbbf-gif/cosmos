<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img">
  <title>Material survival bias in garden history</title>
  <desc>Stone and bronze surviving while wood evidence is lost.</desc>
  <rect width="880" height="520" fill="#f8fafb"/>

  <rect x="120" y="180" width="100" height="160" fill="#d1d5db" stroke="#1f2933"/>
    <text x="170" y="360" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#1f2933">marble</text>
  <rect x="280" y="220" width="80" height="120" fill="#64748b" stroke="#1f2933"/>
    <text x="320" y="360" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#1f2933">bronze</text>
  <rect x="420" y="260" width="120" height="80" fill="#d4a574" stroke="#1f2933" stroke-dasharray="6 4" opacity="0.5"/>
    <text x="480" y="360" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#1f2933">wood (lost)</text>
    <text x="440" y="80" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#1f2933">Museum bias toward what weather spared</text>

</svg>
