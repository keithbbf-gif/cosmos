<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img">
  <title>White oak versus red oak outdoors</title>
  <desc>Tyloses in white oak heartwood schematic.</desc>
  <rect width="880" height="520" fill="#f8fafb"/>

  <rect x="200" y="200" width="200" height="140" fill="#d4a574" stroke="#1f2933"/>
    <text x="300" y="360" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#1f2933">white oak (tyloses)</text>
  <rect x="480" y="200" width="200" height="140" fill="#d4a574" stroke="#1f2933" opacity="0.6"/>
  <path d="M500,240 L660,280" stroke="#3b82f6" stroke-width="2"/>
    <text x="580" y="360" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#1f2933">red oak (open)</text>
    <text x="440" y="90" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#1f2933">DINING OAK ≠ PATIO OAK</text>

</svg>
