<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img">
  <title>Teak oil and silica in wood</title>
  <desc>Cross-section callouts for natural oil and silica.</desc>
  <rect width="880" height="520" fill="#f8fafb"/>

  <rect x="300" y="160" width="280" height="200" fill="#d4a574" stroke="#1f2933"/>
  <line x1="300" y1="200" x2="580" y2="240" stroke="#52606d" stroke-width="1"/>
  <line x1="300" y1="260" x2="580" y2="300" stroke="#52606d" stroke-width="1"/>
    <text x="440" y="120" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#1f2933">TEAK — OIL + SILICA, NOT A CAN COLOR</text>
    <text x="440" y="400" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#52606d">Silvering = sun on the surface</text>

</svg>
