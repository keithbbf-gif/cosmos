  <rect width="880" height="520" fill="#f8fafb"/>

  <rect x="280" y="200" width="320" height="200" fill="#cbd5e1" stroke="#1f2933"/>
  <circle cx="600" cy="160" r="40" fill="#b45309" opacity="0.4"/>
