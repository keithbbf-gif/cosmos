<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img">
  <title>Porch patio and open lawn climates</title>
  <desc>Three outdoor sitting assignments with different roof and splash exposure.</desc>
  <rect width="880" height="520" fill="#f8fafb"/>

    <text x="160" y="50" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#1f2933">PORCH (roof)</text>
  <polygon points="80,120 240,120 260,200 60,200" fill="#e2e8f0" stroke="#1f2933"/>
  <rect x="100" y="200" width="120" height="8" fill="#d4a574" stroke="#1f2933"/>
    <text x="440" y="50" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#1f2933">PATIO (slab)</text>
  <rect x="360" y="200" width="160" height="12" fill="#cbd5e1" stroke="#1f2933"/>
  <rect x="400" y="170" width="80" height="6" fill="#64748b" stroke="#1f2933"/>
    <text x="720" y="50" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#1f2933">LAWN (open sky)</text>
  <ellipse cx="720" cy="220" rx="100" ry="40" fill="#4d7c57" opacity="0.35"/>
  <rect x="680" y="200" width="80" height="8" fill="#d4a574" stroke="#1f2933"/>
    <text x="440" y="400" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#52606d">One word — outdoor — hides three specifications</text>

</svg>
