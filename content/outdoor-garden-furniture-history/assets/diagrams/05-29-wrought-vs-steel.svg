<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img">
  <title>Wrought iron name on mild steel</title>
  <desc>Scroll form with material label correction.</desc>
  <rect width="880" height="520" fill="#f8fafb"/>

  <path d="M300,320 Q340,200 400,280 Q460,360 520,240" fill="none" stroke="#64748b" stroke-width="4"/>
    <text x="300" y="360" text-anchor="start" font-family="system-ui,sans-serif" font-size="10" fill="#1f2933">scroll (same)</text>
    <text x="620" y="280" text-anchor="start" font-family="system-ui,sans-serif" font-size="10" fill="#1f2933">historic wrought</text>
    <text x="620" y="320" text-anchor="start" font-family="system-ui,sans-serif" font-size="10" fill="#1f2933">modern mild steel</text>
    <text x="440" y="80" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1f2933">GRANDMOTHER'S NAME ON A COUSIN</text>

</svg>
