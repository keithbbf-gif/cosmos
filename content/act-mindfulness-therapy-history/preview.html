<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>ACT / mindfulness history — graphics preview (local)</title>
  <style>
    body { font-family: Georgia, serif; max-width: 920px; margin: 2rem auto; padding: 0 1rem; background: #faf8f4; color: #1c1a17; }
    figure { margin: 2rem 0; }
    img { max-width: 100%; height: auto; border: 1px solid #c4b8a8; }
    figcaption { font-size: 0.9rem; color: #5c564c; margin-top: 0.5rem; }
    .figure-credit { display: block; margin-top: 0.35rem; font-size: 0.85rem; }
    h1 { font-size: 1.5rem; }
  </style>
</head>
<body>
  <h1>Graphics preview — draft pack only</h1>
  <p>Not for production. Validates SVG rendering and figure captions.</p>
  <figure class="wow-act-figure wow-act-figure--timeline">
    <img src="graphics/fig-01-document-milestones.svg" alt="Document milestones timeline" width="1200" height="520"/>
    <figcaption><strong>Fig. 1</strong> — Document milestones <span class="figure-credit">WOW Therapies educational series</span></figcaption>
  </figure>
  <figure class="wow-act-figure wow-act-figure--map">
    <img src="graphics/fig-02-clinic-places-map.svg" alt="Clinic places map" width="1200" height="560"/>
    <figcaption><strong>Fig. 2</strong> — Clinic places map</figcaption>
  </figure>
  <figure class="wow-act-figure wow-act-figure--timeline">
    <img src="graphics/fig-03-act-naming-dates.svg" alt="ACT naming dates" width="1200" height="480"/>
    <figcaption><strong>Fig. 3</strong> — ACT naming sequence</figcaption>
  </figure>
  <figure class="wow-act-figure wow-act-figure--type">
    <img src="assets/_shared/series-featured.svg" alt="Series featured template" width="1200" height="630"/>
    <figcaption>Default featured image (type plate)</figcaption>
  </figure>
</body>
</html>
