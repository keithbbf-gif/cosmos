<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" role="img" aria-labelledby="title desc">
  <title id="title">The caprifig year</title>
  <desc id="desc">Mamme, profichi, mammoni cycle after Eisen and Condit. California timing labeled as California.</desc>
  <rect width="840" height="360" fill="#f4efe4"/>
  <text x="24" y="34" font-family="Georgia, serif" font-size="20" fill="#2c2416">Three crops that keep one wasp</text>
  <text x="24" y="56" font-family="Georgia, serif" font-size="12" fill="#6a5b45">Italian names, California months (Condit) · articles 40, 51</text>
  <path d="M80,200 C200,80 400,80 520,200 C640,80 760,140 780,200" fill="none" stroke="#8b3a2a" stroke-width="2"/>
  <g font-family="Georgia, serif" text-anchor="middle" fill="#2c2416">
    <circle cx="160" cy="170" r="48" fill="#e0d3b8" stroke="#8a7349"/>
    <text x="160" y="166" font-size="14">mamme</text>
    <text x="160" y="184" font-size="11">winter ’ April</text>
    <circle cx="420" cy="150" r="56" fill="#e8c48a" stroke="#8b3a2a"/>
    <text x="420" y="142" font-size="14">profichi</text>
    <text x="420" y="160" font-size="11">spring · June</text>
    <text x="420" y="176" font-size="11">pollen + hung</text>
    <circle cx="700" cy="180" r="48" fill="#c5d4c8" stroke="#4a6b52"/>
    <text x="700" y="176" font-size="14">mammoni</text>
    <text x="700" y="194" font-size="11">late summer</text>
  </g>
  <text x="24" y="330" font-family="Georgia, serif" font-size="11" fill="#6a5b45">Schwarz (1900): mamme are late mammoni that overwinter because they are inhabited. Timing is California; the names are older.</text>
</svg>
