<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="title desc">
  <title id="title">Two Egyptian figs</title>
  <desc id="desc">Field-mark comparison of Ficus carica and Ficus sycomorus. Schematic leaves and fruit, not a flora plate.</desc>
  <rect width="800" height="380" fill="#f4efe4"/>
  <text x="24" y="34" font-family="Georgia, serif" font-size="20" fill="#2c2416">Egypt grew two figs</text>
  <text x="24" y="56" font-family="Georgia, serif" font-size="12" fill="#6a5b45">Do not read every tomb fig as Ficus carica · article 03</text>
  <g font-family="Georgia, serif" fill="#2c2416">
    <rect x="40" y="80" width="340" height="250" fill="#e8c48a" stroke="#8b3a2a"/>
    <text x="60" y="110" font-size="16">Ficus carica</text>
    <text x="60" y="130" font-size="13">common / true fig</text>
    <text x="60" y="170" font-size="13">Palmate, usually 35 lobes,</text>
    <text x="60" y="190" font-size="13">scabrous leaf. Pear-shaped</text>
    <text x="60" y="210" font-size="13">syconium. Sweeter fruit.</text>
    <text x="60" y="240" font-size="13">Offering lists from the Old</text>
    <text x="60" y="260" font-size="13">Kingdom on (Gad 2020).</text>
    <text x="60" y="290" font-size="13">Wasp: Blastophaga psenes</text>
    <text x="60" y="310" font-size="13">(when pollinated at all).</text>
    <rect x="420" y="80" width="340" height="250" fill="#d7c4a3" stroke="#8a7349"/>
    <text x="440" y="110" font-size="16">Ficus sycomorus</text>
    <text x="440" y="130" font-size="13">sycomore / sycamore-fig</text>
    <text x="440" y="170" font-size="13">Rounder, less-lobed leaf.</text>
    <text x="440" y="190" font-size="13">Wood, shade, Hathor/Nut.</text>
    <text x="440" y="210" font-size="13">Fruit often gashed to ripen.</text>
    <text x="440" y="240" font-size="13">Tomb offerings; garden pools.</text>
    <text x="440" y="260" font-size="13">Amoss dresser of sycomores.</text>
    <text x="440" y="290" font-size="13">Wasp: Ceratosolen arabicus</text>
    <text x="440" y="310" font-size="13">(lost in Egypt; Galil).</text>
  </g>
</svg>
