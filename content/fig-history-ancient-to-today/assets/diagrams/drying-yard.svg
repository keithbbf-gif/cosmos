<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="title desc">
  <title id="title">Historical drying methods, labeled as methods not a manual</title>
  <desc id="desc">Sun trays, Kymi doubling, Lerida pull, sulfur house. Teaching graphic.</desc>
  <rect width="900" height="400" fill="#f4efe4"/>
  <text x="24" y="32" font-family="Georgia, serif" font-size="20" fill="#2c2416">How a wet fruit became a crate good</text>
  <text x="24" y="54" font-family="Georgia, serif" font-size="12" fill="#6a5b45">Historical methods · article 50 · not a processors SOP</text>
  <g font-family="Georgia, serif" font-size="13" fill="#2c2416">
    <rect x="24" y="80" width="200" height="240" fill="#e8c48a" stroke="#8b3a2a"/>
    <text x="40" y="110" font-size="15">Sun trays</text>
    <text x="40" y="140">Fruit falls or is picked</text>
    <text x="40" y="158">near-dry. Laid on</text>
    <text x="40" y="176">cane / wood / rock.</text>
    <text x="40" y="210">Ayd1n, Fars, Cilento</text>
    <text x="40" y="228">still live by weather.</text>
    <rect x="240" y="80" width="200" height="240" fill="#e0d3b8" stroke="#8a7349"/>
    <text x="256" y="110" font-size="15">Askada / doubled</text>
    <text x="256" y="140">Kymi: split, opened,</text>
    <text x="256" y="158">two halves pressed</text>
    <text x="256" y="176">inner face to inner</text>
    <text x="256" y="194">face. PDO specifies.</text>
    <rect x="456" y="80" width="200" height="240" fill="#d7c4a3" stroke="#8a7349"/>
    <text x="472" y="110" font-size="15">Lerida / pulled</text>
    <text x="472" y="140">Trade styles from</text>
    <text x="472" y="158">the packing house:</text>
    <text x="472" y="176">flattened, pulled,</text>
    <text x="472" y="194">layered, garlanded.</text>
    <text x="472" y="226">Names traveled with</text>
    <text x="472" y="244">the box, not the tree.</text>
    <rect x="672" y="80" width="200" height="240" fill="#c5d4c8" stroke="#4a6b52"/>
    <text x="688" y="110" font-size="15">Sulfur house</text>
    <text x="688" y="140">19th20th c. bleach</text>
    <text x="688" y="158">and insect kill for</text>
    <text x="688" y="176">the pale pack.</text>
    <text x="688" y="210">A method with a</text>
    <text x="688" y="228">date, not a virtue.</text>
  </g>
</svg>
