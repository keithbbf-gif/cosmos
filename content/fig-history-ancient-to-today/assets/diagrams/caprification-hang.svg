<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="title desc">
  <title id="title">Caprification as a hanging of profichi</title>
  <desc id="desc">Teaching sketch of profichi hung in a Smyrna tree. Not a pest-control guide.</desc>
  <rect width="720" height="340" fill="#f4efe4"/>
  <text x="24" y="32" font-family="Georgia, serif" font-size="20" fill="#2c2416">A bag of male fruit, hung on purpose</text>
  <text x="24" y="54" font-family="Georgia, serif" font-size="12" fill="#6a5b45">Caprification · schematic · articles 40, 51, 54</text>
  <path d="M120,300 L200,80 L280,300" fill="none" stroke="#8a7349" stroke-width="8"/>
  <path d="M200,120 C80,140 70,200 90,240" fill="none" stroke="#4a6b52" stroke-width="3"/>
  <path d="M200,130 C320,110 360,180 340,230" fill="none" stroke="#4a6b52" stroke-width="3"/>
  <ellipse cx="160" cy="200" rx="14" ry="18" fill="#c5d4c8" stroke="#4a6b52"/>
  <ellipse cx="300" cy="190" rx="14" ry="18" fill="#c5d4c8" stroke="#4a6b52"/>
  <text x="400" y="140" font-family="Georgia, serif" font-size="14" fill="#2c2416">Profichi (pollen + wasps)</text>
  <text x="400" y="160" font-family="Georgia, serif" font-size="13" fill="#6a5b45">cut from the caprifig,</text>
  <text x="400" y="178" font-family="Georgia, serif" font-size="13" fill="#6a5b45">strung or bagged, hung</text>
  <text x="400" y="196" font-family="Georgia, serif" font-size="13" fill="#6a5b45">in the Smyrna canopy</text>
  <text x="400" y="214" font-family="Georgia, serif" font-size="13" fill="#6a5b45">when the female crop is</text>
  <text x="400" y="232" font-family="Georgia, serif" font-size="13" fill="#6a5b45">receptive. Theophrastus</text>
  <text x="400" y="250" font-family="Georgia, serif" font-size="13" fill="#6a5b45">already watched the swell.</text>
  <text x="24" y="320" font-family="Georgia, serif" font-size="11" fill="#6a5b45">Endosepsis travels with the same insect (Caldis / Hansen). This drawing is history, not advice.</text>
</svg>
