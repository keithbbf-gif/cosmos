<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc">
  <title id="title">California sequence 17691955</title>
  <desc id="desc">Dated California industry nodes from Eisen, Schwarz, Condit, UC ANR.</desc>
  <rect width="1000" height="260" fill="#f4efe4"/>
  <text x="24" y="30" font-family="Georgia, serif" font-size="18" fill="#2c2416">California  the wasp was the missing crate</text>
  <line x1="40" y1="130" x2="960" y2="130" stroke="#8a7349" stroke-width="2"/>
  <g font-family="Georgia, serif" font-size="10" fill="#2c2416" text-anchor="middle">
    <line x1="80" y1="130" x2="80" y2="100" stroke="#8b3a2a"/><text x="80" y="90">1769</text><text x="80" y="160">San Diego</text><text x="80" y="174">Mission fig</text>
    <line x1="250" y1="130" x2="250" y2="100" stroke="#8b3a2a"/><text x="250" y="90">188182</text><text x="250" y="160">Smyrna cuttings</text><text x="250" y="174">trees, no crop</text>
    <line x1="420" y1="130" x2="420" y2="100" stroke="#8b3a2a"/><text x="420" y="90">1889</text><text x="420" y="160">Adriatic dried</text><text x="420" y="174">eastbound</text>
    <line x1="590" y1="130" x2="590" y2="100" stroke="#8b3a2a"/><text x="590" y="90">18991900</text><text x="590" y="160">Blastophaga</text><text x="590" y="174">Roeding crop</text>
    <line x1="760" y1="130" x2="760" y2="100" stroke="#8b3a2a"/><text x="760" y="90">1901</text><text x="760" y="160">Eisen USDA</text><text x="760" y="174">bulletin</text>
    <line x1="900" y1="130" x2="900" y2="100" stroke="#8b3a2a"/><text x="900" y="90">1947 / 55</text><text x="900" y="160">Condit</text><text x="900" y="174">book / monograph</text>
  </g>
  <text x="24" y="230" font-family="Georgia, serif" font-size="11" fill="#6a5b45">UC ANR: commercial culture 1885; wasp established through Roeding, Howard, Swingle. Gasparrinis denial of caprification misled growers (Condit).</text>
</svg>
