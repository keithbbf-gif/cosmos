<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" role="img" aria-labelledby="title desc">
  <title id="title">California fig: mission corridor and San Joaquin drying belt</title>
  <desc id="desc">Schematic coast missions vs. Fresno / Merced / Tulare interior industry.</desc>
  <rect width="640" height="720" fill="#f4efe4"/>
  <text x="24" y="36" font-family="Georgia, serif" font-size="20" fill="#2c2416">Two Californias of the fig</text>
  <text x="24" y="58" font-family="Georgia, serif" font-size="12" fill="#6a5b45">Schematic · articles 35, 38, 54</text>
  <path d="M80,80 C70,200 90,360 70,520 C90,600 140,660 160,700" fill="none" stroke="#c5d4c8" stroke-width="28"/>
  <text x="24" y="380" font-family="Georgia, serif" font-size="12" fill="#3d5348" transform="rotate(-90 24 380)">Pacific</text>
  <g font-family="Georgia, serif" font-size="12" fill="#2c2416">
    <circle cx="150" cy="620" r="6" fill="#8b3a2a"/>
    <text x="164" y="624">San Diego (1769)</text>
    <circle cx="130" cy="500" r="5" fill="#8b3a2a"/>
    <text x="144" y="504">San Buenaventura / LA basin</text>
    <circle cx="120" cy="280" r="5" fill="#8b3a2a"/>
    <text x="134" y="284">San Francisco / Bay</text>
    <text x="134" y="300" fill="#6a5b45" font-size="11">Mission cuttings · common figs</text>
  </g>
  <rect x="280" y="220" width="220" height="280" rx="8" fill="#e0d3b8" stroke="#8a7349"/>
  <text x="300" y="248" font-family="Georgia, serif" font-size="14" fill="#2c2416">San Joaquin belt</text>
  <text x="300" y="268" font-family="Georgia, serif" font-size="11" fill="#6a5b45">Adriatic 1880s · Calimyrna after 1900</text>
  <circle cx="390" cy="360" r="7" fill="#2c2416"/>
  <text x="404" y="356" font-family="Georgia, serif" font-size="14">Fresno</text>
  <text x="404" y="374" font-family="Georgia, serif" font-size="11" fill="#6a5b45">Roeding orchard · wasp 18991900</text>
  <circle cx="400" cy="300" r="4" fill="#4a6b52"/>
  <text x="412" y="304" font-family="Georgia, serif" font-size="12">Merced</text>
  <circle cx="410" cy="420" r="4" fill="#4a6b52"/>
  <text x="422" y="424" font-family="Georgia, serif" font-size="12">Tulare</text>
  <text x="24" y="690" font-family="Georgia, serif" font-size="11" fill="#6a5b45">Coast = Spanish common figs (Mission). Interior = drying industry that needed a wasp.</text>
</svg>
