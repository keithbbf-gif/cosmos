<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" role="img" aria-labelledby="title desc">
  <title id="title">Schematic movement of Ficus carica into the Iberian Americas</title>
  <desc id="desc">Not a voyage map. Nodes: Iberia, Caribbean/Mexico, Andes, Alta California. Dates from Morton/Condit tradition, labeled as such.</desc>
  <rect width="860" height="420" fill="#f4efe4"/>
  <text x="24" y="34" font-family="Georgia, serif" font-size="20" fill="#2c2416">A cutting crosses the Atlantic</text>
  <text x="24" y="56" font-family="Georgia, serif" font-size="12" fill="#6a5b45">Schematic · articles 3435 · dates as compiled, not a logbook</text>
  <circle cx="80" cy="180" r="10" fill="#8b3a2a"/>
  <text x="100" y="176" font-family="Georgia, serif" font-size="14">Iberia</text>
  <text x="100" y="194" font-family="Georgia, serif" font-size="11" fill="#6a5b45">Andalusi + later orchards</text>
  <path d="M90,200 C200,260 280,200 360,220" fill="none" stroke="#8b3a2a" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="380" cy="230" r="8" fill="#8b3a2a"/>
  <text x="396" y="226" font-family="Georgia, serif" font-size="14">Hispaniola / Mexico</text>
  <text x="396" y="244" font-family="Georgia, serif" font-size="11" fill="#6a5b45">Morton: 1560s Spanish plantings</text>
  <path d="M390,250 C430,300 470,320 520,300" fill="none" stroke="#8a7349" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="540" cy="290" r="7" fill="#4a6b52"/>
  <text x="556" y="286" font-family="Georgia, serif" font-size="14">Peru / Chile</text>
  <text x="556" y="304" font-family="Georgia, serif" font-size="11" fill="#6a5b45">coastal valleys, later republics</text>
  <path d="M390,210 C480,120 560,100 640,130" fill="none" stroke="#8b3a2a" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="660" cy="140" r="8" fill="#2c2416"/>
  <text x="676" y="136" font-family="Georgia, serif" font-size="14">Alta California</text>
  <text x="676" y="154" font-family="Georgia, serif" font-size="11" fill="#6a5b45">San Diego 1769 · Mission</text>
  <text x="24" y="390" font-family="Georgia, serif" font-size="11" fill="#6a5b45">Portuguese Atlantic islands are a separate story (article 27). Do not draw one arrow and call it the Spanish fig.</text>
</svg>
