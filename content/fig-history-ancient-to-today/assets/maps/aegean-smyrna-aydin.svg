<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Smyrna port and Ayd1n growing country</title>
  <desc id="desc">Schematic: 0zmir (Smyrna) on the gulf; inland Ayd1n / Büyük Menderes / Küçük Menderes. Trade name vs. orchard country.</desc>
  <rect width="800" height="520" fill="#f4efe4"/>
  <text x="28" y="36" font-family="Georgia, serif" font-size="20" fill="#2c2416">The name on the crate was the port</text>
  <text x="28" y="58" font-family="Georgia, serif" font-size="12" fill="#6a5b45">Smyrna / 0zmir vs. Ayd1n · schematic · articles 2223</text>
  <ellipse cx="160" cy="220" rx="90" ry="70" fill="#c5d4c8"/>
  <text x="120" y="224" font-family="Georgia, serif" font-size="12" fill="#3d5348">Gulf of 0zmir</text>
  <circle cx="230" cy="210" r="7" fill="#8b3a2a"/>
  <text x="244" y="206" font-family="Georgia, serif" font-size="15">Smyrna (0zmir)</text>
  <text x="244" y="224" font-family="Georgia, serif" font-size="11" fill="#6a5b45">export quay, not the orchard</text>
  <path d="M260,250 C360,280 420,300 520,310" fill="none" stroke="#8a7349" stroke-width="10" opacity="0.35"/>
  <text x="360" y="298" font-family="Georgia, serif" font-size="11" fill="#6a5b45">Büyük Menderes</text>
  <path d="M280,190 C380,200 460,210 540,200" fill="none" stroke="#8a7349" stroke-width="6" opacity="0.3"/>
  <text x="400" y="188" font-family="Georgia, serif" font-size="11" fill="#6a5b45">Küçük Menderes</text>
  <circle cx="500" cy="318" r="7" fill="#2c2416"/>
  <text x="516" y="314" font-family="Georgia, serif" font-size="15">Ayd1n</text>
  <text x="516" y="332" font-family="Georgia, serif" font-size="11" fill="#6a5b45">Sar1lop country · PDO 2016</text>
  <circle cx="430" cy="300" r="4" fill="#4a6b52"/>
  <text x="430" y="348" font-family="Georgia, serif" font-size="11">Nazilli · Germencik · 0ncirliova</text>
  <text x="28" y="490" font-family="Georgia, serif" font-size="11" fill="#6a5b45">19th-c. Smyrna figs were grown inland and shipped through 0zmir. Ayd1n 0nciri is the legal name for dried Sar1lop from the defined valleys.</text>
</svg>
