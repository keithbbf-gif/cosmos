<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc">
  <title id="title">Caprification and wasp cycle</title>
  <desc id="desc">Diagram linking caprifig syconia with pollinator wasp and common fig fruit set</desc>
  <rect width="880" height="440" fill="#f5f0e8"/>
  <text x="440" y="30" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="600" fill="#2c2416">Caprification cycle (schematic)</text>
  <ellipse cx="180" cy="200" rx="55" ry="75" fill="#8b5a2b" opacity="0.35" stroke="#2c2416"/>
  <text x="180" y="295" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#2c2416">Caprifig syconium</text>
  <ellipse cx="440" cy="200" rx="40" ry="25" fill="#f5f0e8" stroke="#2c2416"/>
  <text x="440" y="205" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="9" fill="#2c2416">Wasp</text>
  <text x="440" y="250" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#5c4a32">*Blastophaga psenes*</text>
  <ellipse cx="700" cy="200" rx="55" ry="75" fill="#6b3a2a" opacity="0.35" stroke="#2c2416"/>
  <text x="700" y="295" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#2c2416">Common fig (pollinated)</text>
  <path d="M 235 200 L 395 200" stroke="#8b5a2b" stroke-width="2" marker-end="url(#a2)"/>
  <text x="315" y="185" text-anchor="middle" font-size="9" font-family="Segoe UI, system-ui, sans-serif" fill="#5c4a32">emergence</text>
  <path d="M 485 200 L 645 200" stroke="#8b5a2b" stroke-width="2" marker-end="url(#a2)"/>
  <text x="565" y="185" text-anchor="middle" font-size="9" font-family="Segoe UI, system-ui, sans-serif" fill="#5c4a32">pollen carry</text>
  <defs><marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8b5a2b"/></marker></defs>
  <text x="440" y="360" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#5c4a32">Many modern cultivars are parthenocarpic; caprification remains historically central in Smyrna-type production.</text>
  <text x="440" y="420" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5c4a32">`shared.caprification-cycle`</text>
</svg>
