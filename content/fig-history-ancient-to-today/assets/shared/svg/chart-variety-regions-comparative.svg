<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
  <title id="title">Fig variety regions comparative chart</title>
  <desc id="desc">Bar chart comparing representative cultivar types by region</desc>
  <rect width="900" height="480" fill="#f5f0e8"/>
  <text x="450" y="30" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="600" fill="#2c2416">Representative cultivar roles by region (schematic index)</text>
  <text x="450" y="50" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#5c4a32">Bar length = relative historic prominence in local trade (qualitative, not production tonnage)</text>
  <!-- axes -->
  <line x1="120" y1="80" x2="120" y2="380" stroke="#2c2416" stroke-width="1.5"/>
  <line x1="120" y1="380" x2="820" y2="380" stroke="#2c2416" stroke-width="1.5"/>
  <!-- bars -->
  <text x="110" y="120" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#2c2416">Turkey (Aegean)</text>
  <rect x="120" y="105" width="520" height="22" fill="#8b5a2b" opacity="0.7"/>
  <text x="650" y="120" font-family="Segoe UI, system-ui, sans-serif" font-size="9" fill="#5c4a32">Sarilop-type drying</text>
  <text x="110" y="165" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#2c2416">California</text>
  <rect x="120" y="150" width="480" height="22" fill="#6b3a2a" opacity="0.65"/>
  <text x="610" y="165" font-family="Segoe UI, system-ui, sans-serif" font-size="9" fill="#5c4a32">Mission, Kadota, Brown Turkey</text>
  <text x="110" y="210" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#2c2416">Greece</text>
  <rect x="120" y="195" width="400" height="22" fill="#8b5a2b" opacity="0.55"/>
  <text x="530" y="210" font-family="Segoe UI, system-ui, sans-serif" font-size="9" fill="#5c4a32">Vasilika, Mavra</text>
  <text x="110" y="255" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#2c2416">Spain / Portugal</text>
  <rect x="120" y="240" width="360" height="22" fill="#6b3a2a" opacity="0.5"/>
  <text x="490" y="255" font-family="Segoe UI, system-ui, sans-serif" font-size="9" fill="#5c4a32">Cuello de Dama, Coll de Dama</text>
  <text x="110" y="300" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#2c2416">Iran</text>
  <rect x="120" y="285" width="340" height="22" fill="#8b5a2b" opacity="0.45"/>
  <text x="470" y="300" font-family="Segoe UI, system-ui, sans-serif" font-size="9" fill="#5c4a32">Estahban-type drying</text>
  <text x="110" y="345" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#2c2416">Morocco</text>
  <rect x="120" y="330" width="280" height="22" fill="#6b3a2a" opacity="0.4"/>
  <text x="410" y="345" font-family="Segoe UI, system-ui, sans-serif" font-size="9" fill="#5c4a32">Picholine verte lineage</text>
  <text x="450" y="420" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#5c4a32">Use with local pomology sources; names shift across languages.</text>
  <text x="450" y="460" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5c4a32">`shared.chart-variety-regions`</text>
</svg>
