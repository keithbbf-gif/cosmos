<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Mediterranean fig cultivation belt</title>
  <desc id="desc">Schematic map of primary historic fig-growing regions around the Mediterranean</desc>
  <rect width="900" height="560" fill="#f5f0e8"/>
  <text x="450" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="600" fill="#2c2416">Historic Mediterranean fig belt (schematic)</text>
  <!-- sea -->
  <path d="M 120 120 Q 450 80 780 130 L 820 380 Q 450 420 100 360 Z" fill="#d4e4e8" stroke="#5c4a32" stroke-width="1.5"/>
  <text x="450" y="280" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#5c4a32" opacity="0.7">Mediterranean Sea</text>
  <!-- land masses simplified -->
  <path d="M 80 100 L 200 90 L 240 200 L 180 320 L 90 300 Z" fill="#e8dfd0" stroke="#5c4a32" stroke-width="1"/>
  <text x="140" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#2c2416">Iberia</text>
  <path d="M 250 85 L 420 75 L 450 180 L 380 250 L 260 220 Z" fill="#e8dfd0" stroke="#5c4a32" stroke-width="1"/>
  <text x="340" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#2c2416">Italy</text>
  <path d="M 430 70 L 620 95 L 650 200 L 520 280 L 400 240 Z" fill="#e8dfd0" stroke="#5c4a32" stroke-width="1"/>
  <text x="520" y="170" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#2c2416">Greece &amp; Aegean</text>
  <path d="M 620 100 L 780 120 L 800 280 L 680 350 L 600 260 Z" fill="#e8dfd0" stroke="#5c4a32" stroke-width="1"/>
  <text x="700" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#2c2416">Levant</text>
  <path d="M 200 320 L 380 300 L 420 400 L 250 450 L 150 380 Z" fill="#e8dfd0" stroke="#5c4a32" stroke-width="1"/>
  <text x="280" y="380" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#2c2416">North Africa</text>
  <path d="M 480 300 L 620 290 L 640 420 L 500 460 L 420 380 Z" fill="#e8dfd0" stroke="#5c4a32" stroke-width="1"/>
  <text x="540" y="380" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#2c2416">Egypt</text>
  <!-- fig belt shading -->
  <ellipse cx="350" cy="200" rx="280" ry="120" fill="#8b5a2b" opacity="0.15"/>
  <ellipse cx="550" cy="220" rx="200" ry="100" fill="#8b5a2b" opacity="0.12"/>
  <text x="450" y="95" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#8b5a2b">Shaded: core historic orchard zones</text>
  <!-- legend -->
  <rect x="60" y="480" width="16" height="16" fill="#8b5a2b" opacity="0.25" stroke="#5c4a32"/>
  <text x="85" y="493" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#2c2416">Traditional rain-fed &amp; irrigated fig districts</text>
  <circle cx="68" cy="520" r="5" fill="#6b3a2a"/>
  <text x="85" y="524" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#2c2416">Major ancient port cities (trade of fresh &amp; dried figs)</text>
  <circle cx="400" cy="518" r="5" fill="#6b3a2a"/>
  <text x="415" y="522" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#2c2416">Carthage  Syracuse  Athens  Alexandria</text>
  <text x="450" y="548" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5c4a32">Schematic  -  not to scale  `shared.map-med-belt`</text>
</svg>
