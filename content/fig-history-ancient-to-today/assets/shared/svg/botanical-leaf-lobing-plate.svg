<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="title desc">
  <title id="title">Fig leaf lobing comparison</title>
  <desc id="desc">Comparative line leaves showing lobing variation in common fig cultivars</desc>
  <rect width="900" height="400" fill="#f5f0e8"/>
  <text x="450" y="30" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="600" fill="#2c2416">Leaf lobing  -  comparative plate (schematic)</text>
  <!-- leaf 1 -->
  <path d="M 120 200 Q 80 120 140 100 Q 200 80 220 140 Q 240 200 200 260 Q 160 300 120 200 Z" fill="#4a6741" opacity="0.25" stroke="#2c2416" stroke-width="1.2"/>
  <text x="160" y="320" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#2c2416">3-lobed (typical)</text>
  <!-- leaf 2 -->
  <path d="M 380 200 Q 340 130 400 110 Q 460 100 480 170 Q 500 230 460 270 Q 420 300 380 200 Z" fill="#4a6741" opacity="0.2" stroke="#2c2416" stroke-width="1.2"/>
  <path d="M 420 120 L 430 250" fill="none" stroke="#2c2416" stroke-width="0.8"/>
  <text x="420" y="320" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#2c2416">5-lobed</text>
  <!-- leaf 3 -->
  <path d="M 640 200 Q 600 150 660 140 Q 720 135 740 200 Q 755 250 720 280 Q 680 300 640 200 Z" fill="#4a6741" opacity="0.18" stroke="#2c2416" stroke-width="1.2"/>
  <text x="680" y="320" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#2c2416">Shallow lobes</text>
  <text x="450" y="365" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#5c4a32">Cultivar names vary by region; plate shows generalized forms for field identification.</text>
  <text x="450" y="388" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5c4a32">`shared.botanical-leaf-lobing`</text>
</svg>
