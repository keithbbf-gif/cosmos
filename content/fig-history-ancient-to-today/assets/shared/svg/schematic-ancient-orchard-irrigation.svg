<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">Ancient irrigated fig orchard schematic</title>
  <desc id="desc">Plan view of terrace orchard with channel irrigation and caprifig placement</desc>
  <rect width="920" height="500" fill="#f5f0e8"/>
  <text x="460" y="30" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="600" fill="#2c2416">Terraced fig orchard  -  plan schematic (Eastern Mediterranean type)</text>
  <!-- terraces -->
  <rect x="80" y="80" width="760" height="60" fill="#e8dfd0" stroke="#5c4a32"/>
  <rect x="80" y="150" width="760" height="60" fill="#ddd4c4" stroke="#5c4a32"/>
  <rect x="80" y="220" width="760" height="60" fill="#d4c8b8" stroke="#5c4a32"/>
  <rect x="80" y="290" width="760" height="60" fill="#c9bcaa" stroke="#5c4a32"/>
  <!-- trees -->
  <g fill="#4a6741" stroke="#2c2416" stroke-width="0.8">
    <circle cx="150" cy="110" r="14"/><circle cx="250" cy="110" r="14"/><circle cx="350" cy="110" r="14"/>
    <circle cx="150" cy="180" r="14"/><circle cx="250" cy="180" r="14"/><circle cx="350" cy="180" r="14"/>
    <circle cx="150" cy="250" r="14"/><circle cx="250" cy="250" r="14"/><circle cx="350" cy="250" r="14"/>
  </g>
  <!-- caprifig marker -->
  <circle cx="450" cy="180" r="14" fill="#8b5a2b" opacity="0.4" stroke="#2c2416"/>
  <text x="450" y="210" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="9" fill="#8b5a2b">Caprifig (caprifig pollen source)</text>
  <!-- channel -->
  <path d="M 700 70 L 700 360" stroke="#4a90a4" stroke-width="6" fill="none"/>
  <path d="M 700 150 L 500 150 L 500 220 L 300 220" stroke="#4a90a4" stroke-width="4" fill="none"/>
  <text x="720" y="200" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#2c2416">Main channel</text>
  <text x="520" y="140" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#2c2416">Branch rills</text>
  <rect x="80" y="380" width="400" height="55" fill="#fff" stroke="#d4c8b8"/>
  <text x="90" y="400" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#2c2416">Legend: green = common fig (parthenocarpic or pollinated)</text>
  <text x="90" y="418" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#2c2416">Brown = caprifig interplanted for blastophaga wasp transfer (historic practice)</text>
  <text x="460" y="485" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5c4a32">Schematic  -  not to scale  `shared.schematic-orchard-irrigation`</text>
</svg>
