<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
  <title id="title">Traditional fig drying process</title>
  <desc id="desc">Flow diagram from harvest through sundrying to packing</desc>
  <rect width="1000" height="340" fill="#f5f0e8"/>
  <text x="500" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="600" fill="#2c2416">Traditional sundrying &amp; processing (schematic flow)</text>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8b5a2b"/>
    </marker>
  </defs>
  <!-- boxes -->
  <rect x="40" y="100" width="130" height="70" rx="6" fill="#fff" stroke="#5c4a32" stroke-width="1.5"/>
  <text x="105" y="128" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#2c2416">1. Harvest</text>
  <text x="105" y="148" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="9" fill="#5c4a32">ripe syconia</text>
  <rect x="210" y="100" width="130" height="70" rx="6" fill="#fff" stroke="#5c4a32" stroke-width="1.5"/>
  <text x="275" y="128" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#2c2416">2. Dip / cure</text>
  <text x="275" y="148" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="9" fill="#5c4a32">optional salt or</text>
  <text x="275" y="160" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="9" fill="#5c4a32">potassium aid</text>
  <rect x="380" y="100" width="150" height="70" rx="6" fill="#fff" stroke="#5c4a32" stroke-width="1.5"/>
  <text x="455" y="128" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#2c2416">3. Sun trays</text>
  <text x="455" y="148" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="9" fill="#5c4a32">3 - 7 days, turned</text>
  <rect x="570" y="100" width="130" height="70" rx="6" fill="#fff" stroke="#5c4a32" stroke-width="1.5"/>
  <text x="635" y="128" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#2c2416">4. Shade finish</text>
  <text x="635" y="148" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="9" fill="#5c4a32">even moisture</text>
  <rect x="740" y="100" width="130" height="70" rx="6" fill="#fff" stroke="#5c4a32" stroke-width="1.5"/>
  <text x="805" y="128" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#2c2416">5. Sort &amp; press</text>
  <text x="805" y="148" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="9" fill="#5c4a32">grade A / B</text>
  <rect x="900" y="100" width="80" height="70" rx="6" fill="#8b5a2b" opacity="0.2" stroke="#5c4a32" stroke-width="1.5"/>
  <text x="940" y="135" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#2c2416">6. Pack</text>
  <!-- arrows -->
  <line x1="170" y1="135" x2="208" y2="135" stroke="#8b5a2b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="135" x2="378" y2="135" stroke="#8b5a2b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="135" x2="568" y2="135" stroke="#8b5a2b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="135" x2="738" y2="135" stroke="#8b5a2b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="870" y1="135" x2="898" y2="135" stroke="#8b5a2b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="500" y="230" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#5c4a32">Modern plants add tunnel dryers &amp; SO-free lines; this plate shows historic Aegean / Anatolian pattern.</text>
  <text x="500" y="310" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5c4a32">`shared.process-drying-sundry`</text>
</svg>
