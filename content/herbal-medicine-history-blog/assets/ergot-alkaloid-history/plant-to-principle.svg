<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" role="img" aria-labelledby="title desc">
  <title id="title">Claviceps purpurea → named principle (historical)</title>
  <rect width="100%" height="100%" fill="#f7fafc"/>
  <text x="24" y="36" font-family="Source Serif 4, Georgia, serif" font-size="22" font-weight="600" fill="#1a2332">Claviceps purpurea → named principle (historical)</text>
  <text x="24" y="58" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" fill="#4a5568">Historical processing schematic — not a synthesis or dosing guide</text>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2b6cb0"/></marker></defs>
  <rect x="40" y="110" width="120" height="70" rx="6" fill="#edf2f7" stroke="#cbd5e0"/>
  <text x="52" y="142" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1a2332">Claviceps purpurea</text>
  <text x="52" y="160" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="10" font-weight="400" fill="#4a5568">(source plant)</text>
  <rect x="150" y="120" width="100" height="50" rx="6" fill="#ffffff" stroke="#cbd5e0"/>
  <text x="158" y="138" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" font-weight="400" fill="#1a2332">Ergot on rye</text>
  <line x1="160" y1="145" x2="150" y2="145" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="310" y="120" width="100" height="50" rx="6" fill="#ffffff" stroke="#cbd5e0"/>
  <text x="318" y="138" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" font-weight="400" fill="#1a2332">Ergot</text>
  <text x="318" y="152" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" font-weight="400" fill="#1a2332">alkaloids</text>
  <line x1="250" y1="145" x2="310" y2="145" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="470" y="120" width="100" height="50" rx="6" fill="#ffffff" stroke="#cbd5e0"/>
  <text x="478" y="138" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" font-weight="400" fill="#1a2332">Ergometrine /</text>
  <text x="478" y="152" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" font-weight="400" fill="#1a2332">ergotamine</text>
  <line x1="410" y1="145" x2="470" y2="145" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="590" y="120" width="100" height="50" rx="6" fill="#ffffff" stroke="#cbd5e0"/>
  <text x="598" y="138" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" font-weight="400" fill="#1a2332">Obstetric</text>
  <text x="598" y="152" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" font-weight="400" fill="#1a2332">history</text>
  <line x1="570" y1="145" x2="590" y2="145" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="24" y="266" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" fill="#4a5568">Process labels are historiographic, not manufacturing SOPs.</text>
