  <text x="510" y="144" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="10" font-weight="400" fill="#4a5568">retail</text>
  <text x="24" y="406" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" fill="#4a5568">Speculative topology for literacy; verify ports and dates in prose.</text>
