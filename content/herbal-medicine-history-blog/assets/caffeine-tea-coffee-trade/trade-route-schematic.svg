<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Tea, coffee, and caffeine as global commodities — illustrative route</title>
  <rect width="100%" height="100%" fill="#f7fafc"/>
  <text x="24" y="36" font-family="Source Serif 4, Georgia, serif" font-size="22" font-weight="600" fill="#1a2332">Tea, coffee, and caffeine as global commodities — illustrative route</text>
  <text x="24" y="58" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" fill="#4a5568">Illustrative trade schematic — geography simplified, not navigation</text>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2b6cb0"/></marker></defs>
  <rect x="45" y="172" width="110" height="56" rx="6" fill="#ffffff" stroke="#cbd5e0"/>
  <text x="52" y="196" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1a2332">Port A</text>
  <text x="52" y="214" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="10" font-weight="400" fill="#4a5568">source</text>
  <rect x="225" y="92" width="110" height="56" rx="6" fill="#ffffff" stroke="#cbd5e0"/>
  <text x="232" y="116" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1a2332">Hub B</text>
  <text x="232" y="134" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="10" font-weight="400" fill="#4a5568">sorting</text>
  <rect x="405" y="172" width="110" height="56" rx="6" fill="#ffffff" stroke="#cbd5e0"/>
  <text x="412" y="196" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1a2332">Port C</text>
  <text x="412" y="214" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="10" font-weight="400" fill="#4a5568">re-export</text>
  <rect x="565" y="112" width="110" height="56" rx="6" fill="#ffffff" stroke="#cbd5e0"/>
  <text x="572" y="136" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1a2332">Market D</text>
  <text x="572" y="154" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="10" font-weight="400" fill="#4a5568">dispensary</text>
  <path d="M100,200 Q190,140 280,120" fill="none" stroke="#8b6914" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="160" y="134" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="10" font-weight="400" fill="#4a5568">coastal</text>
