<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="388" viewBox="0 0 760 388" role="img" aria-labelledby="title desc">
  <title id="title">From willow bark to salicylate chemistry — discovery timeline</title>
  <rect width="100%" height="100%" fill="#f7fafc"/>
  <text x="24" y="36" font-family="Source Serif 4, Georgia, serif" font-size="22" font-weight="600" fill="#1a2332">From willow bark to salicylate chemistry — discovery timeline</text>
  <text x="24" y="58" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" fill="#4a5568">Dated milestones — illustrative where marked; not a forecast</text>
  <line x1="120" y1="80" x2="120" y2="152" stroke="#cbd5e0" stroke-width="2"/>
  <rect x="24" y="92" width="88" height="28" rx="6" fill="#2b6cb0" stroke="#cbd5e0"/>
  <text x="32" y="112" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">1763</text>
  <text x="136" y="108" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a2332">Stone letter</text>
  <text x="136" y="128" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" font-weight="400" fill="#4a5568">Edmund Stone on willow and agues — often cited; verify</text>
  <text x="136" y="144" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" font-weight="400" fill="#4a5568">primary.</text>
  <line x1="120" y1="152" x2="120" y2="224" stroke="#cbd5e0" stroke-width="2"/>
  <rect x="24" y="164" width="88" height="28" rx="6" fill="#ebf8ff" stroke="#cbd5e0"/>
  <text x="32" y="184" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" font-weight="600" fill="#2b6cb0">1828</text>
  <text x="136" y="180" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a2332">Salicin</text>
  <text x="136" y="200" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" font-weight="400" fill="#4a5568">Brugnatelli / Leroux isolation work — check spelling in</text>
  <text x="136" y="216" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" font-weight="400" fill="#4a5568">sources.</text>
  <line x1="120" y1="224" x2="120" y2="296" stroke="#cbd5e0" stroke-width="2"/>
  <rect x="24" y="236" width="88" height="28" rx="6" fill="#2b6cb0" stroke="#cbd5e0"/>
  <text x="32" y="256" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">1853</text>
  <text x="136" y="252" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a2332">Acetylation path</text>
  <text x="136" y="272" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" font-weight="400" fill="#4a5568">Gerhardt experiments toward acetylsalicylic acid.</text>
  <text x="24" y="374" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" fill="#4a5568">Verify each date against primary sources before print.</text>
</svg>
