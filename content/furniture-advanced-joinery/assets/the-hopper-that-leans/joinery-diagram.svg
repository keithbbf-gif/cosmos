<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Compound dovetail on a sloped hopper side</title>
  <desc id="desc">End grain parallelogram with tails sawn to the hopper bevel, not plumb to the bench</desc>
  <rect width="100%" height="100%" fill="#F7F3E8"/>
  <text x="32" y="44" fill="#1A1A1A" font-family="Georgia, serif" font-size="20" font-weight="600">Compound dovetail on a sloped hopper side</text>
  <rect x="24" y="64" width="592" height="332" fill="none" stroke="#D4C9B0" stroke-width="1"/>

  <line x1="160" y1="120" x2="480" y2="200" stroke="#1A1A1A" stroke-width="2"/>
  <text x="168" y="112" fill="#4A4A4A" font-family="sans-serif" font-size="11">hopper side slope</text>
  <polygon points="200,280 240,220 280,280" fill="none" stroke="#1A1A1A" stroke-width="2.5"/>
  <polygon points="300,300 340,235 380,300" fill="none" stroke="#1A1A1A" stroke-width="2.5"/>
  <line x1="180" y1="320" x2="500" y2="260" stroke="#8B4513" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="184" y="312" fill="#8B4513" font-family="sans-serif" font-size="12">baseline parallel to rim</text>
</svg>
