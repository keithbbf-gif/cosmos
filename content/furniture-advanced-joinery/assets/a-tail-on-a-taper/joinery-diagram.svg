<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Sliding dovetail on a tapered post</title>
  <desc id="desc">Socket that follows taper so the tail does not split the show face</desc>
  <rect width="100%" height="100%" fill="#F7F3E8"/>
  <text x="32" y="44" fill="#1A1A1A" font-family="Georgia, serif" font-size="20" font-weight="600">Sliding dovetail on a tapered post</text>
  <rect x="24" y="64" width="592" height="332" fill="none" stroke="#D4C9B0" stroke-width="1"/>

  <line x1="220" y1="340" x2="300" y2="180" stroke="#1A1A1A" stroke-width="2"/>
  <polygon points="320,260 360,220 400,260 380,300 320,300" fill="none" stroke="#8B4513" stroke-width="2"/>
  <text x="410" y="250" fill="#4A4A4A" font-family="sans-serif" font-size="11">sliding tail</text>
</svg>
