<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Elliptical frame from segments</title>
  <desc id="desc">Splined or bridled joints closing an elliptical ring</desc>
  <rect width="100%" height="100%" fill="#F7F3E8"/>
  <text x="32" y="44" fill="#1A1A1A" font-family="Georgia, serif" font-size="20" font-weight="600">Elliptical frame from segments</text>
  <rect x="24" y="64" width="592" height="332" fill="none" stroke="#D4C9B0" stroke-width="1"/>

  <ellipse cx="320" cy="260" rx="140" ry="70" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="260" y1="230" x2="280" y2="250" stroke="#8B4513" stroke-width="2"/>
  <line x1="360" y1="250" x2="380" y2="230" stroke="#8B4513" stroke-width="2"/>
  <text x="300" y="200" fill="#4A4A4A" font-family="sans-serif" font-size="11">splined segment</text>
</svg>
