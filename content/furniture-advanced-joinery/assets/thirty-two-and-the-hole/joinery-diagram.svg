<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">32 mm system hole grid</title>
  <desc id="desc">Row of 5 mm holes on 32 mm centers for hinges and pins</desc>
  <rect width="100%" height="100%" fill="#F7F3E8"/>
  <text x="32" y="44" fill="#1A1A1A" font-family="Georgia, serif" font-size="20" font-weight="600">32 mm system hole grid</text>
  <rect x="24" y="64" width="592" height="332" fill="none" stroke="#D4C9B0" stroke-width="1"/>

  <line x1="200" y1="260" x2="440" y2="260" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="232" cy="260" r="6" fill="none" stroke="#8B4513" stroke-width="2"/>
  <circle cx="264" cy="260" r="6" fill="none" stroke="#8B4513" stroke-width="2"/>
  <circle cx="296" cy="260" r="6" fill="none" stroke="#8B4513" stroke-width="2"/>
  <circle cx="328" cy="260" r="6" fill="none" stroke="#8B4513" stroke-width="2"/>
  <text x="200" y="240" fill="#4A4A4A" font-family="sans-serif" font-size="11">32 mm centers</text>
