<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Scribed rail shoulder on a curve</title>
  <desc id="desc">Knife line following a turned post, not a square shoulder</desc>
  <rect width="100%" height="100%" fill="#F7F3E8"/>
  <text x="32" y="44" fill="#1A1A1A" font-family="Georgia, serif" font-size="20" font-weight="600">Scribed rail shoulder on a curve</text>
  <rect x="24" y="64" width="592" height="332" fill="none" stroke="#D4C9B0" stroke-width="1"/>

  <ellipse cx="280" cy="260" rx="50" ry="80" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="330" y1="260" x2="480" y2="240" stroke="#8B4513" stroke-width="2.5"/>
  <path d="M 330 260 Q 380 250 480 240" fill="none" stroke="#6B4423" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="340" y="230" fill="#4A4A4A" font-family="sans-serif" font-size="11">scribed shoulder</text>
</svg>
