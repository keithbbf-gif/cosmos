<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Climbing sliding-dovetail socket</title>
  <desc id="desc">Shelf tail with dovetail slope plus case rake in one socket</desc>
  <rect width="100%" height="100%" fill="#F7F3E8"/>
  <text x="32" y="44" fill="#1A1A1A" font-family="Georgia, serif" font-size="20" font-weight="600">Climbing sliding-dovetail socket</text>
  <rect x="24" y="64" width="592" height="332" fill="none" stroke="#D4C9B0" stroke-width="1"/>

  <line x1="180" y1="320" x2="460" y2="200" stroke="#1A1A1A" stroke-width="2"/>
  <polygon points="300,280 340,240 380,260 360,300" fill="none" stroke="#8B4513" stroke-width="2"/>
  <text x="390" y="235" fill="#4A4A4A" font-family="sans-serif" font-size="11">two slopes</text>
