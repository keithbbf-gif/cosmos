<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
<title id="title">True-to-type verification</title>
<rect width="100%" height="100%" fill="#f7f4ef"/>
<style>text { font-family: system-ui, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1c2420; } .label { font-size: 13px; } .small { font-size: 11px; fill: #5c6b63; } .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }</style>
<defs><marker id='arrowhead' markerWidth='8' markerHeight='8' refX='6' refY='4' orient='auto'><polygon points='0 0, 8 4, 0 8' fill='#9aa89f'/></marker></defs>
<rect x="280" y="50" width="160" height="48" rx="6" fill="#d4e4dc" stroke="#2f5d4a" stroke-width="1.5"/>
<text class="label" x="360" y="78" text-anchor="middle">Labeled variety</text>
<rect x="80" y="160" width="180" height="56" rx="6" fill="#ffffff" stroke="#9aa89f" stroke-width="1.5"/>
<text class="label" x="170" y="192" text-anchor="middle">Document source</text>
<rect x="460" y="160" width="180" height="56" rx="6" fill="#ffffff" stroke="#9aa89f" stroke-width="1.5"/>
<text class="label" x="550" y="192" text-anchor="middle">Wait for fruit</text>
<rect x="240" y="280" width="240" height="56" rx="6" fill="#e8dcc8" stroke="#8b5e34" stroke-width="1.5"/>
<text class="label" x="360" y="312" text-anchor="middle">1–3 seasons compare</text>
<line x1="360" y1="98" x2="170" y2="160" stroke="#9aa89f" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="360" y1="98" x2="550" y2="160" stroke="#9aa89f" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="170" y1="216" x2="300" y2="280" stroke="#9aa89f" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="550" y1="216" x2="420" y2="280" stroke="#9aa89f" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>
