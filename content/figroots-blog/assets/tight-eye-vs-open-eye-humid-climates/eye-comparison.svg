<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-labelledby="title desc">
<title id="title">Tight-eye vs open-eye schematic</title>
<rect width="100%" height="100%" fill="#f7f4ef"/>
<style>text { font-family: system-ui, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1c2420; } .label { font-size: 13px; } .small { font-size: 11px; fill: #5c6b63; } .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }</style>
<text class="small">
<tspan x="24" dy="0">Cross-section schematic — not to scale. Photo: D:\FIGS\Fig Fruit.</tspan>
</text>
<text class="label" x="180" y="70" text-anchor="middle">Tight eye</text>
<ellipse cx="180" cy="150" rx="70" ry="55" fill="#e8dcc8" stroke="#8b5e34" stroke-width="2"/>
<circle cx="180" cy="118" r="8" fill="#f7f4ef" stroke="#1c2420" stroke-width="2"/>
<text class="small" x="180" y="230" text-anchor="middle">ostiole opening</text>
<text class="label" x="480" y="70" text-anchor="middle">Open eye</text>
<ellipse cx="480" cy="150" rx="70" ry="55" fill="#e8dcc8" stroke="#8b5e34" stroke-width="2"/>
<circle cx="480" cy="118" r="28" fill="#f7f4ef" stroke="#1c2420" stroke-width="2"/>
<text class="small" x="480" y="230" text-anchor="middle">ostiole opening</text>
</svg>
