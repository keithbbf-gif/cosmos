<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
<title id="title">Humid-week fruit handling</title>
<rect width="100%" height="100%" fill="#f7f4ef"/>
<style>text { font-family: system-ui, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1c2420; } .label { font-size: 13px; } .small { font-size: 11px; fill: #5c6b63; } .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }</style>
<defs><marker id='arrowhead' markerWidth='8' markerHeight='8' refX='6' refY='4' orient='auto'><polygon points='0 0, 8 4, 0 8' fill='#9aa89f'/></marker></defs>
<text class="small">
<tspan x="24" dy="0">After rain + heat — grower choices, not chemical</tspan>
<tspan x="24" dy="16">advice.</tspan>
</text>
<rect x="280" y="52" width="160" height="56" rx="6" fill="#d4e4dc" stroke="#2f5d4a" stroke-width="1.5"/>
<text class="label" x="360" y="76" text-anchor="middle">August rain</text>
<text class="label" x="360" y="92" text-anchor="middle">+ heat?</text>
<rect x="120" y="150" width="160" height="56" rx="6" fill="#d4e4dc" stroke="#2f5d4a" stroke-width="1.5"/>
<text class="label" x="200" y="174" text-anchor="middle">Pick early</text>
<text class="label" x="200" y="190" text-anchor="middle">if splitting</text>
<rect x="440" y="150" width="160" height="56" rx="6" fill="#d4e4dc" stroke="#2f5d4a" stroke-width="1.5"/>
<text class="label" x="520" y="174" text-anchor="middle">Leave on tree</text>
<text class="label" x="520" y="190" text-anchor="middle">if tight eye</text>
<rect x="280" y="250" width="160" height="56" rx="6" fill="#d4e4dc" stroke="#2f5d4a" stroke-width="1.5"/>
<text class="label" x="360" y="274" text-anchor="middle">Net / pick</text>
<text class="label" x="360" y="290" text-anchor="middle">daily anyway?</text>
<line x1="360" y1="108" x2="200" y2="150" stroke="#9aa89f" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="360" y1="108" x2="520" y2="150" stroke="#9aa89f" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="200" y1="206" x2="320" y2="250" stroke="#9aa89f" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="520" y1="206" x2="400" y2="250" stroke="#9aa89f" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>
