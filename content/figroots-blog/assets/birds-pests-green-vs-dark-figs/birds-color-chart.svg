<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-labelledby="title desc">
<desc id="desc">Green vs dark ripe fig visibility against foliage and to birds.</desc>
<title id="title">Bird visibility — illustrative</title>
<rect width="100%" height="100%" fill="#f7f4ef"/>
<style>text { font-family: system-ui, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1c2420; } .label { font-size: 13px; } .small { font-size: 11px; fill: #5c6b63; } .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }</style>
<text class="small">
<tspan x="24" y="20">Illustrative contrast — local bird pressure still wins.</tspan>
</text>
<ellipse cx="90" cy="140" rx="48" ry="32" fill="#4a6b42" opacity="0.35"/>
<ellipse cx="130" cy="120" rx="48" ry="32" fill="#4a6b42" opacity="0.35"/>
<ellipse cx="170" cy="150" rx="48" ry="32" fill="#4a6b42" opacity="0.35"/>
<ellipse cx="400" cy="130" rx="48" ry="32" fill="#4a6b42" opacity="0.35"/>
<ellipse cx="450" cy="155" rx="48" ry="32" fill="#4a6b42" opacity="0.35"/>
<ellipse cx="490" cy="125" rx="48" ry="32" fill="#4a6b42" opacity="0.35"/>
<circle cx="140" cy="165" r="50" fill="#6b8f5b" stroke="#1c2420" stroke-width="2"/>
<text class="label" x="140" y="240" text-anchor="middle">Green ripe (camouflaged)</text>
<text class="small" x="140" y="260" text-anchor="middle">harder to spot in leaves</text>
<circle cx="500" cy="165" r="50" fill="#3d2914" stroke="#1c2420" stroke-width="2"/>
<text class="label" x="500" y="240" text-anchor="middle">Dark ripe (signals sugar)</text>
<text class="small" x="500" y="260" text-anchor="middle">often found first</text>
<path d="M 560 95 L 575 110 L 590 100 L 580 115 L 595 118 L 565 125 Z" fill="#1c2420" opacity="0.7"/>
<text class="small" x="360" y="310" text-anchor="middle">Harvest timing and netting beat color luck every time.</text>
</svg>
