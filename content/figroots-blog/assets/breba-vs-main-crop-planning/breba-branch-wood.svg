<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-labelledby="title desc">
<desc id="desc">Branch schematic showing breba buds on overwintered wood and main crop in leaf axils of new shoots.</desc>
<title id="title">Breba vs main crop — where fruit sets on the branch</title>
<rect width="100%" height="100%" fill="#f7f4ef"/>
<style>text { font-family: system-ui, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1c2420; } .label { font-size: 13px; } .small { font-size: 11px; fill: #5c6b63; } .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }</style>
<text class="small">
<tspan x="24" y="22">Prune off last year’s wood in February → you removed most</tspan>
<tspan x="24" dy="16">breba sites.</tspan>
</text>
<rect x="340" y="200" width="40" height="120" fill="#8b5e34" rx="4"/>
<path d="M 360 210 Q 200 200 120 170" fill="none" stroke="#8b5e34" stroke-width="14" stroke-linecap="round"/>
<text class="label" x="100" y="155">Prior-season shoot</text>
<ellipse cx="130" cy="158" rx="18" ry="22" fill="#d4e4dc" stroke="#2f5d4a" stroke-width="2"/>
<text class="small" x="130" y="195" text-anchor="middle">Breba here</text>
<path d="M 380 210 Q 520 180 580 140" fill="none" stroke="#2f5d4a" stroke-width="10" stroke-linecap="round"/>
<text class="label" x="560" y="125">Current-season shoot</text>
<ellipse cx="500" cy="155" rx="14" ry="18" fill="#e8dcc8" stroke="#8b5e34" stroke-width="2"/>
<ellipse cx="560" cy="146" rx="14" ry="18" fill="#e8dcc8" stroke="#8b5e34" stroke-width="2"/>
<text class="small" x="530" y="200" text-anchor="middle">Main crop in axils</text>
<rect x="40" y="300" width="640" height="56" rx="6" fill="#ffffff" stroke="#9aa89f" stroke-width="1.5"/>
<text class="small">
<tspan x="56" y="322">Hard winter in 8a: assume main crop. Protected pot or wall → breba may still show on saved wood.</tspan>
</text>
</svg>
