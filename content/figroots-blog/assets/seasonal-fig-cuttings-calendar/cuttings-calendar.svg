<rect x="520" y="120" width="90" height="70" rx="6" fill="#8b5e34" stroke="#9aa89f" stroke-width="1.5"/>
<text class="label" x="565.0" y="160" text-anchor="middle">Greenwood</text>
<line x1="60" y1="220" x2="660" y2="220" stroke="#1c2420" stroke-width="2"/>
