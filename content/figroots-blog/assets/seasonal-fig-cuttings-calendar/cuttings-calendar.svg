<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-labelledby="title desc">
<desc id="desc">Year bands for dormant cut, storage, sticking, and greenwood.</desc>
<title id="title">US cuttings calendar — schematic bands</title>
<rect width="100%" height="100%" fill="#f7f4ef"/>
<style>text { font-family: system-ui, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1c2420; } .label { font-size: 13px; } .small { font-size: 11px; fill: #5c6b63; } .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }</style>
<text class="small">
<tspan x="24" y="18">Regional frost dates vary — verify locally. South 8a runs earlier on</tspan>
<tspan x="24" dy="16">the right.</tspan>
</text>
<rect x="60" y="110" width="130" height="72" rx="6" fill="#e8dcc8" stroke="#9aa89f" stroke-width="1.5"/>
<text class="label" x="125.0" y="152" text-anchor="middle">Dormant cut</text>
<rect x="200" y="110" width="110" height="72" rx="6" fill="#d4e4dc" stroke="#9aa89f" stroke-width="1.5"/>
<text class="label" x="255.0" y="152" text-anchor="middle">Store / ship</text>
<rect x="320" y="110" width="150" height="72" rx="6" fill="#2f5d4a" stroke="#9aa89f" stroke-width="1.5"/>
<text class="label" x="395.0" y="152" text-anchor="middle">Stick pops</text>
<rect x="480" y="110" width="120" height="72" rx="6" fill="#8b5e34" stroke="#9aa89f" stroke-width="1.5"/>
<text class="label" x="540.0" y="152" text-anchor="middle">Greenwood</text>
<line x1="60" y1="220" x2="660" y2="220" stroke="#1c2420" stroke-width="2"/>
<line x1="60" y1="220" x2="60" y2="228" stroke="#1c2420"/>
<text class="small" x="60" y="248" text-anchor="middle">Jan</text>
<line x1="210" y1="220" x2="210" y2="228" stroke="#1c2420"/>
<text class="small" x="210" y="248" text-anchor="middle">Apr</text>
<line x1="360" y1="220" x2="360" y2="228" stroke="#1c2420"/>
<text class="small" x="360" y="248" text-anchor="middle">Jul</text>
<line x1="510" y1="220" x2="510" y2="228" stroke="#1c2420"/>
<text class="small" x="510" y="248" text-anchor="middle">Oct</text>
<line x1="660" y1="220" x2="660" y2="228" stroke="#1c2420"/>
<text class="small" x="660" y="248" text-anchor="middle">Dec</text>
</svg>
