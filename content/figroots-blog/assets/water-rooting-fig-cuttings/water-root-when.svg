<svg xmlns="http://www.w3.org/2000/svg" width="720" height="264" viewBox="0 0 720 264" role="img" aria-labelledby="title desc">
<title id="title">Jar vs mix</title>
<rect width="100%" height="100%" fill="#f7f4ef"/>
<style>text { font-family: system-ui, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1c2420; } .label { font-size: 13px; } .small { font-size: 11px; fill: #5c6b63; } .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }</style>
<text class="small">
<tspan x="24" dy="0">No success rate. Water roots are brittle.</tspan>
</text>
<rect x="24" y="56" width="672" height="184" rx="6" fill="#ffffff" stroke="#9aa89f" stroke-width="1.5"/>
<text class="label" x="40" y="80">Job</text>
<text class="label" x="250" y="80">Jar</text>
<text class="label" x="470" y="80">Mix / coir</text>
<text class="small" x="40" y="124">Good lignified tray</text>
<text class="small" x="250" y="124">No</text>
<text class="small" x="470" y="124">Yes</text>
<line x1="32" y1="136" x2="688" y2="136" stroke="#9aa89f"/>
<text class="small" x="40" y="172">Dehydrated now-wood</text>
<text class="small" x="250" y="172">Maybe</text>
<text class="small" x="470" y="172">Prefer mix</text>
<line x1="32" y1="184" x2="688" y2="184" stroke="#9aa89f"/>
<text class="small" x="40" y="220">Mail a name</text>
<text class="small" x="250" y="220">No</text>
<text class="small" x="470" y="220">Yes</text>
