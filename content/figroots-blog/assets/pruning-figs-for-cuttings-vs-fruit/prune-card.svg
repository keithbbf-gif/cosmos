<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
<title id="title">Wood or fruit</title>
<rect width="100%" height="100%" fill="#f7f4ef"/>
<style>text { font-family: system-ui, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1c2420; } .label { font-size: 13px; } .small { font-size: 11px; fill: #5c6b63; } .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }</style>
<defs><marker id='arrowhead' markerWidth='8' markerHeight='8' refX='6' refY='4' orient='auto'><polygon points='0 0, 8 4, 0 8' fill='#9aa89f'/></marker></defs>
<text class="small">
<tspan x="24" dy="0">Celeste hates a hard late-winter chop. Turkey rebounds.</tspan>
</text>
<rect x="260" y="60" width="200" height="56" rx="6" fill="#d4e4dc" stroke="#2f5d4a" stroke-width="1.5"/>
<text class="label" x="360" y="82" text-anchor="middle">This tree’s July job?</text>
<rect x="80" y="180" width="200" height="56" rx="6" fill="#e8dcc8" stroke="#8b5e34" stroke-width="1.5"/>
<text class="label" x="180" y="202" text-anchor="middle">Take 6–8" / 3 nodes</text>
<rect x="440" y="180" width="200" height="56" rx="6" fill="#e8dcc8" stroke="#8b5e34" stroke-width="1.5"/>
<text class="label" x="540" y="202" text-anchor="middle">Leave the wood</text>
<line x1="320" y1="116" x2="180" y2="180" stroke="#9aa89f" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="400" y1="116" x2="540" y2="180" stroke="#9aa89f" stroke-width="2" marker-end="url(#arrowhead)"/>
<rect x="240" y="280" width="240" height="48" rx="6" fill="#ffffff" stroke="#9aa89f" stroke-width="1.5"/>
<text class="small" x="360" y="308" text-anchor="middle">Donor trees first</text>
<line x1="180" y1="236" x2="300" y2="280" stroke="#9aa89f" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="540" y1="236" x2="420" y2="280" stroke="#9aa89f" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>
