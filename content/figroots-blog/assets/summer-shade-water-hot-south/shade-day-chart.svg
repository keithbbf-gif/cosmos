<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
<desc id="desc">Schematic July day with morning sun and afternoon shade bands.</desc>
<title id="title">July day — sun vs afternoon shade</title>
<rect width="100%" height="100%" fill="#f7f4ef"/>
<style>text { font-family: system-ui, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1c2420; } .label { font-size: 13px; } .small { font-size: 11px; fill: #5c6b63; } .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }</style>
<text class="small">
<tspan x="24" y="18">Schematic hours — tune to your row orientation.</tspan>
</text>
<rect x="60" y="140" width="72" height="90" rx="6" fill="#d4e4dc" stroke="#9aa89f" stroke-width="1.5"/>
<text class="small" x="96.0" y="250" text-anchor="middle">6a–10a</text>
<rect x="138" y="140" width="96" height="90" rx="6" fill="#2f5d4a" stroke="#9aa89f" stroke-width="1.5"/>
<text class="small" x="186.0" y="250" text-anchor="middle">10a–2p</text>
<rect x="240" y="140" width="120" height="90" rx="6" fill="#a0452a" stroke="#9aa89f" stroke-width="1.5"/>
<text class="small" x="300.0" y="250" text-anchor="middle">2p–6p</text>
<rect x="366" y="140" width="48" height="90" rx="6" fill="#d4e4dc" stroke="#9aa89f" stroke-width="1.5"/>
<text class="small" x="390.0" y="250" text-anchor="middle">6p+</text>
<text class="label" x="60" y="120">East → time → West (schematic)</text>
<circle cx="120" cy="95" r="14" fill="#8b5e34" opacity="0.9"/>
<text class="small" x="145" y="100">low morning sun</text>
<circle cx="520" cy="95" r="18" fill="#a0452a" opacity="0.85"/>
<text class="small" x="548" y="100">shade cloth / tree line</text>
</svg>
