<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-labelledby="title desc">
<title id="title">Dormant cutting fridge storage</title>
<rect width="100%" height="100%" fill="#f7f4ef"/>
<style>text { font-family: system-ui, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1c2420; } .label { font-size: 13px; } .small { font-size: 11px; fill: #5c6b63; } .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }</style>
<defs><marker id='arrowhead' markerWidth='8' markerHeight='8' refX='6' refY='4' orient='auto'><polygon points='0 0, 8 4, 0 8' fill='#9aa89f'/></marker></defs>
<rect x="40" y="70" width="120" height="56" rx="6" fill="#e8dcc8" stroke="#8b5e34" stroke-width="1.5"/>
<text class="label" x="100" y="96" text-anchor="middle">Lignified</text>
<text class="label" x="100" y="112" text-anchor="middle">wood only</text>
<rect x="200" y="70" width="120" height="56" rx="6" fill="#e8dcc8" stroke="#8b5e34" stroke-width="1.5"/>
<text class="label" x="260" y="96" text-anchor="middle">Wash and</text>
<text class="label" x="260" y="112" text-anchor="middle">dry bark</text>
<rect x="360" y="70" width="120" height="56" rx="6" fill="#e8dcc8" stroke="#8b5e34" stroke-width="1.5"/>
<text class="label" x="420" y="96" text-anchor="middle">Parafilm +</text>
<text class="label" x="420" y="112" text-anchor="middle">double bag</text>
