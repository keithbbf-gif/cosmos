<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
<desc id="desc">Process for washing, bagging, and refrigerating dormant fig cuttings.</desc>
<title id="title">Dormant cutting fridge storage</title>
<rect width="100%" height="100%" fill="#f7f4ef"/>
<style>text { font-family: system-ui, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1c2420; } .label { font-size: 13px; } .small { font-size: 11px; fill: #5c6b63; } .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }</style>
<defs><marker id='arrowhead' markerWidth='8' markerHeight='8' refX='6' refY='4' orient='auto'><polygon points='0 0, 8 4, 0 8' fill='#9aa89f'/></marker></defs>
<rect x="40" y="80" width="120" height="56" rx="6" fill="#e8dcc8" stroke="#8b5e34" stroke-width="1.5"/>
<text class="label" x="100" y="106" text-anchor="middle">Lignified</text>
<text class="label" x="100" y="122" text-anchor="middle">wood only</text>
<rect x="200" y="80" width="120" height="56" rx="6" fill="#e8dcc8" stroke="#8b5e34" stroke-width="1.5"/>
<text class="label" x="260" y="106" text-anchor="middle">Wash and</text>
<text class="label" x="260" y="122" text-anchor="middle">dry bark</text>
<rect x="360" y="80" width="120" height="56" rx="6" fill="#e8dcc8" stroke="#8b5e34" stroke-width="1.5"/>
<text class="label" x="420" y="106" text-anchor="middle">Parafilm +</text>
<text class="label" x="420" y="122" text-anchor="middle">double bag</text>
<rect x="520" y="80" width="120" height="56" rx="6" fill="#e8dcc8" stroke="#8b5e34" stroke-width="1.5"/>
<text class="label" x="580" y="106" text-anchor="middle">Crisper</text>
<text class="label" x="580" y="122" text-anchor="middle">(not freezer)</text>
<rect x="280" y="220" width="120" height="56" rx="6" fill="#e8dcc8" stroke="#8b5e34" stroke-width="1.5"/>
<text class="label" x="340" y="246" text-anchor="middle">Weekly</text>
<text class="label" x="340" y="262" text-anchor="middle">inspect</text>
<rect x="280" y="310" width="120" height="56" rx="6" fill="#e8dcc8" stroke="#8b5e34" stroke-width="1.5"/>
<text class="label" x="340" y="336" text-anchor="middle">Stick when</text>
<text class="label" x="340" y="352" text-anchor="middle">season fits</text>
<rect x="512" y="148" width="136" height="36" rx="6" fill="#d4e4dc" stroke="#2f5d4a" stroke-width="1.5"/>
<text class="mono" x="580" y="172" text-anchor="middle">34–40 °F crisper</text>
<line x1="160" y1="108" x2="200" y2="108" stroke="#9aa89f" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="320" y1="108" x2="360" y2="108" stroke="#9aa89f" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="480" y1="108" x2="520" y2="108" stroke="#9aa89f" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="580" y1="136" x2="340" y2="220" stroke="#9aa89f" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="340" y1="276" x2="340" y2="310" stroke="#9aa89f" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>
