<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-labelledby="title desc">
<desc id="desc">Three-step field test: dig, fill with water, check next morning.</desc>
<title id="title">Hole drainage perk test</title>
<rect width="100%" height="100%" fill="#f7f4ef"/>
<style>text { font-family: system-ui, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1c2420; } .label { font-size: 13px; } .small { font-size: 11px; fill: #5c6b63; } .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }</style>
<text class="small">
<tspan x="24" y="20">If water still sits hours later, do not plant a fig in that hole</tspan>
<tspan x="24" dy="16">— go up (berm).</tspan>
</text>
<rect x="20" y="70" width="160" height="120" rx="6" fill="#ffffff" stroke="#9aa89f" stroke-width="1.5"/>
<rect x="70" y="100" width="60" height="50" fill="#8a7355" stroke="#8b5e34" rx="4"/>
<text class="label" x="100" y="58" text-anchor="middle">1. Dig test hole</text>
<text class="small" x="100" y="210" text-anchor="middle">Same depth you</text>
<text class="small" x="100" y="224" text-anchor="middle">would plant</text>
<rect x="220" y="70" width="160" height="120" rx="6" fill="#ffffff" stroke="#9aa89f" stroke-width="1.5"/>
<rect x="270" y="100" width="60" height="50" fill="#8a7355" stroke="#8b5e34" rx="4"/>
<rect x="272" y="108" width="56" height="30" fill="#d4e4dc" opacity="0.8"/>
<text class="label" x="300" y="58" text-anchor="middle">2. Fill with water</text>
<text class="small" x="300" y="210" text-anchor="middle">Once, to the top</text>
<rect x="420" y="70" width="160" height="120" rx="6" fill="#ffffff" stroke="#9aa89f" stroke-width="1.5"/>
<rect x="470" y="100" width="60" height="50" fill="#8a7355" stroke="#8b5e34" rx="4"/>
<text class="label" x="500" y="118" text-anchor="middle" fill="#2f5d4a">OK ✓</text>
<text class="label" x="500" y="58" text-anchor="middle">3. Next morning</text>
<text class="small" x="500" y="210" text-anchor="middle">Puddle gone?</text>
</svg>
