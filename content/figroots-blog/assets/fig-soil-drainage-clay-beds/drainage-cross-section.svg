<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
<desc id="desc">Cross-section of fig on berm over clay with mulch ring.</desc>
<title id="title">Raised planting on clay — cross section</title>
<rect width="100%" height="100%" fill="#f7f4ef"/>
<style>text { font-family: system-ui, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1c2420; } .label { font-size: 13px; } .small { font-size: 11px; fill: #5c6b63; } .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }</style>
<text class="small">
<tspan x="24" y="20">Schematic bed profile — not an engineered drainage</tspan>
<tspan x="24" dy="16">spec.</tspan>
</text>
<rect x="80" y="220" width="560" height="120" fill="#8a7355"/>
<text class="small" x="360" y="290" text-anchor="middle" fill="#ffffff">native clay (slow drain)</text>
<line x1="100" y1="320" x2="620" y2="320" stroke="#a0452a" stroke-width="2" stroke-dasharray="6 4"/>
<text class="small" x="120" y="345">seasonal wet layer</text>
<path d="M 200 220 L 360 140 L 520 220 Z" fill="#e8dcc8" stroke="#8b5e34" stroke-width="2"/>
<text class="small" x="360" y="185" text-anchor="middle">amended berm (plant high)</text>
<ellipse cx="360" cy="130" rx="70" ry="18" fill="#5c4a32" opacity="0.5"/>
<text class="small" x="360" y="118" text-anchor="middle" fill="#ffffff">mulch ring (not on trunk)</text>
<rect x="340" y="95" width="40" height="50" fill="#2f5d4a" rx="4"/>
<text fill="#ffffff" class="small" x="360" y="125" text-anchor="middle">trunk</text>
<defs><marker id='arrowhead' markerWidth='8' markerHeight='8' refX='6' refY='4' orient='auto'><polygon points='0 0, 8 4, 0 8' fill='#9aa89f'/></marker></defs>
<line x1="280" y1="200" x2="280" y2="240" stroke="#2f5d4a" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="400" y1="200" x2="400" y2="240" stroke="#2f5d4a" stroke-width="2" marker-end="url(#arrowhead)"/>
<text class="label" x="240" y="255">water moves down &amp; out</text>
</svg>
