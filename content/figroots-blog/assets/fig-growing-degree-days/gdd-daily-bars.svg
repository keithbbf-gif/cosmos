<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
<desc id="desc">Bar chart of illustrative daily GDD50 units for one week.</desc>
<title id="title">Schematic GDD50 daily accumulation</title>
<rect width="100%" height="100%" fill="#f7f4ef"/>
<style>text { font-family: system-ui, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1c2420; } .label { font-size: 13px; } .small { font-size: 11px; fill: #5c6b63; } .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }</style>
<text class="small">
<tspan x="24" y="28">Illustrative bars only — not weather data for your zip. Formula shown</tspan>
<tspan x="24" dy="16">is GDD50.</tspan>
</text>
<line x1="88" y1="290" x2="680" y2="290" stroke="#1c2420" stroke-width="1.5"/>
<text class="small">
<tspan x="28" y="210">GDD50</tspan>
<tspan x="28" dy="14">units</tspan>
</text>
<rect x="100" y="153" width="56" height="137" rx="6" fill="#d4e4dc" stroke="#2f5d4a" stroke-width="1.5"/>
<text class="mono" x="128.0" y="312" text-anchor="middle">Mon</text>
<text class="small" x="128.0" y="145" text-anchor="middle">25</text>
<rect x="180" y="120" width="56" height="170" rx="6" fill="#d4e4dc" stroke="#2f5d4a" stroke-width="1.5"/>
<text class="mono" x="208.0" y="312" text-anchor="middle">Tue</text>
<text class="small" x="208.0" y="112" text-anchor="middle">31</text>
<rect x="260" y="192" width="56" height="98" rx="6" fill="#d4e4dc" stroke="#2f5d4a" stroke-width="1.5"/>
<text class="mono" x="288.0" y="312" text-anchor="middle">Wed</text>
<text class="small" x="288.0" y="184" text-anchor="middle">18</text>
<rect x="340" y="142" width="56" height="148" rx="6" fill="#d4e4dc" stroke="#2f5d4a" stroke-width="1.5"/>
<text class="mono" x="368.0" y="312" text-anchor="middle">Thu</text>
<text class="small" x="368.0" y="134" text-anchor="middle">27</text>
<rect x="420" y="164" width="56" height="126" rx="6" fill="#d4e4dc" stroke="#2f5d4a" stroke-width="1.5"/>
<text class="mono" x="448.0" y="312" text-anchor="middle">Fri</text>
<text class="small" x="448.0" y="156" text-anchor="middle">23</text>
<rect x="500" y="131" width="56" height="159" rx="6" fill="#d4e4dc" stroke="#2f5d4a" stroke-width="1.5"/>
<text class="mono" x="528.0" y="312" text-anchor="middle">Sat</text>
<text class="small" x="528.0" y="123" text-anchor="middle">29</text>
<rect x="580" y="175" width="56" height="115" rx="6" fill="#d4e4dc" stroke="#2f5d4a" stroke-width="1.5"/>
<text class="mono" x="608.0" y="312" text-anchor="middle">Sun</text>
<text class="small" x="608.0" y="167" text-anchor="middle">21</text>
<rect x="24" y="318" width="672" height="36" rx="4" fill="#ffffff" stroke="#9aa89f" stroke-width="1.5"/>
<text class="small">
<tspan x="36" y="338">GDD50 = max(0, (Tmax + Tmin) / 2 − 50°F). Some calculators cap Tmax at 86°F — check yours.</tspan>
</text>
</svg>
