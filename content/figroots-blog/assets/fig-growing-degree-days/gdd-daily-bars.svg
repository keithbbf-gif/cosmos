<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-labelledby="title desc">
<title id="title">Schematic GDD50 daily accumulation</title>
<rect width="100%" height="100%" fill="#f7f4ef"/>
<style>text { font-family: system-ui, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1c2420; } .label { font-size: 13px; } .small { font-size: 11px; fill: #5c6b63; } .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }</style>
<text class="small">
<tspan x="24" dy="0">Illustrative bars only — not weather data for your zip. Formula shown</tspan>
<tspan x="24" dy="16">is GDD50.</tspan>
</text>
<rect x="80" y="151" width="56" height="129" rx="6" fill="#d4e4dc" stroke="#2f5d4a" stroke-width="1.5"/>
<text class="mono" x="108.0" y="302" text-anchor="middle">Mon</text>
<text class="small" x="108.0" y="143" text-anchor="middle">25</text>
<rect x="160" y="120" width="56" height="160" rx="6" fill="#d4e4dc" stroke="#2f5d4a" stroke-width="1.5"/>
<text class="mono" x="188.0" y="302" text-anchor="middle">Tue</text>
<text class="small" x="188.0" y="112" text-anchor="middle">31</text>
<rect x="240" y="188" width="56" height="92" rx="6" fill="#d4e4dc" stroke="#2f5d4a" stroke-width="1.5"/>
<text class="mono" x="268.0" y="302" text-anchor="middle">Wed</text>
<text class="small" x="268.0" y="180" text-anchor="middle">18</text>
<rect x="320" y="141" width="56" height="139" rx="6" fill="#d4e4dc" stroke="#2f5d4a" stroke-width="1.5"/>
<text class="mono" x="348.0" y="302" text-anchor="middle">Thu</text>
<text class="small" x="348.0" y="133" text-anchor="middle">27</text>
<rect x="400" y="162" width="56" height="118" rx="6" fill="#d4e4dc" stroke="#2f5d4a" stroke-width="1.5"/>
<text class="mono" x="428.0" y="302" text-anchor="middle">Fri</text>
<text class="small" x="428.0" y="154" text-anchor="middle">23</text>
<rect x="480" y="131" width="56" height="149" rx="6" fill="#d4e4dc" stroke="#2f5d4a" stroke-width="1.5"/>
<text class="mono" x="508.0" y="302" text-anchor="middle">Sat</text>
<text class="small" x="508.0" y="123" text-anchor="middle">29</text>
<rect x="560" y="172" width="56" height="108" rx="6" fill="#d4e4dc" stroke="#2f5d4a" stroke-width="1.5"/>
<text class="mono" x="588.0" y="302" text-anchor="middle">Sun</text>
<text class="small" x="588.0" y="164" text-anchor="middle">21</text>
<rect x="24" y="300" width="672" height="32" rx="4" fill="#ffffff" stroke="#9aa89f" stroke-width="1.5"/>
<text class="small">
<tspan x="36" dy="0">GDD50 = max(0, (Tmax + Tmin) / 2 − 50°F). Some calculators cap Tmax at 86°F — check yours.</tspan>
</text>
</svg>
