<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
<desc id="desc">Flowchart for filtering late fig varieties by local heat budget.</desc>
<title id="title">Variety heat-budget filter (grower workflow)</title>
<rect width="100%" height="100%" fill="#f7f4ef"/>
<style>text { font-family: system-ui, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1c2420; } .label { font-size: 13px; } .small { font-size: 11px; fill: #5c6b63; } .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }</style>
<defs><marker id='arrowhead' markerWidth='8' markerHeight='8' refX='6' refY='4' orient='auto'><polygon points='0 0, 8 4, 0 8' fill='#9aa89f'/></marker></defs>
<text class="small">
<tspan x="24" y="24">Decision flow — not a ripening guarantee.</tspan>
</text>
<rect x="260" y="56" width="200" height="48" rx="6" fill="#e8dcc8" stroke="#8b5e34" stroke-width="1.5"/>
<text class="label" x="360.0" y="78" text-anchor="middle">Late variety</text>
<text class="label" x="360.0" y="94" text-anchor="middle">on the label?</text>
<rect x="260" y="140" width="200" height="48" rx="6" fill="#e8dcc8" stroke="#8b5e34" stroke-width="1.5"/>
<text class="label" x="360.0" y="162" text-anchor="middle">GDD50 from</text>
<text class="label" x="360.0" y="178" text-anchor="middle">your spring start</text>
<rect x="260" y="224" width="200" height="48" rx="6" fill="#e8dcc8" stroke="#8b5e34" stroke-width="1.5"/>
<text class="label" x="360.0" y="246" text-anchor="middle">Finishes before</text>
<text class="label" x="360.0" y="262" text-anchor="middle">your local frost?</text>
<rect x="80" y="328" width="180" height="48" rx="6" fill="#e8dcc8" stroke="#8b5e34" stroke-width="1.5"/>
<text class="label" x="170.0" y="350" text-anchor="middle">Trial row /</text>
<text class="label" x="170.0" y="366" text-anchor="middle">pot shuffle</text>
<rect x="440" y="328" width="180" height="48" rx="6" fill="#e8dcc8" stroke="#8b5e34" stroke-width="1.5"/>
<text class="label" x="530.0" y="350" text-anchor="middle">Family row /</text>
<text class="label" x="530.0" y="366" text-anchor="middle">harvest</text>
<line x1="360" y1="104" x2="360" y2="140" stroke="#9aa89f" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="360" y1="188" x2="360" y2="224" stroke="#9aa89f" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="300" y1="272" x2="170" y2="328" stroke="#9aa89f" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="420" y1="272" x2="530" y2="328" stroke="#9aa89f" stroke-width="2" marker-end="url(#arrowhead)"/>
<text class="small" x="150" y="318">No / tight</text>
<text class="small" x="500" y="318">Yes</text>
</svg>
