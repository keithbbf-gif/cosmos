<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Counter-height island overhang and knee space</title>
  <desc id="desc">Side elevation showing a 36-inch counter with a 15-inch seating overhang and 24-inch-wide stool space per person.</desc>
  <rect width="720" height="360" fill="#f8f7f4"/>
  <rect x="80" y="220" width="420" height="24" fill="#8a8278"/>
  <rect x="80" y="80" width="300" height="140" fill="#d4cabb" stroke="#5c5348" stroke-width="2"/>
  <rect x="380" y="100" width="120" height="20" fill="#b8aea0" stroke="#5c5348" stroke-width="1.5"/>
  <line x1="380" y1="220" x2="380" y2="120" stroke="#1d5a8a" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="400" y="175" font-family="system-ui,sans-serif" font-size="12" fill="#1d5a8a">153 knee depth</text>
  <line x1="500" y1="220" x2="500" y2="100" stroke="#2f6f4e" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="520" y="165" font-family="system-ui,sans-serif" font-size="12" fill="#2f6f4e">Overhang</text>
  <rect x="420" y="244" width="48" height="72" fill="#c9bfb0" stroke="#5c5348" stroke-width="1.5" rx="4"/>
  <text x="444" y="290" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#3d3832">Stool</text>
  <line x1="420" y1="330" x2="468" y2="330" stroke="#3d3832" stroke-width="1.5"/>
  <text x="444" y="348" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#3d3832">243 per person</text>
  <text x="200" y="70" font-family="system-ui,sans-serif" font-size="13" fill="#3d3832">363 counter height (typical)</text>
</svg>
