<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img">
  <title>Top-down kitchen floor plan with a central island and labeled work aisles</title>
  <desc>Schematic plan view: perimeter counters, a rectangular island, and minimum aisle widths between runs.</desc>
  <rect width="880" height="520" fill="#f8fafb"/>
  <rect x="40" y="40" width="800" height="440" fill="#e8eef2" stroke="#1f2933" stroke-width="2"/>
  <rect x="40" y="40" width="800" height="72" fill="#d4e4d9" stroke="#1f2933" stroke-width="1.5"/>
  <rect x="40" y="408" width="800" height="72" fill="#d4e4d9" stroke="#1f2933" stroke-width="1.5"/>
  <rect x="40" y="112" width="72" height="296" fill="#d4e4d9" stroke="#1f2933" stroke-width="1.5"/>
  <rect x="768" y="112" width="72" height="296" fill="#d4e4d9" stroke="#1f2933" stroke-width="1.5"/>
  <rect x="300" y="200" width="280" height="120" fill="#f5e6d3" stroke="#1f2933" stroke-width="2"/>
  <rect x="300" y="192" width="280" height="8" fill="#ffffff" stroke="#1f2933" stroke-width="1"/>
  <text x="440" y="265" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#1f2933">ISLAND (PLAN)</text>
  <line x1="112" y1="260" x2="300" y2="260" stroke="#52606d" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="206" y="248" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#52606d">42-48 in work aisle</text>
  <line x1="580" y1="260" x2="768" y2="260" stroke="#52606d" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="674" y="248" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#52606d">42-48 in work aisle</text>
  <text x="440" y="500" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#52606d">Editorial schematic - not a permit plan. NKBA-style aisle targets shown.</text>
</svg>
