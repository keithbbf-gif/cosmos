<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" role="img">
  <title>From work triangle to work zones around a kitchen island</title>
  <desc>Plan diagram: sink, range, and refrigerator linked as zones with an island interrupting straight triangle legs.</desc>
  <rect width="880" height="480" fill="#f8fafb"/>
  <rect x="80" y="60" width="720" height="360" fill="#e8eef2" stroke="#1f2933" stroke-width="1.5"/>
  <rect x="340" y="180" width="200" height="100" fill="#f5e6d3" stroke="#1f2933" stroke-width="2"/>
  <circle cx="160" cy="120" r="36" fill="#d4e4d9" stroke="#1f2933" stroke-width="1.5"/>
  <text x="160" y="125" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1f2933">SINK</text>
  <circle cx="720" cy="120" r="36" fill="#d4e4d9" stroke="#1f2933" stroke-width="1.5"/>
  <text x="720" y="125" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1f2933">RANGE</text>
  <circle cx="160" cy="360" r="36" fill="#d4e4d9" stroke="#1f2933" stroke-width="1.5"/>
  <text x="160" y="365" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#1f2933">REFRIG</text>
  <polygon points="160,120 720,120 160,360" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="440" y="440" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#52606d">Classic triangle (dashed) vs. island zones you actually walk; prep on the island breaks the old geometry.</text>
</svg>
