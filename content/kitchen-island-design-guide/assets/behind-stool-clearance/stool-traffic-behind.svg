<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img">
  <title>Clearance behind island stools for walking traffic</title>
  <desc>Plan strip: island with stool seats and dimension lines for 32, 36, and 44 inch paths behind seated diners.</desc>
  <rect width="880" height="400" fill="#f8fafb"/>
  <rect x="200" y="120" width="480" height="100" fill="#f5e6d3" stroke="#1f2933" stroke-width="2"/>
  <rect x="240" y="220" width="40" height="24" fill="#e8eef2" stroke="#1f2933"/>
  <rect x="320" y="220" width="40" height="24" fill="#e8eef2" stroke="#1f2933"/>
  <rect x="400" y="220" width="40" height="24" fill="#e8eef2" stroke="#1f2933"/>
  <rect x="480" y="220" width="40" height="24" fill="#e8eef2" stroke="#1f2933"/>
  <rect x="560" y="220" width="40" height="24" fill="#e8eef2" stroke="#1f2933"/>
  <line x1="200" y1="244" x2="120" y2="244" stroke="#1f2933"/>
  <text x="160" y="236" text-anchor="middle" font-size="11" fill="#52606d">32 min</text>
  <line x1="680" y1="244" x2="760" y2="244" stroke="#1f2933"/>
  <text x="720" y="236" text-anchor="middle" font-size="11" fill="#52606d">36 walk</text>
  <text x="440" y="320" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#1f2933">44 in feels like a hallway — use when the island is also a serving lane.</text>
  <text x="440" y="360" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#52606d">Do not steal cook-side aisle width to buy stool clearance.</text>
</svg>
