<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img">
  <title>NEC 2023 island receptacle locations versus obsolete side outlets</title>
  <desc>Plan of island top showing allowed receptacle positions under the counter edge and a crossed-out side outlet location.</desc>
  <rect width="880" height="420" fill="#f8fafb"/>
  <rect x="220" y="140" width="440" height="140" fill="#f5e6d3" stroke="#1f2933" stroke-width="2"/>
  <rect x="220" y="132" width="440" height="8" fill="#fff" stroke="#1f2933"/>
  <circle cx="300" cy="200" r="10" fill="#d4e4d9" stroke="#1f2933"/>
  <circle cx="440" cy="200" r="10" fill="#d4e4d9" stroke="#1f2933"/>
  <circle cx="580" cy="200" r="10" fill="#d4e4d9" stroke="#1f2933"/>
  <text x="440" y="205" text-anchor="middle" font-size="11" fill="#1f2933">TOP - allowed serving locations (210.52(C)(3))</text>
  <line x1="660" y1="210" x2="700" y2="250" stroke="#b91c1c" stroke-width="2"/>
  <line x1="660" y1="250" x2="700" y2="210" stroke="#b91c1c" stroke-width="2"/>
  <text x="730" y="235" font-size="11" fill="#b91c1c">Side outlet serving counter - obsolete practice</text>
  <text x="440" y="360" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#52606d">2023: island top receptacle optional; future provision required if omitted. Confirm adopted NEC with AHJ.</text>
</svg>
