<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="t d">
  <title id="t">Schematic map of Bradley County between the Saline and Ouachita rivers</title>
  <desc id="d">Educational schematic; not a surveyed plat.</desc>
  <rect width="100%" height="100%" fill="#f4f1ea"/>
  <text x="32" y="28" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5c5c5c" letter-spacing="0.08em">SCHEMATIC  NOT TO SCALE</text>
  <path d="M120 80 L120 400 L600 400 L600 80 Z" fill="#d8e8f0" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="90" y="240" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a6fa5" transform="rotate(-90 90 240)">Saline River</text>
  <path d="M600 80 L600 400" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="630" y="240" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a6fa5">Ouachita River</text>
  <ellipse cx="360" cy="240" rx="120" ry="90" fill="#e8dcc8" stroke="#6b5344" stroke-width="1"/>
  <text x="360" y="235" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1c1c1c">Bradley County</text>
  <text x="360" y="255" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5c5c5c">peninsula between rivers</text>
  <circle cx="390" cy="270" r="5" fill="#8b4513"/>
  <text x="405" y="274" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5c5c5c">Warren (schematic)</text>
  <text x="32" y="456" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5c5c5c">Redrawn diagram for orientation  verify against USGS / county sources for navigation</text>
</svg>
