<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" role="img" aria-labelledby="t1">
  <title id="t1">Public open-stack milestones, 2015-2026</title>
  <desc>Editorial timeline of TensorFlow, PyTorch, Hugging Face Transformers, TensorFlow 2, PyTorch Foundation, LLaMA, Llama 3.1, and 2025–2026 open-weight releases.</desc>
  <rect width="960" height="220" fill="#f7f4ee"/>
  <text x="24" y="28" font-family="Georgia, serif" font-size="16" fill="#222">Public open-stack milestones, 2015-2026</text>
  <line x1="40" y1="120" x2="920" y2="120" stroke="#222" stroke-width="2"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#222">
    <g transform="translate(40,120)">
      <circle cy="0" r="5" fill="#222"/><text y="-16" text-anchor="middle">2015</text><text y="28" text-anchor="middle">TensorFlow</text>
    </g>
    <g transform="translate(155,120)">
      <circle cy="0" r="5" fill="#222"/><text y="-16" text-anchor="middle">2016</text><text y="28" text-anchor="middle">PyTorch</text>
    </g>
    <g transform="translate(270,120)">
      <circle cy="0" r="5" fill="#222"/><text y="-16" text-anchor="middle">2018</text><text y="28" text-anchor="middle">HF wheel</text>
    </g>
    <g transform="translate(385,120)">
      <circle cy="0" r="5" fill="#222"/><text y="-16" text-anchor="middle">2019</text><text y="28" text-anchor="middle">TF 2.0</text>
    </g>
    <g transform="translate(500,120)">
      <circle cy="0" r="5" fill="#222"/><text y="-16" text-anchor="middle">2022</text><text y="28" text-anchor="middle">PT Found.</text>
    </g>
    <g transform="translate(615,120)">
      <circle cy="0" r="5" fill="#222"/><text y="-16" text-anchor="middle">2023</text><text y="28" text-anchor="middle">LLaMA</text>
    </g>
    <g transform="translate(730,120)">
      <circle cy="0" r="5" fill="#222"/><text y="-16" text-anchor="middle">2024</text><text y="28" text-anchor="middle">Llama 3.1</text>
    </g>
    <g transform="translate(845,120)">
      <circle cy="0" r="5" fill="#222"/><text y="-16" text-anchor="middle">2025-26</text><text y="28" text-anchor="middle">R1 / oss / 4</text>
    </g>
  </g>
  <text x="24" y="200" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#555">Redrawn editorial timeline. Dates from first-party posts named in BIBLIOGRAPHY.md.</text>
</svg>
