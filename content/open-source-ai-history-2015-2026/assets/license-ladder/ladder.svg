<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 290" role="img" aria-labelledby="t3">
  <title id="t3">License ladder from research-only to OSI-approved</title>
  <desc>Three rungs from research-only weight grants through community licenses to Apache 2.0, MIT, and CC BY–shaped terms named in the essays.</desc>
  <rect width="960" height="290" fill="#f7f4ee"/>
  <text x="24" y="28" font-family="Georgia, serif" font-size="16" fill="#222">A ladder, not a compliment</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#222">
    <rect x="80" y="44" width="88" height="22" rx="4" fill="#dce8dc" stroke="#222"/>
    <text x="124" y="59" text-anchor="middle" font-weight="600">Apache 2.0</text>
    <rect x="176" y="44" width="56" height="22" rx="4" fill="#dce8dc" stroke="#222"/>
    <text x="204" y="59" text-anchor="middle" font-weight="600">MIT</text>
    <rect x="240" y="44" width="72" height="22" rx="4" fill="#efe8d8" stroke="#222"/>
    <text x="276" y="59" text-anchor="middle" font-weight="600">CC BY 4.0</text>
    <text x="330" y="59" font-size="10" fill="#555">Editorial badges — not official license buttons.</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#222">
    <rect x="80" y="200" width="800" height="40" fill="#fff" stroke="#222"/>
    <text x="480" y="225" text-anchor="middle">Research / non-commercial grant (LLaMA 1, some early cards)</text>
    <rect x="80" y="148" width="800" height="40" fill="#efe8d8" stroke="#222"/>
    <text x="480" y="173" text-anchor="middle">Community / acceptable-use (Llama 2-4, Gemma 1-3 Terms)</text>
    <rect x="80" y="96" width="800" height="40" fill="#dce8dc" stroke="#222"/>
    <text x="480" y="121" text-anchor="middle">OSI-shaped licenses on weights and code (Apache 2.0, MIT: TF, PT, Mixtral, R1, gpt-oss, Gemma 4)</text>
  </g>
  <text x="24" y="274" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#555">Placement is illustrative. Read the named license file, not this drawing.</text>
</svg>
