<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
  <title id="title">Wilmar arc 1848–2020</title>
  <desc id="desc">Selected ticks: land entries, mill, college, dinner, gas, census.</desc>
  <rect width="900" height="260" fill="#f4efe6"/>
  <text x="450" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="16">Wilmar — selected ticks (not a complete chronicle)</text>
  <line x1="40" y1="140" x2="860" y2="140" stroke="#1d3557" stroke-width="3"/>
  <g font-family="Georgia, serif" font-size="10" text-anchor="middle">
    <circle cx="70" cy="140" r="4" fill="#6d2e46"/><text x="70" y="170">1848 Govan</text>
    <circle cx="150" cy="140" r="4" fill="#6d2e46"/><text x="150" y="120">1859 $1/acre</text>
    <circle cx="240" cy="140" r="4" fill="#6d2e46"/><text x="240" y="170">1884 Wilmar PO</text>
    <circle cx="330" cy="140" r="4" fill="#6d2e46"/><text x="330" y="120">1890 Gates</text>
    <circle cx="410" cy="140" r="4" fill="#6d2e46"/><text x="410" y="170">1897 school</text>
    <circle cx="490" cy="140" r="4" fill="#6d2e46"/><text x="490" y="120">1907 close</text>
    <circle cx="570" cy="140" r="4" fill="#6d2e46"/><text x="570" y="170">1920 1,034</text>
    <circle cx="650" cy="140" r="4" fill="#6d2e46"/><text x="650" y="120">1924 mill</text>
    <circle cx="730" cy="140" r="4" fill="#6d2e46"/><text x="730" y="170">1948 turbine</text>
    <circle cx="830" cy="140" r="4" fill="#6d2e46"/><text x="830" y="120">2020 395</text>
  </g>
  <text x="450" y="230" text-anchor="middle" font-family="Georgia, serif" font-size="11">Pack graphic AS-TL-01 · June Dinner is older than most ticks and is not a point on this line</text>
</svg>
