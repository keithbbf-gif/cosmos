<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Logging roads and the Iron Mountain Warren Branch</title>
  <desc id="desc">Schematic: Iron Mountain Warren Branch, Wilmar and Saline Valley Railroad, Warren and Saline River Railroad kept distinct.</desc>
  <rect width="800" height="420" fill="#f4efe6"/>
  <text x="400" y="32" text-anchor="middle" font-family="Georgia, serif" font-size="17">Three different railroads (schematic)</text>
  <line x1="80" y1="160" x2="720" y2="160" stroke="#6d2e46" stroke-width="6"/>
  <text x="400" y="145" text-anchor="middle" font-family="Georgia, serif" font-size="13">Iron Mountain / MoPac Warren Branch</text>
  <circle cx="280" cy="160" r="7" fill="#1d3557"/>
  <text x="255" y="190" font-family="Georgia, serif" font-size="12">Wilmar</text>
  <circle cx="420" cy="160" r="7" fill="#1d3557"/>
  <text x="395" y="190" font-family="Georgia, serif" font-size="12">Monticello</text>
  <circle cx="160" cy="160" r="7" fill="#1d3557"/>
  <text x="135" y="190" font-family="Georgia, serif" font-size="12">Warren</text>
  <path d="M280,160 L280,300 L200,360" stroke="#3d5a80" stroke-width="4" fill="none" stroke-dasharray="8 6"/>
  <text x="300" y="280" font-family="Georgia, serif" font-size="12">W&amp;SV (Gates, 1904)</text>
  <path d="M160,160 L160,280 L120,340" stroke="#9b2226" stroke-width="4" fill="none" stroke-dasharray="2 6"/>
  <text x="20" y="300" font-family="Georgia, serif" font-size="12">W&amp;SR (Bradley)</text>
  <text x="400" y="400" text-anchor="middle" font-family="Georgia, serif" font-size="11">Pack graphic AS-MAP-03 · do not confuse W&amp;SV with W&amp;SR</text>
</svg>
