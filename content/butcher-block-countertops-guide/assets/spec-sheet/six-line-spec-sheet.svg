<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" role="img">
  <title>Six-line wood island top specification sheet</title>
  <desc>Checklist fields: species, grain, thickness, finish, fasteners, and wet-work policy for butcher-block island orders.</desc>
  <rect width="880" height="480" fill="#f8fafb"/>
  <rect x="120" y="60" width="640" height="360" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/>
  <text x="440" y="95" text-anchor="middle" font-size="14" fill="#1f2933">WOOD TOP SPEC  SIX LINES</text>
  <text x="160" y="140" font-size="12" fill="#1f2933">1. Species _______________________</text>
  <text x="160" y="175" font-size="12" fill="#1f2933">2. Grain (edge / end / face) ______</text>
  <text x="160" y="210" font-size="12" fill="#1f2933">3. Thickness _____________________</text>
  <text x="160" y="245" font-size="12" fill="#1f2933">4. Finish ________________________</text>
  <text x="160" y="280" font-size="12" fill="#1f2933">5. Fasteners _____________________</text>
  <text x="160" y="315" font-size="12" fill="#1f2933">6. Wet work (sink / none) ________</text>
  <text x="440" y="380" text-anchor="middle" font-size="10" fill="#52606d">Date · mill · dealer · cut allowed yes/no</text>
