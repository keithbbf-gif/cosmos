<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img">
  <title>Wood island top on a cabinet box  schematic</title>
  <desc>Top-down floor plan with a central island cabinet and an edge-grain wood countertop labeled as a separate contract from the box.</desc>
  <rect width="880" height="520" fill="#f8fafb"/>
  <rect x="40" y="40" width="800" height="440" fill="#e8eef2" stroke="#1f2933" stroke-width="1.5"/>
  <rect x="280" y="160" width="320" height="200" fill="#f5e6d3" stroke="#1f2933" stroke-width="1.5"/>
  <rect x="300" y="140" width="280" height="24" fill="#d4a574" stroke="#8b4513"/>
  <text x="440" y="132" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1f2933">EDGE-GRAIN WOOD TOP (oil or film)</text>
  <text x="440" y="280" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#1f2933">BRADLEY ISLAND BOX</text>
  <text x="440" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#52606d">rails, seating height, freight weight</text>
  <path d="M120,120 L760,120" stroke="#52606d" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="440" y="108" text-anchor="middle" font-size="10" fill="#52606d">perimeter counters (other materials)</text>
</svg>
