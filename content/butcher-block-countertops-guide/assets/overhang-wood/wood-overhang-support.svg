<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img">
  <title>Wood countertop overhang and knee-space support</title>
  <desc>Section showing 12-inch seating fly on edge-grain top with corbel bracket and maximum unsupported depth callout.</desc>
  <rect width="880" height="400" fill="#f8fafb"/>
  <rect x="200" y="120" width="280" height="36" fill="#d4a574" stroke="#1f2933"/>
  <rect x="480" y="120" width="200" height="36" fill="#c4956a" stroke="#8b4513"/>
  <text x="580" y="110" text-anchor="middle" font-size="10" fill="#52606d">seating fly</text>
  <rect x="200" y="156" width="200" height="120" fill="#f5e6d3" stroke="#1f2933"/>
  <path d="M480,156 L500,220 L480,220 Z" fill="#6b7280" stroke="#1f2933"/>
  <text x="510" y="200" font-size="10" fill="#52606d">bracket</text>
  <line x1="480" y1="156" x2="680" y2="156" stroke="#52606d" stroke-dasharray="4 3"/>
  <text x="580" y="200" text-anchor="middle" font-size="11" fill="#1f2933">~12 in fly typical</text>
  <text x="440" y="320" text-anchor="middle" font-size="11" fill="#52606d">Thicker top helps; steel helps more</text>
</svg>
