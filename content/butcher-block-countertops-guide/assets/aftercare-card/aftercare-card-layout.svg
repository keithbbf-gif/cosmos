<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img">
  <title>Aftercare card layout for oiled butcher-block island tops</title>
  <desc>Mock care card with oil schedule, never-soak line, trivet reminder, and tape-in-trash-pull delivery note.</desc>
  <rect width="880" height="420" fill="#f8fafb"/>
  <rect x="200" y="50" width="480" height="300" fill="#fffbeb" stroke="#1f2933" stroke-width="1.5"/>
  <text x="440" y="90" text-anchor="middle" font-size="14" fill="#1f2933">WOOD TOP CARE CARD</text>
  <text x="240" y="130" font-size="11" fill="#1f2933">" Wipe spills; never soak</text>
  <text x="240" y="160" font-size="11" fill="#1f2933">" Mineral oil when pale (quarterly habit)</text>
  <text x="240" y="190" font-size="11" fill="#1f2933">" Trivet for hot pans; board for knives</text>
  <text x="240" y="220" font-size="11" fill="#1f2933">" No dishwasher; no cooking oil</text>
  <text x="440" y="300" text-anchor="middle" font-size="10" fill="#52606d">Tape copy in trash pull · date the sheet</text>
</svg>
