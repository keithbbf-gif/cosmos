<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img">
  <title>Mineral oil maintenance schedule for butcher-block island tops</title>
  <desc>Timeline for first-year oiling: heavy month one, then quarterly wipe, with winter dry-season touch-up callout.</desc>
  <rect width="880" height="360" fill="#f8fafb"/>
  <line x1="80" y1="180" x2="800" y2="180" stroke="#1f2933" stroke-width="2"/>
  <circle cx="120" cy="180" r="8" fill="#b45309"/>
  <text x="120" y="150" text-anchor="middle" font-size="11" fill="#1f2933">Week 1</text>
  <text x="120" y="210" text-anchor="middle" font-size="10" fill="#52606d">saturate, wipe dry</text>
  <circle cx="280" cy="180" r="8" fill="#b45309"/>
  <text x="280" y="150" text-anchor="middle" font-size="11" fill="#1f2933">Month 1</text>
  <text x="280" y="210" text-anchor="middle" font-size="10" fill="#52606d">repeat until matte</text>
  <circle cx="480" cy="180" r="8" fill="#d4a574"/>
  <text x="480" y="150" text-anchor="middle" font-size="11" fill="#1f2933">Quarterly</text>
  <text x="480" y="210" text-anchor="middle" font-size="10" fill="#52606d">thin wipe when pale</text>
  <circle cx="680" cy="180" r="8" fill="#d4a574"/>
  <text x="680" y="150" text-anchor="middle" font-size="11" fill="#1f2933">Winter</text>
  <text x="680" y="210" text-anchor="middle" font-size="10" fill="#52606d">forced-air dry spell</text>
  <text x="440" y="300" text-anchor="middle" font-size="11" fill="#52606d">Oil is a habit  not a one-can promise</text>
</svg>
