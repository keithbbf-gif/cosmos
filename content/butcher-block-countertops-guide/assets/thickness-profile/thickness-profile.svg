<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img">
  <title>Butcher-block top thickness profiles for island countertops</title>
  <desc>Side elevation comparing 1.25, 1.5, and 2.5 inch edge-grain top thickness with built-up edge callout.</desc>
  <rect width="880" height="400" fill="#f8fafb"/>
  <g transform="translate(80,80)">
    <rect x="0" y="80" width="180" height="25" fill="#d4a574" stroke="#1f2933"/>
    <text x="90" y="70" text-anchor="middle" font-size="12" fill="#1f2933">1.25 in</text>
    <text x="90" y="130" text-anchor="middle" font-size="10" fill="#52606d">light island, short fly</text>
  </g>
  <g transform="translate(320,80)">
    <rect x="0" y="65" width="180" height="40" fill="#d4a574" stroke="#1f2933"/>
    <text x="90" y="55" text-anchor="middle" font-size="12" fill="#1f2933">1.5 in</text>
    <text x="90" y="130" text-anchor="middle" font-size="10" fill="#52606d">common residential default</text>
  </g>
  <g transform="translate(560,80)">
    <rect x="0" y="35" width="180" height="70" fill="#d4a574" stroke="#1f2933"/>
    <rect x="0" y="35" width="180" height="12" fill="#c4956a" stroke="#8b4513"/>
    <text x="90" y="25" text-anchor="middle" font-size="12" fill="#1f2933">2.5 in + built-up nose</text>
    <text x="90" y="130" text-anchor="middle" font-size="10" fill="#52606d">seating overhang, end grain</text>
  </g>
  <line x1="60" y1="200" x2="820" y2="200" stroke="#52606d" stroke-width="1"/>
  <text x="440" y="230" text-anchor="middle" font-size="11" fill="#52606d">Thickness is structure  not a mood-board slider</text>
</svg>
