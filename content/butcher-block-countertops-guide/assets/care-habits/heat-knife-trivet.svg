<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img">
  <title>Knives, heat, and trivets on wood island countertops</title>
  <desc>Side view of wood top with hot pan on trivet, cutting board for knives, and scorch mark warning on bare wood.</desc>
  <rect width="880" height="360" fill="#f8fafb"/>
  <rect x="120" y="140" width="640" height="40" fill="#d4a574" stroke="#1f2933"/>
  <rect x="200" y="100" width="80" height="12" fill="#6b7280" stroke="#1f2933"/>
  <text x="240" y="92" text-anchor="middle" font-size="10" fill="#52606d">trivet</text>
  <circle cx="240" cy="94" r="28" fill="#9ca3af" stroke="#1f2933" opacity="0.5"/>
  <rect x="480" y="110" width="100" height="8" fill="#deb887" stroke="#8b4513"/>
  <text x="530" y="100" text-anchor="middle" font-size="10" fill="#52606d">cutting board</text>
  <path d="M700,140 Q720,100 740,140" fill="none" stroke="#b91c1c" stroke-width="2"/>
  <text x="720" y="175" text-anchor="middle" font-size="10" fill="#b91c1c">scorch</text>
  <text x="440" y="260" text-anchor="middle" font-size="11" fill="#52606d">Heat and knives are habits  the top is wood, not stone</text>
</svg>
