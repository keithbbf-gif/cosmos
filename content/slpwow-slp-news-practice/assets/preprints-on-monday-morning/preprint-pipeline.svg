<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" role="img" aria-labelledby="title desc">
  <title id="title">Preprint to journal path (schematic)</title>
  <desc id="desc">Flow schematic from preprint server upload through peer review to version of record.</desc>
  <defs>
<style>
.bg { fill: #FAF9F7; }
.title { font-family: Georgia, serif; font-size: 16px; font-weight: 600; fill: #1E293B; }
.dek { font-family: system-ui, sans-serif; font-size: 11px; fill: #64748B; }
.label { font-family: system-ui, sans-serif; font-size: 11px; fill: #64748B; }
.strong { font-family: system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #1E293B; }
.card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; }
.band-teal { fill: #CCFBF1; }
.band-amber { fill: #FEF3C7; }
.band-indigo { fill: #E0E7FF; }
.accent-teal { fill: #0F766E; }
.accent-amber { fill: #B45309; }
.arrow { stroke: #0F766E; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
.note { font-family: system-ui, sans-serif; font-size: 10px; fill: #64748B; }
</style>
  <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#0F766E"/>
  </marker>
  </defs>
  <rect class="bg" width="880" height="420"/>
  <text x="40" y="36" class="title">Preprint Monday path</text>
  <text x="40" y="56" class="dek">Not yet through review</text>
  <rect class="card" x="40" y="76" width="800" height="300" rx="8"/>
  <rect class="band-teal" x="56" y="120" width="180" height="100" rx="4"/>
  <text x="66" y="148" class="strong">Preprint posted</text>
  <text x="66" y="168" class="label">No volume number yet</text>
  <line class="arrow" x1="228" y1="170" x2="246" y2="170"/>
  <rect class="band-indigo" x="248" y="120" width="180" height="100" rx="4"/>
  <text x="258" y="148" class="strong">Peer review</text>
  <text x="258" y="168" class="label">Methods challenged in public</text>
  <line class="arrow" x1="420" y1="170" x2="438" y2="170"/>
  <rect class="band-amber" x="440" y="120" width="180" height="100" rx="4"/>
  <text x="450" y="148" class="strong">Version of record</text>
  <text x="450" y="168" class="label">Citation anchor changes</text>
  <line class="arrow" x1="612" y1="170" x2="630" y2="170"/>
  <rect class="band-teal" x="632" y="120" width="180" height="100" rx="4"/>
  <text x="642" y="148" class="strong">Clinic use</text>
  <text x="642" y="168" class="label">Interesting · not protocol yet</text>
  <text x="40" y="404" class="note">SLPWOW original schematic — typography only. No AI-generated faces.</text>
</svg>
