<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Spar versus interior varnish</title>
  <desc id="desc">Diagram: UV absorbers and longer oil in spar versus interior alkyd</desc>
  <rect width="100%" height="100%" fill="#F7F3E8"/>
  <text x="32" y="44" fill="#1A1A1A" font-family="Georgia, serif" font-size="20" font-weight="600">Spar versus interior varnish</text>
  <text x="48" y="100" fill="#1A1A1A" font-family="sans-serif" font-size="14" font-weight="600">Property</text>
  <text x="220" y="100" fill="#1A1A1A" font-family="sans-serif" font-size="14" font-weight="600">Spar tendency</text>
  <text x="400" y="100" fill="#1A1A1A" font-family="sans-serif" font-size="14" font-weight="600">Interior alkyd</text>
  <line x1="40" y1="108" x2="600" y2="108" stroke="#D4C9B0" stroke-width="1"/>
  <text x="48" y="136" fill="#4A4A4A" font-family="sans-serif" font-size="13">UV packages</text>
  <text x="220" y="136" fill="#4A4A4A" font-family="sans-serif" font-size="13">More absorbers</text>
  <text x="400" y="136" fill="#4A4A4A" font-family="sans-serif" font-size="13">Less exterior focus</text>
  <line x1="40" y1="148" x2="600" y2="148" stroke="#D4C9B0" stroke-width="0.8"/>
  <text x="48" y="188" fill="#4A4A4A" font-family="sans-serif" font-size="13">Flex</text>
  <text x="220" y="188" fill="#4A4A4A" font-family="sans-serif" font-size="13">Longer oil</text>
  <text x="400" y="188" fill="#4A4A4A" font-family="sans-serif" font-size="13">Harder for tabletops</text>
  <line x1="40" y1="200" x2="600" y2="200" stroke="#D4C9B0" stroke-width="0.8"/>
  <text x="48" y="240" fill="#4A4A4A" font-family="sans-serif" font-size="13">Wrong use</text>
  <text x="220" y="240" fill="#4A4A4A" font-family="sans-serif" font-size="13">Chalky porch film indoors</text>
  <text x="400" y="240" fill="#4A4A4A" font-family="sans-serif" font-size="13">Better interior system</text>
  <line x1="40" y1="252" x2="600" y2="252" stroke="#D4C9B0" stroke-width="0.8"/>
</svg>
