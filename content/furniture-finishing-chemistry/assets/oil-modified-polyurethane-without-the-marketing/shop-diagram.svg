<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Oil-modified polyurethane</title>
  <desc id="desc">Diagram: urethane links with oil-modified segments in one film</desc>
  <rect width="100%" height="100%" fill="#F7F3E8"/>
  <text x="32" y="44" fill="#1A1A1A" font-family="Georgia, serif" font-size="20" font-weight="600">Oil-modified polyurethane</text>
  <text x="48" y="100" fill="#1A1A1A" font-family="sans-serif" font-size="14" font-weight="600">Claim</text>
  <text x="220" y="100" fill="#1A1A1A" font-family="sans-serif" font-size="14" font-weight="600">Reality</text>
  <text x="400" y="100" fill="#1A1A1A" font-family="sans-serif" font-size="14" font-weight="600">Shop test</text>
  <line x1="40" y1="108" x2="600" y2="108" stroke="#D4C9B0" stroke-width="1"/>
  <text x="48" y="136" fill="#4A4A4A" font-family="sans-serif" font-size="13">Plastic armor</text>
  <text x="220" y="136" fill="#4A4A4A" font-family="sans-serif" font-size="13">Crosslinked urethane film</text>
  <text x="400" y="136" fill="#4A4A4A" font-family="sans-serif" font-size="13">White scratch line</text>
  <line x1="40" y1="148" x2="600" y2="148" stroke="#D4C9B0" stroke-width="0.8"/>
  <text x="48" y="188" fill="#4A4A4A" font-family="sans-serif" font-size="13">Oil warmth</text>
  <text x="220" y="188" fill="#4A4A4A" font-family="sans-serif" font-size="13">Modified segments, amber</text>
  <text x="400" y="188" fill="#4A4A4A" font-family="sans-serif" font-size="13">Still a skin repair</text>
  <line x1="40" y1="200" x2="600" y2="200" stroke="#D4C9B0" stroke-width="0.8"/>
  <text x="48" y="240" fill="#4A4A4A" font-family="sans-serif" font-size="13">One coat miracle</text>
  <text x="220" y="240" fill="#4A4A4A" font-family="sans-serif" font-size="13">Build + cure schedule</text>
  <text x="400" y="240" fill="#4A4A4A" font-family="sans-serif" font-size="13">Use board, not can copy</text>
  <line x1="40" y1="252" x2="600" y2="252" stroke="#D4C9B0" stroke-width="0.8"/>
