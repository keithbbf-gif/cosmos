<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Shellac barrier coat</title>
  <desc id="desc">Stack diagram: shellac sealer between stain and waterborne or wax and varnish</desc>
  <rect width="100%" height="100%" fill="#F7F3E8"/>
  <text x="32" y="44" fill="#1A1A1A" font-family="Georgia, serif" font-size="20" font-weight="600">Shellac barrier coat</text>
  <text x="48" y="100" fill="#1A1A1A" font-family="sans-serif" font-size="14" font-weight="600">Below</text>
  <text x="220" y="100" fill="#1A1A1A" font-family="sans-serif" font-size="14" font-weight="600">Shellac role</text>
  <text x="400" y="100" fill="#1A1A1A" font-family="sans-serif" font-size="14" font-weight="600">Above</text>
  <line x1="40" y1="108" x2="600" y2="108" stroke="#D4C9B0" stroke-width="1"/>
  <text x="48" y="136" fill="#4A4A4A" font-family="sans-serif" font-size="13">Oily or waxy wood</text>
  <text x="220" y="136" fill="#4A4A4A" font-family="sans-serif" font-size="13">Blocks bleed</text>
  <text x="400" y="136" fill="#4A4A4A" font-family="sans-serif" font-size="13">Waterborne or lacquer class</text>
  <line x1="40" y1="148" x2="600" y2="148" stroke="#D4C9B0" stroke-width="0.8"/>
  <text x="48" y="188" fill="#4A4A4A" font-family="sans-serif" font-size="13">Pigment stain</text>
  <text x="220" y="188" fill="#4A4A4A" font-family="sans-serif" font-size="13">Locks color</text>
  <text x="400" y="188" fill="#4A4A4A" font-family="sans-serif" font-size="13">Clear film</text>
  <line x1="40" y1="200" x2="600" y2="200" stroke="#D4C9B0" stroke-width="0.8"/>
  <text x="48" y="240" fill="#4A4A4A" font-family="sans-serif" font-size="13">Unknown old finish</text>
  <text x="220" y="240" fill="#4A4A4A" font-family="sans-serif" font-size="13">Test first</text>
  <text x="400" y="240" fill="#4A4A4A" font-family="sans-serif" font-size="13">Anything — test still required</text>
  <line x1="40" y1="252" x2="600" y2="252" stroke="#D4C9B0" stroke-width="0.8"/>
</svg>
