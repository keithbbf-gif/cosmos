<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Tung oil: label versus binder</title>
  <desc id="desc">Comparison: true tung polymerization versus wiping varnish labeled tung oil</desc>
  <rect width="100%" height="100%" fill="#F7F3E8"/>
  <text x="32" y="44" fill="#1A1A1A" font-family="Georgia, serif" font-size="20" font-weight="600">Tung oil: label versus binder</text>
  <text x="48" y="100" fill="#1A1A1A" font-family="sans-serif" font-size="14" font-weight="600">Product</text>
  <text x="220" y="100" fill="#1A1A1A" font-family="sans-serif" font-size="14" font-weight="600">Binder truth</text>
  <text x="400" y="100" fill="#1A1A1A" font-family="sans-serif" font-size="14" font-weight="600">Cure behavior</text>
  <line x1="40" y1="108" x2="600" y2="108" stroke="#D4C9B0" stroke-width="1"/>
  <text x="48" y="136" fill="#4A4A4A" font-family="sans-serif" font-size="13">Pure tung</text>
  <text x="220" y="136" fill="#4A4A4A" font-family="sans-serif" font-size="13">Eleostearic acid, slow</text>
  <text x="400" y="136" fill="#4A4A4A" font-family="sans-serif" font-size="13">Harder; long cure; rags dangerous</text>
  <line x1="40" y1="148" x2="600" y2="148" stroke="#D4C9B0" stroke-width="0.8"/>
  <text x="48" y="188" fill="#4A4A4A" font-family="sans-serif" font-size="13">Tung oil finish (trade)</text>
  <text x="220" y="188" fill="#4A4A4A" font-family="sans-serif" font-size="13">Often alkyd or urethane</text>
  <text x="400" y="188" fill="#4A4A4A" font-family="sans-serif" font-size="13">Faster build; film possible</text>
  <line x1="40" y1="200" x2="600" y2="200" stroke="#D4C9B0" stroke-width="0.8"/>
  <text x="48" y="240" fill="#4A4A4A" font-family="sans-serif" font-size="13">Danish / antique oil</text>
  <text x="220" y="240" fill="#4A4A4A" font-family="sans-serif" font-size="13">Wiping varnish family</text>
  <text x="400" y="240" fill="#4A4A4A" font-family="sans-serif" font-size="13">Mutt — see Danish oil draft</text>
  <line x1="40" y1="252" x2="600" y2="252" stroke="#D4C9B0" stroke-width="0.8"/>
</svg>
