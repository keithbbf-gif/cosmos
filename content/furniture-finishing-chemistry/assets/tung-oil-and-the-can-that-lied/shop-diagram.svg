<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">True tung oil versus wiping varnish label</title>
  <desc id="desc">Comparison of pure tung oil cure versus blended wiping varnish in a mislabeled can</desc>
  <rect width="100%" height="100%" fill="#F7F3E8"/>
  <text x="32" y="44" fill="#1A1A1A" font-family="Georgia, serif" font-size="20" font-weight="600">True tung oil versus wiping varnish label</text>
  <text x="48" y="88" fill="#1A1A1A" font-family="sans-serif" font-size="14" font-weight="600">Item</text>
  <text x="220" y="88" fill="#1A1A1A" font-family="sans-serif" font-size="14" font-weight="600">Behavior</text>
  <text x="400" y="88" fill="#1A1A1A" font-family="sans-serif" font-size="14" font-weight="600">Shop note</text>
  <line x1="40" y1="96" x2="600" y2="96" stroke="#D4C9B0" stroke-width="1"/>
  <text x="48" y="124" fill="#4A4A4A" font-family="sans-serif" font-size="13">Pure tung</text>
  <text x="220" y="124" fill="#4A4A4A" font-family="sans-serif" font-size="13">Slow cure</text>
  <text x="400" y="124" fill="#4A4A4A" font-family="sans-serif" font-size="13">Matte in-wood</text>
  <line x1="40" y1="132" x2="600" y2="132" stroke="#D4C9B0" stroke-width="0.8"/>
  <text x="48" y="164" fill="#4A4A4A" font-family="sans-serif" font-size="13">Wiping varnish</text>
  <text x="220" y="164" fill="#4A4A4A" font-family="sans-serif" font-size="13">Faster</text>
  <text x="400" y="164" fill="#4A4A4A" font-family="sans-serif" font-size="13">Thin film</text>
  <line x1="40" y1="172" x2="600" y2="172" stroke="#D4C9B0" stroke-width="0.8"/>
  <text x="48" y="204" fill="#4A4A4A" font-family="sans-serif" font-size="13">Label check</text>
  <text x="220" y="204" fill="#4A4A4A" font-family="sans-serif" font-size="13">Read binder</text>
  <text x="400" y="204" fill="#4A4A4A" font-family="sans-serif" font-size="13">Not the front adjective</text>
  <line x1="40" y1="212" x2="600" y2="212" stroke="#D4C9B0" stroke-width="0.8"/>
</svg>
