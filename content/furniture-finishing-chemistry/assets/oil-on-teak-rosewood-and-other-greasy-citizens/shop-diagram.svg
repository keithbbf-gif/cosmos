  <rect x="48" y="160" width="100" height="48" rx="6" fill="#E8DCC8" stroke="#1A1A1A"/>
  <text x="56" y="188" fill="#1A1A1A" font-family="sans-serif" font-size="11">Scuff</text>
  <line x1="148" y1="184" x2="158" y2="184" stroke="#4A4A4A" stroke-width="2"/>
  <polygon points="158,180 158,188 166,184" fill="#4A4A4A"/>
  <rect x="178" y="160" width="100" height="48" rx="6" fill="#E8DCC8" stroke="#1A1A1A"/>
