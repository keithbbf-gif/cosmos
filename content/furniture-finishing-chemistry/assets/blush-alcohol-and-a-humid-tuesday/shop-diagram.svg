<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Shellac blush in humidity</title>
  <desc id="desc">Schematic white shellac blush when alcohol traps moisture on humid day</desc>
  <rect width="100%" height="100%" fill="#F7F3E8"/>
  <text x="32" y="44" fill="#1A1A1A" font-family="Georgia, serif" font-size="20" font-weight="600">Shellac blush in humidity</text>
  <rect x="80" y="120" width="480" height="64" fill="#FFF8EE" stroke="#B85450" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="96" y="158" fill="#1A1A1A" font-family="sans-serif" font-size="14">Humid air</text>
  <rect x="80" y="204" width="480" height="64" fill="#FFF8EE" stroke="#B85450" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="96" y="242" fill="#1A1A1A" font-family="sans-serif" font-size="14">Fast evap</text>
  <rect x="80" y="288" width="480" height="64" fill="#FFF8EE" stroke="#B85450" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="96" y="326" fill="#1A1A1A" font-family="sans-serif" font-size="14">White blush</text>
