<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Bloom and wrinkle</title>
  <desc id="desc">Diagram: wrinkled skin over uncured oil versus bloom haze</desc>
  <rect width="100%" height="100%" fill="#F7F3E8"/>
  <text x="32" y="44" fill="#1A1A1A" font-family="Georgia, serif" font-size="20" font-weight="600">Bloom and wrinkle</text>
  <text x="48" y="100" fill="#1A1A1A" font-family="sans-serif" font-size="14" font-weight="600">Defect</text>
  <text x="220" y="100" fill="#1A1A1A" font-family="sans-serif" font-size="14" font-weight="600">Likely cause</text>
  <text x="400" y="100" fill="#1A1A1A" font-family="sans-serif" font-size="14" font-weight="600">Response</text>
  <line x1="40" y1="108" x2="600" y2="108" stroke="#D4C9B0" stroke-width="1"/>
  <text x="48" y="136" fill="#4A4A4A" font-family="sans-serif" font-size="13">Wrinkle</text>
  <text x="220" y="136" fill="#4A4A4A" font-family="sans-serif" font-size="13">Thick wet coat</text>
  <text x="400" y="136" fill="#4A4A4A" font-family="sans-serif" font-size="13">Strip back; thin schedule</text>
  <line x1="40" y1="148" x2="600" y2="148" stroke="#D4C9B0" stroke-width="0.8"/>
  <text x="48" y="188" fill="#4A4A4A" font-family="sans-serif" font-size="13">Bloom</text>
  <text x="220" y="188" fill="#4A4A4A" font-family="sans-serif" font-size="13">Moisture or bad recoat</text>
  <text x="400" y="188" fill="#4A4A4A" font-family="sans-serif" font-size="13">Identify layer; strip isolate</text>
  <line x1="40" y1="200" x2="600" y2="200" stroke="#D4C9B0" stroke-width="0.8"/>
  <text x="48" y="240" fill="#4A4A4A" font-family="sans-serif" font-size="13">Warm rag</text>
  <text x="220" y="240" fill="#4A4A4A" font-family="sans-serif" font-size="13">Exothermic cure in pile</text>
  <text x="400" y="240" fill="#4A4A4A" font-family="sans-serif" font-size="13">Water bucket or lay flat dry</text>
  <line x1="40" y1="252" x2="600" y2="252" stroke="#D4C9B0" stroke-width="0.8"/>
</svg>
