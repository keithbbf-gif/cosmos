<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Maintenance by family</title>
  <desc id="desc">Timeline: oil feed, wax buff, varnish recoat, waterborne scuff-recoat</desc>
  <rect width="100%" height="100%" fill="#F7F3E8"/>
  <text x="32" y="44" fill="#1A1A1A" font-family="Georgia, serif" font-size="20" font-weight="600">Maintenance by family</text>
  <text x="48" y="100" fill="#1A1A1A" font-family="sans-serif" font-size="14" font-weight="600">Family</text>
  <text x="220" y="100" fill="#1A1A1A" font-family="sans-serif" font-size="14" font-weight="600">Years later</text>
  <text x="400" y="100" fill="#1A1A1A" font-family="sans-serif" font-size="14" font-weight="600">Refresh</text>
  <line x1="40" y1="108" x2="600" y2="108" stroke="#D4C9B0" stroke-width="1"/>
  <text x="48" y="136" fill="#4A4A4A" font-family="sans-serif" font-size="13">Penetrating oil</text>
  <text x="220" y="136" fill="#4A4A4A" font-family="sans-serif" font-size="13">Dull, marks</text>
  <text x="400" y="136" fill="#4A4A4A" font-family="sans-serif" font-size="13">Wipe same oil</text>
  <line x1="40" y1="148" x2="600" y2="148" stroke="#D4C9B0" stroke-width="0.8"/>
  <text x="48" y="188" fill="#4A4A4A" font-family="sans-serif" font-size="13">Wax on shellac</text>
  <text x="220" y="188" fill="#4A4A4A" font-family="sans-serif" font-size="13">Dry handle</text>
  <text x="400" y="188" fill="#4A4A4A" font-family="sans-serif" font-size="13">Clean, thin wax</text>
  <line x1="40" y1="200" x2="600" y2="200" stroke="#D4C9B0" stroke-width="0.8"/>
  <text x="48" y="240" fill="#4A4A4A" font-family="sans-serif" font-size="13">Film varnish / WB</text>
  <text x="220" y="240" fill="#4A4A4A" font-family="sans-serif" font-size="13">Wear through</text>
  <text x="400" y="240" fill="#4A4A4A" font-family="sans-serif" font-size="13">Scuff + coat or pro</text>
  <line x1="40" y1="252" x2="600" y2="252" stroke="#D4C9B0" stroke-width="0.8"/>
</svg>
