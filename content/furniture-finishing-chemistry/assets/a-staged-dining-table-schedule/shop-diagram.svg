<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Table finish schedule</title>
  <desc id="desc">Gantt-style shop schedule: sand, seal, color, build coats, cure before delivery</desc>
  <rect width="100%" height="100%" fill="#F7F3E8"/>
  <text x="32" y="44" fill="#1A1A1A" font-family="Georgia, serif" font-size="20" font-weight="600">Table finish schedule</text>
  <text x="48" y="100" fill="#1A1A1A" font-family="sans-serif" font-size="14" font-weight="600">Day</text>
  <text x="220" y="100" fill="#1A1A1A" font-family="sans-serif" font-size="14" font-weight="600">Step</text>
  <text x="400" y="100" fill="#1A1A1A" font-family="sans-serif" font-size="14" font-weight="600">Client use</text>
  <line x1="40" y1="108" x2="600" y2="108" stroke="#D4C9B0" stroke-width="1"/>
  <text x="48" y="136" fill="#4A4A4A" font-family="sans-serif" font-size="13">0–1</text>
  <text x="220" y="136" fill="#4A4A4A" font-family="sans-serif" font-size="13">Sand, seal, raise cut</text>
  <text x="400" y="136" fill="#4A4A4A" font-family="sans-serif" font-size="13">Hands off</text>
  <line x1="40" y1="148" x2="600" y2="148" stroke="#D4C9B0" stroke-width="0.8"/>
  <text x="48" y="188" fill="#4A4A4A" font-family="sans-serif" font-size="13">2–4</text>
  <text x="220" y="188" fill="#4A4A4A" font-family="sans-serif" font-size="13">Color + build coats</text>
  <text x="400" y="188" fill="#4A4A4A" font-family="sans-serif" font-size="13">No dishes</text>
  <line x1="40" y1="200" x2="600" y2="200" stroke="#D4C9B0" stroke-width="0.8"/>
  <text x="48" y="240" fill="#4A4A4A" font-family="sans-serif" font-size="13">7–14+</text>
  <text x="220" y="240" fill="#4A4A4A" font-family="sans-serif" font-size="13">Cure per label</text>
  <text x="400" y="240" fill="#4A4A4A" font-family="sans-serif" font-size="13">Glasses with care → normal</text>
  <line x1="40" y1="252" x2="600" y2="252" stroke="#D4C9B0" stroke-width="0.8"/>
</svg>
