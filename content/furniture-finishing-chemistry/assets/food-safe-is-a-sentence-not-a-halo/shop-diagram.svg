<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Food contact clarity</title>
  <desc id="desc">Diagram: fully cured film versus uncured surface on cutting board (conceptual)</desc>
  <rect width="100%" height="100%" fill="#F7F3E8"/>
  <text x="32" y="44" fill="#1A1A1A" font-family="Georgia, serif" font-size="20" font-weight="600">Food contact clarity</text>
  <text x="48" y="100" fill="#1A1A1A" font-family="sans-serif" font-size="14" font-weight="600">Claim</text>
  <text x="220" y="100" fill="#1A1A1A" font-family="sans-serif" font-size="14" font-weight="600">Means</text>
  <text x="400" y="100" fill="#1A1A1A" font-family="sans-serif" font-size="14" font-weight="600">Does not mean</text>
  <line x1="40" y1="108" x2="600" y2="108" stroke="#D4C9B0" stroke-width="1"/>
  <text x="48" y="136" fill="#4A4A4A" font-family="sans-serif" font-size="13">FDA cleared additive</text>
  <text x="220" y="136" fill="#4A4A4A" font-family="sans-serif" font-size="13">In specific cured system</text>
  <text x="400" y="136" fill="#4A4A4A" font-family="sans-serif" font-size="13">Eat off any wet coat</text>
  <line x1="40" y1="148" x2="600" y2="148" stroke="#D4C9B0" stroke-width="0.8"/>
  <text x="48" y="188" fill="#4A4A4A" font-family="sans-serif" font-size="13">Beeswax board butter</text>
  <text x="220" y="188" fill="#4A4A4A" font-family="sans-serif" font-size="13">Surface maintain</text>
  <text x="400" y="188" fill="#4A4A4A" font-family="sans-serif" font-size="13">Substitute for cure schedule</text>
  <line x1="40" y1="200" x2="600" y2="200" stroke="#D4C9B0" stroke-width="0.8"/>
  <text x="48" y="240" fill="#4A4A4A" font-family="sans-serif" font-size="13">Client ask</text>
  <text x="220" y="240" fill="#4A4A4A" font-family="sans-serif" font-size="13">State limits plainly</text>
  <text x="400" y="240" fill="#4A4A4A" font-family="sans-serif" font-size="13">Magic halo label</text>
  <line x1="40" y1="252" x2="600" y2="252" stroke="#D4C9B0" stroke-width="0.8"/>
</svg>
