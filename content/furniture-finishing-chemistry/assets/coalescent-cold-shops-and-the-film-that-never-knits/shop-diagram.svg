<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">MFFT and cold shop coalescence failure</title>
  <desc id="desc">Waterborne film failing to knit below minimum film formation temperature</desc>
  <rect width="100%" height="100%" fill="#F7F3E8"/>
  <text x="32" y="44" fill="#1A1A1A" font-family="Georgia, serif" font-size="20" font-weight="600">MFFT and cold shop coalescence failure</text>
  <rect x="80" y="120" width="480" height="64" fill="#FFF8EE" stroke="#B85450" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="96" y="158" fill="#1A1A1A" font-family="sans-serif" font-size="14">Below MFFT</text>
  <rect x="80" y="204" width="480" height="64" fill="#FFF8EE" stroke="#B85450" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="96" y="242" fill="#1A1A1A" font-family="sans-serif" font-size="14">Beads stay</text>
  <rect x="80" y="288" width="480" height="64" fill="#FFF8EE" stroke="#B85450" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="96" y="326" fill="#1A1A1A" font-family="sans-serif" font-size="14">No knit</text>
</svg>
