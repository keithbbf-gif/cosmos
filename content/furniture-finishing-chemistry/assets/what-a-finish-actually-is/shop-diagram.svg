<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Three jobs, one surface</title>
  <desc id="desc">Diagram: evaporation, binder solidification, and adhesion on sanded wood</desc>
  <rect width="100%" height="100%" fill="#F7F3E8"/>
  <text x="32" y="44" fill="#1A1A1A" font-family="Georgia, serif" font-size="20" font-weight="600">Three jobs, one surface</text>
  <text x="48" y="100" fill="#1A1A1A" font-family="sans-serif" font-size="14" font-weight="600">Step</text>
  <text x="220" y="100" fill="#1A1A1A" font-family="sans-serif" font-size="14" font-weight="600">Mechanism</text>
  <text x="400" y="100" fill="#1A1A1A" font-family="sans-serif" font-size="14" font-weight="600">Shop tell</text>
  <line x1="40" y1="108" x2="600" y2="108" stroke="#D4C9B0" stroke-width="1"/>
  <text x="48" y="136" fill="#4A4A4A" font-family="sans-serif" font-size="13">Carrier leaves</text>
  <text x="220" y="136" fill="#4A4A4A" font-family="sans-serif" font-size="13">Water, alcohol, or mineral spirits evaporates</text>
  <text x="400" y="136" fill="#4A4A4A" font-family="sans-serif" font-size="13">Can feels empty; film may still be soft</text>
  <line x1="40" y1="148" x2="600" y2="148" stroke="#D4C9B0" stroke-width="0.8"/>
  <text x="48" y="188" fill="#4A4A4A" font-family="sans-serif" font-size="13">Binder solidifies</text>
  <text x="220" y="188" fill="#4A4A4A" font-family="sans-serif" font-size="13">Oxygen cure, coalescence, or resin reunion</text>
  <text x="400" y="188" fill="#4A4A4A" font-family="sans-serif" font-size="13">Napkin test fails when it should</text>
  <line x1="40" y1="200" x2="600" y2="200" stroke="#D4C9B0" stroke-width="0.8"/>
  <text x="48" y="240" fill="#4A4A4A" font-family="sans-serif" font-size="13">Stays attached</text>
  <text x="220" y="240" fill="#4A4A4A" font-family="sans-serif" font-size="13">Mechanical bite + chemical stick</text>
  <text x="400" y="240" fill="#4A4A4A" font-family="sans-serif" font-size="13">Peel at edge = prep or compatibility</text>
  <line x1="40" y1="252" x2="600" y2="252" stroke="#D4C9B0" stroke-width="0.8"/>
</svg>
