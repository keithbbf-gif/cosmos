<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Waterborne coalescence</title>
  <desc id="desc">Diagram: acrylic or PU particles in water coalescing after evaporation</desc>
  <rect width="100%" height="100%" fill="#F7F3E8"/>
  <text x="32" y="44" fill="#1A1A1A" font-family="Georgia, serif" font-size="20" font-weight="600">Waterborne coalescence</text>
  <text x="48" y="100" fill="#1A1A1A" font-family="sans-serif" font-size="14" font-weight="600">Phase</text>
  <text x="220" y="100" fill="#1A1A1A" font-family="sans-serif" font-size="14" font-weight="600">What happens</text>
  <text x="400" y="100" fill="#1A1A1A" font-family="sans-serif" font-size="14" font-weight="600">Misread</text>
  <line x1="40" y1="108" x2="600" y2="108" stroke="#D4C9B0" stroke-width="1"/>
  <text x="48" y="136" fill="#4A4A4A" font-family="sans-serif" font-size="13">Wet</text>
  <text x="220" y="136" fill="#4A4A4A" font-family="sans-serif" font-size="13">Water + surfactant + particles</text>
  <text x="400" y="136" fill="#4A4A4A" font-family="sans-serif" font-size="13">Looks like paint</text>
  <line x1="40" y1="148" x2="600" y2="148" stroke="#D4C9B0" stroke-width="0.8"/>
  <text x="48" y="188" fill="#4A4A4A" font-family="sans-serif" font-size="13">Touch-dry</text>
  <text x="220" y="188" fill="#4A4A4A" font-family="sans-serif" font-size="13">Water mostly gone</text>
  <text x="400" y="188" fill="#4A4A4A" font-family="sans-serif" font-size="13">Not yet hard</text>
  <line x1="40" y1="200" x2="600" y2="200" stroke="#D4C9B0" stroke-width="0.8"/>
  <text x="48" y="240" fill="#4A4A4A" font-family="sans-serif" font-size="13">Coalesced</text>
  <text x="220" y="240" fill="#4A4A4A" font-family="sans-serif" font-size="13">Continuous film</text>
  <text x="400" y="240" fill="#4A4A4A" font-family="sans-serif" font-size="13">Tape test on schedule</text>
  <line x1="40" y1="252" x2="600" y2="252" stroke="#D4C9B0" stroke-width="0.8"/>
</svg>
