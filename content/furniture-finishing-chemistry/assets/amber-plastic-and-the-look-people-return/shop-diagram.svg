<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Amber versus clear film</title>
  <desc id="desc">Side-by-side appearance: warm amber varnish versus clear waterborne on maple</desc>
  <rect width="100%" height="100%" fill="#F7F3E8"/>
  <text x="32" y="44" fill="#1A1A1A" font-family="Georgia, serif" font-size="20" font-weight="600">Amber versus clear film</text>
  <text x="48" y="100" fill="#1A1A1A" font-family="sans-serif" font-size="14" font-weight="600">Finish</text>
  <text x="220" y="100" fill="#1A1A1A" font-family="sans-serif" font-size="14" font-weight="600">Color cast</text>
  <text x="400" y="100" fill="#1A1A1A" font-family="sans-serif" font-size="14" font-weight="600">When it wins</text>
  <line x1="40" y1="108" x2="600" y2="108" stroke="#D4C9B0" stroke-width="1"/>
  <text x="48" y="136" fill="#4A4A4A" font-family="sans-serif" font-size="13">Traditional alkyd</text>
  <text x="220" y="136" fill="#4A4A4A" font-family="sans-serif" font-size="13">Warm amber over time</text>
  <text x="400" y="136" fill="#4A4A4A" font-family="sans-serif" font-size="13">Walnut, cherry, antique mood</text>
  <line x1="40" y1="148" x2="600" y2="148" stroke="#D4C9B0" stroke-width="0.8"/>
  <text x="48" y="188" fill="#4A4A4A" font-family="sans-serif" font-size="13">Waterborne acrylic</text>
  <text x="220" y="188" fill="#4A4A4A" font-family="sans-serif" font-size="13">Minimal cast</text>
  <text x="400" y="188" fill="#4A4A4A" font-family="sans-serif" font-size="13">Maple, ash, modern pale</text>
  <line x1="40" y1="200" x2="600" y2="200" stroke="#D4C9B0" stroke-width="0.8"/>
  <text x="48" y="240" fill="#4A4A4A" font-family="sans-serif" font-size="13">Client ask</text>
  <text x="220" y="240" fill="#4A4A4A" font-family="sans-serif" font-size="13">Match existing room</text>
  <text x="400" y="240" fill="#4A4A4A" font-family="sans-serif" font-size="13">Sample on species, not on pine strip</text>
  <line x1="40" y1="252" x2="600" y2="252" stroke="#D4C9B0" stroke-width="0.8"/>
</svg>
