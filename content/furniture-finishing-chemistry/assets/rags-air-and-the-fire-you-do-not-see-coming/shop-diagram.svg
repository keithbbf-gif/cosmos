<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Rag fire triangle</title>
  <desc id="desc">Triangle diagram: oily rag, oxygen, insulated pile heat</desc>
  <rect width="100%" height="100%" fill="#F7F3E8"/>
  <text x="32" y="44" fill="#1A1A1A" font-family="Georgia, serif" font-size="20" font-weight="600">Rag fire triangle</text>
  <text x="48" y="100" fill="#1A1A1A" font-family="sans-serif" font-size="14" font-weight="600">Factor</text>
  <text x="220" y="100" fill="#1A1A1A" font-family="sans-serif" font-size="14" font-weight="600">Shop rule</text>
  <text x="400" y="100" fill="#1A1A1A" font-family="sans-serif" font-size="14" font-weight="600">Never</text>
  <line x1="40" y1="108" x2="600" y2="108" stroke="#D4C9B0" stroke-width="1"/>
  <text x="48" y="136" fill="#4A4A4A" font-family="sans-serif" font-size="13">Oily rag</text>
  <text x="220" y="136" fill="#4A4A4A" font-family="sans-serif" font-size="13">Lay flat or water bucket</text>
  <text x="400" y="136" fill="#4A4A4A" font-family="sans-serif" font-size="13">Ball in trash can</text>
  <line x1="40" y1="148" x2="600" y2="148" stroke="#D4C9B0" stroke-width="0.8"/>
  <text x="48" y="188" fill="#4A4A4A" font-family="sans-serif" font-size="13">Pile heat</text>
  <text x="220" y="188" fill="#4A4A4A" font-family="sans-serif" font-size="13">Insulation holds exotherm</text>
  <text x="400" y="188" fill="#4A4A4A" font-family="sans-serif" font-size="13">Closed lid on wet rags</text>
  <line x1="40" y1="200" x2="600" y2="200" stroke="#D4C9B0" stroke-width="0.8"/>
  <text x="48" y="240" fill="#4A4A4A" font-family="sans-serif" font-size="13">Ventilation</text>
  <text x="220" y="240" fill="#4A4A4A" font-family="sans-serif" font-size="13">Reduces vapor load</text>
  <text x="400" y="240" fill="#4A4A4A" font-family="sans-serif" font-size="13">Spray in unvented closet</text>
  <line x1="40" y1="252" x2="600" y2="252" stroke="#D4C9B0" stroke-width="0.8"/>
</svg>
