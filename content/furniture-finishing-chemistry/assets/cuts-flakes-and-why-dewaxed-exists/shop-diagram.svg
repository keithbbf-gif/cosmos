<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Shellac pound cuts</title>
  <desc id="desc">Table: one-pound through four-pound cut uses and dewaxed stacking</desc>
  <rect width="100%" height="100%" fill="#F7F3E8"/>
  <text x="32" y="44" fill="#1A1A1A" font-family="Georgia, serif" font-size="20" font-weight="600">Shellac pound cuts</text>
  <text x="48" y="100" fill="#1A1A1A" font-family="sans-serif" font-size="14" font-weight="600">Cut</text>
  <text x="220" y="100" fill="#1A1A1A" font-family="sans-serif" font-size="14" font-weight="600">Typical use</text>
  <text x="400" y="100" fill="#1A1A1A" font-family="sans-serif" font-size="14" font-weight="600">Wax note</text>
  <line x1="40" y1="108" x2="600" y2="108" stroke="#D4C9B0" stroke-width="1"/>
  <text x="48" y="136" fill="#4A4A4A" font-family="sans-serif" font-size="13">1 lb</text>
  <text x="220" y="136" fill="#4A4A4A" font-family="sans-serif" font-size="13">Wash sealer</text>
  <text x="400" y="136" fill="#4A4A4A" font-family="sans-serif" font-size="13">Waxed OK under same</text>
  <line x1="40" y1="148" x2="600" y2="148" stroke="#D4C9B0" stroke-width="0.8"/>
  <text x="48" y="188" fill="#4A4A4A" font-family="sans-serif" font-size="13">2 lb</text>
  <text x="220" y="188" fill="#4A4A4A" font-family="sans-serif" font-size="13">General sealing</text>
  <text x="400" y="188" fill="#4A4A4A" font-family="sans-serif" font-size="13">Dewax before dissimilar topcoat</text>
  <line x1="40" y1="200" x2="600" y2="200" stroke="#D4C9B0" stroke-width="0.8"/>
  <text x="48" y="240" fill="#4A4A4A" font-family="sans-serif" font-size="13">3–4 lb</text>
  <text x="220" y="240" fill="#4A4A4A" font-family="sans-serif" font-size="13">Pad build, polish</text>
  <text x="400" y="240" fill="#4A4A4A" font-family="sans-serif" font-size="13">Burnish, not flood</text>
  <line x1="40" y1="252" x2="600" y2="252" stroke="#D4C9B0" stroke-width="0.8"/>
</svg>
