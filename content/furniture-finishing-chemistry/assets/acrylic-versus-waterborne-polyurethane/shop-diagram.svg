<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Acrylic vs waterborne PU</title>
  <desc id="desc">Comparison table: clarity, hardness, and repair of acrylic vs PUD</desc>
  <rect width="100%" height="100%" fill="#F7F3E8"/>
  <text x="32" y="44" fill="#1A1A1A" font-family="Georgia, serif" font-size="20" font-weight="600">Acrylic vs waterborne PU</text>
  <text x="48" y="100" fill="#1A1A1A" font-family="sans-serif" font-size="14" font-weight="600">Type</text>
  <text x="220" y="100" fill="#1A1A1A" font-family="sans-serif" font-size="14" font-weight="600">Clarity</text>
  <text x="400" y="100" fill="#1A1A1A" font-family="sans-serif" font-size="14" font-weight="600">Wear</text>
  <line x1="40" y1="108" x2="600" y2="108" stroke="#D4C9B0" stroke-width="1"/>
  <text x="48" y="136" fill="#4A4A4A" font-family="sans-serif" font-size="13">Acrylic emulsion</text>
  <text x="220" y="136" fill="#4A4A4A" font-family="sans-serif" font-size="13">High on maple</text>
  <text x="400" y="136" fill="#4A4A4A" font-family="sans-serif" font-size="13">Good; thermoplastic when soft</text>
  <line x1="40" y1="148" x2="600" y2="148" stroke="#D4C9B0" stroke-width="0.8"/>
  <text x="48" y="188" fill="#4A4A4A" font-family="sans-serif" font-size="13">Waterborne PU (PUD)</text>
  <text x="220" y="188" fill="#4A4A4A" font-family="sans-serif" font-size="13">Slight warm cast</text>
  <text x="400" y="188" fill="#4A4A4A" font-family="sans-serif" font-size="13">Tougher film</text>
  <line x1="40" y1="200" x2="600" y2="200" stroke="#D4C9B0" stroke-width="0.8"/>
  <text x="48" y="240" fill="#4A4A4A" font-family="sans-serif" font-size="13">Hybrid label</text>
  <text x="220" y="240" fill="#4A4A4A" font-family="sans-serif" font-size="13">Read SDS binder</text>
  <text x="400" y="240" fill="#4A4A4A" font-family="sans-serif" font-size="13">Do not trust front panel alone</text>
  <line x1="40" y1="252" x2="600" y2="252" stroke="#D4C9B0" stroke-width="0.8"/>
</svg>
