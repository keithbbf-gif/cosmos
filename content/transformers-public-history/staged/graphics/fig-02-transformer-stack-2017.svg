<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="tphfig02-title tphfig02-desc">
  <title id="tphfig02-title">Fig. 2 - Encoder-decoder Transformer stack (2017 public specification)</title>
  <desc id="tphfig02-desc">Schematic of stacked encoder and decoder layers with self-attention, cross-attention, and feed-forward sublayers; educational diagram not copied from the paper figure.</desc>
  <defs>
    <style>
      .bg { fill: #F9FAFB; }
      .ink { fill: #111827; font-family: 'Segoe UI', system-ui, sans-serif; }
      .muted { fill: #6B7280; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; }
      .box { fill: #EFF6FF; stroke: #2563EB; stroke-width: 1.5; }
      .box-dec { fill: #F0FDF4; stroke: #059669; stroke-width: 1.5; }
      .box-ff { fill: #FFFFFF; stroke: #9CA3AF; stroke-width: 1.2; }
      .arrow { stroke: #374151; stroke-width: 1.4; fill: none; marker-end: url(#ah); }
    </style>
    <marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#374151"/>
    </marker>
  </defs>
  <rect class="bg" width="960" height="640"/>
  <text x="40" y="36" class="ink" font-size="22" font-weight="bold">2017 encoder-decoder stack (schematic)</text>
  <text x="40" y="58" class="muted">N=6 layers each side in the base model; residuals + LayerNorm around each sublayer.</text>

  <rect x="80" y="100" width="320" height="480" class="box" rx="6"/>
  <text x="100" y="130" class="ink" font-size="16" font-weight="600">Encoder (�N)</text>
  <rect x="110" y="160" width="260" height="56" class="box-ff" rx="4"/>
  <text x="125" y="192" class="ink" font-size="13">Multi-head self-attention</text>
  <rect x="110" y="240" width="260" height="48" class="box-ff" rx="4"/>
  <text x="125" y="268" class="ink" font-size="13">Position-wise FFN</text>
  <text x="100" y="340" class="muted">Repeated N times</text>
  <text x="100" y="520" class="muted">Output: memory tensor K,V for cross-attn</text>

  <rect x="560" y="100" width="320" height="480" class="box-dec" rx="6"/>
  <text x="580" y="130" class="ink" font-size="16" font-weight="600">Decoder (�N)</text>
  <rect x="590" y="160" width="260" height="48" class="box-ff" rx="4"/>
  <text x="605" y="188" class="ink" font-size="13">Masked self-attention</text>
  <rect x="590" y="230" width="260" height="48" class="box-ff" rx="4"/>
  <text x="605" y="258" class="ink" font-size="13">Cross-attention � encoder</text>
  <rect x="590" y="300" width="260" height="48" class="box-ff" rx="4"/>
  <text x="605" y="328" class="ink" font-size="13">Position-wise FFN</text>
  <text x="580" y="400" class="muted">Causal mask on self-attn</text>
  <text x="580" y="520" class="muted">+ positional encodings on both sides</text>

  <path class="arrow" d="M400 280 H520"/>
  <text x="430" y="270" class="muted">memory</text>

  <rect x="340" y="560" width="280" height="44" fill="#E5E7EB" rx="4"/>
  <text x="360" y="588" class="ink" font-size="13">Embeddings + softmax output (tied weights in base model)</text>
</svg>
