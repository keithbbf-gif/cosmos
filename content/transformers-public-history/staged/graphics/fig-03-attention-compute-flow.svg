<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="tphfig03-title tphfig03-desc">
  <title id="tphfig03-title">Fig. 3 - Scaled dot-product attention compute flow</title>
  <desc id="tphfig03-desc">Flow from query, key, and value matrices through scaled matmul, softmax, and value mix; matches the 2017 public equation form.</desc>
  <defs>
    <style>
      .bg { fill: #FAFAFA; }
      .ink { fill: #111827; font-family: 'Consolas', 'Segoe UI', monospace; }
      .label { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; fill: #111827; }
      .muted { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; fill: #6B7280; }
      .node { fill: #FFFFFF; stroke: #4F46E5; stroke-width: 1.5; }
      .op { fill: #EEF2FF; stroke: #6366F1; stroke-width: 1.5; }
      .flow { stroke: #374151; stroke-width: 1.3; fill: none; marker-end: url(#af); }
    </style>
    <marker id="af" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#374151"/>
    </marker>
  </defs>
  <rect class="bg" width="900" height="420"/>
  <text x="36" y="40" class="label" font-size="20" font-weight="bold">Scaled dot-product attention (dataflow)</text>
  <text x="36" y="64" class="muted">Attention(Q,K,V) = softmax(QK@ / -d_k) V - Vaswani et al., 2017 public draft</text>

  <rect x="48" y="120" width="72" height="40" class="node" rx="4"/>
  <text x="62" y="146" class="ink" font-size="14">Q</text>
  <rect x="48" y="200" width="72" height="40" class="node" rx="4"/>
  <text x="64" y="226" class="ink" font-size="14">K</text>
  <rect x="48" y="280" width="72" height="40" class="node" rx="4"/>
  <text x="64" y="306" class="ink" font-size="14">V</text>

  <rect x="200" y="155" width="120" height="50" class="op" rx="4"/>
  <text x="218" y="185" class="label" font-size="13">QK@</text>
  <path class="flow" d="M120 140 L200 175"/>
  <path class="flow" d="M120 220 L200 195"/>

  <rect x="380" y="155" width="140" height="50" class="op" rx="4"/>
  <text x="400" y="178" class="label" font-size="12">� -d_k</text>
  <path class="flow" d="M320 180 L380 180"/>

  <rect x="580" y="155" width="120" height="50" class="op" rx="4"/>
  <text x="600" y="185" class="label" font-size="13">softmax</text>
  <path class="flow" d="M520 180 L580 180"/>

  <rect x="760" y="155" width="100" height="50" class="op" rx="4"/>
  <text x="778" y="185" class="label" font-size="13">� V</text>
  <path class="flow" d="M700 180 L760 180"/>
  <path class="flow" d="M120 300 L740 200"/>

  <rect x="760" y="260" width="100" height="44" class="node" rx="4"/>
  <text x="778" y="288" class="label" font-size="13">output</text>
  <path class="flow" d="M810 205 L810 260"/>

  <text x="36" y="380" class="muted">Batched matmuls on GPU; scaling stabilizes softmax when d_k grows.</text>
</svg>
