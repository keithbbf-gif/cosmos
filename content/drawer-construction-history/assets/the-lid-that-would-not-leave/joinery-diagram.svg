<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Till inside a lidded chest</title>
  <desc id="desc">Side-hung drawer at the base of a chest that still carries a lifting lid</desc>
  <rect width="100%" height="100%" fill="#F7F3E8"/>
  <text x="32" y="44" fill="#1A1A1A" font-family="Georgia, serif" font-size="20" font-weight="600">Till inside a lidded chest</text>
  <rect x="24" y="64" width="592" height="332" fill="none" stroke="#D4C9B0" stroke-width="1"/>

  <rect x="200" y="160" width="240" height="160" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="200" y1="160" x2="440" y2="120" stroke="#1A1A1A" stroke-width="2"/>
  <text x="210" y="150" fill="#4A4A4A" font-family="sans-serif" font-size="11">lifting lid</text>
  <rect x="240" y="260" width="160" height="40" fill="none" stroke="#8B4513" stroke-width="2"/>
  <line x1="220" y1="300" x2="420" y2="300" stroke="#6B4423" stroke-width="3"/>
  <text x="248" y="288" fill="#8B4513" font-family="sans-serif" font-size="10">till drawer</text>
</svg>
