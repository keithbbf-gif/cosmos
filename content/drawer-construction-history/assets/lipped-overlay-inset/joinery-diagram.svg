<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Lipped overlay and inset</title>
  <desc id="desc">Front lip overlapping the case face versus flush inset opening</desc>
  <rect width="100%" height="100%" fill="#F7F3E8"/>
  <text x="32" y="44" fill="#1A1A1A" font-family="Georgia, serif" font-size="20" font-weight="600">Lipped overlay and inset</text>
  <rect x="24" y="64" width="592" height="332" fill="none" stroke="#D4C9B0" stroke-width="1"/>

  <rect x="200" y="200" width="240" height="120" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="210" y="210" width="100" height="60" fill="none" stroke="#8B4513" stroke-width="2"/>
  <rect x="330" y="220" width="90" height="50" fill="none" stroke="#8B4513" stroke-width="2"/>
  <text x="215" y="205" fill="#4A4A4A" font-family="sans-serif" font-size="10">overlay lip</text>
  <text x="335" y="215" fill="#4A4A4A" font-family="sans-serif" font-size="10">inset</text>
</svg>
