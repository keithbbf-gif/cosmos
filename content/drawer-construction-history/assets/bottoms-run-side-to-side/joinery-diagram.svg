<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Drawer bottom grain side to side</title>
  <desc id="desc">Solid floor sliding in grooves with grain running across the width</desc>
  <rect width="100%" height="100%" fill="#F7F3E8"/>
  <text x="32" y="44" fill="#1A1A1A" font-family="Georgia, serif" font-size="20" font-weight="600">Drawer bottom grain side to side</text>
  <rect x="24" y="64" width="592" height="332" fill="none" stroke="#D4C9B0" stroke-width="1"/>

  <rect x="200" y="260" width="240" height="30" fill="none" stroke="#8B4513" stroke-width="2"/>
  <line x1="210" y1="270" x2="430" y2="270" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="210" y1="280" x2="430" y2="280" stroke="#1A1A1A" stroke-width="1"/>
  <rect x="200" y="230" width="20" height="90" fill="none" stroke="#6B4423" stroke-width="2"/>
  <rect x="420" y="230" width="20" height="90" fill="none" stroke="#6B4423" stroke-width="2"/>
  <text x="260" y="250" fill="#4A4A4A" font-family="sans-serif" font-size="11">grain across width</text>
</svg>
