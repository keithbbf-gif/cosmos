<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Side-hung groove on a runner</title>
  <desc id="desc">Long groove ploughed in a drawer side riding a fixed runner on the case</desc>
  <rect width="100%" height="100%" fill="#F7F3E8"/>
  <text x="32" y="44" fill="#1A1A1A" font-family="Georgia, serif" font-size="20" font-weight="600">Side-hung groove on a runner</text>
  <rect x="24" y="64" width="592" height="332" fill="none" stroke="#D4C9B0" stroke-width="1"/>

  <rect x="180" y="200" width="40" height="120" fill="none" stroke="#8B4513" stroke-width="2"/>
  <line x1="220" y1="240" x2="460" y2="240" stroke="#6B4423" stroke-width="3"/>
  <rect x="460" y="220" width="20" height="40" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="190" y1="260" x2="190" y2="300" stroke="#1A1A1A" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="230" y="230" fill="#4A4A4A" font-family="sans-serif" font-size="11">groove rides runner</text>
