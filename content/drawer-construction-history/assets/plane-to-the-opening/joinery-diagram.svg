<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Plane drawer to the opening</title>
  <desc id="desc">Side shaved on a shooting board until the opening accepts the box</desc>
  <rect width="100%" height="100%" fill="#F7F3E8"/>
  <text x="32" y="44" fill="#1A1A1A" font-family="Georgia, serif" font-size="20" font-weight="600">Plane drawer to the opening</text>
  <rect x="24" y="64" width="592" height="332" fill="none" stroke="#D4C9B0" stroke-width="1"/>

  <rect x="200" y="180" width="240" height="140" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="230" y="210" width="180" height="80" fill="none" stroke="#8B4513" stroke-width="2"/>
  <line x1="230" y1="250" x2="210" y2="250" stroke="#C9A227" stroke-width="2"/>
  <text x="250" y="205" fill="#4A4A4A" font-family="sans-serif" font-size="11">shaving to fit</text>
</svg>
