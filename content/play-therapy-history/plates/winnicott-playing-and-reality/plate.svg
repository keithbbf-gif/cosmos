  <title id="title">D. W. Winnicott — typographic plate</title>
  <desc id="desc">No photograph; editorial type plate for educational history.</desc>
  <rect width="360" height="440" fill="#F7F2E8"/>
  <rect x="0" y="0" width="360" height="8" fill="#4A6741"/>
  <text x="180" y="120" text-anchor="middle" font-family="Georgia, 'Palatino Linotype', serif" font-size="11" letter-spacing="0.14em" fill="#4A6741">WOW THERAPIES · PLAY THERAPY HISTORY</text>
  <text x="180" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#1C1A17">D. W. Winnicott</text>
  <text x="180" y="232" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#5C564C">1896–1971</text>
  <text x="180" y="276" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5C564C">pediatrician-analyst whose 1971 Playing</text>
