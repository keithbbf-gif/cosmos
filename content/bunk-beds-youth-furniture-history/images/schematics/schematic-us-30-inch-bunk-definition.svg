<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Educational side view: U.S. bunk-bed height gate at 30 inches</title>
  <desc id="desc">Line drawing of a stacked bed. A dimension line measures from the floor to the underside of the upper mattress foundation at 760 millimeters, labeled 30 inches. Lower bunk sits below the threshold.</desc>
  <rect width="720" height="420" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#333">Educational schematic — not a CPSC or ASTM figure</text>
  <!-- floor -->
  <line x1="60" y1="340" x2="660" y2="340" stroke="#444" stroke-width="2"/>
  <text x="60" y="360" font-family="system-ui,sans-serif" font-size="12" fill="#555">Floor</text>
  <!-- posts -->
  <rect x="120" y="140" width="18" height="200" fill="#8b7355" stroke="#5c4a32"/>
  <rect x="582" y="140" width="18" height="200" fill="#8b7355" stroke="#5c4a32"/>
  <!-- lower foundation -->
  <rect x="138" y="260" width="444" height="12" fill="#c9b896" stroke="#8b7355"/>
  <rect x="150" y="248" width="420" height="12" fill="#e8dcc8" stroke="#aaa" stroke-dasharray="4 2"/>
  <text x="150" y="242" font-family="system-ui,sans-serif" font-size="11" fill="#666">Lower mattress (example)</text>
  <!-- upper foundation -->
  <rect x="138" y="120" width="444" height="12" fill="#c9b896" stroke="#8b7355"/>
  <rect x="150" y="108" width="420" height="12" fill="#e8dcc8" stroke="#aaa" stroke-dasharray="4 2"/>
  <text x="150" y="102" font-family="system-ui,sans-serif" font-size="11" fill="#666">Upper mattress (example)</text>
  <!-- guardrail hint -->
  <rect x="138" y="88" width="444" height="8" fill="none" stroke="#2a6" stroke-width="2"/>
  <text x="590" y="96" font-family="system-ui,sans-serif" font-size="10" fill="#2a6">Guardrail zone (draft 13)</text>
  <!-- dimension: foundation underside to floor -->
  <line x1="90" y1="340" x2="90" y2="132" stroke="#c00" stroke-width="2"/>
  <polygon points="90,132 85,142 95,142" fill="#c00"/>
  <polygon points="90,340 85,330 95,330" fill="#c00"/>
  <rect x="24" y="210" width="52" height="52" fill="#fafafa"/>
  <text x="50" y="228" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#c00" font-weight="600">30 in</text>
  <text x="50" y="246" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#c00">(760 mm)</text>
  <line x1="138" y1="132" x2="100" y2="132" stroke="#c00" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="360" y="400" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#333">16 CFR 1213.2 / 1513.2: measure to underside of upper foundation, not mattress top</text>
</svg>
