<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">Educational view: bunk against a wall and the bed-wall slot</title>
  <desc id="desc">Side elevation showing upper bunk mattress, guardrail, and drywall. Highlights a narrow vertical slot between frame and wall where a small child can wedge, and contrasts with a full-length continuous rail at the wall side.</desc>
  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="26" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#333">Educational schematic — not a CPSC or ASTM figure</text>
  <!-- wall -->
  <rect x="40" y="60" width="48" height="300" fill="#d8d8d8" stroke="#999"/>
  <text x="64" y="380" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#666">Wall</text>
  <!-- bed frame -->
  <rect x="88" y="200" width="320" height="12" fill="#c9b896" stroke="#8b7355"/>
  <rect x="100" y="188" width="296" height="12" fill="#e8dcc8" stroke="#aaa"/>
  <rect x="88" y="100" width="320" height="12" fill="#c9b896" stroke="#8b7355"/>
  <rect x="100" y="88" width="296" height="12" fill="#e8dcc8" stroke="#aaa"/>
  <!-- upper rail against wall -->
  <rect x="88" y="76" width="320" height="8" fill="#2a6"/>
  <text x="248" y="70" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#2a6">Continuous rail at wall side</text>
  <!-- slot -->
  <rect x="76" y="100" width="16" height="112" fill="#ffe8e8" stroke="#c00" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="68" y="160" text-anchor="end" font-family="system-ui,sans-serif" font-size="11" fill="#c00">Bed-wall</text>
  <text x="68" y="176" text-anchor="end" font-family="system-ui,sans-serif" font-size="11" fill="#c00">slot</text>
  <!-- floor -->
  <line x1="40" y1="320" x2="520" y2="320" stroke="#444" stroke-width="2"/>
  <!-- callout -->
  <text x="480" y="120" font-family="system-ui,sans-serif" font-size="12" fill="#333">1999 rule response:</text>
  <text x="480" y="140" font-family="system-ui,sans-serif" font-size="11" fill="#333">full-length rail on wall side;</text>
  <text x="480" y="158" font-family="system-ui,sans-serif" font-size="11" fill="#333">≤0.22 in end gap if not attached</text>
  <text x="360" y="392" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#555">Illustrates hazard geometry discussed in the 1999 Federal Register - not a test diagram</text>
</svg>
