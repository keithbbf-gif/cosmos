<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Educational overview of bunk-bed lab stand-ins</title>
  <desc id="desc">Three labeled icons: tapered block for torso openings, nine-inch sphere for head follow-through, and simplified neck template silhouette for end-structure entrapment. Teaching overview only.</desc>
  <rect width="720" height="360" fill="#fafafa"/>
  <text x="360" y="26" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#333">Educational schematic — not CPSC test figures</text>
  <!-- block -->
  <polygon points="100,80 100,240 220,240 180,80" fill="#f4c2a0" stroke="#a65" stroke-width="2"/>
  <text x="160" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#333">Wedge block</text>
  <text x="160" y="288" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#666">Torso / opening pass</text>
  <!-- sphere -->
  <circle cx="360" cy="160" r="70" fill="none" stroke="#06c" stroke-width="2"/>
  <text x="360" y="165" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#06c">9 in</text>
  <text x="360" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#333">Rigid sphere</text>
  <text x="360" y="288" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#666">Head follows torso</text>
  <!-- neck template stylized -->
  <ellipse cx="560" cy="130" rx="55" ry="40" fill="none" stroke="#639" stroke-width="2"/>
  <rect x="535" y="130" width="50" height="90" fill="none" stroke="#639" stroke-width="2" rx="8"/>
  <text x="560" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#333">Neck template</text>
  <text x="560" y="288" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#666">End-structure entrapment</text>
  <text x="360" y="330" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#333">Names map to 16 CFR 1213.4 - open the CFR to run tests, not this drawing</text>
</svg>
