<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
  <title id="title">Educational plan view: continuous wall-side rail versus ladder-side opening</title>
  <desc id="desc">Top-down bunk outline. One long side rail runs continuously with at most 0.22 inch end gap. The opposite side allows up to a 15 inch opening at one end for ladder access. Rail height shown as 5 inches above maximum mattress plane.</desc>
  <rect width="720" height="440" fill="#fafafa"/>
  <text x="360" y="26" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#333">Educational schematic — not a CPSC or ASTM figure</text>
  <!-- mattress plan -->
  <rect x="160" y="80" width="400" height="220" fill="#e8dcc8" stroke="#8b7355" stroke-width="2" rx="4"/>
  <!-- continuous rail (left) -->
  <rect x="148" y="72" width="8" height="236" fill="#2a6" opacity="0.85"/>
  <text x="100" y="190" font-family="system-ui,sans-serif" font-size="11" fill="#2a6" transform="rotate(-90 100 190)">Continuous rail (≤0.22 in at ends)</text>
  <!-- ladder side rail with gap -->
  <line x1="560" y1="80" x2="560" y2="180" stroke="#2a6" stroke-width="8"/>
  <line x1="560" y1="260" x2="560" y2="300" stroke="#2a6" stroke-width="8"/>
  <rect x="548" y="180" width="24" height="80" fill="#fafafa" stroke="#c00" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="572" y="225" font-family="system-ui,sans-serif" font-size="11" fill="#c00">Ladder gap</text>
  <text x="572" y="242" font-family="system-ui,sans-serif" font-size="10" fill="#c00">≤15 in (380 mm)</text>
  <!-- ladder -->
  <rect x="600" y="120" width="36" height="140" fill="none" stroke="#666" stroke-width="2"/>
  <line x1="608" y1="130" x2="628" y2="130" stroke="#666"/>
  <line x1="608" y1="160" x2="628" y2="160" stroke="#666"/>
  <line x1="608" y1="190" x2="628" y2="190" stroke="#666"/>
  <line x1="608" y1="220" x2="628" y2="220" stroke="#666"/>
  <text x="618" y="280" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#666">Ladder</text>
  <!-- 5 in rail height (side elevation inset) -->
  <rect x="160" y="330" width="180" height="70" fill="#fff" stroke="#ccc"/>
  <line x1="180" y1="390" x2="180" y2="350" stroke="#444"/>
  <rect x="188" y="358" width="120" height="8" fill="#c9b896"/>
  <rect x="188" y="342" width="120" height="10" fill="#e8dcc8"/>
  <rect x="188" y="332" width="120" height="8" fill="#2a6"/>
  <line x1="320" y1="390" x2="320" y2="332" stroke="#c00" stroke-width="2"/>
  <text x="330" y="365" font-family="system-ui,sans-serif" font-size="11" fill="#c00">≥5 in (130 mm)</text>
  <text x="330" y="380" font-family="system-ui,sans-serif" font-size="10" fill="#666">above max mattress</text>
  <text x="250" y="408" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#333">Rail height inset (side view)</text>
  <text x="360" y="428" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#333">Summary of 16 CFR 1213.3 guardrail geometry for literacy - verify current CFR text</text>
</svg>
