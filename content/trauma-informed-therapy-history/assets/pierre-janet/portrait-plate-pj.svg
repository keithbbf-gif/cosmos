<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-labelledby="title desc">
  <title id="title">Portrait plate: Pierre Janet (monogram PJ; no embedded photograph)</title>
  <desc id="desc">Editorial monogram plate for Pierre Janet. No synthetic likeness.</desc>
  <defs>
    <style>
      .paper { fill: #F7F2E8; }
      .frame { fill: none; stroke: #1C1A17; stroke-width: 2; }
      .inner { fill: none; stroke: #6B2D3E; stroke-width: 1; stroke-dasharray: 6 4; }
      .mono { font-family: Georgia, serif; font-size: 56px; font-weight: bold; fill: #6B2D3E; opacity: 0.9; }
      .name { font-family: Georgia, serif; font-size: 22px; font-weight: bold; fill: #1C1A17; }
      .dates { font-family: system-ui, sans-serif; font-size: 14px; fill: #6B2D3E; }
      .note { font-family: system-ui, sans-serif; font-size: 11px; fill: #5C564C; }
    </style>
  </defs>
  <rect class="paper" width="720" height="540"/>
  <rect x="0" y="0" width="720" height="5" fill="#6B2D3E"/>
  <rect class="frame" x="80" y="48" width="560" height="360" rx="2"/>
  <rect class="inner" x="140" y="100" width="440" height="260" rx="4"/>
  <text x="360" y="230" text-anchor="middle" class="mono">PJ</text>
  <text x="360" y="270" text-anchor="middle" class="note">Monogram plate - no AI likeness</text>
  <text x="360" y="440" text-anchor="middle" class="name">Pierre Janet</text>
  <text x="360" y="468" text-anchor="middle" class="dates">1859-1947 - dissociation &amp; automatism</text>
  <text x="40" y="520" class="note">Wikimedia Commons portraits may exist - verify license before raster embed.</text>
</svg>
