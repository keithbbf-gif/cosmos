<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d">
  <title id="t">Three vocabulary lanes: tonic, stimulant, adaptogen</title>
  <desc id="d">Conceptual comparison of historical terms; not a taxonomy of plants.</desc>
  <rect width="100%" height="100%" fill="#f7f6f3"/>
  <text x="36" y="32" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5c5c5c" letter-spacing="0.08em">VOCABULARY MAP  SCHEMATIC</text>
  <text x="36" y="64" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1c1c1c">Three words that get stacked as synonyms</text>
  <rect x="36" y="100" width="250" height="240" fill="#fff" stroke="#1c1c1c" stroke-width="1"/>
  <text x="161" y="130" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1c1c1c">Tonic</text>
  <text x="52" y="160" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5c5c5c">Older pharmacy &amp; materia-medica</text>
  <text x="52" y="180" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5c5c5c">register; strength, nourishment,</text>
  <text x="52" y="200" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5c5c5c">convalescence  not a modern</text>
  <text x="52" y="220" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5c5c5c">regulatory class.</text>
  <rect x="325" y="100" width="250" height="240" fill="#fff" stroke="#1c1c1c" stroke-width="1"/>
  <text x="450" y="130" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1c1c1c">Stimulant</text>
  <text x="341" y="160" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5c5c5c">Physiological arousal language;</text>
  <text x="341" y="180" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5c5c5c">often tied to measurable</text>
  <text x="341" y="200" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5c5c5c">effects in pharmacology texts.</text>
  <rect x="614" y="100" width="250" height="240" fill="#fff" stroke="#8b4513" stroke-width="1.5"/>
  <text x="739" y="130" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1c1c1c">Adaptogen</text>
  <text x="630" y="160" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5c5c5c">Mid-20th-c. Soviet research</text>
  <text x="630" y="180" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5c5c5c">construct exported to reviews</text>
  <text x="630" y="200" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5c5c5c">and supplement aisles  not a</text>
  <text x="630" y="220" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5c5c5c">village category.</text>
  <path d="M286 220 L325 220" stroke="#8a8680" stroke-width="1" marker-end="url(#a)"/>
  <path d="M575 220 L614 220" stroke="#8a8680" stroke-width="1"/>
  <text x="36" y="392" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5c5c5c">Arrows show rhetorical borrowing, not botanical equivalence · redrawn diagram</text>
</svg>
