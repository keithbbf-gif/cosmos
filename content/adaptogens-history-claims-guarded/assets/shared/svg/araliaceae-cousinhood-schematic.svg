<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t d">
  <title id="t">Araliaceae cousinhood: Panax and Eleutherococcus as separate genera</title>
  <desc id="d">Botanical family schematic; not a claim that one plant substitutes for another in the body.</desc>
  <rect width="100%" height="100%" fill="#f7f6f3"/>
  <text x="36" y="32" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5c5c5c" letter-spacing="0.08em">FAMILY SCHEMATIC</text>
  <ellipse cx="360" cy="110" rx="140" ry="36" fill="none" stroke="#1c1c1c" stroke-width="1.5"/>
  <text x="360" y="115" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1c1c1c">Araliaceae</text>
  <line x1="280" y1="146" x2="200" y2="220" stroke="#1c1c1c" stroke-width="1"/>
  <line x1="440" y1="146" x2="520" y2="220" stroke="#1c1c1c" stroke-width="1"/>
  <rect x="80" y="220" width="240" height="120" fill="#fff" stroke="#1c1c1c" stroke-width="1"/>
  <text x="200" y="252" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1c1c1c">Panax</text>
  <text x="200" y="276" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5c5c5c">e.g. *P. ginseng*</text>
  <text x="200" y="296" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5c5c5c">prestige root trade</text>
  <rect x="400" y="220" width="240" height="120" fill="#fff" stroke="#8b4513" stroke-width="1.5"/>
  <text x="520" y="252" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1c1c1c">Eleutherococcus</text>
  <text x="520" y="276" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5c5c5c">*E. senticosus*</text>
  <text x="520" y="296" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5c5c5c">Soviet program kilos</text>
  <text x="36" y="368" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5c5c5c">Cousinhood in a flora ` substitute in a body · illustrative only</text>
