[project]
name = "g47"
version = "0.2.0"
description = "G47 harness planner for COSMOS and COSMOS CODE"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["g47", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
packages = ["g47"]
mypy_path = "."
exclude = "(^|/)seats/"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
pretty = true
